// ---------- Step-families ----------
// Parents can separate, and a separated or widowed parent can marry again.
// A new spouse arrives as a step-parent, sometimes with children of their
// own. Step-relatives are family, but they are not your parents' children:
// they take no share of your parents' estate, and a step-parent's own estate
// goes to their own children unless they've come to think of you as theirs.

function bioParents(){ return (state.family||[]).filter(p=>p.relation==="Mother"||p.relation==="Father"); }
function isStepRelation(rel){ return rel === "Stepmother" || rel === "Stepfather" || rel === "Step-sibling"; }
function livingSpouseOf(parent){
  return (state.family||[]).find(p=>p.alive && p.spouseOf === parent.id) || null;
}

function makeStepParent(parent){
  // Mostly a partner of the other sex, sometimes not.
  const gender = Math.random() < 0.9 ? (parent.gender === "Girl" ? "Boy" : "Girl") : parent.gender;
  const sp = makePerson(gender === "Girl" ? "Stepmother" : "Stepfather", gender, Math.max(25, parent.age + rand(-6, 6)));
  sp.spouseOf = parent.id;
  if(parent.country) sp.country = parent.country;
  sp.closeness = state.age < 18 ? rand(25, 60) : rand(15, 45);
  return sp;
}

function runParentsYear(){
  const parents = bioParents();
  if(!parents.length) return;
  if(state.parentsStatus === undefined) state.parentsStatus = parents.every(p=>p.alive) ? "together" : "widowed";
  const living = parents.filter(p=>p.alive);

  // Roughly four marriages in ten end in divorce; spread over the years a
  // child lives at home and after, that's a little over one in a hundred a year.
  if(state.parentsStatus === "together" && living.length === 2 && living.every(p=>p.age < 75) && Math.random() < 0.012){
    state.parentsStatus = "separated";
    const young = state.age < 18;
    nudge("happiness", young ? -rand(10,18) : -rand(2,6));
    if(young) nudgeHidden("stress", 8);
    milestone("milestone", `Your parents, ${living[0].name} and ${living[1].name}, are separating.`, { icon:"💔", label:"Family", tone:"bad" });
    return;
  }
  if(state.parentsStatus === "together" && living.length < 2) state.parentsStatus = "widowed";

  // A parent on their own may marry again.
  if(state.parentsStatus === "separated" || state.parentsStatus === "widowed"){
    living.forEach(parent=>{
      if(livingSpouseOf(parent) || parent.age >= 72) return;
      let chance = state.parentsStatus === "separated" ? 0.07 : 0.04;
      if(parent.age > 55) chance *= 0.5;
      if(Math.random() >= chance) return;
      const sp = makeStepParent(parent);
      state.family.push(sp);
      // Their children from before come into the family too.
      const kids = pick([0,0,1,1,2,3]);
      for(let i=0;i<kids;i++){
        const k = makePerson("Step-sibling", undefined, Math.max(0, sp.age - rand(22, 38)));
        k.fromStep = sp.id;
        if(sp.country) k.country = sp.country;
        k.closeness = rand(10, 50);
        state.family.push(k);
      }
      const rel = sp.relation.toLowerCase();
      milestone("milestone", `Your ${parent.relation.toLowerCase()} ${parent.name} has married again — ${sp.name}, ${sp.age}. You have a ${rel}${kids ? ` and ${kids} step-sibling${kids===1?"":"s"}` : ""}.`, { icon:"💒", label:"Family", tone:"good" });
    });
  }
}

// When the last of your parents dies married to someone, the surviving
// spouse inherits first, as they would by law and as most wills provide.
// Returns true when it has dealt with the estate.
function divertEstateToSpouse(parent){
  const widow = livingSpouseOf(parent);
  if(!widow) return false;
  const inhRanges = { poor:[1000,5000], middle:[5000,20000], rich:[20000,80000] };
  const [lo,hi] = inhRanges[state.wealthTier] || inhRanges.middle;
  widow.heldEstate = rand(lo, hi);
  state.flags.parentsEstateSettled = true;
  addLog(`${parent.name}'s estate of ${money(widow.heldEstate)} passes first to ${widow.name}, ${parent.gender === "Girl" ? "her" : "his"} ${widow.gender === "Girl" ? "wife" : "husband"}. What happens to it after that is up to them.`, true);
  return true;
}

// A step-parent's estate — including anything they inherited from your
// parent — goes to their own children, and to you only if they came to see
// you as one of theirs.
function settleStepEstate(sp){
  const total = (sp.heldEstate || 0) + rand(0, 15000);
  if(total <= 0) return;
  const ownKids = (state.family||[]).filter(p=>p.fromStep === sp.id);
  const yourSide = 1 + (state.family||[]).filter(p=>p.relation === "Sibling").length;   // you and your siblings
  const close = (sp.closeness || 0) >= 50;
  const includesYou = close || (!ownKids.length && Math.random() < 0.4);
  if(!includesYou){
    addLog(`${sp.name} left ${sp.gender === "Girl" ? "her" : "his"} estate to ${ownKids.length ? `${sp.gender === "Girl" ? "her" : "his"} own children` : "others"}. Nothing came to you.`, true);
    return;
  }
  const share = Math.round(total / (ownKids.length + yourSide));
  addMoney(share);
  milestone("windfall", `${sp.name} remembered you in ${sp.gender === "Girl" ? "her" : "his"} will — ${money(share)}, an equal share with ${sp.gender === "Girl" ? "her" : "his"} own children.`);
}

// ---------- Exes ----------
// Your partner is watched from one place, so every way a relationship can
// end — a breakup, a divorce, a refused proposal, being found out — leaves
// the same thing behind: an ex, with a history, who ages and might come back.

function snapshotPartner(r){
  return { id:r.id, name:r.name, gender:r.gender, age:r.age, closeness:r.closeness, netWorth:r.netWorth,
    married: !!state.married, years: state.relationshipYears || 0, ref: r };
}

function trackPartner(){
  if(!state) return;
  const w = state.partnerWatch;
  const r = state.relationship;
  if(w && (!r || r.id !== w.id)){
    if(!w.died) addEx(w);
    state.partnerWatch = null;
  }
  if(r) state.partnerWatch = snapshotPartner(r);
}

function addEx(w){
  state.exes = state.exes || [];
  if(state.exes.some(e=>e.id === w.id)) return;
  state.exes.push({
    id: w.id, name: w.name, gender: w.gender, age: w.age, alive: true,
    closeness: clamp((w.closeness || 50) - (w.married ? rand(25, 45) : rand(15, 35))),
    netWorth: w.netWorth || 0, wasMarried: w.married, yearsTogether: w.years, endedAge: state.age,
    lastContactAge: state.age, country: (w.ref && w.ref.country) || undefined,
  });
}

function ageExes(){
  (state.exes||[]).forEach(e=>{
    if(!e.alive) return;
    e.age += 1;
    e.closeness = clamp(e.closeness - rand(0, 3));
    if(Math.random() < npcDeathChance(e.age)){
      e.alive = false;
      e.ageAtDeath = e.age;
      e.causeOfDeath = npcDeathCause(e.age);
      e.diedPlayerAge = state.age;
      addLog(`Your ${exLabel(e).toLowerCase()} ${e.name} has died at ${e.age}, of ${e.causeOfDeath}.`, true);
      nudge("happiness", -rand(2, 6));
    }
  });
}

function exLabel(e){
  if(!e.wasMarried) return "Ex-partner";
  return e.gender === "Girl" ? "Ex-wife" : "Ex-husband";
}

// Trying again: likelier with someone you parted from on decent terms, and
// less likely the longer it's been.
function reconcileChance(e){
  const since = state.age - (e.endedAge || state.age);
  return clamp(e.closeness / 140 + (e.wasMarried ? -0.05 : 0.05) - since / 40, 0.7, 0.02);
}

function doReconcile(id){
  const e = (state.exes||[]).find(x=>x.id===id && x.alive);
  if(!e){ refreshPeopleSheet(); return; }
  if(state.relationship){ addLog("You'd have to be single first."); refreshPeopleSheet(); return; }
  if(usesLeft("reconcile") <= 0){ addLog("You've already had that conversation this year."); refreshPeopleSheet(); return; }
  if(!spendAction("reconcile")){ refreshPeopleSheet(); return; }
  recordUse("reconcile");
  if(Math.random() < reconcileChance(e)){
    state.exes = state.exes.filter(x=>x.id !== id);
    const p = makePerson("Partner", e.gender, e.age);
    Object.assign(p, { id:e.id, name:e.name, closeness: clamp(e.closeness + rand(10, 20)), netWorth: e.netWorth });
    state.relationship = p;
    state.relationshipYears = 0;
    state.married = false; state.engaged = false;
    trackPartner();
    nudge("happiness", rand(8, 14));
    milestone("dating", `Back together with ${e.name}.`);
    peopleView.person = { kind:"partner", id:p.id }; peopleView.tab = "partner";
  } else {
    e.closeness = clamp(e.closeness - rand(3, 8));
    nudge("happiness", -4);
    addLog(`Suggested to ${e.name} that you try again. ${e.gender === "Girl" ? "She" : "He"} said no.`);
  }
  refreshPeopleSheet();
}

function doCutContact(id){
  const e = (state.exes||[]).find(x=>x.id===id);
  if(!e) return;
  state.exes = state.exes.filter(x=>x.id!==id);
  addLog(`Cut contact with ${e.name} for good.`);
  peopleView.person = null;
  refreshPeopleSheet();
}

// ---------- The late ----------
// Everyone who has died, in one place: family stays in the family list as it
// always has, exes stay in theirs, and everyone else is recorded here.
function recordLate(entry){
  state.late = state.late || [];
  state.late.push(Object.assign({ id: personIdCounter++, diedPlayerAge: state.age }, entry));
}

function lateEntries(){
  const out = [];
  (state.family||[]).filter(p=>!p.alive).forEach(p=>out.push({ ref:p, kind:"family", name:p.name,
    relation: personRelationLabel(p, "family"), ageAtDeath: p.ageAtDeath !== undefined ? p.ageAtDeath : p.age, cause:p.causeOfDeath, diedPlayerAge:p.diedPlayerAge }));
  (state.exes||[]).filter(e=>!e.alive).forEach(e=>out.push({ ref:e, kind:"ex", name:e.name, relation: exLabel(e),
    ageAtDeath:e.ageAtDeath, cause:e.causeOfDeath, diedPlayerAge:e.diedPlayerAge }));
  (state.late||[]).forEach(l=>out.push(Object.assign({ ref:l }, l)));
  // Most recent first.
  return out.sort((a,b)=>(b.diedPlayerAge === undefined ? -1 : b.diedPlayerAge) - (a.diedPlayerAge === undefined ? -1 : a.diedPlayerAge));
}

function yearsAgo(playerAge){
  if(playerAge === undefined) return "";
  const n = state.age - playerAge;
  return n <= 0 ? "Died this year" : `Died ${n} year${n===1?"":"s"} ago`;
}

function lateRow(l){
  const icon = l.kind === "pet" ? "🐾" : "🕯️";
  const sub = [yearsAgo(l.diedPlayerAge), l.ageAtDeath !== undefined ? `aged ${l.ageAtDeath}` : "", l.cause || ""].filter(Boolean).join(" · ");
  return menuRow({ icon, title: `${l.name} <span class="rel-tag">(${l.relation})</span>`, sub, attr:`data-late="${l.kind}:${l.ref.id}"` });
}

function findLate(kind, id){
  if(kind === "family") return (state.family||[]).find(p=>p.id===id && !p.alive) || null;
  if(kind === "ex") return (state.exes||[]).find(e=>e.id===id && !e.alive) || null;
  return (state.late||[]).find(l=>l.id===id) || null;
}

function renderLatePage(kind, l){
  const isPet = kind === "pet" || l.kind === "pet";
  const relation = kind === "family" ? personRelationLabel(l, "family") : kind === "ex" ? exLabel(l) : l.relation;
  const at = l.ageAtDeath !== undefined ? l.ageAtDeath : l.age;
  const social = usesLeft("social");
  return `<div class="person-card">
      <div class="pc-head"><span class="pc-icon">${isPet ? "🐾" : "🕯️"}</span>
        <span class="pc-txt"><span class="pc-name">${l.name}</span><span class="pc-sub">${relation}${at !== undefined ? ` · died at ${at}` : ""}</span></span></div>
      ${l.causeOfDeath || l.cause ? `<div class="job-line">${l.causeOfDeath || l.cause}</div>` : ""}
      ${l.diedPlayerAge !== undefined ? `<div class="job-line">${yearsAgo(l.diedPlayerAge)}, when you were ${l.diedPlayerAge}.</div>` : ""}
    </div>
    ${isPet ? "" : isAbroad(l) ? `<div class="job-line">🌍 Buried in ${abroadLabel(l)}.</div>` : `<div class="section-label">Remember them</div><div class="menulist">
      ${menuRow({ icon:"💐", title:"Visit their grave", sub: social > 0 ? `${social} social slot${social===1?"":"s"} left this year` : "No social time left this year", attr:'data-lategrave="1"', disabled: social <= 0, chevron:false, dots:true })}
    </div>`}`;
}

function doVisitLateGrave(kind, id){
  const l = findLate(kind, id);
  if(!l){ refreshPeopleSheet(); return; }
  if(isAbroad(l)){ addLog(`${l.name} is buried in ${abroadLabel(l)}.`); refreshPeopleSheet(); return; }
  if(usesLeft("social") <= 0){ addLog("No more time for that this year."); refreshPeopleSheet(); return; }
  if(!spendAction("social")){ refreshPeopleSheet(); return; }
  recordUse("social");
  nudge("happiness", rand(2, 5));
  nudgeHidden("stress", -3);
  addLog(`Visited ${l.name}'s grave and spent a while there.`);
  refreshPeopleSheet();
}

// ---------- Short courses and degree lengths ----------
const DEGREE_YEARS = { "Veterinary Medicine":5, "Pharmacy":4 };

function courseForDegree(course, degree){
  const years = DEGREE_YEARS[degree];
  if(!years || years === course.years) return course;
  return Object.assign({}, course, { years, cost: Math.round(course.cost / course.years * years) });
}

// What a short course at a local college can be in.
const SHORT_COURSES = [
  { id:"bookkeeping", label:"Bookkeeping and accounts", note:"helps finance applications" },
  { id:"it",          label:"IT and computing",         note:"helps tech applications" },
  { id:"language",    label:"A foreign language",       note:"+languages skill" },
  { id:"firstaid",    label:"First aid",                note:"helps emergency-service and care applications" },
  { id:"cooking",     label:"Professional cookery",     note:"helps hospitality applications" },
];

function shortCourseName(){
  return ["United States","Canada"].includes(state.currentCountry) ? "Community college course" : "Short course at a local college";
}

function pickShortCourse(course){
  const done = state.certificates || [];
  const open = SHORT_COURSES.filter(c=>!done.includes(c.id));
  if(!open.length){ addLog("You've already done every short course going."); return; }
  queueChoice({
    title: shortCourseName(),
    text: "Evening and weekend classes, a year long, for a certificate in something useful.",
    options: open.map(c=>({ label:`${c.label} — ${c.note}`, effect:()=>openFundingChoice(Object.assign({}, course, { certificate:c.id, label:`${shortCourseName()}: ${c.label.toLowerCase()}` }), null) }))
      .concat([{ label:"Leave it for now", effect:()=>{ addLog("Thought about a course, and left it."); } }]),
  });
}

// A certificate counts for something in the fields it relates to.
const CERTIFICATE_FIELDS = { bookkeeping:["Finance"], it:["Tech"], firstaid:["Emergency Services","Medical"], cooking:["Hospitality"] };
function certificateBoost(track){
  return (state.certificates||[]).some(c=>(CERTIFICATE_FIELDS[c]||[]).includes(track.category)) ? 0.07 : 0;
}

// An MBA counts in business, and for anyone climbing into management.
function mbaBoost(track, c){
  if(!(state.postgradAwards||[]).includes("MBA")) return 0;
  if(!track) return 0;
  return ["Finance","Tech","Retail","Hospitality","Entrepreneurship"].includes(track.category) || (c && c.rankIndex >= 5) ? 0.08 : 0;
}

// A registered-profession rung you can't pass without the degree.
function degreeCapBlocks(track, c){
  if(!track.degreeFor || state.degree === track.degreeFor) return false;
  if(track.degreeFromYear && (state.year || 2020) < track.degreeFromYear) return false;
  return c.rankIndex >= track.degreeCapRung;
}

// ---------- Workplace agency ----------
// Rather than watching promotions happen to you, performance is a real stat you
// push up or let slide, and you can ask for raises and promotions directly.

// The level at which an employer starts to take an interest.
const PERFORMANCE_WARNING = 30;
const PERFORMANCE_DISMISSAL = 20;

// Runs once a year for any job. Returns true when the job has ended.
// First year under the threshold: a formal warning. Still under it the next
// year: dismissal. Pull it back above and the warning is withdrawn.
function checkPerformanceWarning(jobTitle){
  const perf = jobPerformance();
  if(perf >= PERFORMANCE_WARNING){
    if(state.careerWarning){
      state.careerWarning = null;
      addLog(`Performance back up to ${perf}/100 — the formal warning has been lifted.`, true);
    }
    return false;
  }
  if(!state.careerWarning){
    state.careerWarning = { sinceAge: state.age, title: jobTitle };
    nudgeHidden("stress", 12);
    nudge("happiness", -6);
    addLog(`Called in over your performance as ${jobTitle} — ${perf}/100. A formal warning: get it above ${PERFORMANCE_WARNING} within the year or you're out.`, true);
    return false;
  }
  // Already on a warning. Deep under the threshold is immediate; merely under
  // it gives you one more roll of the dice — or two years' grace with Thick Skin.
  const certain = perf < PERFORMANCE_DISMISSAL;
  const grace = hasPerk("thick_skin") ? 2 : 1;
  const yearsWarned = state.age - state.careerWarning.sinceAge;
  if(!certain && yearsWarned < grace){
    addLog(`Still under review as ${jobTitle} — ${perf}/100. ${grace - yearsWarned} more year${grace-yearsWarned===1?"":"s"} to put it right.`, true);
    return false;
  }
  if(certain || Math.random() < 0.6){
    milestone("fired", `Dismissed as ${jobTitle} — performance never recovered from the warning (${perf}/100).`);
    nudge("happiness", -14);
    nudgeHidden("stress", 10);
    state.career = null;
    state.careerWarning = null;
    state.flags.everSacked = true;
    return true;
  }
  addLog(`Still under review as ${jobTitle} — ${perf}/100. One more year to put it right.`, true);
  return false;
}

function jobPerformance(){
  const c = state.career;
  if(!c) return 0;
  if(c.performance === undefined) c.performance = 50;
  return c.performance;
}
// A promotion puts you at the bottom of a new rung: the reputation that got you
// there doesn't carry, and nor does any above-scale pay. Starting a little
// below the middle means the first year in a new rank has to be earned.
function resetPerformanceForNewRank(){
  const c = state.career;
  if(!c) return;
  c.performance = rand(40, 55);
  c.raiseMult = 1;
  state.careerWarning = null;   // a fresh start isn't on a warning
}

function nudgePerformance(d){
  const c = state.career;
  if(!c) return;
  c.performance = clamp(jobPerformance() + d);
}

function doWorkHarder(){
  if(state.politics){ doPoliticalEffort(1); return; }
  if(!state.career || state.career.training){ addLog("No job to put the hours into."); refreshCareerSheet(); return; }
  if(!spendAction("work")) { refreshCareerSheet(); return; }
  recordUse("work");
  nudgePerformance(rand(8,16));
  nudgeHidden("stress", rand(5,10));
  nudge("happiness", -2);
  if(isCrimeCareer()){
    state.career.heat = clamp((state.career.heat||0) + rand(6,12));
    addLog(`Took on more work for the crew — standing now ${jobPerformance()}/100, and the police are paying closer attention (heat ${crimeHeat()}).`);
    refreshCareerSheet();
    return;
  }
  addLog(`Put in long hours at work — performance now ${jobPerformance()}/100.`);
  refreshCareerSheet();
}

function doSlackOff(){
  if(state.politics){ doPoliticalEffort(-1); return; }
  if(!state.career || state.career.training){ refreshCareerSheet(); return; }
  if(!spendAction("work")) { refreshCareerSheet(); return; }
  recordUse("work");
  nudgePerformance(-rand(8,16));
  nudgeHidden("stress", -rand(6,12));
  nudge("happiness", 5);
  if(isCrimeCareer()){
    state.career.heat = clamp((state.career.heat||0) - rand(10,18));
    addLog(`Laid low this year — standing down to ${jobPerformance()}/100, heat cooled to ${crimeHeat()}.`);
    refreshCareerSheet();
    return;
  }
  addLog(`Coasted at work this year — performance now ${jobPerformance()}/100.`);
  refreshCareerSheet();
}

function doAskRaise(){
  const c = state.career;
  if(!c || c.training){ refreshCareerSheet(); return; }
  if(usesLeft("raise") <= 0){ addLog("You've already asked about pay this year."); refreshCareerSheet(); return; }
  if(!spendAction("raise")) { refreshCareerSheet(); return; }
  recordUse("raise");
  const chance = clamp(0.15 + jobPerformance()/180 + (c.yearsInRank||0)*0.04, 0.85, 0.05);
  if(Math.random() < chance){
    c.raiseMult = (c.raiseMult || 1) * (1 + rand(5,15)/100);
    nudge("happiness", 6);
    addLog(`Asked for a raise and got it — pay is now ${Math.round((c.raiseMult-1)*100)}% above the standard rate.`, true);
  } else {
    nudgePerformance(-3);
    nudge("happiness", -5);
    addLog("Asked for a raise and was turned down.");
  }
  refreshCareerSheet();
}

function doAskPromotion(){
  const c = state.career;
  if(!c || c.training){ refreshCareerSheet(); return; }

  // The services promote by selection board rather than by asking a manager,
  // so they take a different route with their own rank list.
  if(c.kind === "forces"){
    const force = FORCES.find(f=>f.id===c.trackId);
    if(!force){ refreshCareerSheet(); return; }
    const ranks = c.isOfficer ? force.officerRanks : force.ranks;
    if(c.rankIndex >= ranks.length-1){ addLog("Already at the top rank."); refreshCareerSheet(); return; }
    if(usesLeft("promo") <= 0){ addLog("You've already put in for selection this year."); refreshCareerSheet(); return; }
    if(!spendAction("promo")){ refreshCareerSheet(); return; }
    recordUse("promo");
    const promoYears = c.isOfficer ? force.officerPromoYears : force.promoYears;
    const minYears = promoYears[c.rankIndex] ?? 5;
    const served = c.yearsInRank || 0;
    if(served < Math.max(1, minYears - 2)){
      nudge("happiness", -3);
      addLog(`Put in for selection, but ${served} year${served===1?"":"s"} in rank isn't enough — the board expects around ${minYears}.`);
      refreshCareerSheet();
      return;
    }
    const chance = clamp(-0.05 + jobPerformance()/170 + served*0.05 + state.stats.smarts/400 + (hasPerk("fast_track") ? 0.1 : 0), 0.75, 0.02);
    if(Math.random() < chance){
      c.rankIndex += 1;
      c.yearsInRank = 0;
      resetPerformanceForNewRank();
      nudge("happiness", 10);
      milestone("promoted", `Selected for promotion — now ${ranks[c.rankIndex]}, ${force.name}.`);
      if(c.rankIndex === ranks.length-1) state.flags.reachedTopOfLadder = true;
    } else {
      nudgePerformance(-3);
      nudge("happiness", -5);
      addLog("Put in for selection and wasn't picked up this time.");
    }
    refreshCareerSheet();
    return;
  }

  const track = TRACKS.find(t=>t.id===c.trackId);
  if(!track || c.rankIndex >= track.ladder.length-1){ addLog("Already at the top of this ladder."); refreshCareerSheet(); return; }
  if(degreeCapBlocks(track, c)){ addLog(`You can't register as a ${track.ladder[track.degreeCapRung+1].title.toLowerCase()} without a ${track.degreeFor} degree.`); refreshCareerSheet(); return; }
  if(usesLeft("promo") <= 0){ addLog("You've already pushed for promotion this year."); refreshCareerSheet(); return; }
  if(!spendAction("promo")) { refreshCareerSheet(); return; }
  recordUse("promo");
  const chance = clamp(-0.1 + jobPerformance()/150 + (c.yearsInRank||0)*0.06 + (hasPerk("fast_track") ? 0.1 : 0) + mbaBoost(track, c), 0.8, 0.02);
  if(Math.random() < chance){
    c.rankIndex += 1;
    c.yearsInRank = 0;
    resetPerformanceForNewRank();
    nudge("happiness", 10);
    milestone("promoted", `Asked for promotion and got it — now ${track.ladder[c.rankIndex].title}.`);
    if(c.rankIndex === track.ladder.length-1){
      state.flags.reachedTopOfLadder = true;
      state.toppedTracks = (state.toppedTracks || []).concat(track.id);
      addLog(`Reached the top of the ${track.name} ladder.`, true);
    }
  } else {
    nudgePerformance(-4);
    nudge("happiness", -6);
    addLog("Asked for promotion and was passed over.");
  }
  refreshCareerSheet();
}

// ---------- Prison life — years inside are no longer just skipped ----------

const PRISON_EVENTS = [
  ()=>{ nudge("smarts", 4); addLog("Spent the year in the prison library — picked up more than expected."); },
  ()=>{ nudge("health", 5); addLog("Used the prison gym religiously this year."); },
  ()=>{ nudge("health", -rand(8,20)); addLog("Got into a fight on the wing."); },
  ()=>{ nudge("happiness", 4); addLog("Made an ally inside — makes the days easier."); },
  ()=>{ nudge("happiness", -6); addLog("A long, bleak year inside."); },
  ()=>{ nudge("smarts", 3); addLog("Completed a vocational course inside."); },
];

// ---------------------------------------------------------------------------
// Inside
// Conduct is tracked as its own number: it drives the parole board, and every
// choice inside moves it. Everything here costs the year's single prison
// action, so you pick one thing per year and live with it.
// ---------------------------------------------------------------------------

function prisonConduct(){
  if(state.prisonConduct === undefined) state.prisonConduct = 50;
  return state.prisonConduct;
}
function nudgeConduct(d){
  state.prisonConduct = clamp(prisonConduct() + d);
}

// One action a year inside, so the choice actually costs something.
function spendPrisonAction(){
  if(state.prisonActionUsed){
    addLog("You've already made your move for the year. See the year out.");
    refreshActivitySheet();
    return false;
  }
  state.prisonActionUsed = true;
  return true;
}

const PRISON_JOBS = [
  {id:"kitchen",  label:"Work in the kitchens",   pay:380, conduct:[6,11],  desc:"Hot, early starts, and the best-fed wing in the prison."},
  {id:"cleaning", label:"Join the cleaning party",pay:260, conduct:[5,10],  desc:"Nobody's first choice, and the officers notice who volunteers."},
  {id:"post",     label:"Run the wing post",      pay:300, conduct:[6,10],  desc:"Trusted work. You hear everything first."},
  {id:"laundry",  label:"Work the laundry",       pay:280, conduct:[5,9],   desc:"Steam, noise, and steady hours."},
  {id:"library",  label:"Help in the library",    pay:220, conduct:[5,9],   desc:"Quiet, and it keeps your mind working.", smarts:[2,5]},
  {id:"gardens",  label:"Work the gardens",       pay:240, conduct:[5,9],   desc:"Outdoors, which counts for a lot in here.", health:[2,5]},
  {id:"mentor",   label:"Mentor new arrivals",    pay:200, conduct:[8,14],  desc:"The governor's office looks on this very favourably.", karma:[4,8]},
];

// Volunteer for a job on the wing.
function doPrisonJob(id){
  if(state.prisonYearsLeft <= 0) return;
  const job = PRISON_JOBS.find(j=>j.id===id);
  if(!job) return;
  if(!spendPrisonAction()) return;
  addMoney(job.pay);
  nudgeConduct(rand(job.conduct[0], job.conduct[1]));
  nudge("happiness", rand(2,5));
  if(job.smarts) nudge("smarts", rand(job.smarts[0], job.smarts[1]));
  if(job.health) nudge("health", rand(job.health[0], job.health[1]));
  if(job.karma) nudgeHidden("karma", rand(job.karma[0], job.karma[1]));
  state.prisonWorkYears = (state.prisonWorkYears || 0) + 1;
  state.prisonJobsDone = (state.prisonJobsDone || []).concat(job.id);
  addLog(`${job.label} this year — ${money(job.pay)} in prison wages. Conduct now ${prisonConduct()}/100.`);
  refreshActivitySheet();
}

// Keep your head down: the safest year available.
function doKeepClean(){
  if(state.prisonYearsLeft <= 0) return;
  if(!spendPrisonAction()) return;
  nudgeConduct(rand(8,14));
  nudgeHidden("stress", -rand(3,8));
  nudgeHidden("karma", rand(1,3));
  state.prisonCleanYears = (state.prisonCleanYears || 0) + 1;
  addLog(`Kept your head down and stayed out of trouble. Conduct now ${prisonConduct()}/100.`);
  refreshActivitySheet();
}

// Use the facilities — modest gains, mild conduct benefit.
function doPrisonSelfImprovement(kind){
  if(state.prisonYearsLeft <= 0) return;
  if(!spendPrisonAction()) return;
  if(kind === "gym"){
    nudge("health", rand(4,9));
    nudgeConduct(rand(2,5));
    addLog("Spent the year in the prison gym. Fitter than when you came in.");
  } else if(kind === "course"){
    nudge("smarts", rand(4,8));
    nudgeConduct(rand(4,8));
    state.flags.prisonCourse = true;
    addLog("Completed an education course inside — it'll count for something on release.");
  } else {
    nudge("happiness", rand(3,7));
    nudgeConduct(rand(1,4));
    addLog("Kept to the chapel and the yard. A quiet year.");
  }
  refreshActivitySheet();
}

// Crimes available inside. Each pays or gains something, and each carries a
// real chance of being caught — which lengthens the sentence and wrecks
// your conduct record.
const PRISON_CRIMES = [
  {id:"contraband", label:"Deal contraband",        catch:0.30, pay:[400,2500],  extra:[1,2], conduct:[-10,-20], desc:"Phones, tobacco, whatever moves."},
  {id:"brew",       label:"Brew hooch in your cell",catch:0.25, pay:[100,600],   extra:[1,1], conduct:[-8,-15],  desc:"Fruit, sugar, patience."},
  {id:"extort",     label:"Lean on another inmate", catch:0.28, pay:[300,1800],  extra:[1,3], conduct:[-15,-25], desc:"Takings, and a reputation."},
  {id:"fight",      label:"Settle a score",         catch:0.45, pay:[0,0],       extra:[1,2], conduct:[-18,-30], desc:"No money in it. Respect, if you win."},
  {id:"officer",    label:"Bribe an officer",       catch:0.35, pay:[0,0],        extra:[2,4], conduct:[-12,-22], desc:"Buys a quieter sentence, if it holds.", cost:[500,3000]},
];

function doPrisonCrime(id){
  if(state.prisonYearsLeft <= 0) return;
  const def = PRISON_CRIMES.find(c=>c.id===id);
  if(!def) return;
  if(def.cost && state.money < def.cost[0]){
    addLog(`You haven't got the money for that in here.`);
    refreshActivitySheet();
    return;
  }
  if(!spendPrisonAction()) return;

  // A crew behind you makes it easier to get away with.
  let catchChance = state.gang ? def.catch * 0.75 : def.catch;
  // Doing it year after year draws attention.
  catchChance += (state.prisonOffences || 0) * 0.06;
  catchChance = clamp01(catchChance);

  if(def.cost){
    const paid = rand(def.cost[0], Math.min(def.cost[1], Math.max(def.cost[0], Math.floor(state.money))));
    addMoney(-paid);
  }

  if(Math.random() < catchChance){
    state.prisonOffences = (state.prisonOffences || 0) + 1;
    const extra = rand(def.extra[0], def.extra[1]);
    state.prisonYearsLeft += extra;
    nudgeConduct(def.conduct[0] * 1.5);
    nudgeHidden("karma", -6);
    nudge("happiness", -8);
    state.flags.prisonFight = true;       // the parole board remembers
    state.flags.caughtInside = true;
    if(def.id === "fight"){
      nudge("health", -rand(10,25));
      addLog(`Caught fighting. ${extra} more year${extra===1?"":"s"} on the sentence, time in segregation, and you came off worse.`, true);
    } else {
      addLog(`Caught ${def.label.toLowerCase()}. ${extra} more year${extra===1?"":"s"} added to the sentence, and it's on your record.`, true);
    }
  } else {
    state.prisonOffences = (state.prisonOffences || 0) + 1;
    const pay = def.pay[1] ? rand(def.pay[0], def.pay[1]) : 0;
    if(pay) addMoney(pay);
    nudgeConduct(rand(def.conduct[1], def.conduct[0]));
    nudgeHidden("karma", -3);
    if(def.id === "fight"){
      nudge("health", -rand(3,10));
      nudge("happiness", 4);
      addLog("Settled a score and got away with it. Nobody will try you again this year.");
    } else if(def.id === "officer"){
      state.flags.bribedOfficer = true;
      nudge("happiness", 6);
      nudgeHidden("stress", -10);
      addLog("The bribe held. An easier year than it might have been.");
    } else {
      addLog(`${def.label} — ${money(pay)}, and nobody the wiser.`);
    }
  }
  refreshActivitySheet();
}

function doPrisonEscape(){
  if(state.prisonYearsLeft <= 0) return;
  if(!spendPrisonAction()) return;
  // A trusted prisoner has more freedom of movement, so good conduct helps —
  // and a failed attempt is much more costly than it was.
  const chance = clamp(0.08 + state.stats.smarts/400 + state.stats.health/400 + (prisonConduct()-50)/500, 0.4, 0.03);
  if(Math.random() < chance){
    state.prisonYearsLeft = 0;
    state.flags.escapedPrison = true;
    state.prisonActionUsed = false;
    nudge("happiness", 10);
    milestone("released", "Escaped from prison. Free — for now.");
  } else {
    const extra = rand(2,5);
    state.prisonYearsLeft += extra;
    nudge("health", -rand(8,18));
    nudgeConduct(-rand(25,40));
    state.flags.prisonFight = true;
    state.flags.triedToEscape = true;
    addLog(`Escape attempt failed — ${extra} more year${extra===1?"":"s"} on the sentence, and you've lost any trust you had.`, true);
  }
  refreshActivitySheet();
}

// ---------- Emigration — a new country changes salary scale and cost of living ----------

// Anywhere in the world will have you, for a price.
const EMIGRATION_DESTINATIONS = COUNTRIES;

// ---------- Holidays — short trips, unlike the permanent move of emigration ----------

// ---------- Bucket list — long-term life goals, ticked off as you achieve them ----------

const BUCKET_LIST_GOALS = [
  {id:"travel", label:"Take a holiday abroad", test:s=>!!s.bucketList.holidayTaken},
  {id:"ownHome", label:"Own your own home", test:s=>s.assets.some(a=>a.type==="property")},
  {id:"marry", label:"Get married", test:s=>!!s.flags.everMarried},
  {id:"parent", label:"Become a parent", test:s=>s.children.length>0},
  {id:"degree", label:"Earn a degree", test:s=>!!s.degree},
  {id:"topOfCareer", label:"Reach the top of a career", test:s=>!!s.flags.reachedTopOfLadder},
  {id:"millionaire", label:"Become a millionaire", test:s=>netWorth()>=1000000},
  {id:"licence", label:"Learn to drive", test:s=>!!s.flags.canDrive},
  {id:"pet", label:"Own a pet", test:s=>s.pets.length>0 || !!s.bucketList.everHadPet},
  {id:"famous", label:"Become famous", test:s=>(s.hidden.fame||0)>=60},
];

function checkBucketList(){
  BUCKET_LIST_GOALS.forEach(goal=>{
    if(state.bucketList.done[goal.id]) return;
    if(goal.test(state)){
      state.bucketList.done[goal.id] = state.age;
      nudge("happiness", 4);
      addLog(`Bucket list: ${goal.label} — ticked off at ${state.age}.`, true);
    }
  });
}

// What moving somewhere does to your earnings and your bills, measured against
// where you were born rather than in absolute terms — so a life that starts in
// Lagos and moves to London gains as much as the reverse loses, and staying put
// is always neutral.
function emigrationShift(destName){
  const dest = countryByName(destName);
  const home = countryByName(state.birthplace) || countryByName("England");
  if(!dest || !home) return { salaryMult: 1, costMult: 1 };
  // Clamped so the extremes of the table can't produce absurd multipliers.
  const salaryMult = clamp(dest.salaryMult / home.salaryMult, 6, 0.15);
  const costMult   = clamp(dest.costMult   / home.costMult,   4, 0.2);
  return { salaryMult, costMult };
}

// Crossing a continent costs more than moving next door.
function emigrationCost(destName){
  const sameContinent = continentOf(destName) === continentOf(state.currentCountry);
  const base = sameContinent ? rand(1200, 3000) : rand(3500, 9000);
  return Math.round(base * priceLevel());
}

function doEmigrate(name){
  const dest = EMIGRATION_DESTINATIONS.find(d=>d.name===name);
  if(!dest) return;
  if(name === state.currentCountry){ addLog(`You already live in ${name}.`); refreshActivitySheet(); return; }
  const moveCost = emigrationCost(name);
  if(state.money < moveCost){ addLog(`Not enough money to emigrate to ${name} — the move alone costs ${money(moveCost)}.`); refreshActivitySheet(); return; }
  if(!spendAction("emigrate")){ refreshActivitySheet(); return; }
  closeSheet();
  openEmigrationChoice(name, moveCost);
  render();
}

// ---------- Who lives where ----------
// Everyone has a country. Someone with none set lives wherever you do; when
// you emigrate, everyone who stays behind is marked with the country you left.
// People abroad can be called (or written to, before phones were usual) and
// asked to come and join you, but you can't spend time with them in person,
// live with them, or visit their grave — until they move, or you move back.
function isHere(x){ return !!x && (!x.country || !state || x.country === state.currentCountry); }
function isAbroad(x){ return !!x && !isHere(x); }
function abroadLabel(x){ return x && x.country ? x.country : "abroad"; }

// How you keep in touch from abroad, by era.
function callVerb(){
  const y = state ? (state.year || 2020) : 2020;
  return y < 1965 ? { verb:"Write to them", noun:"letter", past:"Wrote to" }
       : y < 2008 ? { verb:"Phone them", noun:"phone call", past:"Phoned" }
       : { verb:"Video call them", noun:"video call", past:"Video-called" };
}

function doCallAbroad(kind, id){
  const p = personByRef(kind, id);
  if(!p || !isAbroad(p) || p.alive === false){ refreshPeopleSheet(); return; }
  if(usesLeft("social") <= 0){ addLog("No more time for that this year."); refreshPeopleSheet(); return; }
  if(!spendAction("social")){ refreshPeopleSheet(); return; }
  recordUse("social");
  const key = kind === "child" ? "bond" : "closeness";
  p[key] = clamp((p[key] === undefined ? 50 : p[key]) + rand(1, 4));
  p.lastContactAge = state.age;
  nudge("happiness", rand(1, 2));
  const v = callVerb();
  addLog(`${v.past} ${p.name} in ${abroadLabel(p)}. Not the same as being there, but it helps.`);
  refreshPeopleSheet();
}

// Would they uproot themselves to be near you?
function inviteChance(p, kind){
  const warmth = kind === "child" ? (p.bond === undefined ? 50 : p.bond) : (p.closeness === undefined ? 50 : p.closeness);
  let c = warmth / 130;
  const rel = p.relation || "";
  if(/Mother|Father|Grand/.test(rel) && p.age >= 70) c *= 0.5;
  if(/Sibling/.test(rel)) c -= 0.1;
  if(kind === "child" && p.partnered) c -= 0.15;
  if(kind === "friend") c *= 0.35;
  if(kind === "ex") c *= 0.2;
  return clamp(c, 0.75, 0.03);
}

function joinYou(p){
  p.country = state.currentCountry;
  p.lastContactAge = state.age;
}

function doInviteToJoin(kind, id){
  const p = personByRef(kind, id);
  if(!p || !isAbroad(p) || p.alive === false){ refreshPeopleSheet(); return; }
  if(p.invitedAge === state.age){ addLog(`You've already asked ${p.name} this year.`); refreshPeopleSheet(); return; }
  if(usesLeft("social") <= 0){ addLog("No more time for that this year."); refreshPeopleSheet(); return; }
  if(!spendAction("social")){ refreshPeopleSheet(); return; }
  recordUse("social");
  p.invitedAge = state.age;
  if(Math.random() < inviteChance(p, kind)){
    joinYou(p);
    // A parent's spouse comes with them.
    if(kind === "family") (state.family||[]).forEach(o=>{ if(o.alive && (o.spouseOf === p.id || p.spouseOf === o.id) && isAbroad(o)) joinYou(o); });
    nudge("happiness", rand(5, 10));
    milestone("milestone", `${p.name} has moved to ${state.currentCountry} to be near you.`, { icon:"🧳", label:"Family" });
  } else {
    addLog(`Asked ${p.name} to move to ${state.currentCountry}. ${p.gender === "Girl" ? "She" : "He"} said ${pick(["their life is where it is","not yet, maybe one day","no, but was touched to be asked"])}.`);
  }
  refreshPeopleSheet();
}

function abroadPersonPage(p, kind, card){
  const social = usesLeft("social");
  const noSocial = social <= 0;
  const socialSub = social > 0 ? `${social} social ${social===1?"slot":"slots"} left this year` : "No social time left this year";
  const where = `<div class="job-line">🌍 Lives in ${abroadLabel(p)}. You're in ${state.currentCountry}, so it's a ${callVerb().noun} or nothing — unless they move.</div>`;
  if(kind === "enemy") return card + `<div class="job-line">🌍 In ${abroadLabel(p)}, and out of your life while you're in ${state.currentCountry}.</div>`;
  const rows = [ actionRow("call", "📞", callVerb().verb, "+a little closeness", { disabled: noSocial }) ];
  if(kind !== "ex") rows.push(actionRow("invite", "🧳", `Ask them to move to ${state.currentCountry}`,
    p.invitedAge === state.age ? "Already asked this year" : `About ${Math.round(inviteChance(p, kind)*100)}% chance`, { disabled: noSocial || p.invitedAge === state.age }));
  if(kind === "ex") rows.push(actionRow("cutcontact", "🚪", "Cut contact for good", "They leave your list"));
  if(kind === "friend") rows.push(actionRow("unfriend", "👋", "Let the friendship go", ""));
  return card + where + `<div class="section-label">From a distance</div><div class="menulist">${rows.join("")}</div><div class="job-line">${socialSub}.</div>`;
}

// ---------- Emigrating, and who comes ----------
function householdFor(){
  const out = [];
  if(state.relationship) out.push({ p:state.relationship, kind:"partner" });
  (state.children||[]).forEach(c=>{ if(c.alive !== false && c.age < 18 && isHere(c)) out.push({ p:c, kind:"child" }); });
  return out;
}
function relativesWhoCouldCome(){
  const out = [];
  (state.family||[]).forEach(p=>{ if(p.alive && isHere(p)) out.push({ p, kind:"family" }); });
  (state.children||[]).forEach(c=>{ if(c.alive !== false && c.age >= 18 && isHere(c)) out.push({ p:c, kind:"child" }); });
  return out;
}
function listNames(arr){
  const n = arr.map(x=>x.p.name);
  return n.length <= 1 ? (n[0] || "") : n.slice(0,-1).join(", ") + " and " + n[n.length-1];
}

function openEmigrationChoice(name, moveCost){
  const house = householdFor();
  const kin = relativesWhoCouldCome();
  const r = state.relationship;
  const kids = house.filter(h=>h.kind==="child");
  const options = [];
  options.push({ label: house.length ? `Move with ${listNames(house)}` : "Move on your own",
    effect: ()=>completeEmigration(name, moveCost, { partnerComes:true, invite:false }) });
  if(kin.length) options.push({ label: `Ask the family to come too — ${kin.length} ${kin.length===1?"relative":"relatives"}, each will decide`,
    effect: ()=>completeEmigration(name, moveCost, { partnerComes:true, invite:true }) });
  if(r && !state.married) options.push({ label: `Go without ${r.name} — it ends the relationship`,
    effect: ()=>completeEmigration(name, moveCost, { partnerComes:false, invite:false }) });
  options.push({ label:"Stay where you are", effect: ()=>{ state.pendingActionId = null; addLog(`Thought about moving to ${name}, and stayed.`); } });
  const behind = [];
  if(kin.length) behind.push("your family");
  if((state.friends||[]).some(isHere)) behind.push("your friends");
  queueChoice({
    title: `Moving to ${name}`,
    text: `The move costs ${money(moveCost)}.${kids.length ? ` ${kids.length===1?"Your child comes":"Your children come"} with you.` : ""}${behind.length ? ` ${behind.join(" and ").replace(/^./, c=>c.toUpperCase())} will stay in ${state.currentCountry} unless they choose to follow — you won't be able to live with them or see them in person, only keep in touch from a distance.` : ""} Any job you hold here ends.`,
    options,
  });
}

function completeEmigration(name, moveCost, opts){
  if(state.money < moveCost){ state.pendingActionId = null; addLog(`Not enough money to emigrate to ${name} any more.`); return; }
  addMoney(-moveCost);
  commitAction();
  const from = state.currentCountry;
  const r = state.relationship;
  // Who comes: your household, and any relatives who say yes.
  const coming = [];
  if(r && opts.partnerComes) coming.push(r);
  (state.children||[]).forEach(c=>{ if(c.alive !== false && c.age < 18 && isHere(c)) coming.push(c); });
  const joined = [];
  if(opts.invite){
    relativesWhoCouldCome().forEach(({p, kind})=>{
      if(Math.random() < inviteChance(p, kind) + 0.1){ coming.push(p); joined.push(p); }
    });
    // Couples move together.
    (state.family||[]).forEach(o=>{ if(o.alive && !coming.includes(o) && coming.some(c=>c.spouseOf === o.id || o.spouseOf === c.id)){ coming.push(o); joined.push(o); } });
  }
  // Everyone and everything else stays where it is.
  const stay = x=>{ if(x && !coming.includes(x) && !x.country) x.country = from; };
  (state.family||[]).forEach(stay);
  (state.children||[]).forEach(stay);
  (state.friends||[]).forEach(stay);
  (state.exes||[]).forEach(stay);
  (state.enemies||[]).forEach(stay);
  (state.late||[]).forEach(stay);
  (state.assets||[]).forEach(a=>{ if(a.type === "property") stay(a); });
  coming.forEach(c=>{ c.country = name; });
  state.currentCountry = name;
  // You can't live in a house in the country you've just left.
  (state.assets||[]).forEach(a=>{ if(a.type === "property" && a.home && isAbroad(a)) a.home = false; });
  state.livedCountries = (state.livedCountries || []).concat(name);

  // The partner who stays behind.
  if(r && !opts.partnerComes){
    r.country = from;
    addLog(`Said goodbye to ${r.name}, who is staying in ${from}. It's over.`, true);
    nudge("happiness", -rand(8, 14));
    state.relationship = null; state.engaged = false; state.relationshipYears = 0;
  }
  // You can't live with parents who stayed behind.
  if(state.livingWithParents && !livingParent()) state.livingWithParents = false;
  // Work belongs to the place you left. A business can be run from anywhere.
  if(state.career){
    const t = state.career.kind === "civilian" ? TRACKS.find(x=>x.id===state.career.trackId) : null;
    addLog(`Left your ${t ? t.name.toLowerCase() : "job"} behind in ${from}.`);
    state.career = null; state.careerWarning = null;
  }
  if(state.politics){ addLog(`Gave up your office in ${from}.`, true); state.politics = null; }

  const lang = state.skills.languages || 0;
  const languageBonus = 1 + (lang/300);
  const shift = emigrationShift(name);
  state.emigrationMultipliers = { salaryMult: shift.salaryMult * languageBonus, costMult: shift.costMult };
  milestone("milestone", `Emigrated from ${from} to ${name}, ${continentOf(name)} — ${money(moveCost)} to make the move.`, {silent:true});
  // Leaving people you love behind hurts more than leaving a place.
  const leftClose = (state.family||[]).concat(state.children||[]).filter(p=>p.alive !== false && isAbroad(p) && ((p.closeness||p.bond||0) >= 60)).length;
  const settlingHit = Math.round(8 - (lang/15)) + Math.min(8, leftClose * 2);
  nudge("happiness", -Math.max(1, settlingHit));
  // Speaking the language means a social footing from the start.
  if(lang >= 40) addFriend(null, rand(40, 60));
  const came = coming.filter(c=>c !== r || opts.partnerComes);
  addLog(`Emigrated to ${name} for ${money(moveCost)}${came.length ? `, with ${came.map(c=>c.name).join(", ")}` : ", alone"}. ${joined.length ? `${joined.map(j=>j.name).join(" and ")} decided to come too. ` : opts.invite ? "Nobody else in the family wanted to uproot. " : ""}${lang >= 40 ? "Speaking the language made settling in far easier. " : ""}Earnings ×${shift.salaryMult.toFixed(2)}, living costs ×${shift.costMult.toFixed(2)} against home.`, true);
  refreshActivitySheet();
}

// You can be born anywhere by choice — the whole table is offered in God Mode.
const BIRTHPLACES = COUNTRIES.map(c=>c.name);

// The default roll, though, is weighted. The game's institutions are British
// (GCSEs, the Royal Navy, HMRC-style tax), so a random birth is usually in the
// British Isles, sometimes elsewhere in the English-speaking world, and
// occasionally anywhere at all.
const BIRTH_WEIGHTS = [
  { weight: 60, pool: ["England","Scotland","Wales","Northern Ireland"] },
  { weight: 20, pool: ["Ireland","United States","Canada","Australia","New Zealand"] },
  { weight: 12, pool: ["France","Germany","Spain","Italy","Netherlands","Poland","Portugal","Sweden","Norway","Denmark"] },
  { weight: 8,  pool: null },   // anywhere in the world
];

function rollBirthplace(){
  let total = BIRTH_WEIGHTS.reduce((s,w)=>s+w.weight,0);
  let roll = Math.random() * total;
  for(const band of BIRTH_WEIGHTS){
    roll -= band.weight;
    if(roll <= 0) return pick(band.pool || BIRTHPLACES);
  }
  return "England";
}

const NOBILITY_RANKS = [
  {id:"commoner", label:"Commoner", maleTitle:"", femaleTitle:""},
  {id:"knight", label:"Knight / Dame", maleTitle:"Sir", femaleTitle:"Dame"},
  {id:"baron", label:"Baron / Baroness", maleTitle:"Baron", femaleTitle:"Baroness"},
  {id:"earl", label:"Earl / Countess", maleTitle:"Earl", femaleTitle:"Countess"},
  {id:"duke", label:"Duke / Duchess", maleTitle:"Duke", femaleTitle:"Duchess"},
  {id:"royal", label:"Prince / Princess (Royalty)", maleTitle:"Prince", femaleTitle:"Princess", canInheritThrone:true},
];

function titlePrefix(){
  if(state.flags.becameMonarch) return state.gender==="Boy" ? "King" : "Queen";
  const rank = NOBILITY_RANKS.find(r=>r.id===state.nobility);
  if(!rank || rank.id==="commoner") return "";
  return state.gender==="Boy" ? rank.maleTitle : rank.femaleTitle;
}

// Holds the pre-rolled character so the setup screen opens with everything
// already chosen — the player amends rather than filling in blanks.
let setupDraft = null;

function rollSetupDraft(){
  const gender = pick(["Girl","Boy"]);
  setupDraft = {
    firstName: nameFor(gender),
    lastName: pick(SURNAMES),
    gender,
    sexuality: rollSexuality(),
    birthplace: rollBirthplace(),
    wealthClass: pick(["poor","middle","middle","rich"]),
    nobility: "commoner",
    scenarioId: "free",
    eraId: pick(ERAS).id,
    bpContinent: null,
    advOpen: false,
    autoName: true,   // true until the player types a name of their own
  };
}

// Create a Life — compact, mobile-first. Everything arrives pre-rolled; the
// player amends what they care about and presses Begin. Anything advanced
// (sexuality, wealth, nobility, birthplace) is tucked behind a disclosure so
// the default path is one screen with no scrolling to speak of.

const FEATURED_SCENARIOS = ["free","rags","redemption"];

// The God Mode controls, each behind its own perk.
const GOD_PERKS = ["god_sexuality","era_choice","god_birthplace","god_wealth","god_nobility","god_royalty"];
function godPerksOwned(){ return GOD_PERKS.filter(id=>hasPerk(id)).length; }

// The throne is a separate unlock, so a royal rank left over in the draft from
// before a refund falls back to the highest title you're actually entitled to.
function nobilityAllowed(id){
  const rank = NOBILITY_RANKS.find(r=>r.id===id);
  if(!rank) return "commoner";
  if(rank.canInheritThrone && !hasPerk("god_royalty")) return "duke";
  return rank.id;
}

function rollSexuality(){ return pick(["Straight","Straight","Straight","Straight","Gay","Bisexual"]); }

// Shown in place of a control you haven't unlocked, naming the perk and what
// it costs so there's no guessing where it comes from.
function lockedNote(perkId, whatItDoes){
  const p = perkById(perkId);
  if(!p) return "";
  const lvl = levelFromXp(meta.xp).level;
  const short = lvl < p.level
    ? `needs level ${p.level}`
    : (xpAvailable() >= p.cost ? `${p.cost.toLocaleString()} XP — you can afford it` : `${p.cost.toLocaleString()} XP`);
  return `<div class="lead">${whatItDoes} Unlock it with <b>${p.name}</b> — ${short}, from the Perks screen.</div>`;
}

function makePerson(relation, gender, age){
  const g = gender || pick(["Girl","Boy"]);
  const p = { id: personIdCounter++, name: nameFor(g), relation, gender: g, alive:true, closeness: rand(40,80) };
  p.age = age === undefined ? plausibleAgeFor(relation) : age;
  // Nobody has a negative age, however they were built.
  if(!Number.isFinite(p.age) || p.age < 0) p.age = 0;
  // Someone you met in a bar has savings just as much as someone you met on an
  // app, and a prenup is only a judgement call if you can see them.
  if(relation === "Partner") p.netWorth = plausiblePartnerNetWorth(p.age);
  return p;
}

// Partners from older saves, or built before this existed, get a figure the
// first time anything asks for one.
function partnerNetWorth(p){
  const who = p || state.relationship;
  if(!who) return 0;
  if(!Number.isFinite(who.netWorth)) who.netWorth = plausiblePartnerNetWorth(who.age || 25);
  return Math.max(0, Math.round(who.netWorth));
}

// A sensible age for a person in a given role, relative to the player's.
function plausibleAgeFor(relation){
  const a = state ? state.age : 0;
  switch(relation){
    case "Mother": case "Father": return a + rand(22, 38);
    case "Grandmother": case "Grandfather": return a + rand(48, 72);
    case "Sibling": return Math.max(0, a + rand(-9, 9));   // never below zero
    case "Partner": return Math.max(18, a + rand(-8, 8));
    case "Friend": return Math.max(0, a + rand(-6, 6));
    default: return Math.max(0, a + rand(-10, 10));
  }
}

// Anyone without a recorded age (an older save, or a person built before ages
// existed) gets one inferred from their role, once.
function ensurePersonAge(p){
  if(!p) return p;
  if(p.age === undefined) p.age = plausibleAgeFor(p.relation);
  if(!Number.isFinite(p.age) || p.age < 0) p.age = 0;
  return p;
}

// ---------------------------------------------------------------------------
// One mortality curve for everyone in the world, the player included. Mirrors
// the player's own deathChance table so an NPC of 90 is as likely to die as a
// player of 90 — rather than the old roll, which keyed off the PLAYER's age
// and let parents reach a hundred and more.
// ---------------------------------------------------------------------------
function npcDeathChance(age){
  let chance;
  if(age < 15)      chance = 0.0002;
  else if(age < 25) chance = 0.0006;
  else if(age < 35) chance = 0.001;
  // From here the bands track real UK annual mortality rates fairly closely,
  // which is what puts the average lifespan around eighty rather than seventy.
  else if(age < 45) chance = 0.0018;
  else if(age < 55) chance = 0.0035;
  else if(age < 65) chance = 0.009;
  else if(age < 75) chance = 0.021;
  else if(age < 85) chance = 0.055;
  else if(age < 90) chance = 0.13;
  else if(age < 95) chance = 0.22;
  else if(age < 100) chance = 0.33;
  else if(age < 105) chance = 0.48;
  else              chance = 0.65;  // beyond this, nobody lasts long
  return chance;
}

// Plain-English cause for an NPC's death, appropriate to their age.
function npcDeathCause(age){
  if(age >= 85) return pick(["old age","old age","a long decline","natural causes"]);
  if(age >= 65) return pick(["a short illness","heart trouble","natural causes","a stroke"]);
  if(age >= 40) return pick(["a sudden illness","heart trouble","cancer","an accident"]);
  return pick(["an accident","a sudden illness","a road accident"]);
}

// A plausible age for someone you'd meet now: clustered around your own, a
// little wider as you get older, and never below 18.
function plausiblePartnerAge(){
  const spread = state.age < 25 ? 4 : state.age < 40 ? 8 : 14;
  return Math.max(18, state.age + rand(-spread, spread));
}

// Rough wealth for a prospective partner, scaled by their age — someone in
// their fifties has had longer to accumulate than someone of twenty.
function plausiblePartnerNetWorth(age){
  const years = Math.max(0, age - 21);
  const base = rand(0, 4000) + years * rand(400, 2600);
  // The occasional very wealthy match — but even inherited money compounds,
  // so a windfall at 50 is a bigger one than at 22.
  if(Math.random() < 0.06) return base + Math.round(rand(40000, 200000) * (1 + years / 12));
  return Math.round(base);
}

// Builds a dating prospect with everything the filters can be applied to.
function makeProspect(ageRange){
  const gender = desiredPartnerGender();
  const p = makePerson("Partner", gender);
  // Normally people near your own age; where an age filter is set, draw from
  // inside it, since looking outside your own bracket is a real preference.
  if(ageRange){
    const lo = Math.max(18, ageRange[0]);
    const hi = Math.max(lo, ageRange[1]);
    p.age = rand(lo, hi);
  } else {
    p.age = plausiblePartnerAge();
  }
  p.netWorth = plausiblePartnerNetWorth(p.age);
  p.trait = pick(DATING_TRAITS);
  return p;
}

function desiredPartnerGender(){
  if(state.sexuality === "Gay") return state.gender;
  if(state.sexuality === "Straight") return state.gender === "Boy" ? "Girl" : "Boy";
  return pick(["Boy","Girl"]);
}

// ---------- Dating — one attempt per year, via the app or organic methods ----------

const DATING_TRAITS = [
  "loves hiking", "obsessed with true crime podcasts", "plays five instruments badly",
  "runs marathons for fun", "collects vintage vinyl", "can't cook to save their life",
  "always up for karaoke", "writing a novel nobody will read", "walks dogs on weekends",
  "insists pineapple belongs on pizza", "into amateur astronomy", "never misses a pub quiz",
];

// ---------- Dating app filters ----------
// Kept outside the life state so they survive a new life but never end up in
// a save file or a time-machine snapshot.
let datingFilters = { minAge:null, maxAge:null, minNetWorth:null };

function filterSummary(){
  const bits = [];
  if(datingFilters.minAge || datingFilters.maxAge){
    bits.push(`age ${datingFilters.minAge || 18}–${datingFilters.maxAge || "any"}`);
  }
  if(datingFilters.minNetWorth) bits.push(`${money(datingFilters.minNetWorth)}+ net worth`);
  return bits.length ? bits.join(" · ") : "no filters — anyone nearby";
}

function matchesFilters(p){
  const f = datingFilters;
  if(f.minAge && p.age < f.minAge) return false;
  if(f.maxAge && p.age > f.maxAge) return false;
  if(f.minNetWorth && p.netWorth < f.minNetWorth) return false;
  return true;
}

// What share of people would pass the filters. Asking for a particular age
// bracket just points you at a different group, so it doesn't thin the pool;
// asking for wealth genuinely does.
function filterSelectivity(){
  const f = datingFilters;
  if(!f.minNetWorth) return 1;
  if(f.minNetWorth >= 500000) return 0.06;
  if(f.minNetWorth >= 100000) return 0.18;
  if(f.minNetWorth >= 25000) return 0.45;
  return 0.8;
}

// How many profiles the app has to show. Gatekeeping on wealth means fewer
// people, visibly — one or two profiles rather than a full list.
function profileSlots(){
  const sel = filterSelectivity();
  if(sel >= 1) return 3;
  if(sel >= 0.4) return 3;
  if(sel >= 0.15) return 2;
  return 1;
}

// Profiles currently showing on the app, respecting the filters. Draws from a
// larger pool and keeps what passes, so tight filters genuinely return less.
function generateDatingProfiles(){
  const f = datingFilters;
  // Honour an age filter by drawing from it directly; without one, people
  // near your own age as before.
  const range = (f.minAge || f.maxAge) ? [f.minAge || 18, f.maxAge || Math.max(60, state.age + 20)] : null;
  const slots = profileSlots();
  const profiles = [];
  for(let tries = 0; tries < 200 && profiles.length < slots; tries++){
    const p = makeProspect(range);
    if(matchesFilters(p)) profiles.push(p);
  }
  return profiles;
}

function setDatingFilter(key, value){
  const v = value === "" || value === null ? null : parseAmount(value);
  datingFilters[key] = Number.isFinite(v) ? v : null;
  // Keep the age range the right way round.
  if(datingFilters.minAge !== null) datingFilters.minAge = Math.max(18, Math.min(99, datingFilters.minAge));
  if(datingFilters.maxAge !== null) datingFilters.maxAge = Math.max(18, Math.min(99, datingFilters.maxAge));
  if(datingFilters.minAge && datingFilters.maxAge && datingFilters.minAge > datingFilters.maxAge){
    const t = datingFilters.minAge; datingFilters.minAge = datingFilters.maxAge; datingFilters.maxAge = t;
  }
  refreshActivitySheet();
}

function clearDatingFilters(){
  datingFilters = { minAge:null, maxAge:null, minNetWorth:null };
  addLog("Cleared the dating filters.");
  refreshActivitySheet();
}

function matchChance(){
  return clamp(0.35 + (state.stats.looks-50)/300 + (state.stats.happiness-50)/400, 0.75, 0.1);
}

// ---------- Fertility ----------
// Per-year chance of conceiving, for the woman in the couple at a given age.
// Follows the real curve: a plateau through the twenties, a decline from the
// mid-thirties, a steep fall after forty and effectively nothing past the
// mid-forties.
function femaleFertility(age){
  if(age < 15) return 0;
  if(age < 20) return 0.80;
  if(age < 25) return 0.86;
  if(age < 30) return 0.82;
  if(age < 33) return 0.72;
  if(age < 35) return 0.60;
  if(age < 38) return 0.42;
  if(age < 40) return 0.28;
  if(age < 42) return 0.15;
  if(age < 44) return 0.07;
  if(age < 46) return 0.03;
  if(age < 50) return 0.01;
  return 0;
}

// Male fertility declines far more gently, and much later.
function maleFertility(age){
  if(age < 16) return 0;
  if(age < 40) return 1;
  if(age < 50) return 0.9;
  if(age < 60) return 0.75;
  if(age < 70) return 0.55;
  return 0.35;
}

// The couple's combined chance of conceiving in a year of trying, before
// contraception is taken into account. Returns 0 where conception isn't
// possible at all — two partners of the same sex, or either one too young.
function conceptionChance(partner, useProtection){
  if(!partner) return 0;
  const myGender = state.gender;
  const theirGender = partner.gender || (myGender === "Boy" ? "Girl" : "Boy");
  // It takes one of each. Same-sex couples don't conceive by this route.
  if(myGender === theirGender) return 0;

  const myAge = state.age;
  const theirAge = partner.age === undefined ? plausiblePartnerAge() : partner.age;
  const womanAge = myGender === "Girl" ? myAge : theirAge;
  const manAge   = myGender === "Boy"  ? myAge : theirAge;

  let chance = femaleFertility(womanAge) * maleFertility(manAge);
  if(chance <= 0) return 0;

  // Health on both sides nudges it, and a known condition can weigh on it.
  chance *= 0.75 + (state.stats.health / 200);
  if((state.conditions||[]).some(c=>/infertility/i.test(c.name))) chance *= 0.1;

  // Contraception, used properly, is the dominant factor.
  if(useProtection) chance *= 0.03;
  // A couple who've agreed to use it as a matter of course are covered even
  // on a night nobody thought about it.
  else if(state.birthControl && state.relationship && partner === state.relationship) chance *= 0.04;

  return clamp01(chance);
}

function clamp01(v){ return v < 0 ? 0 : v > 1 ? 1 : v; }

// A plain-English read on the odds, for the protection prompt.
function conceptionOddsLabel(partner){
  const c = conceptionChance(partner, false);
  if(c <= 0) return "no chance of pregnancy";
  if(c < 0.03) return "a very remote chance of pregnancy";
  if(c < 0.1) return "a slim chance of pregnancy";
  if(c < 0.3) return "a real chance of pregnancy";
  if(c < 0.6) return "a good chance of pregnancy";
  return "a high chance of pregnancy";
}

function doDatingApp(name, profileIndex){
  if(!spendAction("dating")){ refreshActivitySheet(); return; }
  if(usesLeft("dating") <= 0){ addLog("Already spent enough time on the apps this year."); refreshActivitySheet(); return; }
  recordUse("dating");
  const profile = (state.datingProfiles || [])[profileIndex];
  // Narrow filters mean fewer people to choose from, and the ones who do pass
  // have more options themselves — so matching gets harder as you get fussier.
  const chance = clamp(matchChance() * (0.5 + filterSelectivity()/2), 0.75, 0.04);
  if(Math.random() < chance){
    const partner = profile ? Object.assign(makePerson("Partner", profile.gender), {
      name: profile.name, age: profile.age, netWorth: profile.netWorth, trait: profile.trait,
    }) : Object.assign(makeProspect(), { name });
    state.relationship = partner;
    nudge("happiness", 8);
    milestone("dating", `Matched with ${partner.name}, ${partner.age}, on the app — hit it off right away.`);
    state.datingProfiles = null;  // the list is stale once you're seeing someone
  } else {
    addLog(`Messaged ${name} on the app, but it fizzled out.`);
  }
  refreshActivitySheet();
}

// ---------- One-night stands ----------
// Available whether or not you're seeing someone — though if you are, it's an
// affair, with everything that comes with being found out.

function oneNightChance(){
  return clamp(0.3 + (state.stats.looks-50)/200 + (state.stats.happiness-50)/400, 0.85, 0.08);
}

function doOneNightStand(){
  if(state.age < 18){ return; }
  if(!spendAction("onenight")){ refreshActivitySheet(); return; }
  if(usesLeft("onenight") <= 0){ addLog("You've had enough nights like that for one year."); refreshActivitySheet(); return; }
  recordUse("onenight");

  if(Math.random() >= oneNightChance()){
    nudge("happiness", -3);
    addLog("A night out that went nowhere.");
    refreshActivitySheet();
    return;
  }

  const other = makeProspect();
  closeSheet();
  // The decision that matters is made in the moment, so it's a forced prompt
  // rather than a button tucked away in a menu.
  queueChoice({
    title: "One thing leads to another",
    text: `You've ended up back with ${other.name}, ${other.age}. There's ${conceptionOddsLabel(other)} if you don't use protection, and a risk of infection either way.`,
    options: [
      { label: "Use protection", effect: ()=>resolveOneNight(other, true) },
      { label: "Don't bother", effect: ()=>resolveOneNight(other, false) },
      { label: "Change your mind and go home", effect: ()=>{
          nudge("happiness", -2);
          addLog(`Thought better of it and left ${other.name} to it.`);
        }},
    ],
  });
}

function resolveOneNight(other, useProtection){
  const cheating = !!state.relationship;
  nudge("happiness", cheating ? 3 : 6);
  nudgeHidden("stress", cheating ? 10 : -3);
  if(cheating) nudgeHidden("karma", -10);
  addLog(`Spent the night with ${other.name}, ${other.age}${useProtection ? ", using protection" : ", without protection"}.${cheating ? " And you're supposed to be with someone." : ""}`);

  if(!useProtection && Math.random() < 0.08){
    addCondition("an infection", "early");
    addLog("Picked up an infection — worth seeing a doctor about it.", true);
  } else if(useProtection && Math.random() < 0.01){
    addCondition("an infection", "early");
    addLog("Picked up an infection despite being careful.", true);
  }

  // Being found out is the real risk of an affair.
  if(cheating && Math.random() < 0.3){
    state.flags.caughtCheating = true;
    const name = state.relationship.name;
    if(Math.random() < 0.55){
      addLog(`${name} found out about the affair and ended it.`, true);
      state.relationship = null;
      state.married = false;
      nudge("happiness", -18);
    } else {
      state.relationship.closeness = clamp((state.relationship.closeness||50) - rand(25,45));
      addLog(`${name} found out about the affair. They've stayed, for now.`, true);
      nudge("happiness", -12);
    }
  }

  // Conception uses the same model as a relationship, with both ages counted.
  if(state.children.length < 6 && Math.random() < conceptionChance(other, useProtection)){
    const womanIsPlayer = state.gender === "Girl";
    if(womanIsPlayer){
      addLog(`A pregnancy from that night with ${other.name}.`, true);
      conceiveChild();
    } else {
      addLog(`${other.name} is pregnant, and it's yours.`, true);
      conceiveChild();
    }
  }
  refreshActivitySheet();
}

const ORGANIC_DATING_METHODS = [

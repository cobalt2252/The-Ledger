function addFriend(name, closeness){
  const f = makePerson("Friend");
  if(name) f.name = name;
  f.closeness = closeness === undefined ? rand(40,60) : closeness;
  f.lastContactAge = state.age;
  state.friends.push(f);
  return f;
}

// Someone new wants to get to know you.
function offerNewFriendship(){
  const ctx = pick(MEETING_CONTEXTS.filter(c=>state.age >= c.minAge && c.available()));
  if(!ctx) return;
  const name = pick(NAMES);
  queueChoice({
    title: "Someone worth knowing",
    text: `You've got talking to ${name} ${ctx.text}. They've suggested doing something sometime.`,
    options: [
      { label: "Take them up on it", effect: ()=>{
          const f = addFriend(name, rand(45,65));
          nudge("happiness", rand(3,7));
          addLog(`Became friends with ${name}, who you met ${ctx.text}. Closeness ${f.closeness}.`, true);
        }},
      { label: "Be polite but keep your distance", effect: ()=>{
          addLog(`Was friendly enough with ${name}, but left it there.`);
        }},
      { label: "Not interested", effect: ()=>{
          nudgeHidden("karma", -2);
          addLog(`Brushed ${name} off.`);
          if(Math.random() < 0.15) makeEnemy(`a snub when you first met ${name}`);
        }},
    ],
  });
}

// An existing friend asks you to do something.
function offerFriendInvitation(){
  const candidates = state.friends.filter(f=>f.closeness > 10 && isHere(f));
  if(!candidates.length) return;
  const f = pick(candidates);
  const inv = pick(FRIEND_INVITATIONS.filter(i=>i.cost <= Math.max(0, state.money)));
  if(!inv) return;
  queueChoice({
    title: `${f.name} is in touch`,
    text: `${f.name} has asked if you fancy ${inv.label}${inv.cost ? ` — it'll cost about ${money(inv.cost)}` : ""}. You last saw them ${f.lastContactAge === undefined || state.age - f.lastContactAge <= 0 ? "recently" : `${state.age - f.lastContactAge} year${state.age-f.lastContactAge===1?"":"s"} ago`}.`,
    options: [
      { label: `Go — ${inv.cost ? money(inv.cost) : "free"}`, effect: ()=>{
          if(inv.cost) addMoney(-inv.cost);
          f.closeness = clamp(f.closeness + rand(6,13));
          f.lastContactAge = state.age;
          nudge("happiness", rand(inv.happy[0], inv.happy[1]));
          if(inv.stat) nudge(inv.stat, rand(1,3));
          addLog(`Went to ${inv.label} with ${f.name}. Closeness now ${f.closeness}.`);
        }},
      { label: "Make an excuse", effect: ()=>{
          f.closeness = clamp(f.closeness - rand(4,10));
          addLog(`Made an excuse to ${f.name}. Closeness now ${f.closeness}.`);
        }},
      { label: "Don't reply", effect: ()=>{
          f.closeness = clamp(f.closeness - rand(10,18));
          addLog(`Left ${f.name}'s message unanswered.`);
        }},
    ],
  });
}

// A friend you've neglected pulls you up on it.
function offerNeglectedFriend(){
  const neglected = state.friends.filter(f=>isHere(f) && f.lastContactAge !== undefined && state.age - f.lastContactAge >= 4 && f.closeness > 0);
  if(!neglected.length) return;
  const f = pick(neglected);
  const years = state.age - f.lastContactAge;
  queueChoice({
    title: `${f.name} has had enough`,
    text: `It's been ${years} years. ${f.name} has got in touch to say they've noticed, and that it's always them making the effort.`,
    options: [
      { label: "Apologise and make the time", effect: ()=>{
          f.closeness = clamp(f.closeness + rand(10,20));
          f.lastContactAge = state.age;
          nudge("happiness", 4);
          addLog(`Made it right with ${f.name}. Closeness now ${f.closeness}.`, true);
        }},
      { label: "Say you've been busy", effect: ()=>{
          f.closeness = clamp(f.closeness - rand(5,12));
          addLog(`Told ${f.name} you'd been busy. They've heard it before.`);
        }},
      { label: "Let the friendship go", effect: ()=>{
          state.friends = state.friends.filter(x=>x.id !== f.id);
          nudge("happiness", -5);
          addLog(`Let the friendship with ${f.name} go.`, true);
        }},
    ],
  });
}

// Rolled once a year, after the other systems, and only when nothing else has
// already claimed the year's decision.
function maybeSocialEvent(){
  if(state.pendingChoice || !state.alive || state.prisonYearsLeft > 0) return;

  // Being pulled up on neglect comes first — it's the consequence of the decay.
  if(Math.random() < 0.3 && state.friends.some(f=>f.lastContactAge !== undefined && state.age - f.lastContactAge >= 4 && f.closeness > 0)){
    offerNeglectedFriend();
    return;
  }
  // Then an invitation from someone you already know.
  if(state.friends.length && Math.random() < 0.3){
    offerFriendInvitation();
    return;
  }
  // Then meeting someone new — likelier when you have few friends.
  const room = 6 - state.friends.length;
  if(room > 0 && state.age >= 5){
    const chance = 0.1 + room * 0.035;
    if(Math.random() < chance) offerNewFriendship();
  }
}

function makeEnemy(reason){
  const e = { id: personIdCounter++, name: pick(NAMES), reason, hostility: rand(30,60), age: Math.max(10, state.age + rand(-8,8)) };
  state.enemies = (state.enemies||[]).concat(e);
  addLog(`${e.name} has it in for you — ${reason}.`, true);
  return e;
}

function runEnemyYear(){
  state.enemies = (state.enemies||[]).filter(e=>{
    if(e.age === undefined) return true;
    if(Math.random() < npcDeathChance(e.age + 1)){
      const cause = npcDeathCause(e.age + 1);
      recordLate({ kind:"enemy", name:e.name, relation:"Rival", ageAtDeath:e.age + 1, cause, country: e.country });
      addLog(`${e.name}, who had it in for you, has died at ${e.age + 1}.`);
      return false;
    }
    return true;
  });
  (state.enemies||[]).forEach(e=>{
    if(e.age === undefined) e.age = Math.max(10, state.age + rand(-8,8));
    e.age += 1;
    e.hostility = clamp(e.hostility + rand(-3,6));
    if(isHere(e) && e.hostility > 70 && Math.random() < 0.25){
      const harm = pick(["spread rumours about you","got you in trouble at work","vandalised your property","picked a fight with you"]);
      if(harm === "vandalised your property" && state.assets.length){
        const a = pick(state.assets);
        const dmg = Math.round(a.value * 0.05);
        a.value = Math.max(0, a.value - dmg);
        addLog(`${e.name} ${harm} — ${money(dmg)} of damage.`, true);
      } else if(harm === "picked a fight with you"){
        nudge("health", -rand(5,15));
        addLog(`${e.name} ${harm}.`, true);
      } else {
        nudge("happiness", -rand(4,9));
        if(state.career) nudgePerformance(-5);
        addLog(`${e.name} ${harm}.`, true);
      }
    }
  });
}

function doConfrontEnemy(id){
  const e = (state.enemies||[]).find(x=>x.id===id);
  if(!e) return;
  if(usesLeft("social") <= 0){ addLog("No time left for that this year."); refreshPeopleSheet(); return; }
  if(!spendAction("social")){ refreshPeopleSheet(); return; }
  recordUse("social");
  const odds = clamp(0.3 + state.stats.health/300 + (state.skills.martialArts||0)/300, 0.9, 0.1);
  if(Math.random() < odds){
    e.hostility = clamp(e.hostility - rand(20,40));
    nudge("happiness", 5);
    addLog(`Stood up to ${e.name}. They've backed off for now.`);
  } else {
    nudge("health", -rand(5,15));
    e.hostility = clamp(e.hostility + rand(5,15));
    addLog(`Confronted ${e.name} and came off worse.`);
  }
  refreshPeopleSheet();
}

function doMakePeace(id){
  const e = (state.enemies||[]).find(x=>x.id===id);
  if(!e) return;
  if(usesLeft("social") <= 0){ addLog("No time left for that this year."); refreshPeopleSheet(); return; }
  if(!spendAction("social")){ refreshPeopleSheet(); return; }
  recordUse("social");
  const odds = clamp(0.35 + state.stats.smarts/300 + state.hidden.karma/300, 0.9, 0.1);
  if(Math.random() < odds){
    state.enemies = state.enemies.filter(x=>x.id!==e.id);
    nudge("happiness", 8);
    nudgeHidden("karma", 5);
    addLog(`Made peace with ${e.name}. That's one less thing.`, true);
  } else {
    e.hostility = clamp(e.hostility + rand(3,10));
    addLog(`Tried to make peace with ${e.name}. They weren't interested.`);
  }
  refreshPeopleSheet();
}

// ---------- Time Machine ----------
// A snapshot is kept at the start of every year, so a life can be rewound and
// replayed from an earlier age. Snapshots are deep copies so rewinding can't
// be corrupted by later mutations.

const TIME_MACHINE_DEPTH_BASE = 15;
// Long Memory keeps more years in reach; Hardcore keeps none at all.
function timeMachineDepth(){
  if(meta.difficulty === "hardcore") return 0;
  return hasPerk("long_memory") ? 30 : TIME_MACHINE_DEPTH_BASE;
}

function pushSnapshot(){
  if(isHardcore()) return;   // one life means no going back
  try{
    state.snapshots = state.snapshots || [];
    const copy = JSON.parse(JSON.stringify(state));
    delete copy.snapshots; // never nest snapshots inside snapshots
    // pendingChoice holds option callbacks, which JSON can't carry — a restored
    // one would render buttons whose effects no longer exist, so drop it.
    delete copy.choiceQueue;
    delete copy.pendingChoice;
    delete copy.yearReview;
    state.snapshots.push({ age: state.age, data: copy });
    if(state.snapshots.length > timeMachineDepth()) state.snapshots.shift();
  }catch(e){ /* snapshotting is best-effort and never blocks play */ }
}

function rewindTo(age){
  const snaps = state.snapshots || [];
  const snap = snaps.find(s=>s.age === age);
  if(!snap) return;
  const keep = snaps.filter(s=>s.age < age);
  const restored = JSON.parse(JSON.stringify(snap.data));
  restored.snapshots = keep;
  restored.pendingChoice = null;
  restored.choiceQueue = [];
  restored.yearReview = null;
  state = restored;
  state.alive = true;
  state.causeOfDeath = null;
  state.finalScore = null;
  state.newAchievements = [];
  addLog(`Turned back the clock to age ${age}. This life gets another run at it.`, true);
  closeSheet();
  render();
}

    ${chevron || opens ? `<span class="chev">›</span>` : dots ? `<span class="dots">•••</span>` : ""}

}

// ---------- Condition ----------
// Things wear. Condition runs 0–100 and decides most of what something is
// worth: a car with a tired engine, a house that needs a new roof, a clock that
// has been dropped. It is shown everywhere the thing is.
function condLabel(c){
  return c >= 95 ? "Mint" : c >= 80 ? "Excellent" : c >= 62 ? "Good" : c >= 42 ? "Fair" : c >= 22 ? "Poor" : "Ruined";
}
// What share of its pristine value something in this condition fetches.
function condFactor(c){ return 0.2 + 0.8 * Math.pow(clamp(c, 100, 0) / 100, 1.3); }
// Houses hold value better than objects: even a wreck is worth the plot.
function propCondFactor(c){ return 0.6 + 0.4 * clamp(c, 100, 0) / 100; }

function pickWeighted(list){
  const total = list.reduce((s,x)=>s+(x.w||1),0);
  let r = Math.random() * total;
  for(const x of list){ r -= (x.w||1); if(r <= 0) return x; }
  return list[list.length-1];
}
function shopYear(){ return state ? (state.year || 2020) : 2020; }
function priced(modern){ return Math.max(1, Math.round(modern * priceLevel())); }

// A used vehicle: older and more worn means cheaper, and condition is what's
// left after the years. Dealers price within a band of the true value.
function usedVehicle(cls, type, opts){
  const o = opts || {};
  const year = shopYear();
  const isNew = !o.usedOnly && Math.random() < 0.3;
  const age = isNew ? 0 : rand(1, o.maxAge || 15);
  const condition = isNew ? 100 : clamp(100 - age * rand(3, 6) + rand(-10, 10), 98, 12);
  const newPrice = rand(cls.newPrice[0], cls.newPrice[1]);
  const market = priced(newPrice * Math.pow(0.86, age) * (0.7 + 0.3 * condition / 100));
  const miles = age ? age * rand(6000, 11000) : rand(5, 40);
  return {
    type, condition, market,
    madeYear: year - age,
    upkeep: priced(cls.upkeep),
    detail: isNew ? "Brand new" : `${year - age} · ${age} year${age===1?"":"s"} old · ${miles.toLocaleString()} miles`,
  };
}

      return Array.from({length:rand(3,5)}, ()=>{
        const d = pick(defs);

        return { type:"vehicle", label:`${pick(["Brock","Pelham","Strider","Arrow"])} ${d.label}`, condition,

    stock(){

        { label:"Gold watch", p:[1500,6000] }, { label:"Chronograph watch", p:[4000,38000] },

          market: Math.round(asking * 0.1), asking, upkeep:0, detail:"No certificate offered" };

  { id:"music", name:"Hyacinth Guitars", kind:"Music shops", icon:"🎸", blurb:"Guitars, pianos, drums and more",
    stock(){
      const defs = [

        { label:"Bass guitar", p:[350,2500], from:1952 }, { label:"Vintage electric guitar", p:[3000,25000], from:1975, vintage:true },
        { label:"Upright piano", p:[1500,9000], from:1900 }, { label:"Grand piano", p:[15000,90000], from:1900 },
        { label:"Digital piano", p:[500,3000], from:1985 }, { label:"Violin", p:[300,6000], from:1900 },
        { label:"Drum kit", p:[500,4000], from:1940 }, { label:"Synthesizer", p:[800,6000], from:1970 },

      return shuffle(defs).slice(0, rand(4,6)).map(d=>{

        return Object.assign(usedVehicle({ newPrice:d.p, upkeep:d.upkeep }, "boat", { maxAge:20 }), { label:`${pick(["Sea","Tide","Harbour","Gull"])}${pick(["runner","song","light","wake"])} ${d.label.toLowerCase()}`, needs:"canBoat" });

        { label:"private jet", p:[3000000,25000000], upkeep:350000, needs:"canFlyPlane", from:1965 },
      ].filter(d=>shopYear() >= d.from);
      if(!defs.length) return [];
      return Array.from({length:rand(2,4)}, ()=>{
        const d = pick(defs);
        return Object.assign(usedVehicle({ newPrice:d.p, upkeep:d.upkeep }, "vehicle", { maxAge:25 }), { label:`${pick(["Skylark","Merlin","Corvid","Heron"])} ${d.label}`, needs:d.needs });

function shuffle(a){ const b = a.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; }

// What the shop has out today. Walking in again brings out different stock.
let shopStock = {};
let shopView = { shop:null };
let listingSeq = 0;

function restockShop(id){
  const def = SHOP_DEFS.find(s=>s.id===id);
  if(!def) return [];
  const items = def.stock().map(l=>{
    l.market = Math.max(1, l.market);
    if(l.asking === undefined) l.asking = Math.round(l.market * rand(90, 115) / 100);
    l.asking = Math.max(1, l.asking);
    l.id = ++listingSeq;
    return l;
  });
  shopStock[id] = items;
  return items;
}

// A plain-English verdict on the price, which a careful buyer would work out.
function priceVerdict(l){
  if(l.soldAsSeen || l.fake) return "";
  const r = l.asking / Math.max(1, l.market);
  return r < 0.94 ? "Below the going rate" : r > 1.1 ? "Optimistic asking price" : "Fair price";
}

function doBuyListing(shopId, listingId){
  const def = SHOP_DEFS.find(s=>s.id===shopId);
  const stock = shopStock[shopId] || [];
  const l = stock.find(x=>x.id===listingId);
  if(!def || !l){ refreshShoppingSheet(); return; }
  if(l.needs && !state.flags[l.needs]){
    addLog(`You need the right licence before buying ${aOrAn(l.label)} ${l.label.toLowerCase()}.`);
    refreshShoppingSheet(); return;
  }
  if(state.money < l.asking){ addLog(`Can't afford the ${l.label.toLowerCase()} at ${money(l.asking)}.`); refreshShoppingSheet(); return; }
  addMoney(-l.asking);
  const condition = l.trueCondition !== undefined ? l.trueCondition : l.condition;
  const value = l.realMarket !== undefined ? l.realMarket : l.market;
  const asset = { type:l.type, name:l.label, value, upkeep:l.upkeep||0, rented:false, condition };
  ["cat","baseValue","madeYear","classic","fake","vintage","antique"].forEach(k=>{ if(l[k] !== undefined) asset[k] = l[k]; });
  if(asset.baseValue !== undefined && l.trueCondition === undefined) asset.value = Math.round(asset.baseValue * condFactor(condition));
  if(l.type === "luxury"){ asset.appraised = true; asset.pl = priceLevel(); }
  state.assets.push(asset);
  shopStock[shopId] = stock.filter(x=>x.id !== listingId);
  nudge("happiness", l.asking > eraMoney(20000) ? 8 : 3);
  addLog(`Bought the ${l.label.toLowerCase()} from ${def.name} for ${money(l.asking)}.`, l.asking > eraMoney(20000));
  if(l.fake) addLog("It looks convincing enough, though it's worth a fraction of what you paid.");
  if(l.soldAsSeen && condition < l.condition - 5){
    addLog(`Drove it home and found out what "sold as seen" means — it's in ${condLabel(condition).toLowerCase()} condition, not ${condLabel(l.condition).toLowerCase()}. Worth about ${money(value)}.`, true);
    nudge("happiness", -6);
  } else if(l.soldAsSeen){
    addLog("It turned out to be as described. A rare result at Dodgy Dave's.");
  }
  refreshShoppingSheet();
}

function openShoppingSheet(shopId){
  closeSheet();
  shopView = { shop:null };
  const overlay=document.createElement("div");
  overlay.className="overlay"; overlay.id="sheetOverlay";
  document.body.appendChild(overlay);
  if(shopId) enterShop(shopId, overlay);
  else renderShoppingSheet(overlay);
}
function enterShop(id, overlay){
  shopView.shop = id;
  restockShop(id);
  renderShoppingSheet(overlay || document.getElementById("sheetOverlay"));
}
function refreshShoppingSheet(){
  render();
  const ov=document.getElementById("sheetOverlay");
  if(ov) renderShoppingSheet(ov);
}
function renderShoppingSheet(overlay){
  if(!overlay) return;
  const def = shopView.shop ? SHOP_DEFS.find(s=>s.id===shopView.shop) : null;
  let body = "";
  if(!def){
    const kinds = [...new Set(SHOP_DEFS.map(s=>s.kind))];
    body = `<div class="job-line">Every visit brings out different stock: new models, used ones, bargains and the occasional rip-off.</div>
      ${kinds.map(k=>`<div class="section-label">${k}</div><div class="menulist">
        ${SHOP_DEFS.filter(s=>s.kind===k).map(s=>menuRow({ icon:s.icon, title:s.name,
          sub: s.needs && !state.flags[s.needs] ? `${s.blurb} · you'll need a licence to buy` : s.blurb, attr:`data-shop="${s.id}"` })).join("")}
      </div>`).join("")}`;
  } else {
    const stock = shopStock[def.id] || [];
    body = `<div class="job-line">${def.blurb}. Today's stock — come back another time and it will be different.</div>
      <div class="menulist">
        ${stock.length ? stock.map(l=>{
          const locked = l.needs && !state.flags[l.needs];
          const afford = state.money >= l.asking;
          const bits = [ l.soldAsSeen ? `Described as ${condLabel(l.condition).toLowerCase()} · sold as seen` : condLabel(l.condition), l.detail, priceVerdict(l),
            l.upkeep ? `${money(l.upkeep)}/yr to keep` : "", locked ? "needs a licence" : !afford ? "can't afford it" : "" ].filter(Boolean);
          return menuRow({ icon:"", title:l.label, sub:bits.join(" · "), value:money(l.asking), attr:`data-buyl="${l.id}"`, disabled: locked || !afford, chevron:false, dots:true });
        }).join("") : `<div class="job-line">Sold out. Come back another time.</div>`}
      </div>`;
  }
  overlay.innerHTML = sheetShell(def ? `${def.icon} ${def.name}` : "🛍️ Shopping", body, !!def);
  overlay.querySelectorAll("[data-shop]").forEach(b=>b.addEventListener("click",()=>enterShop(b.dataset.shop, overlay)));
  overlay.querySelectorAll("[data-buyl]").forEach(b=>b.addEventListener("click",()=>doBuyListing(def.id, parseInt(b.dataset.buyl,10))));
  const back = overlay.querySelector("#mBack");
  if(back) back.addEventListener("click", ()=>{ shopView.shop = null; renderShoppingSheet(overlay); });
  const x = overlay.querySelector("#closeSheetBtn");
  if(x) x.addEventListener("click", closeSheet);
}

// ---------- Property listings ----------
// Instead of one generic house at one price, the market shows a handful of
// real-sounding homes each time you look: a studio, a semi, a farmhouse, a
// manor now and then, in different places and states of repair. Prices follow
// the housing index for the year you're in.
const PROPERTY_TYPES = [
  { id:"studio",   label:"Studio flat",          mult:0.42, beds:[0,0],  w:1.5 },
  { id:"flat1",    label:"One-bedroom flat",     mult:0.55, beds:[1,1],  w:2 },
  { id:"flat2",    label:"Two-bedroom flat",     mult:0.72, beds:[2,2],  w:2 },
  { id:"terrace",  label:"Terraced house",       mult:0.85, beds:[2,3],  w:2.5 },
  { id:"semi",     label:"Semi-detached house",  mult:1.0,  beds:[3,3],  w:2.5 },
  { id:"bungalow", label:"Bungalow",             mult:1.05, beds:[2,3],  w:1.2 },
  { id:"detached", label:"Detached house",       mult:1.55, beds:[4,5],  w:1.5 },
  { id:"townhouse",label:"Georgian townhouse",   mult:2.2,  beds:[4,6],  w:0.6 },
  { id:"farmhouse",label:"Farmhouse with land",  mult:2.0,  beds:[4,6],  w:0.6 },
  { id:"penthouse",label:"Penthouse apartment",  mult:3.2,  beds:[2,4],  w:0.4, from:1965 },
  { id:"manor",    label:"Country manor",        mult:6.5,  beds:[7,12], w:0.2 },
];
const PROPERTY_PLACES = [
  { where:"in the town centre", m:1.0 }, { where:"on a quiet suburban street", m:1.0 }, { where:"in a commuter village", m:0.95 },
  { where:"by the sea", m:1.1 }, { where:"in the city", m:1.15 }, { where:"on the edge of the countryside", m:0.95 },
  { where:"near the station", m:1.02 }, { where:"in a sought-after school catchment", m:1.12 }, { where:"on a busy main road", m:0.88 },
];

function makePropertyListing(){
  const t = pickWeighted(PROPERTY_TYPES.filter(p=>!p.from || shopYear() >= p.from));
  const place = pick(PROPERTY_PLACES);
  const roll = Math.random();
  const condition = roll < 0.25 ? rand(12, 40) : roll < 0.78 ? rand(52, 85) : rand(86, 100);
  const beds = rand(t.beds[0], t.beds[1]);
  const value = Math.round(propertyPrice() * t.mult * place.m * propCondFactor(condition) / 1000) * 1000;
  const asking = Math.round(value * rand(92, 112) / 100 / 1000) * 1000;
  const state_ = condition < 41 ? "needs renovation" : condition > 85 ? "newly renovated" : "";
  return { id: ++listingSeq, propType:t.id, label:`${t.label} ${place.where}`, beds, condition, value, asking,
    upkeep: Math.round(propertyUpkeep() * Math.max(0.5, t.mult) * (condition < 40 ? 1.5 : 1)), note: state_ };
}
function propertyListings(fresh){
  if(fresh || !assetsView.listings) assetsView.listings = Array.from({length:5}, makePropertyListing);
  return assetsView.listings;
}
function mortgageDeposit(price){ return Math.round(price * (hasPerk("first_rung") ? 0.1 : 0.2)); }

function doBuyListedProperty(id, withMortgage){
  const l = (assetsView.listings||[]).find(x=>x.id===id);
  if(!l){ refreshAssetsSheet(); return; }
  if(state.age < 18){ addLog("You're too young to buy property."); refreshAssetsSheet(); return; }
  const asset = { type:"property", name:l.label, value:l.value, upkeep:l.upkeep, rented:false, condition:l.condition, propType:l.propType, beds:l.beds };
  if(withMortgage){
    const rate = 0.05, term = 25;
    const deposit = mortgageDeposit(l.asking);
    if(state.money < deposit){ addLog(`Not enough for the ${money(deposit)} deposit.`); refreshAssetsSheet(); return; }
    const approvalChance = 0.4 + (state.creditScore||60)/150 + (hasPerk("first_rung") ? 0.2 : 0);
    // Lenders want to see an income that can carry the loan.
    const affordable = (state.lastIncome || 0) * 4.5 >= (l.asking - deposit) || state.money >= l.asking;
    if(!affordable || Math.random() > Math.min(0.9, approvalChance)){
      addLog(affordable ? `Mortgage application declined — credit score ${state.creditScore}/100 wasn't enough this time.`
        : `Mortgage application declined — lenders will go to about four and a half times your income, and you'd need ${money(l.asking - deposit)}.`);
      refreshAssetsSheet(); return;
    }
    const principal = l.asking - deposit;
    const annualPayment = Math.round(principal * rate / (1 - Math.pow(1+rate, -term)));
    addMoney(-deposit);
    asset.mortgage = { balance:principal, rate, annualPayment };
    addLog(`Bought the ${l.label.toLowerCase()} for ${money(l.asking)}: ${money(deposit)} down and a 25-year mortgage at ${money(annualPayment)}/yr.`, true);
  } else {
    if(state.money < l.asking){ addLog(`It's on at ${money(l.asking)} — more than you have.`); refreshAssetsSheet(); return; }
    addMoney(-l.asking);
    addLog(`Bought the ${l.label.toLowerCase()} outright for ${money(l.asking)}.`, true);
  }
  state.assets.push(asset);
  assetsView.listings = assetsView.listings.filter(x=>x.id!==id);
  nudge("happiness", 6);
  refreshAssetsSheet();
}

// Renovation: money in, condition up, and usually more value than it cost.
function renovationQuote(a){
  if(a.condition === undefined || a.condition >= 90) return null;
  const base100 = a.value / propCondFactor(a.condition);
  const gain = 90 - a.condition;
  return { cost: Math.round(base100 * gain / 100 * 0.33 / 100) * 100, to: 90 };
}
function doRenovate(i){
  const a = state.assets[i];
  const q = a && a.type === "property" ? renovationQuote(a) : null;
  if(!q){ refreshAssetsSheet(); return; }
  if(state.money < q.cost){ addLog(`The builders want ${money(q.cost)}, and you haven't got it.`); refreshAssetsSheet(); return; }
  addMoney(-q.cost);
  const from = a.condition;
  // Builders are builders: the job can overrun or come in short.
  const to = clamp(q.to + rand(-12, 8), 100, from + 5);
  a.value = Math.round(a.value * propCondFactor(to) / propCondFactor(from));
  a.condition = to;
  if(a.upkeep && from < 40) a.upkeep = Math.round(a.upkeep / 1.5);
  addLog(`Renovated the ${a.name.toLowerCase()} for ${money(q.cost)} — now in ${condLabel(to).toLowerCase()} condition and valued at ${money(a.value)}.`, true);
  refreshAssetsSheet();
}

function doSellProperty(i){
  const a = state.assets[i];
  if(!a || a.type !== "property"){ refreshAssetsSheet(); return; }
  const fees = Math.round(a.value * 0.015);
  const owed = a.mortgage ? a.mortgage.balance : 0;
  const net = a.value - fees - owed;
  if(net < 0 && state.money < -net){ addLog(`You owe more on the ${a.name.toLowerCase()} than it would sell for, and can't cover the gap.`); refreshAssetsSheet(); return; }
  state.assets.splice(i, 1);
  addMoney(net);
  addLog(`Sold the ${a.name.toLowerCase()} for ${money(a.value)}${owed?`, paid off the ${money(owed)} mortgage`:""} and ${money(fees)} in agents' fees — ${money(net)} to you.`, true);
  refreshAssetsSheet();
}

// One home you live in. It can't be let, and it saves on what you'd otherwise
// pay to keep a roof over your head.
function homeOf(){ return (state && state.assets||[]).find(a=>a.type==="property" && a.home && isHere(a)) || null; }

// ---------- Rent ----------
// Anyone living independently who doesn't live in a home they own pays rent.
// What you rent depends on what you can afford: a room in a shared house, a
// small flat, or a place of your own, at about a third of your income. Prices
// follow the housing market for the year. A partner shares the cost.
const RENT_YIELD = 0.045;   // a year's rent on a standard home, as a share of its price
function fullRent(){ return Math.round(propertyPrice() * RENT_YIELD); }
function sharedRoomRent(){ return Math.round(fullRent() * 0.4); }
function paysRent(){
  return !!state && state.age >= 18 && !state.livingWithParents && !(state.prisonYearsLeft > 0) && !homeOf() && !fullTimeStudent();
}
// Full-time students' rent goes on their student loan, as a maintenance loan
// would, at the shared-room rate.
function fullTimeStudent(){ return state.education === "degree" || state.education === "college"; }
function studentRent(){
  if(!state || state.age < 18 || state.livingWithParents || state.prisonYearsLeft > 0 || homeOf() || !fullTimeStudent()) return;
  const r = sharedRoomRent();
  state.studentLoan = state.studentLoan || { balance:0, rate:0.06 };
  state.studentLoan.balance += r;
  addLog(`Your maintenance loan covered ${money(r)} of rent on a room in student housing.`);
}
function rentDue(){
  if(!paysRent()) return 0;
  const afford = (state.lastIncome || 0) * 0.33;
  let rent = clamp(afford, fullRent(), sharedRoomRent());
  if(state.married) rent *= 0.6;
  return Math.round(rent * ((state.emigrationMultipliers && state.emigrationMultipliers.costMult) || 1));
}
function rentedPlace(){
  const afford = (state.lastIncome || 0) * 0.33;
  return afford >= fullRent() * 0.95 ? "a place of your own" : afford <= sharedRoomRent() * 1.05 ? "a room in a shared house" : "a small flat";
}

// ---------- Leaving home ----------
// Adult children who stay at home pay their parents something towards their
// keep. They leave when they can afford a place, marry, go off to university,
// reach thirty, or when there's no longer a parent's home to live in, or
// whenever they choose.
function livingParent(){ return (state.family||[]).some(p=>(p.relation==="Mother"||p.relation==="Father") && p.alive && isHere(p)); }
function boardDue(){
  if(!state || !state.livingWithParents || state.age < 18 || state.prisonYearsLeft > 0) return 0;
  return Math.round(Math.min(eraMoney(2500), (state.lastIncome || 0) * 0.15));
}
function moveOutReason(){
  if(!livingParent()){
    const away = (state.family||[]).find(p=>(p.relation==="Mother"||p.relation==="Father") && p.alive && isAbroad(p));
    return away ? `with your parents in ${abroadLabel(away)}` : "with no parents' home to live in any more";
  }
  if(state.married) return "to set up home together";
  if(state.flags.movedBackHome) return null;
  if(state.education === "degree") return "to go to university";
  if(state.age >= 30) return "at thirty, it was time";
  if((state.lastIncome || 0) * 0.33 >= sharedRoomRent() * 1.6) return "now that you can afford it";
  return null;
}
function maybeMoveOut(){
  if(!state || !state.livingWithParents || state.age < 18 || state.prisonYearsLeft > 0) return;
  const why = moveOutReason();
  if(!why) return;
  state.livingWithParents = false;
  const owned = (state.assets||[]).some(a=>a.type==="property" && !a.rented && (a.condition === undefined || a.condition >= 22));
  milestone("milestone", `Moved out of the family home ${why}${owned ? ", into a place you own" : `, into ${rentedPlace()}`}.`, { icon:"🏠", label:"Home" });
}
function doMoveOut(){
  if(!state.livingWithParents){ refreshAssetsSheet(); return; }
  state.livingWithParents = false;
  state.flags.movedBackHome = false;
  nudge("happiness", 4);
  addLog(`Moved out of the family home into ${homeOf() ? "a place you own" : rentedPlace()} — rent is ${money(rentDue())} a year.`, true);
  refreshAssetsSheet();
}
function canMoveBackHome(){ return !state.livingWithParents && state.age >= 18 && !state.married && livingParent() && !(state.prisonYearsLeft > 0); }
function doMoveBackHome(){
  if(!canMoveBackHome()){ refreshAssetsSheet(); return; }
  (state.assets||[]).forEach(a=>{ if(a.type==="property") a.home = false; });
  state.livingWithParents = true;
  state.flags.movedBackHome = true;
  nudge("happiness", -3);
  addLog("Moved back in with your parents. Cheaper, if a little humbling.", true);
  refreshAssetsSheet();
}
function whereYouLiveHtml(){
  if(state.age < 18) return "";
  const home = homeOf();
  let line, btns = "";
  if(state.prisonYearsLeft > 0) line = "In prison. No rent to pay.";
  else if(state.livingWithParents){
    line = `Living with your parents${boardDue() ? `, paying ${money(boardDue())} a year towards your keep` : ""}.`;
    btns = `<button class="small" id="moveOutBtn">Move out and rent — about ${money(Math.max(sharedRoomRent(), Math.round((state.lastIncome||0)*0.33 > fullRent() ? fullRent() : Math.max(sharedRoomRent(), (state.lastIncome||0)*0.33))))} a year</button>`;
  } else if(home) line = `Living in your own home: the ${home.name.replace(/^(a|an|the) /i,"").toLowerCase()}. No rent to pay.`;
  else if(fullTimeStudent()) line = `In student housing — your maintenance loan covers ${money(sharedRoomRent())} a year of rent.`;
  else line = `Renting ${rentedPlace()}: ${money(rentDue())} a year${state.married ? ", your share with your partner" : ""}. A home of your own would end that.`;
  if(canMoveBackHome() && !home) btns += `<button class="small" id="moveBackBtn">Move back in with your parents — no rent, about ${money(Math.round(Math.min(eraMoney(2500), (state.lastIncome||0)*0.15)))} a year towards your keep</button>`;
  return `<div class="section-label">Where you live</div><div class="track-card"><span class="req-line">${line}</span>${btns ? `<div class="choices">${btns}</div>` : ""}</div>`;
}

// If you own somewhere fit to live in and nobody's renting it, you live there.
function settleIntoHome(){
  if(!state || state.age < 18 || state.livingWithParents || homeOf()) return;
  const spare = (state.assets||[]).find(a=>a.type==="property" && !a.rented && isHere(a) && (a.condition === undefined || a.condition >= 22));
  if(!spare) return;
  spare.home = true;
  addLog(`Moved into ${/^(a|an|the) /i.test(spare.name) ? spare.name : `the ${spare.name.toLowerCase()}`} you own, rather than paying rent elsewhere.`);
}

// A home of your own is a quiet, steady pleasure.
function homeYear(){
  maybeMoveOut();
  settleIntoHome();
  studentRent();
  if(homeOf() && !state.livingWithParents && !(state.prisonYearsLeft > 0)) nudge("happiness", rand(1, 2));
}
function doMoveInto(i){
  const a = state.assets[i];
  if(!a || a.type !== "property"){ refreshAssetsSheet(); return; }
  if(isAbroad(a)){ addLog(`The ${a.name.toLowerCase()} is in ${abroadLabel(a)}, and you live in ${state.currentCountry}.`); refreshAssetsSheet(); return; }
  if(a.condition !== undefined && a.condition < 22){ addLog(`The ${a.name.toLowerCase()} isn't fit to live in until it's renovated.`); refreshAssetsSheet(); return; }
  (state.assets||[]).forEach(x=>{ if(x.type==="property") x.home = false; });
  a.home = true; a.rented = false;
  if(state.livingWithParents && state.age >= 18){ state.livingWithParents = false; }
  nudge("happiness", 5);
  addLog(`Moved into the ${a.name.toLowerCase()}. It's home now.`, true);
  refreshAssetsSheet();
}
function canLet(a){ return !a.home && (a.condition === undefined || a.condition >= 22); }

// ---------- Belongings and heirlooms ----------
// Belongings keep a pristine value and a condition; what they're worth is
// one times the other. Antiques, art and good jewellery gain value over the
// years; ordinary instruments lose it until they're old enough to be vintage.
// Heirlooms come down the family — from grandparents, from parents, and from
// you to whoever carries on the ledger.
const HEIRLOOM_KINDS = [
  { noun:"mantel clock",           base:[300,4000],  cat:"antique" },
  { noun:"pocket watch",           base:[200,6000],  cat:"jewellery" },
  { noun:"brooch",                 base:[150,5000],  cat:"jewellery" },
  { noun:"signet ring",            base:[200,2500],  cat:"jewellery" },
  { noun:"pearl necklace",         base:[400,7000],  cat:"jewellery" },
  { noun:"writing desk",           base:[400,8000],  cat:"antique" },
  { noun:"oil painting",           base:[200,15000], cat:"art" },
  { noun:"silver tea service",     base:[500,6000],  cat:"antique" },
  { noun:"first-edition book",     base:[100,8000],  cat:"book" },
  { noun:"set of service medals",  base:[150,3000],  cat:"medals" },
  { noun:"violin",                 base:[300,20000], cat:"instrument" },
  { noun:"porcelain vase",         base:[100,9000],  cat:"antique" },
  { noun:"Persian rug",            base:[300,7000],  cat:"antique" },
  { noun:"hand-stitched quilt",    base:[50,600],    cat:"textile" },
  { noun:"grandfather clock",      base:[600,9000],  cat:"antique" },
];
function eraAdjective(y){
  return y < 1714 ? "17th-century" : y < 1837 ? "Georgian" : y < 1901 ? "Victorian" : y < 1914 ? "Edwardian"
    : y < 1919 ? "wartime" : y < 1940 ? "Art Deco" : y < 1960 ? "mid-century" : "vintage";
}
// The thing itself, and what it's really worth (which may not be what the
// family has always believed).
function makeHeirloomItem(){
  const k = pick(HEIRLOOM_KINDS);
  const madeYear = shopYear() - rand(25, 160);
  const age = shopYear() - madeYear;
  const believed = priced(rand(k.base[0], k.base[1]) * (1 + (age - 25) / 150));
  const r = Math.random();
  const truth = r < 0.05 ? believed * rand(5, 20)         // a real find
              : r < 0.13 ? believed * rand(10, 25) / 100   // a later copy
              : believed * rand(60, 150) / 100;
  return { name:`${eraAdjective(madeYear)} ${k.noun}`, cat:k.cat, madeYear, condition: rand(25, 95), believed, trueBase: Math.max(1, Math.round(truth)) };
}

function giveHeirloom(fromLabel, item){
  const h = item || makeHeirloomItem();
  const a = { type:"heirloom", name:h.name, cat:h.cat, madeYear:h.madeYear, condition:h.condition,
    baseValue: h.believed !== undefined ? h.believed : h.baseValue, trueBase: h.trueBase !== undefined ? h.trueBase : h.baseValue,
    appraised: !!h.appraised, fake: !!h.fake, from: fromLabel, receivedYear: state.year, upkeep:0, rented:false, pl: priceLevel() };
  a.value = Math.round(a.baseValue * condFactor(a.condition));
  state.assets.push(a);
  return a;
}

// A grandparent sometimes leaves you something; your parents' things are
// shared among their children.
function heirloomOnDeath(p){
  if(p.relation === "Grandmother" || p.relation === "Grandfather"){
    if(Math.random() >= 0.4) return;
    const a = giveHeirloom(`your ${p.relation.toLowerCase()} ${p.name}`);
    milestone("windfall", `${p.name} left you ${aOrAn(a.name)} ${a.name}. ${condLabel(a.condition)} condition — the family always thought it was worth about ${money(a.value)}.`, { icon:"🏺", label:"Heirloom" });
  }
}
function parentsHeirlooms(mode, beneficiaries){
  if(mode === "none") return [];
  const n = state.wealthTier === "rich" ? rand(2, 3) : rand(1, 2);
  const got = [];
  for(let i=0;i<n;i++){
    if(mode === "all" || Math.random() < 1 / Math.max(1, beneficiaries)) got.push(giveHeirloom("your parents"));
  }
  if(got.length){
    milestone("windfall", `From your parents' things: ${got.map(a=>`${aOrAn(a.name)} ${a.name}`).join(" and ")}.`, { icon:"🏺", label:"Heirloom" });
  } else if(beneficiaries > 1){
    addLog("Your parents' heirlooms went to your siblings.");
  }
  return got;
}

function isBelonging(a){ return a.type === "luxury" || a.type === "heirloom"; }
// The real return, on top of inflation: what fine things gain or lose
// against everything else in a year.
function belongingAppreciation(a){
  if(a.fake) return -0.03;
  if(["antique","art","book","medals"].includes(a.cat) || a.type === "heirloom") return rand(0, 3) / 100;
  if(a.cat === "jewellery") return rand(-1, 2) / 100;
  if(a.cat === "instrument") return (a.vintage || (a.madeYear && shopYear() - a.madeYear >= 25)) ? rand(-1, 3) / 100 : -rand(3, 6) / 100;
  return -0.02;
}
function belongingWear(a){
  // Jewellery and antiques that are looked after barely change; things that
  // get used do.
  return a.cat === "jewellery" ? (Math.random() < 0.5 ? 1 : 0) : a.cat === "instrument" || a.cat === "textile" ? rand(1, 3) : (Math.random() < 0.6 ? 1 : 0);
}

// Called once a year from depreciateAssets.
function ageBelongings(){
  (state.assets||[]).forEach(a=>{
    if(!isBelonging(a) || a.condition === undefined || a.baseValue === undefined) return;
    const pl = priceLevel();
    const inflation = a.pl ? pl / a.pl : 1;
    a.pl = pl;
    const g = inflation * (1 + belongingAppreciation(a));
    a.baseValue = Math.round(a.baseValue * g);
    if(a.trueBase !== undefined && !a.appraised) a.trueBase = Math.round(a.trueBase * g);
    let wear = belongingWear(a);
    if(Math.random() < 0.015){
      wear += rand(10, 30);
      addLog(`Your ${a.name} was damaged — ${pick(["knocked off a shelf","caught in a leak","scratched in a move","chipped by a careless guest"])}. Now in ${condLabel(clamp(a.condition - wear)).toLowerCase()} condition.`);
    }
    a.condition = clamp(a.condition - wear);
    a.value = Math.round(a.baseValue * condFactor(a.condition));
  });
}
// Vehicles wear too, and classics keep their value instead of losing it.
function ageVehicleCondition(a){
  if(a.condition === undefined) return;
  a.condition = clamp(a.condition - rand(1, 4));
}

function restoreQuote(a){
  if(!isBelonging(a) || a.condition === undefined || a.condition >= 85 || a.fake) return null;
  const base = a.appraised || a.type !== "heirloom" ? a.baseValue : a.baseValue;
  const to = Math.min(95, a.condition + 40);
  return { cost: Math.max(eraMoney(60), Math.round(base * (to - a.condition) / 100 * 0.3)), to };
}
function doRestore(i){
  const a = state.assets[i];
  const q = a ? restoreQuote(a) : null;
  if(!q){ refreshAssetsSheet(); return; }
  if(state.money < q.cost){ addLog(`Restoration would cost ${money(q.cost)}.`); refreshAssetsSheet(); return; }
  addMoney(-q.cost);
  const from = a.condition;
  // Over-restoring an antique strips the character that made it valuable.
  if(["antique","art"].includes(a.cat) && Math.random() < 0.1){
    a.condition = clamp(from + rand(5, 15));
    a.baseValue = Math.round(a.baseValue * 0.85);
    if(a.trueBase) a.trueBase = Math.round(a.trueBase * 0.85);
    addLog(`Had the ${a.name} restored for ${money(q.cost)}. The restorer overdid it — it looks newer, and has lost some of its character and value.`, true);
  } else {
    a.condition = q.to;
    addLog(`Had the ${a.name} restored for ${money(q.cost)} — from ${condLabel(from).toLowerCase()} to ${condLabel(a.condition).toLowerCase()} condition.`, true);
  }
  a.value = Math.round(a.baseValue * condFactor(a.condition));
  refreshAssetsSheet();
}

function appraisalFee(){ return eraMoney(120); }
function doAppraise(i){
  const a = state.assets[i];
  if(!a || a.type !== "heirloom" || a.appraised){ refreshAssetsSheet(); return; }
  const fee = appraisalFee();
  if(state.money < fee){ addLog(`A valuation costs ${money(fee)}.`); refreshAssetsSheet(); return; }
  addMoney(-fee);
  const before = a.value;
  a.baseValue = a.trueBase;
  a.appraised = true;
  a.value = Math.round(a.baseValue * condFactor(a.condition));
  const r = a.value / Math.max(1, before);
  if(r >= 4){
    milestone("windfall", `The valuer went very quiet over your ${a.name}. It's worth ${money(a.value)} — not the ${money(before)} the family always thought.`, { icon:"🏺", label:"Heirloom" });
  } else if(r <= 0.35){
    addLog(`Had the ${a.name} valued for ${money(fee)}. It's a later copy — worth ${money(a.value)}, not ${money(before)}.`, true);
    nudge("happiness", -3);
  } else {
    addLog(`Had the ${a.name} valued for ${money(fee)}: ${money(a.value)} in its present condition.`);
  }
  refreshAssetsSheet();
}

// What you'd get for it now. Unvalued heirlooms go to a dealer, who knows
// more than you do; valued ones go to auction.
function saleQuote(a){
  if(a.type === "heirloom" && !a.appraised) return { price: Math.round(a.value * 0.7), how:"to a dealer" };
  if(a.type === "heirloom" || a.antique || a.vintage) return { price: Math.round(a.value * 0.88), how:"at auction, after fees" };
  return { price: Math.round(a.value * 0.8), how:"second-hand" };
}
function doSellBelonging(i){
  const a = state.assets[i];
  if(!a || !isBelonging(a)){ refreshAssetsSheet(); return; }
  const q = saleQuote(a);
  // Auctions are a gamble around the estimate; dealers aren't.
  const price = q.how.startsWith("at auction") ? Math.round(q.price * rand(85, 125) / 100) : q.price;
  state.assets.splice(i, 1);
  addMoney(price);
  if(a.type === "heirloom"){
    nudge("happiness", -rand(3, 7));
    addLog(`Sold the ${a.name} ${a.from ? `that came from ${a.from} ` : ""}${q.how.split(",")[0]} for ${money(price)}.`, true);
  } else {
    addLog(`Sold the ${a.name.toLowerCase()} for ${money(price)}.`);
  }
  refreshAssetsSheet();
}

// When you die, your heirlooms and anything of note you owned pass to whoever
// carries on — unless the will gives everything away.
function heirloomsForHeir(chosen, children, deceasedName, deceasedGender){
  const plan = state.estatePlan || "equal";
  if(plan === "charity") return [];
  if(plan === "eldest"){
    const eldest = children.reduce((a,b)=>(b.age>a.age?b:a), children[0]);
    if(eldest && eldest.id !== chosen.id) return [];
  }
  const parentWord = deceasedGender === "Girl" ? "mother" : "father";
  return (state.assets||[]).filter(a=>isBelonging(a) && a.condition !== undefined && !a.fake).map(a=>({
    type:"heirloom", name: a.name.replace(/ \(pre-owned\)$/, ""), cat:a.cat, madeYear:a.madeYear, condition:a.condition,
    baseValue:a.baseValue, trueBase: a.trueBase !== undefined ? a.trueBase : a.baseValue, appraised: a.appraised !== false,
    from: a.type === "heirloom" && a.from ? `${a.from}, by way of your ${parentWord}` : `your ${parentWord} ${deceasedName.split(" ")[0]}`,
    value: a.value, upkeep:0, rented:false,
  }));
}

function belongingRow(a){
  const q = saleQuote(a), rq = restoreQuote(a);
  const valued = a.type !== "heirloom" || a.appraised;
  const bits = [ a.condition !== undefined ? `${condLabel(a.condition)} condition` : "",
    a.madeYear ? `made around ${a.madeYear}` : "", a.from ? `from ${a.from}` : "" ].filter(Boolean).join(" · ");
  return `<div class="track-card">
    <div class="person-row"><span>${a.type === "heirloom" ? "🏺 " : ""}${a.name.charAt(0).toUpperCase() + a.name.slice(1)}</span><span class="rel">${valued ? money(a.value) : `about ${money(a.value)}?`}</span></div>
    ${bits ? `<span class="req-line">${bits}${valued ? "" : " · never valued"}</span>` : ""}
    <div class="choices">
      ${a.type === "heirloom" && !a.appraised ? `<button class="small" data-appraise="${a.i}">Have it valued — ${money(appraisalFee())}</button>` : ""}
      ${rq ? `<button class="small" data-restore="${a.i}">Restore it — ${money(rq.cost)}</button>` : ""}
      <button class="small" data-sellbel="${a.i}">Sell ${q.how} — ${money(q.price)}</button>
    </div>
  </div>`;
}

          <div class="choices">
            ${p.home ? "" : canLet(p) ? `<button class="small" data-rent="${p.i}">${p.rented?"Stop renting out":"Rent it out"}</button>` : `<button class="small" disabled>Rent it out — needs renovating first</button>`}
            ${p.home || isAbroad(p) ? "" : `<button class="small" data-movein="${p.i}">Move in</button>`}
            ${rq ? `<button class="small" data-renovate="${p.i}">Renovate — ${money(rq.cost)}</button>` : ""}
            <button class="small" data-sellprop="${p.i}">Sell — ${money(p.value - fees - owed)} to you</button>

      `:`<div class="job-line">You don't own any property.</div>`}
      ${age>=18?`
        <div class="section-label">On the market</div>
        <div class="job-line">A different set of homes every time you look. Asking prices follow the market for ${state.year}.</div>
        ${propertyListings().map(l=>{
          const dep = mortgageDeposit(l.asking);
          const verdict = l.asking < l.value*0.96 ? "priced to sell" : l.asking > l.value*1.07 ? "optimistic asking price" : "";
          return `<div class="track-card"><h3>${l.label}</h3>
            <span class="req-line">${l.beds?`${l.beds} bedroom${l.beds===1?"":"s"}`:"Studio"} · ${condLabel(l.condition)} condition${l.note?` — ${l.note}`:""}${verdict?` · ${verdict}`:""} · ${money(l.upkeep)}/yr upkeep</span>
            <div class="review-row"><span>Asking price</span><span class="v">${money(l.asking)}</span></div>

          <div class="review-row"><span>Price each</span><span class="v">${money(propertyPrice())}</span></div>

         ${own.length ? `<div class="section-label">Things you've bought</div>${own.map(b=>b.condition!==undefined ? belongingRow(b) : plain(b)).join("")}` : ""}

      ${mortgageDebt?`<div class="review-row"><span>Mortgages</span><span class="v" style="color:var(--bad)">−${money(mortgageDebt)}</span></div>`:""}
      ${studentDebt?`<div class="review-row"><span>Student loan</span><span class="v" style="color:var(--bad)">−${money(studentDebt)}</span></div>`:""}

    </div>`;

  const titles = { root:"Assets", finances:"Finances", invest:"Investments", property:"Property",

  overlay.querySelectorAll("[data-sellprop]").forEach(b=>b.addEventListener("click",()=>doSellProperty(parseInt(b.dataset.sellprop,10))));
  overlay.querySelectorAll("[data-movein]").forEach(b=>b.addEventListener("click",()=>doMoveInto(parseInt(b.dataset.movein,10))));
  overlay.querySelectorAll("[data-appraise]").forEach(b=>b.addEventListener("click",()=>doAppraise(parseInt(b.dataset.appraise,10))));
  overlay.querySelectorAll("[data-restore]").forEach(b=>b.addEventListener("click",()=>doRestore(parseInt(b.dataset.restore,10))));
  overlay.querySelectorAll("[data-sellbel]").forEach(b=>b.addEventListener("click",()=>doSellBelonging(parseInt(b.dataset.sellbel,10))));

  overlay.querySelectorAll("[data-investamt]").forEach(b=>b.addEventListener("click",()=>{const[t,a]=b.dataset.investamt.split(":");doInvestType(t,parseInt(a,10));refreshAssetsSheet();}));
  overlay.querySelectorAll("[data-sellinvest]").forEach(b=>b.addEventListener("click",()=>{sellInvestment(parseInt(b.dataset.sellinvest,10));refreshAssetsSheet();}));
  // Keep what's typed through the re-render that each purchase triggers.
  const amtEl = document.getElementById("investAmtInput");
  if(amtEl) amtEl.addEventListener("input", ()=>{ investAmountDraft = amtEl.value; });

  const g=(id,fn)=>{const el=document.getElementById(id); if(el) el.addEventListener("click",fn);};
  g("claimPensionBtn",()=>{claimPension();refreshAssetsSheet();});

  g("moveBackBtn", doMoveBackHome);

  g("unrentAllBtn", stopRentingAllProperties);

  g("buyBulkBtn",()=>{

// ---------- Career-specific actions ----------
// Each of these is a job you actually *do*, not just a salary that arrives.
// Keyed by track id; shown in the Career tab when relevant.

const CAREER_ACTIONS = {
  model: {
    id:"casting", label:"Go to a casting",
    run(){
      // Looks get you booked; age past the peak starts to count against you.
      const t = TRACKS.find(x=>x.id==="model");
      const agePenalty = state.age > t.peakAge ? (state.age - t.peakAge) * 0.03 : 0;
      const odds = clamp(0.15 + state.stats.looks/220 + jobPerformance()/400 - agePenalty, 0.85, 0.05);
      if(Math.random() < odds){
        payIncome(rand(3000, 30000) * (1 + state.career.rankIndex*0.5), "Booked from a casting");
        nudgeHidden("fame", rand(3,9)); nudgePerformance(rand(5,10)); nudge("happiness", 5);
        addLog("Booked. The client asked for you by name.", true);
      } else {
        nudgePerformance(-2); nudge("happiness", -3);
        addLog(agePenalty > 0 ? "They went with someone younger." : "Not what they were looking for this time.");
      }
    }
  },
  producer: {
    id:"produce", label:"Produce a record for an artist",
    run(){
      const cost = eraMoney(2000);
      if(state.money < cost){ addLog("Studio time costs money you don't have."); return; }
      addMoney(-cost);
      const odds = clamp(0.2 + state.stats.smarts/300 + jobPerformance()/300 + (state.hidden.fame||0)/400, 0.85, 0.05);
      if(Math.random() < odds){
        payIncome(rand(5000, 40000) * (1 + state.career.rankIndex*0.6), "Production fee and points");
        nudgeHidden("fame", rand(2,6)); nudgePerformance(rand(6,12));
        addLog("The record did well, and your production was all over the reviews.", true);
      } else {
        nudgePerformance(-3);
        addLog(`Spent ${money(cost)} on studio time for a record nobody bought.`);
      }
    }
  },
  band: {

function isCrimeCareer(){
  const c = state.career;
  if(!c || c.kind !== "civilian") return false;
  const t = TRACKS.find(x=>x.id===c.trackId);
  return !!(t && t.criminal);
}

function careerActionFor(){
  const c = state.career;
  if(!c || c.training || c.kind !== "civilian") return null;
  return CAREER_ACTIONS[c.trackId] || null;
}

function doCareerAction(){
  const act = careerActionFor();
  if(!act) return;
  if(usesLeft("careeract") <= 0){ addLog("That's enough of that for one year."); refreshCareerSheet(); return; }
  if(!spendAction("careeract")){ refreshCareerSheet(); return; }
  recordUse("careeract");
  act.run();
  refreshCareerSheet();
}

// ---------- Postgraduate study ----------
// A route to the hardest careers, and a real investment of years and money.

const POSTGRAD_COURSES = [
  {id:"masters", label:"Master's degree", years:1, cost:12000, minSmarts:60, smartsGain:[6,10], award:"Master's"},
  {id:"phd",     label:"PhD",             years:4, cost:16000, minSmarts:75, smartsGain:[12,18], award:"PhD", requires:"Master's"},
  // Business school: an MBA, normally taken after a few years at work.
  {id:"mba",     label:"MBA (business school)", years:1, cost:45000, minSmarts:60, smartsGain:[4,8], award:"MBA", minAge:24},
];

// ---------------------------------------------------------------------------
// Returning to education
// Nobody is too old to go back. Each stage has an entry requirement, a cost
// and a length; a course can be funded by scholarship, by loan, or by asking
// your parents — and each route has a different catch.
// ---------------------------------------------------------------------------

const RETURN_COURSES = [
  {id:"gcse",      label:"Adult evening classes",        years:1, cost:900,   minSmarts:0,  smartsGain:[5,10],
   sets:"school-finished", desc:"Finish what you left off.", needs:null},
  {id:"college",   label:"College diploma",              years:2, cost:4000,  minSmarts:35, smartsGain:[7,13],
   sets:"college-finished", desc:"A further-education qualification.", needs:null},
  {id:"degree",    label:"University degree",            years:3, cost:28000, minSmarts:50, smartsGain:[10,16],
   sets:"degree-finished", desc:"A full undergraduate course, with a subject of your choosing.", needs:null, picksDegree:true},
  {id:"secondeg",  label:"A second degree",              years:3, cost:30000, minSmarts:55, smartsGain:[8,14],
   sets:"degree-finished", desc:"Another subject entirely — and another set of careers opened up.", needs:"degree-finished", picksDegree:true},
  {id:"shortcourse", get label(){ return shortCourseName(); }, years:1, cost:600, minSmarts:0, smartsGain:[2,5],
   sets:null, desc:"A year of evening classes for a certificate in something useful.", needs:null},
];

// The stages you could enrol on right now, and why any are closed off.
function availableReturnCourses(){
  return RETURN_COURSES.filter(c=>{
    if(c.id === "secondeg") return state.education === "degree-finished" && !!state.degree;
    if(c.id === "degree")   return state.education !== "degree-finished";
    if(c.id === "college")  return !["college-finished","degree-finished"].includes(state.education);
    if(c.id === "gcse")     return !["school-finished","college-finished","degree-finished"].includes(state.education);
    if(c.id === "shortcourse") return state.age >= 16 && (state.certificates||[]).length < SHORT_COURSES.length;
    return true;
  });
}

// Scholarships are awarded on ability, and are not guaranteed.
function scholarshipChance(course){
  return clamp01(-0.25 + state.stats.smarts/110 - course.cost/200000);
}

// Parents help if they're alive, you're close to them, and they have it.
function canAskParentsForFees(){
  // You can ask anyone who's still alive. Whether they can afford it is what
  // parentFeesChance decides — a poor family is unlikely to say yes, but
  // being unable to ask at all isn't right.
  return (state.family||[]).some(p=>(p.relation==="Mother"||p.relation==="Father") && p.alive);
}
function parentFeesChance(){
  const parents = (state.family||[]).filter(p=>(p.relation==="Mother"||p.relation==="Father") && p.alive);
  if(!parents.length) return 0;
  const closeness = parents.reduce((s,p)=>s+(p.closeness||50),0)/parents.length;
  const base = state.wealthTier === "rich" ? 0.8 : state.wealthTier === "middle" ? 0.45 : 0.15;
  return clamp01(base + (closeness-50)/160);
}

// Step one: pick the stage.
function openReturnToEducation(){
  const courses = availableReturnCourses();
  if(state.studying){ addLog(`Already enrolled on the ${state.studying.label}.`); refreshCareerSheet(); return; }
  if(state.postgrad){ addLog("Already partway through a postgraduate course."); refreshCareerSheet(); return; }
  if(!courses.length){ addLog("You've already been through every stage of education there is."); refreshCareerSheet(); return; }
  closeSheet();
  queueChoice({
    title: "Back into education",
    text: `You're ${state.age}. Nobody is going to stop you going back. Smarts ${state.stats.smarts}/100.`,
    options: courses.map(c=>({
      label: `${c.label} — ${c.years}yr · ${money(c.cost)}${c.minSmarts?` · smarts ${c.minSmarts}+`:""}`,
      effect: ()=>{
        if(state.stats.smarts < c.minSmarts){
          nudge("happiness", -4);
          addLog(`Applied for the ${c.label.toLowerCase()} and was turned down — smarts ${state.stats.smarts}, and they wanted ${c.minSmarts}.`, true);
          return;
        }
        if(c.picksDegree) pickReturnDegree(c);
        else if(c.id === "shortcourse") pickShortCourse(c);
        else openFundingChoice(c, null);
      },
    })).concat([{ label:"Leave it for now", effect:()=>{ addLog("Thought about going back to study, and left it."); } }]),
  });
}

// Step two, for a degree: which subject. This is what gates the careers.
function pickReturnDegree(course){
  queueChoice({
    title: "Choosing a subject",
    text: "Some careers — medicine, dentistry, veterinary work, pharmacy, nursing, law — need the matching degree.",
    options: DEGREE_OPTIONS.map(d=>({
      label: DEGREE_YEARS[d] ? `${d} — ${DEGREE_YEARS[d]} years` : d,
      effect: ()=>openFundingChoice(courseForDegree(course, d), d),
    })),
  });
}

// Step three: who pays.
function openFundingChoice(course, degree){
  const options = [];
  const schChance = scholarshipChance(course);

  options.push({
    label: `Apply for a scholarship — ${Math.round(schChance*100)}% chance`,
    effect: ()=>{
      if(Math.random() < schChance){
        nudge("happiness", 10);
        addLog(`Won a scholarship covering the full ${money(course.cost)} of the ${course.label.toLowerCase()}.`, true);
        enrolReturnCourse(course, degree, "scholarship");
      } else {
        addLog("The scholarship application was unsuccessful.");
        nudge("happiness", -3);
        // You still get to choose another way to pay.
        openFundingChoice(Object.assign({}, course, { noScholarship:true }), degree);
      }
    },
  });

  options.push({
    label: `Take a student loan — ${money(course.cost)} at 6%`,
    effect: ()=>{
      const existing = state.studentLoan ? state.studentLoan.balance : 0;
      state.studentLoan = { balance: existing + course.cost, rate: 0.06 };
      addLog(`Took a student loan of ${money(course.cost)} for the ${course.label.toLowerCase()}${existing?` — total student debt now ${money(state.studentLoan.balance)}`:""}.`, true);
      enrolReturnCourse(course, degree, "loan");
    },
  });

  if(state.money >= course.cost){
    options.push({
      label: `Pay for it yourself — ${money(course.cost)}`,
      effect: ()=>{
        addMoney(-course.cost);
        addLog(`Paid the ${money(course.cost)} fees for the ${course.label.toLowerCase()} outright.`);
        enrolReturnCourse(course, degree, "self");
      },
    });
  }

  if(canAskParentsForFees()){
    const pc = parentFeesChance();
    options.push({
      label: `Ask your parents — ${Math.round(pc*100)}% chance`,
      effect: ()=>{
        const parents = (state.family||[]).filter(p=>(p.relation==="Mother"||p.relation==="Father") && p.alive);
        if(Math.random() < pc){
          parents.forEach(p=>{ p.closeness = clamp((p.closeness||50) - rand(0,4)); });
          addLog(`Your parents covered the ${money(course.cost)} in fees for the ${course.label.toLowerCase()}.`, true);
          enrolReturnCourse(course, degree, "parents");
        } else {
          parents.forEach(p=>{ p.closeness = clamp((p.closeness||50) - rand(3,9)); });
          nudge("happiness", -5);
          addLog("Asked your parents to pay the fees. They said they couldn't.");
          openFundingChoice(Object.assign({}, course, { noParents:true }), degree);
        }
      },
    });
  }

  options.push({ label:"Don't enrol after all", effect:()=>{ addLog(`Decided against the ${course.label.toLowerCase()}.`); } });

  // Filter out the routes already tried this time round.
  const filtered = options.filter(o=>{
    if(course.noScholarship && /scholarship/i.test(o.label)) return false;
    if(course.noParents && /parents/i.test(o.label)) return false;
    return true;
  });

  queueChoice({
    title: "Paying for it",
    text: `${course.label}${degree?` in ${degree}`:""} — ${course.years} year${course.years===1?"":"s"}, ${money(course.cost)}. How will you fund it?`,
    options: filtered,
  });
}

function enrolReturnCourse(course, degree, funding){
  state.studying = {
    id: course.id, label: course.label, yearsLeft: course.years,
    sets: course.sets, smartsGain: course.smartsGain, degree: degree || null, funding,
    certificate: course.certificate || null,
  };
  nudge("happiness", 6);
  milestone("enrolled", `Enrolled on the ${course.label.toLowerCase()}${degree?` in ${degree}`:""} at ${state.age} — ${course.years} year${course.years===1?"":"s"} of study ahead.`);
  render();
}

function doDropStudying(){
  if(!state.studying) return;
  addLog(`Dropped out of the ${state.studying.label.toLowerCase()}. Any fees paid are gone${state.studying.funding==="loan"?", and the loan still stands":""}.`, true);
  state.studying = null;
  nudge("happiness", -5);
  refreshCareerSheet();
}

// A year of study, run alongside everything else.
function runStudyingYear(){
  const s = state.studying;
  if(!s || state.prisonYearsLeft > 0) return;
  s.yearsLeft -= 1;
  nudge("smarts", rand(2,5));
  nudgeHidden("stress", 2);
  if(s.yearsLeft <= 0){
    nudge("smarts", rand(s.smartsGain[0], s.smartsGain[1]));
    nudge("happiness", 12);
    if(s.sets) state.education = s.sets;
    if(s.degree) state.degree = s.degree;
    if(s.certificate){
      state.certificates = (state.certificates||[]).concat(s.certificate);
      if(s.certificate === "language") state.skills.languages = clamp((state.skills.languages||0) + rand(12,20));
    }
    state.flags.returnedToEducation = true;
    milestone("graduated", `Graduated from the ${s.label.toLowerCase()}${s.degree?` with a degree in ${s.degree}`:""} at ${state.age}.`);
    state.studying = null;
    if(s.sets) offerAfterQualification(s.sets === "degree-finished" ? "degree" : s.sets === "college-finished" ? "college" : "school");
  } else {
    addLog(`Another year of the ${s.label.toLowerCase()} — ${s.yearsLeft} to go.`);
  }
}

function doStartPostgrad(id){
  const def = POSTGRAD_COURSES.find(p=>p.id===id);
  if(!def) return;
  if(state.postgrad){ addLog("Already partway through a course."); refreshActivitySheet(); return; }
  if(state.education !== "degree-finished" && !state.postgradAwards?.length){
    addLog("You need an undergraduate degree first."); refreshActivitySheet(); return;
  }
  if(def.requires && !(state.postgradAwards||[]).includes(def.requires)){
    addLog(`A ${def.requires} is required before starting a ${def.label}.`); refreshActivitySheet(); return;
  }
  if(state.stats.smarts < def.minSmarts){ addLog(`Not accepted — a ${def.label} needs smarts ${def.minSmarts}+.`); refreshActivitySheet(); return; }
  if(def.minAge && state.age < def.minAge){ addLog(`Business schools want a few years' work behind you first — come back at ${def.minAge}.`); refreshActivitySheet(); return; }
  if((state.postgradAwards||[]).includes(def.award)){ addLog(`You already hold a ${def.award}.`); refreshActivitySheet(); return; }
  if(!spendAction("postgrad")){ refreshActivitySheet(); return; }
  commitAction();
  // Postgraduate fees go through the same funding choice as going back to
  // school, rather than silently requiring the cash up front.
  closeSheet();
  openPostgradFunding(def);
}

// Scholarship, loan, parents or cash — for a postgraduate course.
function openPostgradFunding(def){
  const course = { id:def.id, label:def.label, years:def.years, cost:def.cost, minSmarts:def.minSmarts };
  const enrol = (funding)=>{
    state.postgrad = { id:def.id, yearsLeft:def.years, label:def.label, award:def.award, smartsGain:def.smartsGain, funding };
    milestone("enrolled", `Enrolled on a ${def.label} — ${def.years} year${def.years===1?"":"s"} of study ahead.`);
    render();
  };
  const schChance = scholarshipChance(course);
  const options = [];
  options.push({ label:`Apply for a funded place — ${Math.round(schChance*100)}% chance`, effect:()=>{
    if(Math.random() < schChance){ nudge("happiness",10); addLog(`Won a funded place covering the full ${money(def.cost)}.`, true); enrol("scholarship"); }
    else { addLog("The funding application was unsuccessful."); nudge("happiness",-3); openPostgradFundingFallback(def, enrol); }
  }});
  options.push({ label:`Take a student loan — ${money(def.cost)} at 6%`, effect:()=>{
    const existing = state.studentLoan ? state.studentLoan.balance : 0;
    state.studentLoan = { balance: existing + def.cost, rate:0.06 };
    addLog(`Took a student loan of ${money(def.cost)} for the ${def.label}.`, true);
    enrol("loan");
  }});
  if(state.money >= def.cost){
    options.push({ label:`Pay the ${money(def.cost)} yourself`, effect:()=>{ addMoney(-def.cost); enrol("self"); }});
  }
  if(canAskParentsForFees()){
    const pc = parentFeesChance();
    options.push({ label:`Ask your parents — ${Math.round(pc*100)}% chance`, effect:()=>{
      const parents = (state.family||[]).filter(p=>(p.relation==="Mother"||p.relation==="Father") && p.alive);
      if(Math.random() < pc){ addLog(`Your parents covered the ${money(def.cost)} in fees.`, true); enrol("parents"); }
      else { parents.forEach(p=>{ p.closeness = clamp((p.closeness||50) - rand(3,9)); }); nudge("happiness",-5); addLog("They said they couldn't."); openPostgradFundingFallback(def, enrol); }
    }});
  }
  options.push({ label:"Don't enrol", effect:()=>{ addLog(`Decided against the ${def.label}.`); }});
  queueChoice({ title:"Paying for it", text:`${def.label} — ${def.years} year${def.years===1?"":"s"}, ${money(def.cost)}.`, options });
}

// After a failed scholarship or a refusal, the paying options that are left.
function openPostgradFundingFallback(def, enrol){
  const options = [{ label:`Take a student loan — ${money(def.cost)} at 6%`, effect:()=>{
    const existing = state.studentLoan ? state.studentLoan.balance : 0;
    state.studentLoan = { balance: existing + def.cost, rate:0.06 };
    addLog(`Took a student loan of ${money(def.cost)} instead.`, true);
    enrol("loan");
  }}];
  if(state.money >= def.cost){
    options.push({ label:`Pay the ${money(def.cost)} yourself`, effect:()=>{ addMoney(-def.cost); enrol("self"); }});
  }
  options.push({ label:"Don't enrol", effect:()=>{ addLog(`Decided against the ${def.label}.`); }});
  queueChoice({ title:"Another way to pay", text:`The ${def.label} still costs ${money(def.cost)}.`, options });
}

// ---------- What next, after each stage ----------
// Finishing any stage of education asks what comes next: the next stage up,
// or stopping and finding work (which opens the job listings), or leaving it
// for now. Every option's entry requirement is shown on it.
function lookForWorkNext(){
  if(state.career || state.business || state.politics) return;
  state.openJobsNext = true;
}

function postgradOptionsOpen(){
  const held = state.postgradAwards || [];
  return POSTGRAD_COURSES.filter(d=>!held.includes(d.award) && (!d.requires || held.includes(d.requires)) && !(d.minAge && state.age < d.minAge));
}

function offerAfterQualification(stage){
  const options = [];
  const pricey = c=>`${money(c.cost)} · ${c.years} year${c.years===1?"":"s"}${c.minSmarts?` · smarts ${c.minSmarts}+`:""}`;
  const an = l=>/^(MBA|[AEIOU])/.test(l) ? "an" : "a";
  if(stage === "school"){
    const c = RETURN_COURSES.find(x=>x.id==="college");
    options.push({ label:`Go on to ${an(c.label)} ${c.label.toLowerCase()} — ${pricey(c)}`, effect:()=>{
      if(state.stats.smarts < c.minSmarts){ addLog(`Turned down for the ${c.label.toLowerCase()} — smarts ${state.stats.smarts}, and they wanted ${c.minSmarts}.`, true); return; }
      openFundingChoice(c, null);
    }});
  }
  if(stage === "college"){
    const c = RETURN_COURSES.find(x=>x.id==="degree");
    options.push({ label:`Go on to university — ${pricey(c)}`, effect:()=>{
      if(state.stats.smarts < c.minSmarts){ addLog(`Turned down by the university — smarts ${state.stats.smarts}, and they wanted ${c.minSmarts}.`, true); return; }
      pickReturnDegree(c);
    }});
  }
  if(stage === "degree" || stage === "postgrad"){
    postgradOptionsOpen().forEach(d=>{
      options.push({ label:`Go on to ${an(d.label)} ${d.label} — ${pricey(d)}`, effect:()=>{
        if(state.stats.smarts < d.minSmarts){ addLog(`Not accepted onto the ${d.label} — smarts ${state.stats.smarts}, and they wanted ${d.minSmarts}.`, true); return; }
        openPostgradFunding(d);
      }});
    });
  }
  const working = !!(state.career || state.business || state.politics);
  if(!working) options.push({ label:"Stop here and look for work", effect:()=>{ addLog("Finished with studying for now, and started looking for work."); lookForWorkNext(); }});
  options.push({ label: working ? "Carry on as you are" : "Leave it for now", effect:()=>{ addLog("Left further study for another time — you can go back from Occupation whenever you like."); }});
  if(options.length < 2) return;
  const titles = { school:"School's finished", college:"College is finished", degree:"You've graduated", postgrad:"Qualified" };
  queueChoice({
    title: titles[stage] || "What next?",
    text: stage === "postgrad" ? `You now hold ${(state.postgradAwards||[]).join(", ")}. Study further, or put it to work?`
        : stage === "degree" ? `A degree in ${state.degree || "General Studies"}. Postgraduate study, or out into the working world?`
        : "Carry on to the next stage, or stop here?",
    options,
  });
}

function doDropPostgrad(){
  if(!state.postgrad) return;
  addLog(`Dropped out of the ${state.postgrad.label}. The fees are gone.`, true);
  state.postgrad = null;
  nudge("happiness", -5);
  refreshActivitySheet();
}

function runPostgradYear(){
  const p = state.postgrad;
  if(!p || state.prisonYearsLeft > 0) return;
  p.yearsLeft -= 1;
  nudge("smarts", rand(2,4));
  nudgeHidden("stress", 3);
  if(p.yearsLeft <= 0){
    state.postgradAwards = (state.postgradAwards||[]).concat(p.award);
    nudge("smarts", rand(p.smartsGain[0], p.smartsGain[1]));
    nudge("happiness", 10);
    milestone("graduated", `Awarded a ${p.award}.`);
    state.postgrad = null;
    offerAfterQualification("postgrad");
  } else {
    addLog(`Continuing the ${p.label} — ${p.yearsLeft} year${p.yearsLeft===1?"":"s"} to go.`);
  }
}

// ---------- Substances, addiction and recovery ----------
// Short-term relief with a real risk of dependency, and a costly but effective
// route back out again.

const SUBSTANCES = [
  {id:"drink", label:"Drink heavily", minAge:18, cost:60,  happiness:[4,9],  health:[-6,-2],  addictChance:0.10, name:"alcohol"},
  {id:"smoke", label:"Smoke",         minAge:16, cost:40,  happiness:[2,5],  health:[-8,-3],  addictChance:0.18, name:"tobacco"},
  {id:"pills", label:"Take recreational drugs", minAge:18, cost:200, happiness:[8,15], health:[-14,-5], addictChance:0.22, name:"drugs"},
];

function isAddicted(name){ return (state.addictions||[]).includes(name); }

function doSubstance(id){
  const def = SUBSTANCES.find(s=>s.id===id);
  if(!def) return;
  if(state.age < def.minAge){ addLog("Too young for that."); refreshActivitySheet(); return; }
  if(usesLeft("substance") <= 0){ addLog("Enough of that for one year."); refreshActivitySheet(); return; }
  if(state.money < def.cost){ addLog("Not enough money for that."); refreshActivitySheet(); return; }
  if(!spendAction("substance")){ refreshActivitySheet(); return; }
  recordUse("substance");
  addMoney(-def.cost);
  nudge("happiness", rand(def.happiness[0], def.happiness[1]));
  nudge("health", rand(def.health[0], def.health[1]));
  nudgeHidden("stress", -rand(4,10));
  if(def.id === "smoke") state.flags.smoker = true;
  if(!isAddicted(def.name) && Math.random() < def.addictChance * (hasPerk("iron_liver") ? 0.5 : 1)){
    state.addictions = (state.addictions||[]).concat(def.name);
    addLog(`Developed a dependency on ${def.name}.`, true);
  } else {
    addLog(`${def.label} this year.`);
  }
  refreshActivitySheet();
}

// Addictions bite every year until treated.
function applyAddictions(){
  (state.addictions||[]).forEach(a=>{
    nudge("health", -rand(2,5));
    nudge("happiness", -rand(1,4));
    addMoney(-rand(200,900));
    nudgeHidden("stress", 3);
    if(Math.random() < 0.04){
      addCondition(a === "alcohol" ? "liver damage" : a === "tobacco" ? "a chronic cough" : "lasting health damage");
    }
  });
  if((state.addictions||[]).length) addLog(`Struggling with ${state.addictions.join(" and ")} — it costs you every year.`);
}

function doRehab(){
  if(!(state.addictions||[]).length){ addLog("Nothing to treat."); refreshActivitySheet(); return; }
  const cost = 3500;
  if(state.money < cost){ addLog(`Rehab costs ${money(cost)} — not affordable right now.`); refreshActivitySheet(); return; }
  if(usesLeft("rehab") <= 0){ addLog("One course of treatment a year."); refreshActivitySheet(); return; }
  if(!spendAction("rehab")){ refreshActivitySheet(); return; }
  recordUse("rehab");
  addMoney(-cost);
  // Treatment works more often than not, and willpower (happiness) helps.
  const chance = clamp(0.5 + state.stats.happiness/300, 0.9, 0.25);
  if(Math.random() < chance){
    const beaten = state.addictions[0];
    state.addictions = state.addictions.slice(1);
    if(beaten === "tobacco") state.flags.smoker = false;
    nudge("happiness", 10);
    state.flags.beatAddiction = true;
    addLog(`Completed treatment and came off ${beaten}.`, true);
  } else {
    nudge("happiness", -6);
    addLog("Went through rehab but relapsed afterwards.");
  }
  refreshActivitySheet();
}

// ---------- Arrest, court and sentencing ----------
// Being caught is no longer an instant sentence: you choose how to react to the
// arrest, whether to pay for a lawyer, and how to plead — and each decision
// genuinely moves the odds.

function beginArrest(def, reward){
  milestone("caught", `Caught in the act — the police have arrived.`);
  queueChoice({
    title:"Under arrest",
    text:`You've been caught attempting ${def.label.toLowerCase()}. How do you react?`,
    options:[
      {label:"Go quietly", effect:()=>{ goToCourt(def, reward, { cooperated:true }); }},
      {label:"Try to flee", effect:()=>{
        const chance = clamp(0.15 + state.stats.health/300 + (state.skills.martialArts||0)/400, 0.6, 0.05);
        if(Math.random() < chance){
          nudge("happiness", 8);
          addLog("Outran them. No charges — this time.", true);
        } else {
          nudge("health", -rand(5,15));
          addLog("Caught after a chase. It will not look good in court.", true);
          goToCourt(def, reward, { fled:true });
        }
      }},
      {label:"Resist arrest", effect:()=>{
        nudge("health", -rand(10,25));
        addLog("Resisted, and came off worse. An extra charge to answer for.", true);
        goToCourt(def, reward, { resisted:true });
      }},
    ]
  });
}

function goToCourt(def, reward, ctx){
  const lawyerCost = 4000;
  queueChoice({
    title:"Your day in court",
    text:`Charged over ${def.label.toLowerCase()}. A good solicitor costs ${money(lawyerCost)} — representing yourself is free, but you'd be relying on your own wits.`,
    options:[
      {label:`Hire a solicitor — ${money(lawyerCost)}`, effect:()=>{
        if(state.money < lawyerCost){
          addLog("Couldn't afford a solicitor — representing yourself by necessity.");
          enterPlea(def, reward, Object.assign({}, ctx, { lawyer:false }));
        } else {
          addMoney(-lawyerCost);
          enterPlea(def, reward, Object.assign({}, ctx, { lawyer:true }));
        }
      }},
      {label:"Represent yourself", effect:()=>{ enterPlea(def, reward, Object.assign({}, ctx, { lawyer:false })); }},
    ]
  });
}

function enterPlea(def, reward, ctx){
  queueChoice({
    title:"How do you plead?",
    text:"Pleading guilty usually means a lighter sentence. Not guilty is a gamble — acquittal, or the full weight of it.",
    options:[
      {label:"Plead guilty", effect:()=>{ deliverVerdict(def, reward, Object.assign({}, ctx, { plea:"guilty" })); }},
      {label:"Plead not guilty", effect:()=>{ deliverVerdict(def, reward, Object.assign({}, ctx, { plea:"notguilty" })); }},
    ]
  });
}

function deliverVerdict(def, reward, ctx){
  // Acquittal odds: a solicitor helps most, smarts helps, and fleeing or
  // resisting counts firmly against you.
  let acquit = 0.10;
  if(ctx.lawyer) acquit += 0.30;
  acquit += state.stats.smarts / 400;
  if(ctx.cooperated) acquit += 0.05;
  if(ctx.fled) acquit -= 0.10;
  if(ctx.resisted) acquit -= 0.15;
  if(state.flags.criminalRecord) acquit -= 0.10;
  if(ctx.plea === "guilty") acquit = 0; // you've admitted it
  acquit = clamp(acquit, 0.75, 0);

  if(Math.random() < acquit){
    nudge("happiness", 12);
    addLog("Found not guilty. You walk free, record intact.", true);
    render();
    return;
  }

  state.flags.criminalRecord = true;
  let jailYears = rand(def.jailYears[0], def.jailYears[1]);
  if(state.gang && jailYears > 0) jailYears += 1;
  if(ctx.resisted) jailYears += 1;
  if(ctx.fled) jailYears += 1;
  // Guilty pleas earn credit; a good solicitor argues it down further.
  if(ctx.plea === "guilty") jailYears = Math.floor(jailYears * 0.65);
  if(ctx.lawyer) jailYears = Math.floor(jailYears * 0.75);

  if(jailYears > 0){
    state.prisonYearsLeft = (state.prisonYearsLeft||0) + jailYears;
    state.career = null;
    state.paroleEligible = false;
    milestone("sentenced", `Convicted — sentenced to ${jailYears} year${jailYears===1?"":"s"} in prison.`);
  } else {
    const fine = Math.round((reward||500) * (ctx.plea === "guilty" ? 1.0 : 1.8));
    addMoney(-fine);
    nudge("happiness", -6);
    milestone("caught", `Convicted — fined ${money(fine)}, no custodial sentence.`);
  }
  render();
}

// ---------- Parole ----------
function doApplyParole(){
  if(state.prisonYearsLeft <= 0) return;
  if(usesLeft("parole") <= 0){ addLog("The parole board only sits once a year."); render(); return; }
  recordUse("parole");
  // Conduct inside is what the board actually weighs, alongside how much of
  // the sentence is left. Work on the wing and courses count in your favour.
  let chance = 0.1 + prisonConduct()/180 + state.hidden.karma/400 - state.prisonYearsLeft*0.03;
  chance += Math.min(3, state.prisonWorkYears || 0) * 0.04;
  if(state.flags.prisonCourse) chance += 0.05;
  if(state.flags.prisonFight) chance -= 0.2;
  if(state.flags.triedToEscape) chance -= 0.15;
  chance = clamp(chance, 0.85, 0.02);
  if(Math.random() < chance){
    milestone("released", `Parole granted — released early with ${state.prisonYearsLeft} year${state.prisonYearsLeft===1?"":"s"} left to serve.`);
    state.prisonYearsLeft = 0;
    nudge("happiness", 12);
  } else {
    nudge("happiness", -5);
    addLog("Parole denied. Back to the wing.");
  }
  render();
}

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Ledger — A Life Simulator</title>
<style>
  :root{
    /* Mobile redesign palette */
    --bg:#11151C;
    --surface:#202936;
    --surface-2:#1a222e;
    --primary:#183D70;
    --accent:#F4A340;
    --text:#F5F3EC;
    --text-dim:#AAB2BF;
    --line:#2b3545;
    --green:#4caf72;
    --red:#e05a5a;
    --amber:#F4A340;

    /* Legacy aliases, so all the existing markup keeps working */
    --black:#0b0e13;
    --navy:var(--surface);
    --navbar:var(--primary);
    --header:var(--surface-2);
    --paper:var(--bg);
    --panel:var(--surface);
    --ink:var(--text);
    --ink-soft:var(--text-dim);
    --rule:var(--line);
    --orange:var(--accent);
    --teal:#2bb8a8;
    --cyan:#4cc4e0;
    --yellow:var(--accent);
    --blue-link:#79aef0;
    --good:var(--green);
    --bad:var(--red);
    --brass:var(--text-dim);
    --brass-line:var(--line);
    --stamp:var(--accent);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100%;
    display:flex;
    justify-content:center;
    padding:0 0 184px;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
  }
  body.noscroll{ padding-bottom:0; }
  #app{ width:100%; max-width:480px; }

  /* ---- Top bar ---- */
  .topbar{ background:var(--black); color:var(--text); display:flex; align-items:center; gap:8px; padding:calc(8px + env(safe-area-inset-top)) 10px 8px; }
  .topbar .circ{ width:26px;height:26px;border-radius:50%;border:1.5px solid var(--text-dim);display:flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer;flex:0 0 auto;color:var(--text); }
  .topbar .logo{ color:var(--accent); font-weight:800; letter-spacing:.5px; font-size:17px; flex:1; }
  .topbar .xp-pill{ background:transparent; border:1.5px solid var(--accent); color:var(--accent); font-size:10.5px; font-weight:700; padding:4px 9px; border-radius:999px; white-space:nowrap; cursor:pointer; }
  .topbar .ver{ font-size:9px; color:#6b737f; }

  /* ---- Character header ---- */
  .charhead{ background:var(--surface-2); display:flex; align-items:center; gap:10px; padding:10px 12px; border-bottom:1px solid var(--line); }
  .charhead .avatar{ width:44px;height:44px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:24px;flex:0 0 auto;border:2px solid var(--line); }
  .charhead .who{ flex:1; min-width:0; }
  .charhead .nm{ color:var(--text); font-weight:700; font-size:14.5px; }
  .charhead .role{ font-size:11.5px; color:var(--text-dim); display:flex; align-items:center; gap:4px; margin-top:2px; }
  .charhead .bank{ text-align:right; flex:0 0 auto; }
  .charhead .bank .lbl{ font-size:9.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.5px; }
  .charhead .bank .amt{ color:var(--green); font-weight:800; font-size:14.5px; }

  /* ---- Promo strip ---- */
  .promo{ background:var(--primary); color:var(--text); font-size:11px; padding:5px 12px; text-align:center; }

  /* ---- Life log ---- */
  .logwrap{ background:var(--bg); padding:6px 12px 10px; }
  #log{ display:flex; flex-direction:column; }
  .yearhead{ color:var(--accent); font-weight:800; font-size:14px; margin:12px 0 4px; display:flex; align-items:center; justify-content:space-between; }
  .cake{ width:26px;height:26px;border-radius:50%;background:var(--primary);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;position:relative; }
  .cake .dot{ position:absolute;top:-1px;right:-1px;width:8px;height:8px;border-radius:50%;background:var(--red);border:1.5px solid var(--bg); }
  .entry{ font-size:13.5px; line-height:1.5; padding:3px 0; color:#dcdfe5; }
  .entry.stamp{ font-weight:700; color:var(--accent); }
  .entry.news{ font-style:italic; color:var(--text-dim); }
  .entry.money-in{ color:#6ed094; }
  .entry.money-out{ color:#e8bd72; }
  .entry.bad{ color:var(--red); }

  /* ---- Bottom nav ---- */
  #actionbar{ position:fixed; bottom:0;left:0;right:0; display:flex; flex-direction:column; align-items:center; z-index:5; background:var(--surface-2); }
  #actionbar-inner{ width:100%; max-width:480px; }
  .navbar{ background:var(--primary); display:flex; align-items:flex-end; justify-content:space-between; padding:6px 4px calc(7px + env(safe-area-inset-bottom)); position:relative; }
  .navbtn{ flex:1; background:none;border:none;color:#cfe0f5;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:9.5px;padding:4px 0;cursor:pointer;font-family:inherit; }
  .navbtn .ic{ font-size:18px; line-height:1; }
  .navbtn.job .ic{ color:var(--accent); }
  .navbtn.assets .ic{ color:var(--teal); }
  .navbtn.rel .ic{ color:var(--cyan); }
  .navbtn.act .ic{ color:var(--cyan); }
  .agewrap{ flex:0 0 76px; display:flex; justify-content:center; position:relative; }
  .agebtn{ width:62px;height:62px;border-radius:50%;background:var(--accent);color:#22180a;border:3px solid var(--bg);font-weight:800;font-size:12px;cursor:pointer;margin-top:-26px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;font-family:inherit;box-shadow:0 2px 10px rgba(0,0,0,.45); }
  .agebtn .plus{ font-size:20px; }
  .backbtn{ position:absolute; right:2px; bottom:-2px; width:26px;height:26px;border-radius:50%;background:var(--red);color:#fff;border:2px solid var(--bg);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;padding:0; }

  /* ---- Stat bars under the nav ---- */
  .statsbar{ background:var(--surface-2); padding:7px 12px 9px; border-top:1px solid var(--line); }
  .statline{ display:flex; align-items:center; gap:7px; margin:3px 0; }
  .statline .nm{ font-size:11px; width:66px; color:var(--text-dim); font-weight:600; }
  .statline .ic{ font-size:12px; width:16px; text-align:center; }
  .statline .track{ flex:1; height:13px; background:#0e131a; border-radius:3px; overflow:hidden; border:1px solid var(--line); }
  .statline .fill{ display:block; height:100%; border-radius:3px; transition:width .35s ease; }
  .statline .pct{ font-size:10.5px; font-weight:700; width:40px; text-align:center; background:var(--surface); border:1px solid var(--line); border-radius:3px; padding:1px 0; color:var(--text); }
  .statline .warn{ color:var(--red); font-size:11px; width:12px; flex:0 0 12px; text-align:center; }
  .statline .delta{ width:26px; flex:0 0 26px; text-align:right; margin-left:4px; font-size:11px; }
  .statline .pct{ flex:0 0 40px; }
  .actionpips{ font-size:10.5px; color:var(--text-dim); text-align:center; padding-top:4px; }

  /* ---- Sheets / panels ---- */
  .panel{ background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin:10px 12px; }
  .overlay{ position:fixed;inset:0; background:rgba(5,7,11,.72); display:flex;align-items:flex-end;justify-content:center; z-index:10; }
  .sheet{ background:var(--surface-2); width:100%;max-width:480px; border-radius:18px 18px 0 0; padding:14px 14px calc(18px + env(safe-area-inset-bottom)); max-height:84vh; overflow-y:auto; position:relative; border-top:1px solid var(--line); }
  .sheet-x{ position:absolute; top:10px; right:10px; width:30px;height:30px; border-radius:50%; background:var(--red); color:#fff; border:none; font-size:15px; font-weight:700; line-height:1; display:flex; align-items:center; justify-content:center; padding:0; cursor:pointer; z-index:2; }
  .sheet h2{ padding-right:38px; }
  .sheet h2{ font-size:17px;font-weight:800; margin:0 0 10px; color:var(--text); }
  button{ font-family:inherit; font-size:13px; border:1px solid var(--line); background:var(--surface); color:var(--text); padding:11px 12px; border-radius:10px; cursor:pointer; text-align:left; }
  button:active{ background:#27313f; }
  button.primary{ background:var(--accent); color:#22180a; border-color:var(--accent); text-align:center; font-weight:800; }
  button.danger{ border-color:var(--red); color:var(--red); }
  button:disabled{ opacity:.4; cursor:default; }
  button.small{ padding:8px 10px; font-size:12px; }
  .choices{ display:flex; flex-direction:column; gap:7px; margin-top:8px; }
  .cat-list{ display:grid; grid-template-columns:1fr 1fr; gap:7px; }
  .menu-item{ display:flex; align-items:center; gap:10px; width:100%; }
  .mrow{ display:flex; align-items:center; gap:11px; width:100%; padding:12px 12px; background:var(--surface); border:1px solid var(--line); border-radius:11px; cursor:pointer; text-align:left; font-family:inherit; font-size:13.5px; color:var(--text); }
  .mrow:active{ background:#27313f; }
  .mrow.selected{ border-color:var(--accent); background:#262f3d; }
  .mrow .mi{ font-size:21px; width:26px; text-align:center; flex:0 0 26px; }
  .mrow .mtxt{ flex:1; min-width:0; }
  .mrow .mtitle{ display:block; font-weight:600; }
  .mrow .msub{ display:block; font-size:10.5px; color:var(--text-dim); margin-top:2px; }
  .mrow .mval{ font-size:12px; font-weight:700; color:var(--green); flex:0 0 auto; }
  .mrow .chev{ color:#5f6b7a; font-size:17px; flex:0 0 auto; }
  .mrow:disabled{ opacity:.4; cursor:default; }
  .menulist{ display:flex; flex-direction:column; gap:7px; }
  .mrow .dots, .erow .dots{ color:#7d8896; font-size:13px; letter-spacing:1px; flex:0 0 auto; }
  /* Rows built from plain buttons share the menu-row layout. */
  .erow{ display:flex; align-items:center; gap:11px; width:100%; padding:11px 12px; border-radius:11px; }
  .erow.small{ padding:11px 12px; font-size:13px; }
  .erow .chev{ color:#5f6b7a; font-size:17px; flex:0 0 auto; }
  .track-card .erow{ background:var(--surface-2); }
  .erow .mi{ font-size:20px; width:26px; text-align:center; flex:0 0 26px; }
  .erow .mi-dot{ display:inline-block; width:6px; height:6px; border-radius:50%; background:#3a4554; }
  .erow .mtxt{ flex:1; min-width:0; }
  .erow .mtitle{ display:block; font-weight:600; font-size:13.5px; }
  .erow .msub{ display:block; font-size:10.5px; color:var(--text-dim); margin-top:2px; }
  .erow .mval{ font-size:12px; font-weight:700; color:var(--green); flex:0 0 auto; white-space:nowrap; }
  .erow .mval.free{ color:var(--text-dim); font-weight:600; }
  .erow.danger .mtitle{ color:var(--red); }
  .erow:disabled .dots{ visibility:hidden; }
  /* The header pinned to the top of every sheet. */
  .sheet.has-hud{ padding-top:0; }
  .sheet-hud{ position:sticky; top:0; z-index:3; display:flex; align-items:center; gap:10px; margin:0 -14px 12px; padding:12px 14px 10px; background:var(--surface-2); border-bottom:1px solid var(--line); border-radius:18px 18px 0 0; }
  .sheet-hud .hud-av{ width:36px; height:36px; border-radius:50%; background:var(--surface); border:2px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:20px; flex:0 0 auto; }
  .sheet-hud .hud-who{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .sheet-hud .hud-nm{ font-weight:700; font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sheet-hud .hud-role{ font-size:10.5px; color:var(--text-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sheet-hud .hud-bank{ display:flex; flex-direction:column; align-items:flex-end; flex:0 0 auto; }
  .sheet-hud .hud-amt{ color:var(--green); font-weight:800; font-size:14px; white-space:nowrap; }
  .sheet-hud .hud-lbl{ font-size:9.5px; color:var(--text-dim); white-space:nowrap; }
  .sheet-hud .sheet-x{ position:static; flex:0 0 30px; margin-left:4px; }
  .sheet.has-hud .sheet-title, .sheet.has-hud h2{ padding-right:0; }
  .mrow .rel-tag{ font-weight:400; color:var(--text-dim); }
  .mbar{ display:inline-block; vertical-align:middle; width:110px; height:6px; margin-left:6px; background:#0e131a; border:1px solid var(--line); border-radius:4px; overflow:hidden; }
  .mbar > span{ display:block; height:100%; background:var(--accent); }
  .mbar > span.high{ background:var(--green); }
  .mbar > span.low{ background:var(--red); }
  .person-card{ background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px; margin:0 0 4px; }
  .person-card .pc-head{ display:flex; align-items:center; gap:11px; margin-bottom:8px; }
  .person-card .pc-icon{ font-size:34px; line-height:1; }
  .person-card .pc-txt{ display:flex; flex-direction:column; }
  .person-card .pc-name{ font-weight:800; font-size:16px; }
  .person-card .pc-sub{ font-size:12px; color:var(--text-dim); }
  .person-card .pc-bar{ display:grid; grid-template-columns:auto 1fr auto; gap:8px; align-items:center; font-size:12px; color:var(--text-dim); margin:4px 0 6px; }
  .person-card .pc-v{ font-weight:700; color:var(--text); }
  .sheet-title{ display:flex; align-items:center; gap:8px; margin:0 0 12px; padding-right:38px; }
  .sheet-title .bk{ font-size:21px; color:var(--accent); cursor:pointer; line-height:1; background:none;border:none;padding:0 2px 0 0;font-family:inherit; }
  .sheet-title h2{ margin:0; padding:0; font-size:17px; font-weight:800; color:var(--text); }
  .menu-item .mi{ font-size:19px; width:24px; text-align:center; }
  .section-label{ font-size:10.5px; letter-spacing:1px; text-transform:uppercase; color:var(--text-dim); font-weight:700; margin:12px 0 5px; }
  .section-label:first-child{ margin-top:0; }
  .job-line{ font-size:12px; color:var(--text-dim); margin-top:4px; }
  .req-line{ font-size:10.5px; color:var(--text-dim); display:block; margin-top:2px; }
  .track-card{ border:1px solid var(--line); border-radius:10px; padding:9px 11px; margin-bottom:8px; background:var(--surface); }
  .track-card h3{ margin:0 0 2px; font-size:13.5px; font-weight:700; }
  .ladder-preview{ font-size:10.5px; color:var(--text-dim); margin:4px 0 8px; }
  .breadcrumb{ font-size:11.5px; color:var(--accent); margin-bottom:8px; cursor:pointer; font-weight:600; }
  .tab-row{ display:flex; gap:5px; overflow-x:auto; padding-bottom:8px; margin-bottom:10px; border-bottom:1px solid var(--line); }
  .tab-btn{ flex:0 0 auto; padding:7px 11px; font-size:11.5px; border:1px solid var(--line); background:var(--surface); border-radius:999px; white-space:nowrap; }
  .tab-btn.active{ background:var(--accent); color:#22180a; border-color:var(--accent); font-weight:700; }
  .tab-panel{ max-height:54vh; overflow-y:auto; }
  .person-row{ display:flex; justify-content:space-between; align-items:baseline; padding:7px 0; border-bottom:1px solid var(--line); font-size:13px; }
  .person-row .rel{ font-size:10.5px; color:var(--text-dim); }
  .person-row.dead{ opacity:.45; text-decoration:line-through; }
  .achv-row{ display:flex; justify-content:space-between; padding:5px 0; border-bottom:1px solid var(--line); font-size:12.5px; }
  .desc{ font-size:10.5px; color:var(--text-dim); }
  .review{ background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--accent); border-radius:10px; padding:10px 12px; margin:10px 12px; }
  .review h3{ margin:0 0 6px; font-size:11.5px; font-weight:700; letter-spacing:.8px; color:var(--accent); text-transform:uppercase; }
  .review-row{ display:flex; justify-content:space-between; font-size:12.5px; padding:2px 0; gap:10px; }
  .review-row .v{ font-weight:600; }
  .bar-track{ height:7px; background:#0e131a; border-radius:4px; overflow:hidden; border:1px solid var(--line); }
  .bar-fill{ display:block; height:100%; background:var(--green); }
  .bar-fill.low{ background:var(--red); }
  .bar-fill.high{ background:var(--green); }
  .delta{ font-size:10.5px; margin-left:5px; font-weight:700; }
  .delta.up{ color:var(--good); }
  .delta.down{ color:var(--bad); }
  .tag{ display:inline-block; font-size:9.5px; letter-spacing:.5px; border:1px solid var(--red); color:var(--red); padding:1px 5px; border-radius:3px; margin-left:6px; font-weight:700; }
  .tag.world{ border-color:var(--accent); color:var(--accent); }
  .hidden{ display:none !important; }
  .name-input{ width:100%; font-family:inherit; font-size:15px; padding:11px; border:1px solid var(--line); background:var(--surface-2); color:var(--text); margin-bottom:10px; border-radius:10px; }
  .gender-grid{ display:grid; grid-template-columns:1fr 1fr; gap:7px; margin-bottom:10px; }
  .gender-grid button{ text-align:center; }
  .gender-grid button.selected{ background:var(--accent); color:#22180a; border-color:var(--accent); font-weight:700; }
  .cat-list button{ text-align:center; }
  .cat-list button.selected{ background:var(--accent); color:#22180a; border-color:var(--accent); font-weight:700; }
  .epitaph{ text-align:center; font-style:italic; color:var(--text-dim); margin:8px 0 14px; }
  .close-row{ margin-top:10px; }
  .setup-head{ text-align:center; padding:18px 12px 10px; }
  .setup-head h1{ font-size:30px; margin:4px 0 2px; font-weight:800; color:var(--accent); letter-spacing:.5px; }
  .setup-head .sub{ font-size:12px; color:var(--text-dim); }

  /* ====================================================================== */
  /*  Mobile redesign — standalone screens (splash, home, create, etc.)      */
  /* ====================================================================== */

  .screen{ min-height:100vh; display:flex; flex-direction:column; padding-bottom:env(safe-area-inset-bottom); }
  .scr-head{ display:flex; align-items:center; gap:10px; padding:calc(14px + env(safe-area-inset-top)) 16px 10px; }
  .scr-head .hbtn{ width:34px;height:34px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:15px;padding:0;flex:0 0 auto;color:var(--text); }
  .scr-head .htitle{ flex:1; font-size:16px; font-weight:800; letter-spacing:.3px; text-align:center; }
  .scr-head .hspace{ width:34px; flex:0 0 auto; }

  .brand{ text-align:center; padding:10px 16px 2px; }
  .brand .bt{ font-size:32px; font-weight:800; letter-spacing:2px; color:var(--accent); line-height:1.05; }
  .brand .bs{ font-size:11.5px; color:var(--text-dim); letter-spacing:.6px; margin-top:6px; }

  .card{ background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:14px 16px; margin:10px 16px; }
  .card .ct{ font-size:10.5px; letter-spacing:1.2px; text-transform:uppercase; color:var(--text-dim); font-weight:700; }
  .card .cbig{ font-size:24px; font-weight:800; margin-top:3px; }
  .card .csub{ font-size:11.5px; color:var(--text-dim); margin-top:3px; }

  .xpbar{ height:8px; background:#0e131a; border:1px solid var(--line); border-radius:999px; overflow:hidden; margin:10px 0 6px; }
  .xpbar > span{ display:block; height:100%; background:var(--accent); }

  .cta{ display:block; width:calc(100% - 32px); margin:12px 16px 0; padding:17px 14px; border-radius:14px; background:var(--accent); color:#22180a; border:none; font-size:16px; font-weight:800; text-align:center; letter-spacing:.3px; box-shadow:0 4px 16px rgba(244,163,64,.22); }
  .cta.ghost{ background:transparent; color:var(--text); border:1px solid var(--line); box-shadow:none; font-weight:700; }

  .rowcard{ display:flex; align-items:center; gap:12px; width:calc(100% - 32px); margin:10px 16px 0; padding:14px 16px; background:var(--surface); border:1px solid var(--line); border-radius:14px; text-align:left; color:var(--text); }
  .rowcard .ri{ font-size:22px; flex:0 0 auto; }
  .rowcard .rt{ flex:1; min-width:0; }
  .rowcard .rt b{ display:block; font-size:14px; font-weight:700; }
  .rowcard .rt span{ display:block; font-size:11.5px; color:var(--text-dim); margin-top:2px; }
  .rowcard .rc{ color:#5f6b7a; font-size:18px; flex:0 0 auto; }

  .tiles{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:12px 16px 0; }
  .tile{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px 12px; text-align:center; color:var(--text); }
  .tile .ti{ font-size:24px; }
  .tile b{ display:block; font-size:13px; margin-top:6px; font-weight:700; }
  .tile span{ display:block; font-size:10.5px; color:var(--text-dim); margin-top:2px; }

  .ver{ text-align:center; font-size:10px; color:#5a626e; padding:18px 0 10px; letter-spacing:.5px; }

  /* Splash */
  .splash{ min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; }
  .splash .sbrand{ font-size:38px; font-weight:800; letter-spacing:3px; color:var(--accent); }
  .splash .stag{ font-size:12px; color:var(--text-dim); letter-spacing:1px; }
  .splash .dots{ display:flex; gap:7px; margin-top:22px; }
  .splash .dots i{ width:7px;height:7px;border-radius:50%;background:var(--text-dim); animation:sp 1.1s infinite ease-in-out; }

<script>
// ---------------------------------------------------------------------------
// Storage shim.
// Inside the Claude artifact host, window.storage is provided for us. Running
// from a plain web server (GitHub Pages, file://) it doesn't exist, so fall
// back to localStorage with the same async get/set shape the game expects.
// ---------------------------------------------------------------------------
if(typeof window !== "undefined" && !window.storage){
  window.storage = {
    async get(key){
      const v = localStorage.getItem("ll_" + key);
      if(v === null) throw new Error("no such key: " + key);
      return { key, value: v };
    },
    async set(key, value){
      localStorage.setItem("ll_" + key, value);
      return { key, value };
    },
    async delete(key){
      localStorage.removeItem("ll_" + key);
      return { key, deleted: true };
    },
    async list(prefix){
      const keys = [];
      for(let i = 0; i < localStorage.length; i++){
        const k = localStorage.key(i);
        if(k && k.startsWith("ll_")){
          const bare = k.slice(3);
          if(!prefix || bare.startsWith(prefix)) keys.push(bare);
        }
      }
      return { keys };
    }
  };
}
</script>

function countryByName(name){ return COUNTRIES.find(c=>c.name===name); }
function countriesIn(continent){ return COUNTRIES.filter(c=>c.continent===continent); }
function continentOf(name){ const c = countryByName(name); return c ? c.continent : "Europe"; }

// The currency of wherever the character is living, falling back to sterling.
function localCurrency(){
  const c = state ? countryByName(state.currentCountry) : null;
  return c || { name:"England", code:"GBP", sym:"£", rate:1 };
}

// ---------------------------------------------------------------------------
// Writing an amount
// Everything is stored in sterling. money() renders it in the local currency
// when that is switched on, with the sterling equivalent in brackets when
// that is switched on too.
// ---------------------------------------------------------------------------

function formatGbp(n){
  const sign = n < 0 ? "−" : "";
  return sign + "£" + Math.abs(Math.round(n)).toLocaleString();
}

function formatIn(cur, gbpAmount){
  const sign = gbpAmount < 0 ? "−" : "";
  const local = Math.abs(gbpAmount) * (cur.rate || 1);
  // Currencies with huge unit counts are rounded harder so a bank balance
  // doesn't run to eleven digits of false precision.
  let value;
  if(local >= 1000000) value = Math.round(local / 1000) * 1000;
  else value = Math.round(local);
  return sign + (cur.sym || "") + value.toLocaleString();
}

function money(n){
  if(!Number.isFinite(n)) n = 0;
  const cur = localCurrency();
  const useLocal = meta.localCurrency !== false && cur.code !== "GBP";
  if(!useLocal) return formatGbp(n);
  const localText = formatIn(cur, n);
  if(meta.showGbp === false) return localText;
  return `${localText} (${formatGbp(n)})`;
}

// Rewrites any "£123" inside a label into the local currency, for the action
// labels that live in static data and so can't be template literals.
function cur(text){
  if(typeof text !== "string") return text;
  return text.replace(/£([\d,]+)/g, (_, digits)=>money(parseInt(digits.replace(/,/g,""), 10)));
}

// Sterling regardless of the setting — for the few places that need a single
// comparable scale, such as the across-lives records.
function moneyGbp(n){ return formatGbp(n); }

let unlockedAchievements = [];

// Meta-progression that persists across every life you play: total XP, the
// level it buys, a record of past lives, and which difficulty is selected.
let meta = { xp: 0, xpSpent: 0, lives: [], difficulty: "normal", perks: [], museum: null,
             localCurrency: true, showGbp: true };

// XP still to spend. The level comes from the lifetime total, so buying perks
// never demotes you.
function xpAvailable(){ return Math.max(0, (meta.xp || 0) - (meta.xpSpent || 0)); }
function hasPerk(id){ return (meta.perks || []).includes(id); }

async function loadUnlockedAchievements(){
  try{
    const res = await window.storage.get('life_ledger_achievements', false);
    if(res && res.value){ unlockedAchievements = JSON.parse(res.value); }
  }catch(e){ unlockedAchievements = []; }
  try{
    const res2 = await window.storage.get('life_ledger_meta', false);
    if(res2 && res2.value){ meta = Object.assign(meta, JSON.parse(res2.value)); }
  }catch(e){ /* first run — defaults are fine */ }
  render();
}
async function saveUnlockedAchievements(){
  try{ await window.storage.set('life_ledger_achievements', JSON.stringify(unlockedAchievements), false); }catch(e){ /* best effort, ok to fail silently */ }
}
async function saveMeta(){
  try{ await window.storage.set('life_ledger_meta', JSON.stringify(meta), false); }catch(e){ /* best effort */ }
}

function activeScenario(){
  return SCENARIOS.find(s=>s.id === (state.scenarioId||"free")) || SCENARIOS[0];
}

function checkScenarioGoal(){
  const sc = activeScenario();
  if(!sc.goal || state.scenarioDone) return;
  try{
    if(sc.goal.test(state)){
      state.scenarioDone = true;
      meta.xp += 2000;
      saveMeta();
      addLog(`Scenario complete — ${sc.name}: ${sc.goal.desc}. +2,000 XP.`, true);
    }
  }catch(e){ /* a malformed goal must never break the year */ }
}

// ---------- Parenting ----------
// Children have their own stats; now you can actually influence them.

function doParent(childId, kind){
  const ch = state.children.find(x=>x.id===childId);
  if(!ch) return;
  if(usesLeft("parent") <= 0){ addLog("You've given the children what time you have this year."); refreshPeopleSheet(); return; }
  if(kind === "tuition" && state.money < 1200){ addLog("Can't afford private tuition."); refreshPeopleSheet(); return; }
  if(kind === "treat" && state.money < 200){ addLog("Can't afford a treat right now."); refreshPeopleSheet(); return; }
  if(!spendAction("parent")){ refreshPeopleSheet(); return; }
  recordUse("parent");
  ch.bond = ch.bond === undefined ? 50 : ch.bond;
  if(kind === "time"){
    ch.happiness = clamp(ch.happiness + rand(5,12));
    ch.bond = clamp(ch.bond + rand(5,12));
    nudge("happiness", 4);
    addLog(`Spent proper time with ${ch.name}.`);
  } else if(kind === "homework"){
    ch.smarts = clamp((ch.smarts===undefined?50:ch.smarts) + rand(4,9));
    ch.bond = clamp(ch.bond + rand(1,4));
    addLog(`Helped ${ch.name} with schoolwork.`);
  } else if(kind === "tuition"){
    addMoney(-1200);
    ch.smarts = clamp((ch.smarts===undefined?50:ch.smarts) + rand(8,15));
    addLog(`Paid for private tuition for ${ch.name}.`);
  } else if(kind === "treat"){
    addMoney(-200);
    ch.happiness = clamp(ch.happiness + rand(8,15));
    ch.bond = clamp(ch.bond + rand(4,10));
    addLog(`Treated ${ch.name} to something special.`);
  } else if(kind === "discipline"){
    if(Math.random() < 0.5){
      ch.happiness = clamp(ch.happiness - rand(3,8));
      ch.smarts = clamp((ch.smarts===undefined?50:ch.smarts) + rand(2,5));
      ch.bond = clamp(ch.bond - rand(1,5));
      addLog(`Came down firmly on ${ch.name}. They sulked, but took it in.`);
    } else {
      ch.happiness = clamp(ch.happiness - rand(6,14));
      ch.bond = clamp(ch.bond - rand(6,14));
      addLog(`Disciplined ${ch.name}. It did not go well.`);
    }
  }
  refreshPeopleSheet();
}

// ---------- Yearly opportunity card ----------
// One pick from three offers, drawn from what's plausible for your situation.

function buildOpportunities(){
  const pool = [];
  const a = state.age;
  if(a >= 16) pool.push({label:"A cash-in-hand weekend job", run:()=>{ const m=rand(400,1500); payIncome(m,"Weekend work"); }});
  if(a >= 12) pool.push({label:"A friend invites you out", run:()=>{ nudge("happiness", rand(5,12)); { const near = state.friends.filter(isHere); if(near.length) pick(near).closeness += 6; } addLog("A good night out with friends."); }});
  pool.push({label:"Spend the year on self-improvement", run:()=>{ nudge("smarts", rand(3,7)); nudge("health", rand(2,5)); addLog("A quietly productive year."); }});
  if(a >= 18) pool.push({label:"A risky tip from a colleague", run:()=>{
    if(Math.random()<0.45){ const m=rand(2000,15000); addMoney(m); addLog(`The tip paid off — ${money(m)}.`, true); }
    else { const m=Math.min(state.money, rand(500,4000)); addMoney(-m); addLog(`The tip was rubbish — lost ${money(m)}.`); } }});
  if(a >= 14) pool.push({label:"Volunteer locally", run:()=>{ nudgeHidden("karma", 8); nudge("happiness", 5); addLog("Gave some time to a local cause."); }});
  if(a >= 18 && state.career) pool.push({label:"Take on a stretch project at work", run:()=>{ nudgePerformance(rand(8,16)); nudgeHidden("stress", 8); addLog("Took on a stretch project."); }});
  if(a >= 10) pool.push({label:"Throw yourself into a hobby", run:()=>{ nudge("happiness", rand(4,9)); nudge("smarts", rand(1,4)); addLog("Got properly into a hobby this year."); }});
  if(a >= 18) pool.push({label:"Put the year into your health", run:()=>{ nudge("health", rand(6,12)); nudge("looks", rand(2,6)); addLog("A year of looking after yourself."); }});
  // Shuffle and take three distinct offers.
  const picked = [];
  while(picked.length < 3 && pool.length){
    picked.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);
  }
  return picked;
}

function maybeOpportunity(){
  if(state.pendingChoice || state.prisonYearsLeft > 0 || state.age < 8) return;
  if(Math.random() >= 0.3) return;
  const offers = buildOpportunities();
  if(offers.length < 2) return;
  queueChoice({
    title:"An opportunity",
    text:"Something to do with the year ahead. Pick one.",
    options: offers.map(o=>({ label:o.label, effect:o.run })),
  });
}

// ---------- Illness treatment ----------
// Conditions can now actually be treated rather than only screened for.

function treatmentCostFor(cond){
  return cond.severity === "early" ? 800 : 2500;
}
function doTreatCondition(name){
  const cond = state.conditions.find(x=>x.name===name);
  if(!cond) return;
  const cost = treatmentCostFor(cond);
  if(state.money < cost){ addLog(`Treatment for ${name} costs ${money(cost)} — not affordable.`); refreshActivitySheet(); return; }
  if(usesLeft("treat") <= 0){ addLog("One course of treatment a year."); refreshActivitySheet(); return; }
  if(!spendAction("treat")){ refreshActivitySheet(); return; }
  recordUse("treat");
  addMoney(-cost);
  // Early-stage problems respond far better than entrenched ones.
  const chance = cond.severity === "early" ? 0.8 : 0.45;
  if(Math.random() < chance){
    state.conditions = state.conditions.filter(x=>x.name!==name);
    nudge("health", rand(5,12));
    nudge("happiness", 6);
    addLog(`Treatment for ${name} worked — it's cleared up.`, true);
  } else {
    nudge("health", rand(1,4));
    addLog(`Treatment for ${name} helped a little, but it's still with you.`);
  }
  refreshActivitySheet();
}

  if(!c || c.trackId !== "band") return;

  state.career = { kind:"civilian", trackId:"music", rankIndex:rank, yearsInRank:0, training:null };

// Every career now has something that can happen in it. Civilian tracks have
// their own situations; the services draw from a shared pool.
function maybeCareerEvent(){
  if(state.pendingChoice || !state.career || state.career.training) return;
  if(state.prisonYearsLeft > 0) return;
  if(Math.random() >= 0.14) return;

  if(state.career.kind === "forces"){
    queueChoice(tiedToThisJob(pick(FORCES_EVENTS)(state)));
    return;
  }
  const pool = CAREER_EVENT_POOLS[state.career.trackId];
  if(pool){ queueChoice(tiedToThisJob(pick(pool)(state))); return; }
  const build = CAREER_EVENTS[state.career.trackId];
  if(build){ queueChoice(tiedToThisJob(build(state))); return; }

  // A fallback for anything without a bespoke situation, so no career is
  // entirely eventless.
  queueChoice(tiedToThisJob(pick(GENERIC_CAREER_EVENTS)(state)));
}

// A situation at work can wait in the queue behind other decisions, and the
// job can end before it's answered — a dismissal, an arrest, a resignation.
// Answering it then would act on a job you no longer have, so it's answered
// only if it's still the same job.
function tiedToThisJob(choice){
  const job = state.career;
  return Object.assign({}, choice, {
    options: choice.options.map(o=>Object.assign({}, o, {
      effect: ()=>{
        if(state.career !== job){ addLog("By the time you'd decided, that job was behind you."); return; }
        return o.effect();
      },
    })),
  });
}

// ---------- Save / resume ----------
// A life in progress is written to storage after every year so a refresh or a
// closed tab doesn't lose the run. Option callbacks can't be serialised, so a
// pending decision is dropped on save and re-offered naturally next year.

let saveTimer = null;
async function saveCurrentLife(){
  try{
    if(!state || !state.alive){ await window.storage.set('life_ledger_save', "", false); return; }
    const copy = JSON.parse(JSON.stringify(state));
    delete copy.pendingChoice;   // holds functions
    delete copy.choiceQueue;     // same — option callbacks don't serialise
    delete copy.snapshots;       // large, and rebuildable
    await window.storage.set('life_ledger_save', JSON.stringify({ v:1, state:copy }), false);
  }catch(e){ /* saving is best-effort and must never interrupt play */ }
}
function queueSave(){
  if(saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(saveCurrentLife, 400);
}
let savedLife = null;
async function loadSavedLife(){
  try{
    const res = await window.storage.get('life_ledger_save', false);
    if(res && res.value){
      const parsed = JSON.parse(res.value);
      if(parsed && parsed.state && parsed.state.alive) savedLife = parsed.state;
    }
  }catch(e){ savedLife = null; }
  render();
}
function resumeSavedLife(){
  if(!savedLife) return;
  state = savedLife;
  state.snapshots = state.snapshots || [];
  state.pendingChoice = null;
  state.choiceQueue = [];
  savedLife = null;
  addLog("Picked the ledger back up where you left off.");
  render();
}
async function discardSavedLife(){
  savedLife = null;
  try{ await window.storage.set('life_ledger_save', "", false); }catch(e){}
  render();
}

// ---------- Sound & haptics ----------
// Tones are synthesised so there are no asset files to load. Both are opt-out
// and fail silently where unsupported.

let audioCtx = null;
function tone(freq, ms, type, gainVal){
  if(meta.soundOff) return;
  try{
    if(!audioCtx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return;
      audioCtx = new AC();
    }
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type || "sine";
    o.frequency.value = freq;
    g.gain.value = gainVal || 0.05;
    o.connect(g); g.connect(audioCtx.destination);
    const now = audioCtx.currentTime;
    g.gain.setValueAtTime(g.gain.value, now);
    g.gain.exponentialRampToValueAtTime(0.0001, now + ms/1000);
    o.start(now); o.stop(now + ms/1000);
  }catch(e){ /* audio is cosmetic */ }
}
function buzz(pattern){
  if(meta.hapticsOff) return;
  try{ if(navigator && navigator.vibrate) navigator.vibrate(pattern); }catch(e){}
}
const SFX = {

  bad:    ()=>{ tone(220, 180, "sawtooth", 0.04); buzz([25,40,25]); },
  death:  ()=>{ tone(180, 450, "sine", 0.06); buzz([60,80,140]); },
  money:  ()=>{ tone(990, 60, "square", 0.03); setTimeout(()=>tone(1320,70,"square",0.03),60); buzz(15); },

};

// ---------- Levels ----------
// Each level costs a bit more than the last, so early levels come quickly and
// later ones represent real investment across many lives.
function levelFromXp(xp){
  let lvl = 1, need = 500, spent = 0;
  while(xp >= spent + need){ spent += need; lvl++; need = Math.round(need * 1.25); }
  return { level: lvl, into: xp - spent, need };
}

function eraById(id){ return ERAS.find(e=>e.id===id) || ERAS[ERAS.length-1]; }
function currentEra(){ return eraById(state && state.eraId); }

// What a pound was worth, indexed so that 2020 = 1. Applied together to wages,
// house prices and living costs, so the economy behaves the same in real terms
// in every era while the numbers read as period-appropriate.
function moneyIndex(year){
  const pts = [[1940,0.025],[1950,0.035],[1960,0.045],[1970,0.07],[1975,0.12],
               [1980,0.2],[1985,0.27],[1990,0.36],[1995,0.46],[2000,0.55],
               [2005,0.66],[2010,0.78],[2015,0.88],[2020,1.0],[2025,1.22],[2035,1.5],[2050,2.0]];
  if(year <= pts[0][0]) return pts[0][1];
  if(year >= pts[pts.length-1][0]) return pts[pts.length-1][1];
  for(let i=0;i<pts.length-1;i++){
    const [y0,v0] = pts[i], [y1,v1] = pts[i+1];
    if(year >= y0 && year <= y1){
      const t = (year - y0) / (y1 - y0);
      return v0 + (v1 - v0) * t;
    }
  }
  return 1;
}

// The index for the year the character is living through right now.
function priceLevel(){
  if(!state) return 1;
  return moneyIndex(state.year || 2020);
}

// Scales a modern figure into the money of the current year.
function eraMoney(modernAmount){
  return Math.round(modernAmount * priceLevel());
}

// House prices have outrun wages, so property carries its own index on top of
// general inflation — which is what makes buying early a real bet.
function housingIndex(year){
  // Calibrated so that a house costs roughly the real historical multiple of
  // average earnings: about 3.5× in the 1970s, 4× in 2000, 9× today.
  const pts = [[1940,0.0083],[1950,0.0116],[1960,0.0159],[1970,0.0270],[1975,0.0450],
               [1980,0.0795],[1990,0.1788],[2000,0.2428],[2007,0.5470],[2010,0.5596],
               [2015,0.7285],[2020,1.0000],[2025,1.1850],[2035,1.4901],[2050,2.0971]];
  if(year <= pts[0][0]) return pts[0][1];
  if(year >= pts[pts.length-1][0]) return pts[pts.length-1][1];
  for(let i=0;i<pts.length-1;i++){
    const [y0,v0] = pts[i], [y1,v1] = pts[i+1];
    if(year >= y0 && year <= y1){
      const t = (year - y0) / (y1 - y0);
      return v0 + (v1 - v0) * t;
    }
  }
  return 1;
}

  const ev = ERA_EVENTS.find(e=>e.year === state.year);
  if(!ev) return;
  try{ ev.effect(); }catch(e){ /* an era event must never break the year */ }
  addLog(`${state.year}: ${ev.text}`, true);
}

// National service: two years' conscription at 18 for men, for the cohorts it
// applied to. A real constraint on the 1940s and early 50s, and nothing at all
// after that.
function checkConscription(){
  const era = currentEra();
  if(!era.conscription) return false;
  if(state.gender !== "Boy") return false;
  if(state.age !== 18 || state.flags.didNationalService || state.flags.deferredService) return false;
  const force = pick(FORCES);
  queueChoice({
    title: "Your call-up papers",
    text: `It is ${state.year}, you are 18, and national service is compulsory. Two years with ${force.name}, whether you like it or not. There are ways round it, none of them free.`,
    options: [
      { label: `Report for duty with ${force.name}`, effect: ()=>{
          state.flags.didNationalService = true;
          state.careerWarning = null;
          state.servedForces = (state.servedForces || []).concat(force.id);
          state.career = { kind:"forces", trackId:force.id, isOfficer:false, rankIndex:0, yearsInRank:0,
                           deployed:false, deployedYearsLeft:0, conscript:true, conscriptYearsLeft:2, performance:50 };
          nudge("health", rand(3,9));
          nudgeHidden("stress", 6);
          milestone("hired", `Called up for national service with ${force.name}.`);
        }},
      { label: "Apply to defer for study", effect: ()=>{
          if(state.stats.smarts >= 55){
            state.flags.deferredService = true;
            addLog("Deferment granted on educational grounds. You never are called up.", true);
          } else {
            state.flags.didNationalService = true;
            state.careerWarning = null;
            state.servedForces = (state.servedForces || []).concat(force.id);
          state.career = { kind:"forces", trackId:force.id, isOfficer:false, rankIndex:0, yearsInRank:0,
                             deployed:false, deployedYearsLeft:0, conscript:true, conscriptYearsLeft:2, performance:50 };
            addLog(`Deferment refused — smarts ${state.stats.smarts} wasn't enough. Reporting to ${force.name} regardless.`, true);
          }
        }},
      { label: "Register as a conscientious objector", effect: ()=>{
          state.flags.deferredService = true;
          state.flags.objector = true;
          nudgeHidden("karma", 8);
          nudge("happiness", -6);
          if(Math.random() < 0.4){
            state.prisonYearsLeft = 1;
            state.prisonConduct = 60;
            milestone("sentenced", "Refused to serve and were sent to prison for a year for it.");
          } else {
            addLog("Registered as an objector. Non-combatant work instead, and a certain look from the neighbours.", true);
          }
        }},
    ],
  });
  return true;
}

function perkById(id){ return PERKS.find(p=>p.id===id); }
function perksOwned(){ return (meta.perks||[]).length; }
function perkUnlockable(p){
  if(hasPerk(p.id)) return false;
  if(levelFromXp(meta.xp).level < p.level) return false;
  return xpAvailable() >= p.cost;
}

function buyPerk(id){
  const p = perkById(id);
  if(!p) return false;
  if(hasPerk(id)) return false;
  const lvl = levelFromXp(meta.xp).level;
  if(lvl < p.level) return false;
  if(xpAvailable() < p.cost) return false;
  meta.perks = (meta.perks || []).concat(id);
  meta.xpSpent = (meta.xpSpent || 0) + p.cost;
  saveMeta();
  SFX.good();
  return true;
}

// Refunds everything so a different build can be tried — the whole point of a
// tree is being able to change your mind about it.
function respecPerks(){
  meta.perks = [];
  meta.xpSpent = 0;
  saveMeta();
  SFX.tap();
}

// ---------- Life scoring ----------
// Scores a finished life across the things the game actually tracks, so runs
// can be compared against each other rather than just "did you die rich".
function scoreLife(s){
  const nw = netWorth();
  const parts = {
    longevity: Math.round(s.age * 8),
    wealth: Math.max(0, Math.round(Math.min(nw, 5000000) / 2500)),
    happiness: Math.round((s.records.happiness||0) * 4),
    career: s.flags.reachedTopOfLadder ? 400 : 0,
    family: (s.children.length * 120) + (s.flags.everMarried ? 100 : 0),
    bucket: Object.keys(s.bucketList.done).length * 60,
    achievements: (s.newAchievements||[]).length * 150,
    titles: (s.flags.becameMonarch ? 800 : 0) + (s.flags.honoured ? 300 : 0) + (s.flags.heldOffice_pm ? 500 : 0),
    generation: ((s.generation||1) - 1) * 200,
  };
  const total = Math.round(Object.values(parts).reduce((a,b)=>a+b,0) * diff().xpMult);
  return { parts, total };
}

function emptyMuseum(){
  const m = {};
  MUSEUM_SECTIONS.forEach(sec=>{ m[sec.id] = []; });
  return m;
}
function museum(){
  if(!meta.museum) meta.museum = emptyMuseum();
  MUSEUM_SECTIONS.forEach(sec=>{ if(!Array.isArray(meta.museum[sec.id])) meta.museum[sec.id] = []; });
  return meta.museum;
}
// A country goes into its continent's section.
function countrySectionId(name){
  return "countries_" + continentOf(name).replace(/\s+/g,"_").toLowerCase();
}
function museumAddCountry(name){
  if(!name) return;
  museumAdd(countrySectionId(name), name);
}

function museumAdd(sectionId, entryId){
  if(!entryId) return;
  const m = museum();
  if(!m[sectionId].includes(entryId)) m[sectionId].push(entryId);
}
function museumHas(sectionId, entryId){ return museum()[sectionId].includes(entryId); }

function museumSectionProgress(sec){
  const all = sec.all();
  const have = all.filter(e=>museumHas(sec.id, e.id)).length;
  return { have, total: all.length, pct: all.length ? Math.round(have/all.length*100) : 0 };
}
function museumProgress(){
  let have = 0, total = 0;
  MUSEUM_SECTIONS.forEach(sec=>{ const p = museumSectionProgress(sec); have += p.have; total += p.total; });
  return { have, total, pct: total ? Math.round(have/total*100) : 0 };
}

// Reads everything a finished life achieved into the museum.
function recordToMuseum(s){
  // Careers: only the top of a ladder counts as "topped".
  if(s.career && s.flags.reachedTopOfLadder){
    if(s.career.kind === "civilian") museumAdd("careers", s.career.trackId);
    else if(s.career.kind === "forces") museumAdd("forces", s.career.trackId);
  }
  // Any service at all counts for the services section.
  (s.servedForces || []).forEach(id=>museumAdd("forces", id));
  (s.toppedTracks || []).forEach(id=>museumAdd("careers", id));
  Object.keys(s.flags).forEach(f=>{
    const m = /^heldOffice_(.+)$/.exec(f);
    if(m && s.flags[f]) museumAdd("offices", m[1]);
  });
  if(s.degree && s.education === "degree-finished") museumAdd("degrees", s.degree);
  (s.postgradAwards || []).forEach(a=>museumAdd("postgrad", a));
  museumAddCountry(s.birthplace);
  museumAddCountry(s.currentCountry);
  (s.livedCountries || []).forEach(c=>museumAddCountry(c));
  museumAdd("eras", s.eraId);
  // Ribbons are recorded by id, which means looking the name back up.
  if(s.ribbon){
    const r = RIBBONS.find(x=>x.name === s.ribbon);
    if(r) museumAdd("ribbons", r.id);
  }
  if(s.weddingVenue) museumAdd("venues", s.weddingVenue);
  if(s.honeymoon && s.honeymoon !== "none") museumAdd("honeymoons", s.honeymoon);
  (s.prisonJobsDone || []).forEach(j=>museumAdd("prison", j));
  MUSEUM_FEATS.forEach(f=>{
    try{ if(f.test(s)) museumAdd("feats", f.id); }catch(e){ /* a feat test must never break a death */ }
  });
}

function recordFinishedLife(s){
  const score = scoreLife(s);
  meta.xp += score.total;
  meta.lives.push({
    ribbon: s.ribbon || null,
    name: s.name,
    age: s.age,
    netWorth: netWorth(),
    score: score.total,
    generation: s.generation || 1,
    difficulty: meta.difficulty,
    title: titlePrefix() || null,
    cause: s.causeOfDeath,
  });
  // Keep the record from growing without bound.
  if(meta.lives.length > 50) meta.lives = meta.lives.slice(-50);
  saveMeta();
  return score;
}

// One line on what a career field holds, for its row on the Occupation screen.
function categorySummary(cat){
  if(cat === "Armed Forces"){
    const n = forcesAvailable().length;
    return n ? `${n} service${n===1?"":"s"} open to you · ${forcesAvailable().map(f=>f.name).slice(0,2).join(", ")}${n>2?"…":""}` : "No service here takes recruits from your background";
  }
  if(cat === "Entrepreneurship") return `${BUSINESS_TYPES.length} kinds of business to start`;
  if(cat === "Politics"){
    const s = currentSystem();
    return s === "monarchy" ? "The royal court — favour, not elections" : s === "authoritarian" ? "The party — no real elections" : "Parish council to Prime Minister";
  }
  const all = TRACKS.filter(t=>t.category === cat);
  const open = tracksInCategory(cat);
  if(!all.length) return "";
  if(!open.length) return "Nothing in this field exists yet";
  if(open.length === 1){
    const l = open[0].ladder;
    return `${l[0].title} to ${l[l.length-1].title}`;
  }
  const names = open.map(t=>t.name);
  return `${open.length} careers · ${names.slice(0,3).join(", ")}${names.length>3?"…":""}`;
}

// born, or where you've since settled. Emigrating therefore opens up a
// different set of services.
function forcesAvailable(){
  if(typeof state === "undefined" || !state) return FORCES;
  const nations = new Set([
    forceNationFor(state.birthplace),
    forceNationFor(state.currentCountry),
    ...((state.livedCountries || []).map(forceNationFor)),
  ]);
  return FORCES.filter(f=>nations.has(f.country));
}

  if(typeof state === "undefined" || !state) return "";
  const here = forceNationFor(state.currentCountry);
  const born = forceNationFor(state.birthplace);
  const where = born !== here ? `${here} or ${born}` : here;
  return `You can only enlist in the forces of ${where}. Settle in another country to open up its services.`;

function trackExistsYet(track){
  const from = TRACK_FROM_YEAR[track.id];
  if(!from) return true;
  return (state ? (state.year || 2020) : 2020) >= from;

// Why a career isn't on the list yet, for the Occupation screen.
function trackEraNote(track){
  const from = TRACK_FROM_YEAR[track.id];
  if(!from || trackExistsYet(track)) return "";
  return `Doesn't exist yet — not until about ${from}.`;
}

// A track's smarts requirement, after any perk that lowers it.
function effectiveMinSmarts(track){
  let min = track.minSmarts;
  if(track.perkMinSmarts){
    Object.entries(track.perkMinSmarts).forEach(([perk, lowered])=>{
      if(hasPerk(perk)) min = Math.min(min, lowered);
    });
  }
  return min;
}

function tracksInCategory(cat){ return TRACKS.filter(t=>t.category===cat && trackExistsYet(t)); }

function officeById(id){ return POLITICAL_OFFICES.find(o=>o.id===id) || null; }

// What kind of state you're living in. Everywhere not named is an elected one.
function governmentOf(countryName){
  return GOVERNMENT_BY_COUNTRY[countryName] || "democracy";
}
function currentSystem(){
  return governmentOf(state && state.currentCountry ? state.currentCountry : "England");
}

// Only one ladder is open at a time: emigrating is how you change which.
function officesAvailable(){
  const sys = currentSystem();
  return POLITICAL_OFFICES.filter(o=>o.system === sys);
}

// How power is described where you are, for the screens.
const SYSTEM_NOTES = {
  democracy: "Elections aren't guaranteed — losing a campaign burns the money with nothing to show for it. Smarts, fame and karma all improve your odds.",
  monarchy: "There are no elections here. You rise by royal favour, and the throne itself passes by blood — unless you take it.",
  authoritarian: "There are no real elections here. You rise through the party, and falling out of favour is answered with a cell rather than a by-election.",
};
function systemNote(){ return SYSTEM_NOTES[currentSystem()] || SYSTEM_NOTES.democracy; }
function systemLabel(){
  const s = currentSystem();
  return s === "monarchy" ? "the royal court" : s === "authoritarian" ? "the party" : "the ballot box";
}

// In an elected system this is the vote. In the others it is the chance of
// being picked, which turns on standing rather than popularity.
function electionWinChance(office){
  const base = currentSystem() === "democracy"
    ? 0.3 + state.stats.smarts/300 + (state.hidden.fame||0)/300 + state.hidden.karma/300
    // Patronage: brains and visibility still help, but so does being useful to
    // the people above you, and scruples do not.
    : 0.26 + state.stats.smarts/260 + (state.hidden.fame||0)/400 + (100 - state.hidden.karma)/500;
  // Each rung is harder than the last, so an eleven-step ladder is a career
  // rather than a formality.
  const rung = office && office.requiresPrevious ? ladderIndexOf(office) : 0;
  return clamp(base - rung * 0.062, 0.85, 0.05);
}

// How long you have to have held the post below before anyone will move you
// up from it, and how well you have to be doing.
function minYearsForRung(rung){ return 2 + Math.floor(rung / 3); }
function minApprovalForRung(rung){ return Math.min(80, 48 + rung * 3); }

function ladderIndexOf(office){
  const ladder = POLITICAL_OFFICES.filter(o=>o.system === office.system);
  return Math.max(0, ladder.findIndex(o=>o.id === office.id));
}

// The throne is inherited. Anyone else who wants it has to take it.
function canInheritThrone(){
  const rank = NOBILITY_RANKS.find(r=>r.id===state.nobility);
  return !!(rank && rank.canInheritThrone);
}

function runForOffice(officeId){
  const office = officeById(officeId);
  if(!office) return;
  if(office.system !== currentSystem()){
    addLog(`${office.title} isn't an office that exists in ${state.currentCountry}.`);
    refreshCareerSheet(); return;
  }
  if(state.career || state.business){
    addLog("Can't run a campaign while holding down a regular job or business — quit or sell first.");
    refreshCareerSheet(); return;
  }
  if(state.politics){
    const current = officeById(state.politics.officeId);
    if(!current || office.requiresPrevious !== current.id){
      addLog(`You're already ${current ? current.title : "in office"} — the only move from here is the next rung up.`);
      refreshCareerSheet(); return;
    }
    if(usesLeft("promo") <= 0){ addLog("You've already pushed for advancement this year."); refreshCareerSheet(); return; }
    const rung = ladderIndexOf(office);
    const needYears = minYearsForRung(rung), needApproval = minApprovalForRung(rung);
    const served = state.politics.yearsServed || state.politics.yearsInOffice || 0;
    if(served < needYears){
      addLog(`You've been ${current.title} for ${served} year${served===1?"":"s"}. Nobody moves up from there inside ${needYears}.`);
      refreshCareerSheet(); return;
    }
    if(politicalApproval() < needApproval){
      addLog(`${office.title} needs a record of ${needApproval}%+ behind it — you're on ${politicalApproval()}%.`);
      refreshCareerSheet(); return;
    }
    if(!spendAction("promo")){ refreshCareerSheet(); return; }
    recordUse("promo");
    if(office.id === "monarch" && !canInheritThrone()){
      if(state.flags.stagedCoup){ addLog("You have moved against the throne once already."); refreshCareerSheet(); return; }
      openCoupChoice(office); return;
    }
    if(state.stats.smarts < office.minSmarts){
      addLog(`Not seen as credible enough for ${office.title} yet.`); refreshCareerSheet(); return;
    }
    if(state.money < office.campaignCost){
      addLog(`Not enough money behind a move for ${office.title}.`); refreshCareerSheet(); return;
    }
    addMoney(-office.campaignCost);
    // Standing in the post you hold is what carries you up.
    const lift = (politicalApproval() - 50) / 150;
    if(Math.random() < clamp01(electionWinChance(office) + lift)){
      takeOffice(office);
    } else {
      nudgeApproval(-rand(3, 8));
      addLog(office.appointed
        ? `Passed over for ${office.title}. You stay where you are.`
        : `The move for ${office.title} came to nothing. You stay where you are.`);
    }
    refreshCareerSheet();
    return;
  }
  // A throne is not applied for. You are born to it, or you seize it — and
  // seizing it is precisely not waiting your turn, so this comes before the
  // question of which post you held last.
  if(office.id === "monarch" && !canInheritThrone()){
    if(state.flags.stagedCoup){
      addLog("You have moved against the throne once already. Nobody will follow you a second time.");
      refreshCareerSheet(); return;
    }
    openCoupChoice(office);
    return;
  }
  if(office.requiresPrevious && !state.flags["heldOffice_"+office.requiresPrevious]){
    addLog(`Need to have served as ${officeById(office.requiresPrevious).title} first.`);
    refreshCareerSheet(); return;
  }
  if(state.stats.smarts < office.minSmarts){
    addLog(`Not seen as credible enough yet to run for ${office.title}.`); refreshCareerSheet(); return;
  }
  if(state.money < office.campaignCost){
    addLog(`Not enough money to fund a campaign for ${office.title}.`); refreshCareerSheet(); return;
  }
  addMoney(-office.campaignCost);
  if(Math.random() < electionWinChance(office)){
    takeOffice(office);
  } else if(office.appointed){
    addLog(`Passed over for ${office.title}. Somebody else was the safer choice.`);
    nudge("happiness", -5);
  } else {
    addLog(`Lost the election for ${office.title}. The campaign funds are gone.`);
  }
  refreshCareerSheet();
}

function takeOffice(office){
  // A new post, a new record to build: the standing that got you here belongs
  // to the job you just left.
  state.politics = { officeId: office.id, yearsInOffice:0, yearsServed:0, approval: rand(42, 56) };
  state.flags["heldOffice_"+office.id] = true;
  if(office.id === "monarch"){
    state.flags.becameMonarch = true;
    milestone("hired", `Crowned ${state.gender==="Boy" ? "King" : "Queen"}.`);
  } else if(office.id === "supreme_leader"){
    milestone("hired", `Confirmed as Supreme Leader. There is no term limit.`);
  } else if(office.appointed){
    milestone("hired", `Appointed ${office.title}.`);
  } else {
    milestone("hired", `Won the election — sworn in as ${office.title}.`);
  }
}

// Taking a throne you have no claim to. It works or it does not, and it does
// not half-work.
function openCoupChoice(office){
  closeSheet();
  const chance = clamp(0.06 + state.stats.smarts/500 + (state.hidden.fame||0)/400
    + (state.flags["heldOffice_chief_of_court"] ? 0.12 : 0)
    + (state.flags["heldOffice_heir"] ? 0.20 : 0), 0.40, 0.03);
  queueChoice({
    title: "Take the throne?",
    text: `You have no claim by blood. Taking the crown means taking it — the court, the guard, and whoever else can be bought. Roughly ${Math.round(chance*100)}% of plots like yours succeed. The rest end at the end of a rope.`,
    options: [
      { label: "Move against the Sovereign", effect: ()=>{
          state.flags.stagedCoup = true;
          if(Math.random() < chance){
            takeOffice(office);
            nudgeHidden("karma", -20);
            nudgeHidden("fame", 30);
          } else {
            state.flags.criminalRecord = true;
            state.politics = null;
            if(Math.random() < 0.45){
              die("executed for treason");
            } else {
              state.prisonYearsLeft = rand(12, 30);
              state.career = null;
              state.paroleEligible = false;
              milestone("sentenced", `The plot failed. Convicted of treason — ${state.prisonYearsLeft} years.`);
            }
          }
        }},
      { label: "Think better of it", effect: ()=>{ nudge("happiness", -2); addLog("Decided to live instead."); } },
    ],
  });
}

// An office-holder's performance is their approval rating, and it behaves the
// way the job's performance stat does elsewhere: you push it up by grafting,
// let it slide by coasting, and it decides whether you keep the seat.
function politicalApproval(){
  const p = state.politics;
  if(!p) return 0;
  if(p.approval === undefined) p.approval = 50;
  return p.approval;
}
function nudgeApproval(d){
  const p = state.politics;
  if(!p) return;
  p.approval = clamp(politicalApproval() + d);
}

// Work harder (+1) or coast (-1) in office — the political equivalent of
// doWorkHarder / doSlackOff, which route here when you hold office.
function doPoliticalEffort(dir){
  if(!state.politics){ refreshCareerSheet(); return; }
  if(!spendAction("work")){ refreshCareerSheet(); return; }
  if(usesLeft("work") <= 0){ addLog("You've set your pace for this year."); refreshCareerSheet(); return; }
  recordUse("work");
  const office = officeById(state.politics.officeId);
  if(dir > 0){
    nudgeApproval(rand(7,15));
    nudgeHidden("stress", rand(6,12));
    nudge("happiness", -3);
    nudgeHidden("fame", rand(1,4));
    addLog(`Worked the constituency hard as ${office.title} — approval now ${politicalApproval()}%.`);
  } else {
    nudgeApproval(-rand(8,16));
    nudgeHidden("stress", -rand(6,12));
    nudge("happiness", 5);
    addLog(`Coasted in office this year — approval now ${politicalApproval()}%.`);
  }
  refreshCareerSheet();
}

// Resign the seat. Immediate, and it leaves a mark.
function resignOffice(){
  if(!state.politics){ refreshCareerSheet(); return; }
  const office = officeById(state.politics.officeId);
  closeSheet();
  queueChoice({
    title: `Resign as ${office.title}?`,
    text: `Standing down mid-term ends the job at once. It tends to be remembered.`,
    options: [
      { label: "Resign the seat", effect: ()=>{
          state.politics = null;
          nudge("happiness", -6);
          nudgeHidden("fame", -5);
          state.flags.resignedOffice = true;
          addLog(`Resigned as ${office.title}.`, true);
        }},
      { label: "Stay in post", effect: ()=>{ addLog("Decided to see out the term."); } },
    ],
  });
}

function runPoliticsYear(){
  const p = state.politics;
  if(!p) return;
  const office = officeById(p.officeId);
  if(!office){ state.politics = null; return; }
  if(p.approval === undefined) p.approval = 50;
  payIncome(office.salary, `Salary as ${office.title}`);
  state.pension += Math.round(office.salary*0.08);
  nudgeHidden("fame", rand(2,6));
  nudgeHidden("stress", 3);
  p.yearsInOffice += 1;
  p.yearsServed = (p.yearsServed || 0) + 1;

  // Approval drifts towards the middle on its own, pulled by how you're seen.
  const drift = Math.round((state.hidden.karma - 50)/25) + rand(-4, 3);
  nudgeApproval(drift);

  // A collapse in standing brings pressure to go. What that means depends
  // entirely on who you answer to.
  if(p.approval < PERFORMANCE_WARNING){
    if(!p.warned){
      p.warned = true;
      nudgeHidden("stress", 12);
      addLog(office.system === "democracy"
        ? `Approval has fallen to ${p.approval}% as ${office.title}. The party has made it clear you need to turn it round.`
        : office.system === "monarchy"
          ? `You have fallen to ${p.approval}% in the Sovereign's favour as ${office.title}. The court has noticed.`
          : `Your standing in the party has fallen to ${p.approval}% as ${office.title}. People are being asked about your loyalty.`, true);
    } else if(p.approval < PERFORMANCE_DISMISSAL || Math.random() < 0.5){
      nudge("happiness", -12);
      const wasTitle = office.title;
      state.politics = null;
      state.flags.deselected = true;
      if(office.system === "democracy"){
        addLog(`Deselected as ${wasTitle} — approval never recovered (${p.approval}%).`, true);
      } else if(office.system === "monarchy"){
        addLog(`Dismissed from the court as ${wasTitle}, and told not to return.`, true);
        nudgeHidden("fame", -8);
      } else {
        // Purged rather than voted out: the party does not retire people.
        if(Math.random() < 0.5){
          state.flags.criminalRecord = true;
          state.prisonYearsLeft = (state.prisonYearsLeft||0) + rand(3, 12);
          state.career = null;
          state.paroleEligible = false;
          milestone("sentenced", `Purged as ${wasTitle}. Convicted of corruption — ${state.prisonYearsLeft} years.`);
        } else {
          addLog(`Quietly removed as ${wasTitle} and given a post nobody wants.`, true);
          nudgeHidden("fame", -12);
        }
      }
      return;
    }
  } else if(p.warned){
    p.warned = false;
    addLog(office.system === "democracy"
      ? `Approval back up to ${p.approval}% — the party is off your back.`
      : `Back up to ${p.approval}% — the questions have stopped.`, true);
  }

  // A sovereign reigns and a supreme leader rules until they die, so there is
  // no term to come to an end.
  if(office.termYears >= 99) return;

  if(p.yearsInOffice >= office.termYears){
    // Approval now carries real weight at the ballot box.
    const chance = clamp01(electionWinChance(office) * (0.5 + p.approval/100));
    if(Math.random() < chance){
      p.yearsInOffice = 0;
      addLog(office.system === "democracy"
        ? `Re-elected as ${office.title} for another term on ${p.approval}% approval.`
        : `Reappointed as ${office.title} for another term on ${p.approval}% standing.`, true);
    } else {
      addLog(office.system === "democracy"
        ? `Voted out after serving as ${office.title} — ${p.approval}% approval wasn't enough.`
        : `Not reappointed as ${office.title} — ${p.approval}% standing wasn't enough.`, true);
      nudge("happiness",-8);
      state.politics = null;
    }
  }
}


// ---------- Starting your own business — a different beast from the job ladders above:
// no fixed salary, no application. You sink money in, and each year is a roll
// of revenue against overheads, with a real chance of the whole thing going
// under. Running a business is mutually exclusive with a normal career.

const BUSINESS_TYPES = [
  {id:"shop", name:"Retail Shop", startCost:15000, minSmarts:20, baseRevenue:[5000,20000], failChanceBase:0.15},
  {id:"restaurant", name:"Restaurant", startCost:40000, minSmarts:30, baseRevenue:[10000,50000], failChanceBase:0.22},
  {id:"tech_startup", name:"Tech Startup", startCost:20000, minSmarts:60, baseRevenue:[0,200000], failChanceBase:0.3},
  {id:"consultancy", name:"Consultancy", startCost:5000, minSmarts:50, baseRevenue:[10000,60000], failChanceBase:0.1},
  {id:"online_store", name:"Online Store", startCost:3000, minSmarts:35, baseRevenue:[2000,30000], failChanceBase:0.18},
];

function startBusiness(typeId){
  const def = BUSINESS_TYPES.find(t=>t.id===typeId);
  if(!def) return;
  if(state.politics){ addLog("Can't start a business while holding political office."); closeSheet(); render(); return; }
  if(state.stats.smarts < def.minSmarts){ addLog(`Not sharp enough yet to make a go of a ${def.name.toLowerCase()}.`); closeSheet(); render(); return; }
  if(state.money < def.startCost){ addLog(`Not enough money to start a ${def.name.toLowerCase()}.`); closeSheet(); render(); return; }
  if(state.career){
    addLog("Left the day job to focus on the new business full-time.");
    state.career = null;
  }
  addMoney(-def.startCost);
  state.business = { typeId, name: `${(state.name||"Your").split(" ")[0]}'s ${def.name}`, employees:0, yearsRunning:0, valuation:def.startCost, lastProfit:0 };
  addLog(`Started ${state.business.name} with a ${money(def.startCost)} investment.`, true);
  closeSheet();
  render();
}

function hireEmployee(){
  if(!state.business) return;
  const cost = 2000;
  if(state.money < cost){ addLog("Not enough money to hire anyone right now."); refreshCareerSheet(); return; }
  addMoney(-cost);
  state.business.employees += 1;
  addLog(`Hired another employee at ${state.business.name}.`);
  refreshCareerSheet();
}

function sellBusiness(){
  if(!state.business) return;
  const payout = state.business.valuation;
  addMoney(payout);
  addLog(`Sold ${state.business.name} for ${money(payout)}.`, true);
  if(payout >= 500000) state.flags.bigExit = true;
  state.business = null;
  refreshCareerSheet();
}

// Civilian jobs can be walked away from immediately; military service needs a
// year's notice before you're actually discharged.
function quitJob(){
  state.careerWarning = null;
  const c = state.career;
  if(!c) return;
  if(c.kind === "forces"){
    if(c.resigning) return;
    c.resigning = true;
    c.resignYearsLeft = 1;
    addLog("Handed in your notice — one more year of service before you're discharged.", true);
  } else {
    const track = TRACKS.find(t=>t.id===c.trackId);
    if(track.criminal && !c.training){
      leaveCrimeCareer(track, c);
      refreshCareerSheet();
      return;
    }
    const label = c.training ? `training for ${track.name}` : `the job as a ${track.ladder[c.rankIndex].title}`;
    state.career = null;
    addLog(`Quit ${label} on the spot.`, true);
  }
  refreshCareerSheet();
}

// Nobody just hands in their notice. The higher you are, the more you know,
// and the less they like you walking away with it.
function leaveCrimeCareer(track, c){
  const rank = c.rankIndex;
  const title = track.ladder[rank].title;
  state.career = null;
  state.careerWarning = null;
  const killed = rank >= 7 && Math.random() < 0.1;
  if(killed){ die("killed for knowing too much"); return; }
  if(Math.random() < 0.25 + rank * 0.04){
    nudge("health", -rand(15, 30));
    startRecovery(1);
    addLog(`Walked away from it as ${aOrAn(title)} ${title}. They made sure it hurt — you're out, but badly beaten.`, true);
  } else {
    nudge("happiness", 6);
    addLog(`Walked away from it as ${aOrAn(title)} ${title}, and nobody came after you.`, true);
  }
}

function runBusinessYear(){
  const b = state.business;
  if(!b) return;
  const def = BUSINESS_TYPES.find(t=>t.id===b.typeId);
  b.yearsRunning += 1;
  const luckFactor = 0.5 + Math.random()*1.2;
  const smartsFactor = (0.7 + state.stats.smarts/150) * ((state.postgradAwards||[]).includes("MBA") ? 1.1 : 1);
  const employeeFactor = 1 + b.employees*0.4;
  let revenue = Math.round(def.baseRevenue[0] + (def.baseRevenue[1]-def.baseRevenue[0]) * Math.random());
  revenue = Math.round(revenue * smartsFactor * employeeFactor * luckFactor * (state.emigrationMultipliers.salaryMult||1));
  const wageExpense = b.employees * 18000;
  const overhead = Math.round(def.startCost * 0.05);
  const profit = revenue - wageExpense - overhead;
  if(profit > 0){
    const tax = taxOnTop(profit);
    addMoney(profit - tax);
    recordIncome(profit);
    addLog(`${b.name}: profit ${money(profit)}, ${money(profit-tax)} after ${money(tax)} tax.`);
  } else {
    addMoney(profit);
    state.lastIncome = 0;
  }
  b.lastProfit = profit;
  b.valuation = Math.max(0, Math.round((b.valuation||def.startCost) * 0.6 + Math.max(profit,0)*2*0.4));
  addLog(`${b.name}: revenue ${money(revenue)}, profit ${money(profit)} this year.`);
  nudgeHidden("stress", 3);

  let failChance = Math.max(0.02, def.failChanceBase - b.yearsRunning*0.01);
  if(profit < 0) failChance += 0.1;
  if(Math.random() < failChance){
    addLog(`${b.name} went under after ${b.yearsRunning} year${b.yearsRunning===1?"":"s"}. The doors close for good.`, true);
    state.business = null;
    nudge("happiness", -12);
    state.creditScore = clamp((state.creditScore||60) - 10, 100, 0);
  }
}

const PET_TYPES = [
  {id:"dog", name:"Dog", cost:200, upkeep:300, maxAge:13},

function doAdoptPet(typeId){
  if(!spendAction("pet")){ refreshActivitySheet(); return; }
  const def = PET_TYPES.find(p=>p.id===typeId);
  if(!def) return;
  if(state.pets.length >= 3){ addLog("Already got your hands full with the pets you have."); refreshActivitySheet(); return; }
  if(state.money < def.cost){ addLog(`Not enough money to adopt a ${def.name.toLowerCase()}.`); refreshActivitySheet(); return; }
  addMoney(-def.cost);
  state.pets.push({ id: personIdCounter++, typeId, name: pick(["Biscuit","Max","Luna","Charlie","Bella","Rocky","Milo","Daisy","Oscar","Nala"]), age:0, alive:true });
  state.bucketList.everHadPet = true;
  commitAction();
  addLog(`Adopted a ${def.name.toLowerCase()}.`, true);
  refreshActivitySheet();
}

function agePets(){
  state.pets.forEach(p=>{
    if(!p.alive) return;
    const def = PET_TYPES.find(d=>d.id===p.typeId);
    p.age += 1;
    nudge("happiness", 2);
    const deathChanceForPet = p.age >= def.maxAge ? 0.25 : 0.01;
    if(Math.random() < deathChanceForPet){
      p.alive = false;
      addLog(`${p.name} passed away of old age.`, true);
      recordLate({ kind:"pet", name:p.name, relation: def.name, ageAtDeath:p.age, cause:"old age" });
      nudge("happiness", -10);
    } else if(Math.random() < 0.05){
      addLog(`${p.name} needed an emergency vet visit.`);
      addMoney(-rand(100,400));
    }
  });
  state.pets = state.pets.filter(p=>p.alive);
}

function doPetShow(petId){
  if(!spendAction("petshow")){ refreshActivitySheet(); return; }
  const p = state.pets.find(x=>x.id===petId);
  if(!p) return;
  if(usesLeft("petshow") <= 0){ addLog("Only so many shows on the circuit each year."); refreshActivitySheet(); return; }
  const entryFee = 50;
  if(state.money < entryFee){ addLog("Not enough money for the entry fee."); refreshActivitySheet(); return; }
  recordUse("petshow");
  addMoney(-entryFee);
  if(Math.random() < 0.3){
    const prize = rand(200,1000);
    addMoney(prize);
    nudge("happiness",6);
    addLog(`${p.name} won a prize at the pet show: ${money(prize)}!`, true);
  } else {
    addLog(`${p.name} didn't place at the pet show, but had fun.`);
  }
  refreshActivitySheet();
}

// ---------- Rare / legendary events ----------

function maybeNaturalDisaster(){
  const damageable = state.assets.filter(a=>["property","car","motorcycle","boat"].includes(a.type));
  if(damageable.length === 0) return;
  if(Math.random() >= 0.02) return;
  const asset = pick(damageable);
  const disaster = pick(["a house fire","severe flooding","a storm","a burst pipe"]);
  const insured = !!state.lifeInsurance; // a proxy for holding sensible cover generally
  const severity = Math.random();
  if(severity < 0.15){
    // Total loss
    const lost = asset.value;
    state.assets = state.assets.filter(a=>a!==asset);
    nudge("happiness", -15);
    if(insured){
      const payout = Math.round(lost * 0.7);
      addMoney(payout);
      addLog(`${disaster.charAt(0).toUpperCase()+disaster.slice(1)} destroyed ${asset.name} completely. Insurance covered ${money(payout)} of the ${money(lost)} loss.`, true);
    } else {
      addLog(`${disaster.charAt(0).toUpperCase()+disaster.slice(1)} destroyed ${asset.name} completely — an uninsured loss of ${money(lost)}.`, true);
    }
  } else {
    // Partial damage
    const damage = Math.round(asset.value * (0.1 + Math.random()*0.3));
    asset.value = Math.max(0, asset.value - damage);
    nudge("happiness", -6);
    if(insured){
      const payout = Math.round(damage * 0.7);
      addMoney(payout);
      addLog(`${disaster.charAt(0).toUpperCase()+disaster.slice(1)} damaged ${asset.name} — ${money(damage)} of damage, ${money(payout)} covered by insurance.`, true);
    } else {
      addLog(`${disaster.charAt(0).toUpperCase()+disaster.slice(1)} damaged ${asset.name} — ${money(damage)} knocked off its value, uninsured.`, true);
    }
  }
}

// ---------- Life stage ----------

function stage(age){
  if(age < 5) return "infant";
  if(age < 13) return "child";
  if(age < 18) return "teen";
  if(age < 65) return "adult";
  return "elder";
}

function checkStageTransition(){
  const prev = stage(state.age - 1);
  const now = stage(state.age);
  if(prev === now) return;
  const labels = { child:"Started school as a child.", teen:"Entered the teenage years.", adult:"Became an adult.", elder:"Reached retirement age." };
  if(labels[now]) addLog(labels[now], true);
}

// year — most importantly, there's only so much part-time work a school-age
// kid can realistically fit in around lessons.
const MAX_USES_PER_YEAR = { partjob: 1, hustle: 2, dating: 1, tryforbaby: 1, argument: 2, getaway: 1, intimacy: 3, onenight: 2, propose: 1, vote: 1, adopt: 1, ivf: 1, cosmetic: 1, bbcomp: 1, holiday: 1, lottery: 10, petshow: 2, crime: 3, work: 1, raise: 1, promo: 1, school: 1, social: 3, parole: 1, substance: 2, rehab: 1, postgrad: 1, careeract: 1, gig: 2, parttime: 1, parent: 2, treat: 1, vehicle: 2, race: 1, reconcile: 1, spy: 1, anniversary: 1, vows: 1, counsel: 1, petplay: 2 };

function usesLeft(id){
  let cap = MAX_USES_PER_YEAR[id];
  if(cap === undefined) return Infinity;
  if(id === "social" && hasPerk("well_liked")) cap += 1;
  return cap - (state.yearlyActivityUses[id] || 0);
}
function recordUse(id){
  state.yearlyActivityUses[id] = (state.yearlyActivityUses[id] || 0) + 1;
  commitAction();
}

// ---------- Action budget ----------
// A year only holds so much. Anything that meaningfully advances your life
// costs one action, which forces real trade-offs instead of letting you do
// everything every year. Trivial or passive things (voting, buying a lottery
// ticket, checking a menu) are deliberately free.
const FREE_ACTIONS = new Set(["vote","lottery","estate","social","anniversary","petplay"]);

function actionsPerYear(){
  let n = 3;
  if(state.age < 13) n = 2;                       // a child's year is narrower
  if(state.age >= 18 && state.age < 66) n = 3;
  if(state.age >= 66) n = 4;                      // retirement frees up time
  if(state.hidden.energy > 75) n += 1;            // high energy buys a little more
  if(state.hidden.energy < 25) n -= 1;            // exhaustion costs you
  if(state.recoveryYearsLeft > 0) n -= 1;         // recovering from injury
  return Math.max(1, n);
}
function actionsLeft(){
  return actionsPerYear() - (state.actionsUsed || 0);
}
// Checked at the top of an action: is there time left this year? This only
// *checks* — the budget is spent later, once the attempt actually succeeds, so
// a rejected attempt (no money, too young) never costs you a year's action.
function spendAction(id){
  if(FREE_ACTIONS.has(id)) return true;
  if(actionsLeft() <= 0){
    addLog("No time left this year — age up to get a fresh start.");
    return false;
  }
  state.pendingActionId = id;
  return true;
}
// Commits the action the current handler reserved. Called from recordUse, and
// explicitly by the few actions that don't use the per-year use counter.
function commitAction(){
  if(state.pendingActionId === undefined || state.pendingActionId === null) return;
  if(!FREE_ACTIONS.has(state.pendingActionId)){
    state.actionsUsed = (state.actionsUsed || 0) + 1;
  }
  state.pendingActionId = null;
}

// Gang membership: steadier illicit income and better crime odds, but a

function doJoinGang(){
  if(state.gang){ addLog("Already running with a crew."); refreshActivitySheet(); return; }

function runGangYear(){
  const g = state.gang;
  if(!g || state.prisonYearsLeft > 0) return;
  g.yearsIn += 1;
  const cut = rand(1000, 6000) * (g.rank === "Lieutenant" ? 2 : 1);
  addMoney(cut);
  addLog(`Your cut from ${g.name} this year: ${money(cut)}.`);
  nudgeHidden("karma", -3);
  nudgeHidden("stress", 4);

  if(g.rank === "Associate" && g.yearsIn >= 3 && Math.random() < 0.3){
    g.rank = "Lieutenant";
    addLog(`Promoted to Lieutenant in ${g.name}.`, true);
  }
  if(Math.random() < 0.12){
    nudge("health", -rand(10,30));
    addLog(`Caught up in violence running with ${g.name}.`, true);
    if(Math.random() < 0.3) startRecovery(1);
  }
  if(Math.random() < 0.1){
    state.flags.criminalRecord = true;
    const years = rand(2,6);
    state.prisonYearsLeft = (state.prisonYearsLeft||0) + years;
    state.career = null;
    addLog(`Picked up by police in a raid on ${g.name} — ${years} years inside.`, true);
  }
}

function doCrime(id){
  if(!spendAction("crime")){ refreshActivitySheet(); return; }
  const def = CRIMES.find(c=>c.id===id);
  if(!def) return;
  if(state.age < def.minAge){ addLog(`Too young for that particular crime.`); refreshActivitySheet(); return; }
  // Only so many jobs a year before you draw attention — and each one after
  // the first makes the next riskier, so spamming petty crime isn't free money.
  if(usesLeft("crime") <= 0){ addLog("Laying low — you've pushed your luck enough this year."); refreshActivitySheet(); return; }
  const priorJobs = state.yearlyActivityUses.crime || 0;
  recordUse("crime");
  // Gang backing improves the odds; a violent crime while gang-affiliated draws a longer sentence.
  let catchChance = state.gang ? def.catchChance * 0.8 : def.catchChance;
  catchChance = Math.min(0.95, catchChance + priorJobs * 0.15);
  const reward = rand(def.reward[0], def.reward[1]);
  if(Math.random() >= catchChance){
    addMoney(reward);
    addLog(`Got away with it: ${def.label.toLowerCase()} nets ${money(reward)}.`);
  } else {
    closeSheet();
    beginArrest(def, reward);
    return;
  }
  refreshActivitySheet();
}

function checkChallenges(s){
  meta.challengesDone = meta.challengesDone || [];
  const newly = CHALLENGES.filter(ch=>{
    if(meta.challengesDone.includes(ch.id)) return false;
    try{ return ch.test(s); }catch(e){ return false; }
  });
  newly.forEach(ch=>{
    meta.challengesDone.push(ch.id);
    meta.xp += ch.xp;
  });
  if(newly.length) saveMeta();
  return newly;
}

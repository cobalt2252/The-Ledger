              ${(c.ownChildren||[]).length ? `<span class="req-line">Brings ${c.ownChildren.length} child${c.ownChildren.length===1?"":"ren"} of their own: ${c.ownChildren.map(gk=>`${gk.name} (${gk.age})`).join(", ")}</span>` : ""}
              <button class="small" data-heir="${c.id}">Continue as ${c.name}</button>
            </div>
          `).join("")}
        ` : ""}
        ${(state.snapshots||[]).length && !isHardcore() ? `<button style="width:100%;margin-top:10px;" id="timeMachineBtn">⏳ Time Machine — rewind and try again</button>` : ""}
        <button class="primary" style="width:100%;margin-top:10px;" id="newLifeBtn">Open a new ledger</button>
      </div>
    `;
  }

  app.innerHTML = html;

  app.querySelectorAll("[data-notif]").forEach(b=>{
    b.addEventListener("click", ()=>dismissNotification(parseInt(b.dataset.notif,10)));
  });
  const ncb = document.getElementById("notifClearBtn");
  if(ncb) ncb.addEventListener("click", clearNotifications);

  if(!state.alive){
    document.getElementById("newLifeBtn").addEventListener("click", ()=>{ state=null; appScreen="home"; render(); });
    const tmBtn = document.getElementById("timeMachineBtn"); if(tmBtn) tmBtn.addEventListener("click", openTimeMachine);
    app.querySelectorAll("[data-heir]").forEach(btn=>{
      btn.addEventListener("click", ()=>startAsChild(parseInt(btn.dataset.heir,10)));
    });
  }

  // Stat bars live under the nav bar, coloured by level (not by which stat),
  // with a warning triangle on anything in danger.
  const STAT_META = { health:{ic:"❤️",label:"Health"}, happiness:{ic:"😀",label:"Happiness"},
                      smarts:{ic:"🧠",label:"Smarts"}, looks:{ic:"✨",label:"Looks"} };
  const statsHtml = `
    <div class="statsbar">
      ${["happiness","health","smarts","looks"].map(k=>{
        const v = state.stats[k];
        const col = v<=25 ? "var(--red)" : (v<=50 ? "var(--orange)" : "var(--green)");
        const d = state.yearReview && state.yearReview.deltas ? state.yearReview.deltas[k] : 0;
        return `<div class="statline">
          <span class="nm">${STAT_META[k].label}</span>
          <span class="ic">${STAT_META[k].ic}</span>
          <span class="track"><span class="fill" style="width:${v}%;background:${col}"></span></span>
          <span class="warn">${v<=25?"⚠️":""}</span>
          <span class="pct" style="color:${col}">${v}%</span>
          <span class="delta ${d>0?'up':(d<0?'down':'')}">${d?`${d>0?'+':''}${d}`:""}</span>
        </div>`;
      }).join("")}
      ${state.alive && state.prisonYearsLeft<=0 ? `<div class="actionpips">${"◆".repeat(Math.max(0,actionsLeft()))}${"◇".repeat(Math.max(0,actionsPerYear()-Math.max(0,actionsLeft())))} &nbsp;${actionsLeft()}/${actionsPerYear()} actions left this year</div>` : ""}
    </div>`;

  if(state.alive){
    if(pendingOutcome){
      // The result of the last decision is shown first; whatever queued behind
      // it waits until this is dismissed.
      bar.innerHTML = statsHtml;
      renderOutcomeSheet(pendingOutcome);
    } else if(state.pendingChoice){
      bar.innerHTML = statsHtml;
      renderChoiceSheet(state.pendingChoice);
    } else {
      const inPrison = state.prisonYearsLeft > 0;
      // Inside, most of the game isn't reachable. Rather than leaving tabs
      // that only say "not while you're in prison", the bar changes to the
      // three things that are actually available: the wing, your finances,
      // and visits.
      bar.innerHTML = inPrison ? `
        <div id="actionbar-inner">
          <div class="navbar">
            <button class="navbtn job" id="navPrison"><span class="ic">🔒</span>The Wing</button>
            <button class="navbtn assets" id="navAssets"><span class="ic">💰</span>Assets</button>
            <div class="agewrap">
              <button class="agebtn" id="ageBtn"><span class="plus">+</span>Serve</button>
              ${(state.snapshots||[]).length && !isHardcore() ? `<button class="backbtn" id="backBtn" title="Time Machine">−</button>` : ""}
            </div>
            <button class="navbtn rel" id="navRel"><span class="ic">❤️</span>Visits</button>
            <button class="navbtn act" id="navAct"><span class="ic">⋯</span>More</button>
          </div>
          ${statsHtml}
        </div>
      ` : `
        <div id="actionbar-inner">
          <div class="navbar">
            <button class="navbtn job" id="navJob"><span class="ic">💼</span>Job</button>
            <button class="navbtn assets" id="navAssets"><span class="ic">💰</span>Assets</button>
            <div class="agewrap">
              <button class="agebtn" id="ageBtn"><span class="plus">+</span>Age</button>
              ${(state.snapshots||[]).length && !isHardcore() ? `<button class="backbtn" id="backBtn" title="Time Machine">−</button>` : ""}
            </div>
            <button class="navbtn rel" id="navRel"><span class="ic">❤️</span>Relationships</button>
            <button class="navbtn act" id="navAct"><span class="ic">⋯</span>Activities</button>
          </div>
          ${statsHtml}
        </div>
      `;
      document.getElementById("ageBtn").addEventListener("click", ageUp);
      const bb = document.getElementById("backBtn"); if(bb) bb.addEventListener("click", openTimeMachine);
      const njb = document.getElementById("navJob");
      if(njb) njb.addEventListener("click", ()=>{ careerView={level:"categories",category:null}; openCareerSheet(); });
      const npb = document.getElementById("navPrison");
      if(npb) npb.addEventListener("click", ()=>{ activityView={tab:"prison"}; openActivitySheet(); });
      document.getElementById("navAssets").addEventListener("click", openAssetsSheet);
      document.getElementById("navRel").addEventListener("click", openPeopleSheet);
      document.getElementById("navAct").addEventListener("click", openActivitySheet);
    }
  } else {
    bar.innerHTML = "";
  }

  const menuBtn = document.getElementById("menuBtn"); if(menuBtn) menuBtn.addEventListener("click", openSettingsSheet);
  const ribbonBtn = document.getElementById("ribbonBtn"); if(ribbonBtn) ribbonBtn.addEventListener("click", openRibbonSheet);
  const xpPill = document.getElementById("xpPill"); if(xpPill) xpPill.addEventListener("click", openRibbonSheet);

  const logEl = document.getElementById("log");
  // The diary now reads oldest-at-top, so bring the newest year into view.
  // The page itself scrolls (the log isn't its own scroll box), and the fixed
  // nav bar sits over the bottom, so scroll the last entry to just above it.
  if(logEl && state && state.alive){
    try{
      const last = logEl.lastElementChild;
      if(last && last.scrollIntoView){
        last.scrollIntoView({ block:"end" });
      } else if(window.scrollTo){
        window.scrollTo(0, document.body.scrollHeight);
      }
    }catch(e){ /* scrolling is cosmetic — never let it break a render */ }
  }
}

// A decision or its outcome is shown once. render() runs again for all sorts
// of reasons (dismissing a notification, a timer), so the sheet already up is
// replaced, never stacked; a stale copy underneath could be answered twice.
function clearDecisionSheets(){
  document.querySelectorAll(".overlay[data-decision]").forEach(o=>o.remove());
}
function renderChoiceSheet(choice){
  clearDecisionSheets();
  const overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.setAttribute("data-decision", "choice");
  overlay.innerHTML = `
    <div class="sheet">
      <h2>${choice.title}</h2>
      <p style="line-height:1.5;">${choice.text}</p>
      <div class="choices">
        ${choice.options.map((o,i)=>`<button data-i="${i}">${o.label}</button>`).join("")}
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.querySelectorAll("button").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const idx = parseInt(btn.dataset.i,10);
      runOptionWithOutcome(choice, idx);
      overlay.remove();
      if(maybeDie()){ pendingOutcome = null; render(); return; }
      render();   // the outcome panel takes over from here
    });
  });
}

// Shown straight after a decision: did it work, and what did it cost?
function renderOutcomeSheet(outcome){
  clearDecisionSheets();
  const overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.setAttribute("data-decision", "outcome");
  const tone = outcome.verdict === "success" ? { ic:"✓", col:"var(--green)", word:"It worked" }
             : outcome.verdict === "fail"    ? { ic:"✕", col:"var(--red)",   word:"That didn't go to plan" }
             :                                 { ic:"•", col:"var(--text-dim)", word:"Done" };
  const deltaBits = Object.entries(outcome.deltas).map(([k,v])=>
    `<span class="delta ${v>0?"up":"down"}" style="margin-right:9px;">${k.charAt(0).toUpperCase()+k.slice(1)} ${v>0?"+":""}${v}</span>`).join("");

  overlay.innerHTML = `
    <div class="sheet">
      <div class="outcome-head">
        <span class="outcome-ic" style="background:${tone.col}">${tone.ic}</span>
        <span class="outcome-txt">
          <b style="color:${tone.col}">${outcome.headline || tone.word}</b>
          <span>${outcome.title} — you chose "${outcome.chose}"</span>
        </span>
      </div>
      ${outcome.lines.length
        ? `<div class="outcome-lines">${outcome.lines.map(t=>`<div class="entry">${t}</div>`).join("")}</div>`
        : `<div class="job-line">Nothing came of it.</div>`}
      ${(outcome.moneyDelta || deltaBits) ? `
        <div class="track-card" style="margin-top:10px;">
          ${outcome.moneyDelta ? `<div class="review-row"><span>Money</span><span class="v" style="color:${outcome.moneyDelta>0?'var(--green)':'var(--bad)'}">${outcome.moneyDelta>0?"+":"−"}${money(Math.abs(outcome.moneyDelta))}</span></div>` : ""}
          ${deltaBits ? `<div style="margin-top:4px;">${deltaBits}</div>` : ""}
        </div>` : ""}
      <div class="choices"><button class="primary" id="outcomeOkBtn">Continue</button></div>
    </div>
  `;
  document.body.appendChild(overlay);
  document.getElementById("outcomeOkBtn").addEventListener("click", ()=>{
    pendingOutcome = null;
    overlay.remove();
    SFX.tap();
    // Only now does anything that queued up behind this decision come forward.
    advanceChoiceQueue();
    render();
    // "Look for work" opens the job listings once nothing else is waiting.
    if(state && state.openJobsNext && !state.pendingChoice){
      state.openJobsNext = false;
      if(!state.career){ careerView = { level:"categories", category:null }; openCareerSheet(); }
    }
  });
}

// Milestone toasts, stacked at the top and dismissed by tapping.
function renderNotifications(){
  if(!notifications.length) return "";
  return `<div class="notifstack">
    ${notifications.map(n=>`
      <button class="notif ${n.tone}" data-notif="${n.id}">
        <span class="ni">${n.icon}</span>
        <span class="nt"><b>${n.label}</b><span>${n.text}</span></span>
        <span class="nx">✕</span>
      </button>`).join("")}
    ${notifications.length > 1 ? `<button class="notif-clear" id="notifClearBtn">Dismiss all ${notifications.length}</button>` : ""}
  </div>`;
}

const CORE_ACTIVITY_DEFS = [
  {id:"gym", label:"Gym — £20 · +health +looks"},

  {id:"screening", label:"Preventive health screening — £120 · catches conditions early"},
  {id:"study", label:"Study independently — free · +smarts"},
  {id:"therapy", label:"Therapy sessions — £80 · +happiness -stress"},
  {id:"party", label:"Night out — ~£50 · +happiness -health"},
];
const OTHER_MIN_AGE = { invest:18, casino:18, hustle:16, car:17, house:18 };

let activityView = { tab: "foryou" };
// Which continent is open on the emigration screen, so two hundred countries
// don't arrive as one list.
let worldView = { continent: null };

function renderTabs(activeId, tabs){
  return `<div class="tab-row">${tabs.map(t=>`<button class="tab-btn ${t.id===activeId?'active':''}" data-tab="${t.id}">${t.label}</button>`).join("")}</div>`;
}

function activityTabs(){
  const age = state.age;
  // Assets now live on their own nav tab, so Activities keeps the
  // mind/body, love, crime, casino, leisure and lifestyle groupings.
  const tabs = [];
  if(state.prisonYearsLeft > 0){
    // Inside, the menu is cut back to what you can actually do.
    const conduct = prisonConduct();
    tabs.push({id:"prison", label:"The Wing", icon:"🔒",
               sub:`${state.prisonYearsLeft}yr left · conduct ${conduct}/100${state.prisonActionUsed?" · decided this year":""}`});
    tabs.push({id:"money", label:"Finances", icon:"💰", sub:"Your money carries on without you"});
    tabs.push({id:"health", label:"Health", icon:"🏥", sub:"Conditions and the prison doctor"});
    // Nothing else is appended, so the rest of the game genuinely isn't offered
    // while you're inside.
    return tabs;
  }
  tabs.push({id:"foryou", label:"Mind & Body", icon:"🧘", sub:"Gym, doctor, study, vices"});
  if(age >= 13){
    const n = Object.values(state.social||{}).filter(a=>!a.banned).length;
    tabs.push({id:"social", label:"Social Media", icon:"📱", sub: n ? `${(state.followers||0).toLocaleString()} followers across ${n} platform${n===1?"":"s"}` : "YouTube, TikTok, Instagram, X, Twitch and more"});
  }
  if(age >= 5) tabs.push({id:"skills", label:"Sport & Beauty", icon:"🏅", sub:"Training, competitions, cosmetic work"});
  if(age >= 16) tabs.push({id:"dating", label:"Love", icon:"💘", sub:"Dating, partners, intimacy"});
  if(age >= 18) tabs.push({id:"family", label:"Family", icon:"👨‍👩‍👧", sub:"Children, adoption, IVF"});
  if(age >= 16) tabs.push({id:"licenses", label:"Licences", icon:"📄", sub:"Driving, boat, pilot and more"});
  if(age >= 16) tabs.push({id:"money", label:"Casino & Work", icon:"🎲", sub:"Side work and gambling"});
  if(age >= 18) tabs.push({id:"world", label:"Travel", icon:"✈️", sub:"Holidays, bucket list, emigration"});
  return tabs;
}

function openActivitySheet(){
  activityView = { tab: "menu" };
  socialView = { platform: null };
  closeSheet();
  const overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.id = "sheetOverlay";
  document.body.appendChild(overlay);
  renderActivitySheetContent(overlay);
}

function renderActivitySheetContent(overlay){
  const age = state.age;
  const tabs = activityTabs();
  // "menu" is the drill-down root and deliberately isn't one of the tabs.
  if(activityView.tab !== "menu" && !tabs.find(t=>t.id===activityView.tab)) activityView.tab = "menu";

  let panel = "";
  if(activityView.tab === "prison"){
    const conduct = prisonConduct();
    const used = !!state.prisonActionUsed;
    const conductLabel = conduct >= 75 ? "model prisoner" : conduct >= 55 ? "no trouble" :
                         conduct >= 35 ? "watched" : conduct >= 20 ? "a problem" : "a serious problem";
    // Parole odds, shown rather than hidden, so conduct visibly matters.
    let paroleOdds = 0.1 + conduct/180 + state.hidden.karma/400 - state.prisonYearsLeft*0.03;
    paroleOdds += Math.min(3, state.prisonWorkYears || 0) * 0.04;
    if(state.flags.prisonCourse) paroleOdds += 0.05;
    if(state.flags.prisonFight) paroleOdds -= 0.2;
    if(state.flags.triedToEscape) paroleOdds -= 0.15;
    paroleOdds = clamp(paroleOdds, 0.85, 0.02);

    panel = `
      <div class="track-card">
        <h3>${state.prisonYearsLeft} year${state.prisonYearsLeft===1?"":"s"} left to serve</h3>

        <div class="review-row"><span>Years worked on the wing</span><span class="v">${state.prisonWorkYears||0}</span></div>
        <div class="review-row"><span>Clean years</span><span class="v">${state.prisonCleanYears||0}</span></div>

      </div>
      <div class="job-line">You get one move a year in here. ${used ? "You've made it — see the year out." : "Everything else is on hold until release."}</div>

      <div class="section-label">Keep your head down</div>
      <div class="choices">
        ${used ? `<button disabled>Already decided this year</button>` : `
          <button id="prKeepClean">Behave and stay out of trouble — best for parole</button>
          <button class="small" data-prself="gym">Use the gym — +health</button>
          <button class="small" data-prself="course">Take an education course — +smarts</button>
          <button class="small" data-prself="quiet">Keep to the chapel and the yard — +happiness</button>
        `}
      </div>

      <div class="section-label">Volunteer for work</div>
      <div class="job-line">Prison wages are small, but the governor's office keeps a note of who puts their hand up.</div>

        ${used ? `<button disabled>Already decided this year</button>` : PRISON_CRIMES.map(c=>{
          const risk = clamp01((state.gang ? c.catch*0.75 : c.catch) + (state.prisonOffences||0)*0.06);
          return `<button class="small danger" data-prcrime="${c.id}">${c.label} — ${Math.round(risk*100)}% caught · ${c.desc}</button>`;
        }).join("")}
      </div>

      <div class="section-label">Getting out</div>
      <div class="choices">
        ${usesLeft("parole")>0
          ? `<button id="paroleBtn2">Apply for parole — ${Math.round(paroleOdds*100)}% on your record</button>`
          : `<button disabled>Parole board already sat this year</button>`}
        ${used ? `<button disabled>Already decided this year</button>` : `<button class="danger" id="escapeBtn2">Attempt escape — adds 2–5 years if it fails</button>`}
      </div>
      ${state.gang ? `<div class="job-line">Running with ${state.gang.name} makes everything in here a little easier to get away with.</div>` : ""}
    `;

let peopleView = { tab: "menu", person: null, sub: null };

function openPeopleSheet(){
  peopleView = { tab: "menu", person: null, sub: null, late: null };
  closeSheet();
  const overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.id = "sheetOverlay";
  document.body.appendChild(overlay);
  renderPeopleSheetContent(overlay);
}

function renderPeopleSheetContent(overlay){
  if(!peopleView.sub) peopleView.sub = null;
  const living = (state.family||[]).filter(p=>p.alive);
  const late = (state.family||[]).filter(p=>!p.alive);
  const tabs = [
    {id:"partner", label:"Love", icon:"💞", sub:state.relationship?`${state.married?"Married to":state.engaged?"Engaged to":"Seeing"} ${state.relationship.name}, ${ensurePersonAge(state.relationship).age}`:(state.flags.widowed?"Widowed":"Not seeing anyone")},
    {id:"family", label:"Family", icon:"👪", sub:`${living.length} living relative${living.length===1?"":"s"}${late.length?` · ${late.length} late`:""}`},
    {id:"children", label:"Children", icon:"🧒", sub:state.children.length?`${state.children.length} child${state.children.length===1?"":"ren"}`:"No children"},
    {id:"friends", label:"Friends", icon:"🤝", sub:state.friends.length?`${state.friends.length} friend${state.friends.length===1?"":"s"}`:"No close friends"},
    {id:"enemies", label:"Enemies", icon:"⚔️", sub:(state.enemies||[]).length?`${state.enemies.length} rival${state.enemies.length===1?"":"s"}`:"Nobody against you"},
    {id:"pets", label:"Pets", icon:"🐾", sub:(state.pets||[]).length?`${state.pets.length} pet${state.pets.length===1?"":"s"}`:"No pets"},
    {id:"exes", label:"Exes", icon:"💔", sub:(()=>{ const n=(state.exes||[]).filter(e=>e.alive).length; return n ? `${n} ex${n===1?"":"es"}` : "Nobody you've broken up with"; })()},
    {id:"late", label:"Late relationships", icon:"🕯️", sub:(()=>{ const n=lateEntries().length; return n ? `${n} remembered` : "Nobody you've lost"; })()},
  ];

  // Someone's own page, if one is open and they're still in your life.
  let person = null;
  if(peopleView.person){
    person = personByRef(peopleView.person.kind, peopleView.person.id);
    if(!person){ peopleView.person = null; peopleView.sub = null; if(peopleView.tab === "partner") peopleView.tab = "menu"; }
  }

  let title, body;
  if(peopleView.late){
    const l = findLate(peopleView.late.kind, peopleView.late.id);
    if(!l) peopleView.late = null;
  }
  if(peopleView.late){
    const l = findLate(peopleView.late.kind, peopleView.late.id);
    title = "In memory";
    body = renderLatePage(peopleView.late.kind, l);
  } else if(person){
    const kind = peopleView.person.kind;
    title = peopleView.sub === "gift" ? `A gift for ${person.name}` : peopleView.sub === "anniversary" ? "Your anniversary" : personRelationLabel(person, kind);
    body = renderPersonPage(person, kind);
  } else if(peopleView.tab === "menu"){
    title = "Relationships";
    // Seeing everyone stays at the very top, above every list.
    const circle = socialCircle().length + (state.children||[]).filter(c=>c.adult && isHere(c)).length;
    const neglected = (state.friends||[]).filter(f=>isHere(f) && f.lastContactAge!==undefined && state.age-f.lastContactAge>=3).length;
    const everyone = circle ? `<div class="choices" style="margin:0 0 10px;">
        <button class="primary" id="seeEveryoneBtn" ${usesLeft("social")<=0?"disabled":""}>
          ${usesLeft("social")<=0 ? "No time left for visits this year" : `🤝 Spend time with everyone — all ${circle}`}
        </button>
      </div>
      <div class="job-line" style="margin-bottom:10px;">One press keeps every relationship ticking over. It uses the year's whole social allowance${neglected?`, and ${neglected} ${neglected===1?"friendship is":"friendships are"} drifting`:""}.</div>` : "";
    body = everyone + `<div class="menulist" style="margin-top:4px;">${tabs.map(t=>menuRow({icon:t.icon, title:t.label, sub:t.sub, attr:`data-tab="${t.id}"`})).join("")}</div>`;
  } else {
    const tab = tabs.find(t=>t.id===peopleView.tab) || {label:"Relationships"};
    title = tab.label;
    const list = (arr, kind)=>`<div class="menulist">${arr.map(p=>personRow(p, kind)).join("")}</div>`;
    if(peopleView.tab === "partner"){
      body = `<div class="job-line">Not currently seeing anyone.${state.flags.widowed?" Widowed.":""} Meet someone from the Activities screen.</div>`;
    } else if(peopleView.tab === "family"){
      body = (living.length ? `<div class="section-label">Living</div>${list(living, "family")}` : `<div class="job-line">No living family.</div>`)
        + (late.length ? `<div class="section-label">Late relatives</div>${list(late, "family")}` : "");
    } else if(peopleView.tab === "children"){
      body = state.children.length ? list(state.children, "child") : `<div class="job-line">No children yet.</div>`;
    } else if(peopleView.tab === "friends"){
      body = state.friends.length ? list(state.friends, "friend") : `<div class="job-line">No close friends at the moment. Chances to meet people come up as the years pass.</div>`;
    } else if(peopleView.tab === "enemies"){
      body = (state.enemies||[]).length ? list(state.enemies, "enemy") : `<div class="job-line">Nobody has it in for you right now.</div>`;
    } else if(peopleView.tab === "exes"){
      const living = (state.exes||[]).filter(e=>e.alive);
      body = living.length ? list(living, "ex") : `<div class="job-line">Nobody you've broken up with.</div>`;
    } else if(peopleView.tab === "late"){
      const all = lateEntries();
      body = all.length ? `<div class="menulist">${all.map(lateRow).join("")}</div>` : `<div class="job-line">Nobody you've lost — yet.</div>`;
    } else if(peopleView.tab === "pets"){
      body = ((state.pets||[]).length ? list(state.pets, "pet") : `<div class="job-line">No pets at the moment.</div>`)
        + ((state.pets||[]).length < 3 ? `<div class="section-label">Adopt</div><div class="menulist">
          ${PET_TYPES.map(p=>menuRow({icon:{dog:"🐕",cat:"🐈",exotic:"🦎"}[p.id]||"🐾", title:`Adopt a ${p.name.toLowerCase()}`, sub:`${money(p.upkeep)}/yr to keep`, value:money(p.cost), attr:`data-adoptpet="${p.id}"`, chevron:false, dots:true, disabled: state.money < p.cost})).join("")}
        </div>` : "");
    } else {
      body = "";
    }
  }

  const hasBack = !!person || !!peopleView.late || peopleView.tab !== "menu";
  overlay.innerHTML = `
    <div class="sheet"><button class="sheet-x" id="closeSheetBtn">✕</button>
      <div class="sheet-title">${hasBack?`<button class="bk" id="mBackP">‹</button>`:""}<h2>${title}</h2></div>
      <div class="tab-panel">${body}</div>
    </div>`;

  overlay.querySelectorAll("[data-tab]").forEach(btn=>btn.addEventListener("click", ()=>{
    peopleView.tab = btn.dataset.tab;
    peopleView.sub = null;
    // Love has one person in it, so it goes straight to their page.
    if(peopleView.tab === "partner" && state.relationship) peopleView.person = { kind:"partner", id: state.relationship.id };
    renderPeopleSheetContent(overlay);
  }));
  overlay.querySelectorAll("[data-person]").forEach(btn=>btn.addEventListener("click", ()=>{
    const [kind, id] = btn.dataset.person.split(":");
    peopleView.person = { kind, id: parseInt(id,10) };
    peopleView.sub = null;
    renderPeopleSheetContent(overlay);
  }));
  overlay.querySelectorAll("[data-pact]").forEach(btn=>btn.addEventListener("click", ()=>{
    const ref = peopleView.person;
    if(ref) runPersonAction(ref.kind, ref.id, btn.dataset.pact);
  }));
  overlay.querySelectorAll("[data-gifttier]").forEach(btn=>btn.addEventListener("click", ()=>{
    const ref = peopleView.person;
    if(ref) doGiftTier(ref.kind, ref.id, btn.dataset.gifttier);
  }));
  overlay.querySelectorAll("[data-anniv]").forEach(btn=>btn.addEventListener("click", ()=>doAnniversary(btn.dataset.anniv)));
  overlay.querySelectorAll("[data-late]").forEach(btn=>btn.addEventListener("click", ()=>{
    const [kind, id] = btn.dataset.late.split(":");
    peopleView.late = { kind, id: parseInt(id,10) };
    renderPeopleSheetContent(overlay);
  }));
  overlay.querySelectorAll("[data-lategrave]").forEach(btn=>btn.addEventListener("click", ()=>{
    if(peopleView.late) doVisitLateGrave(peopleView.late.kind, peopleView.late.id);
  }));
  overlay.querySelectorAll("[data-adoptpet]").forEach(b=>b.addEventListener("click", ()=>{ doAdoptPet(b.dataset.adoptpet); refreshPeopleSheet(); }));
  const mbp = document.getElementById("mBackP");
  if(mbp) mbp.addEventListener("click", ()=>{
    if(peopleView.sub){ peopleView.sub = null; }
    else if(peopleView.late){ peopleView.late = null; }
    else if(peopleView.person){ peopleView.person = null; if(peopleView.tab === "partner") peopleView.tab = "menu"; }
    else { peopleView.tab = "menu"; }
    renderPeopleSheetContent(overlay);
  });
  const seeAllBtn = document.getElementById("seeEveryoneBtn");
  if(seeAllBtn) seeAllBtn.addEventListener("click", doSpendTimeWithEveryone);
  document.getElementById("closeSheetBtn").addEventListener("click", closeSheet);
}

function renderCareerSheetContent(overlay){
  if(state.age < 18){
    overlay.innerHTML = `
      <div class="sheet"><button class="sheet-x" id="closeSheetBtn">✕</button>
        <h2>Career</h2>
        <p>Too young to work yet. Focus on school for now.</p>
      </div>`;
    document.getElementById("closeSheetBtn").addEventListener("click", closeSheet);
    return;
  }

  if(state.politics){
    const office = officeById(state.politics.officeId);
    const ap = politicalApproval();
    const standing = office.system === "democracy" ? "Approval rating"
      : office.system === "monarchy" ? "Standing at court" : "Standing in the party";
    overlay.innerHTML = `
      <div class="sheet"><button class="sheet-x" id="closeSheetBtn">✕</button>
        <h2>Career</h2>
        <div class="track-card">
          <h3>${office.title}</h3>
          <span class="req-line">${office.termYears >= 99 ? `${state.politics.yearsInOffice} year${state.politics.yearsInOffice===1?"":"s"} in post, held for life` : `${state.politics.yearsInOffice} of ${office.termYears} years into this term`} · ${money(office.salary)}/yr</span>
        </div>
        ${state.politics.warned ? `<div class="promo" style="border-radius:10px;margin:8px 0;">⚠️ ${office.system === "democracy" ? `The party has warned you — approval ${ap}%. Get it above ${PERFORMANCE_WARNING}% or you'll be deselected.` : office.system === "monarchy" ? `You are out of favour — ${ap}%. Get it above ${PERFORMANCE_WARNING}% or you'll be dismissed from the court.` : `Your loyalty is in question — ${ap}%. Get it above ${PERFORMANCE_WARNING}% or you will be purged.`}</div>` : ""}
        <div class="track-card">
          <span class="req-line">${standing}: ${ap}%</span>
          <div class="bar-track"><div class="bar-fill ${ap<=25?'low':(ap>=75?'high':'')}" style="width:${ap}%"></div></div>
          <div class="choices">
            ${usesLeft("work")>0 ? `<button class="small" id="workHarderBtn">Work the constituency — +approval, +stress</button>` : `<button class="small" disabled>Pace set for this year</button>`}
            ${usesLeft("work")>0 ? `<button class="small" id="slackBtn">Coast — -approval, -stress</button>` : ""}
          </div>
          <div class="job-line">${office.system === "democracy" ? "Approval decides whether you hold the seat at the next election, and whether the party keeps you at all." : office.system === "monarchy" ? "Favour at court decides whether you keep the post, and how far you go." : "Your standing decides whether you rise, and whether you are allowed to retire."}</div>
        </div>
        ${(()=>{
          const next = POLITICAL_OFFICES.find(o=>o.requiresPrevious === office.id);
          if(!next) return `<div class="job-line">There is nothing above this post.</div>`;
          const rung = ladderIndexOf(next);
          const needYears = minYearsForRung(rung), needAp = minApprovalForRung(rung);
          const years = state.politics.yearsServed || state.politics.yearsInOffice || 0;
          const ready = ap >= needAp && years >= needYears &&
            state.stats.smarts >= next.minSmarts && state.money >= next.campaignCost;
          const word = office.system === "democracy" ? "approval" : "standing";
          return `<div class="track-card">
            <h3>Next: ${next.title}</h3>
            <span class="req-line">${next.campaignCost ? `${money(next.campaignCost)} to mount it · ` : ""}Needs smarts ${next.minSmarts}+, ${needYears} years in post and ${word} of ${needAp}%+ · ${money(next.salary)}/yr</span>
            <span class="req-line">You: ${years} year${years===1?"":"s"} in post, ${ap}% ${word}, smarts ${state.stats.smarts}</span>
            ${usesLeft("promo") <= 0
              ? `<button class="small" disabled>Already pushed for advancement this year</button>`
              : ready
                ? `<button class="small" data-runfor="${next.id}">${next.id === "monarch" && !canInheritThrone() ? "Take the throne" : `Move for ${next.title}`}</button>`
                : `<button class="small" disabled>${years < needYears ? `${needYears - years} more year${needYears-years===1?"":"s"} in post` : ap < needAp ? `Needs ${needAp}%+ — you're on ${ap}%` : state.stats.smarts < next.minSmarts ? `Needs smarts ${next.minSmarts}+` : `Needs ${money(next.campaignCost)}`}</button>`}
          </div>`;
        })()}
        <div class="choices">
          <button class="small danger" id="resignOfficeBtn">${office.system === "democracy" ? "Resign the seat" : "Step down from the post"}</button>
        </div>
      </div>`;
    document.getElementById("closeSheetBtn").addEventListener("click", closeSheet);
    const whp = document.getElementById("workHarderBtn"); if(whp) whp.addEventListener("click", doWorkHarder);
    const slp = document.getElementById("slackBtn"); if(slp) slp.addEventListener("click", doSlackOff);
    const rop = document.getElementById("resignOfficeBtn"); if(rop) rop.addEventListener("click", resignOffice);
    overlay.querySelectorAll("[data-runfor]").forEach(b=>b.addEventListener("click", ()=>runForOffice(b.dataset.runfor)));
    return;
  }

  if(state.business){
    const b = state.business;
    const def = BUSINESS_TYPES.find(t=>t.id===b.typeId);
    overlay.innerHTML = `
      <div class="sheet"><button class="sheet-x" id="closeSheetBtn">✕</button>
        <h2>Career</h2>
        <div class="track-card">
          <h3>${b.name}</h3>
          <span class="req-line">${def.name} · ${b.yearsRunning} year${b.yearsRunning===1?"":"s"} running · ${b.employees} employee${b.employees===1?"":"s"}</span>
          <span class="req-line">Last year's profit: ${money(b.lastProfit)} · Estimated valuation: ${money(b.valuation)}</span>
          <div class="choices">
            <button class="small" id="hireBtn">Hire an employee — ${money(2000)}</button>
            <button class="small danger" id="sellBizBtn">Sell the business — ${money(b.valuation)}</button>
          </div>
        </div>
      </div>`;
    document.getElementById("hireBtn").addEventListener("click", hireEmployee);
    document.getElementById("sellBizBtn").addEventListener("click", sellBusiness);
    document.getElementById("closeSheetBtn").addEventListener("click", closeSheet);
    return;
  }

  if(state.career){
    const c = state.career;
    let statusHtml = "";
    if(c.training){
      const track = TRACKS.find(t=>t.id===c.trackId);
      statusHtml = `<p>Currently training: <b>${c.training.label}</b> (${c.training.yearsLeft} year${c.training.yearsLeft===1?'':'s'} remaining) toward ${track.name}.</p>`;
    } else if(c.kind==="civilian"){
      const track = TRACKS.find(t=>t.id===c.trackId);
      // Shown in the money of the year being lived through, as it's paid.
      const sal = money(Math.round(track.ladder[c.rankIndex].salary * priceLevel()));
      statusHtml = `<p>Currently: <b>${track.ladder[c.rankIndex].title}</b> (${track.name}) · rung ${c.rankIndex+1} of ${track.ladder.length}<br><span class="job-line">${track.criminal ? `Your cut: about ${sal}/yr, in cash — untaxed and undeclared` : `Salary: ${sal}/yr${track.volatile ? " — varies a lot year to year" : ""}`}</span></p>`;
      if(track.criminal){
        const heat = crimeHeat();
        const [lo, hi] = crimeSentenceRange(track, c.rankIndex);
        statusHtml += `<div class="track-card">
          <span class="req-line">Police heat: ${heat}/100 · about ${Math.round(crimeArrestChance(heat, c.rankIndex)*100)}% chance of arrest this year</span>
          <div class="bar-track"><div class="bar-fill ${heat>=60?'low':''}" style="width:${heat}%"></div></div>
          <div class="job-line">Caught at this rank, you'd face ${lo}–${hi} years. Taking on more raises your standing and your heat; lying low cools both.</div>
        </div>`;
      }
      if(track.peakAge && state.age > track.peakAge){
        statusHtml += `<div class="job-line" style="color:var(--bad)">Past ${track.peakAge}, the bookings slow and agencies start looking elsewhere.</div>`;
      }
    } else if(c.kind==="forces"){
      const force = FORCES.find(f=>f.id===c.trackId);
      const ranks = c.isOfficer ? force.officerRanks : force.ranks;
      statusHtml = `<p>Currently: <b>${ranks[c.rankIndex]}</b>, ${force.name}${c.deployed?' <span class="tag">DEPLOYED</span>':''}</p>`;
    }
    if(!c.training){
      const perf = jobPerformance();
      const isForces = c.kind === "forces";
      // A formal warning is shown prominently — it's a year's notice, not a
      // number buried in a panel.
      if(state.careerWarning){
        statusHtml += `<div class="promo" style="border-radius:10px;margin:8px 0;">⚠️ Formal warning since age ${state.careerWarning.sinceAge} — performance ${perf}/100. Get it above ${PERFORMANCE_WARNING} this year or you'll be ${isForces?"discharged":"dismissed"}.</div>`;
      } else if(perf < PERFORMANCE_WARNING + 10){
        statusHtml += `<div class="job-line" style="color:var(--bad)">Performance is close to the ${PERFORMANCE_WARNING}/100 line. Below it you'll be formally warned.</div>`;
      }
      statusHtml += `<div class="track-card">
        <span class="req-line">${isForces?"Reported performance":"Performance"}: ${perf}/100${c.raiseMult && c.raiseMult>1 ? ` · pay ${Math.round((c.raiseMult-1)*100)}% above standard` : ""}</span>
        <div class="bar-track"><div class="bar-fill ${perf<=25?'low':(perf>=75?'high':'')}" style="width:${perf}%"></div></div>
        <div class="choices">
          ${usesLeft("work")>0 ? `<button class="small" id="workHarderBtn">${isForces?"Volunteer for everything":isCrimeCareer()?"Take on more work":"Work harder"} — +performance, ${isCrimeCareer()?"+heat":"+stress"}</button>` : `<button class="small" disabled>Work effort set for this year</button>`}
          ${usesLeft("work")>0 ? `<button class="small" id="slackBtn">${isForces?"Do the minimum":isCrimeCareer()?"Lie low":"Slack off"} — -performance, ${isCrimeCareer()?"-heat":"-stress"}</button>` : ""}
          ${!isForces ? (usesLeft("raise")>0 ? `<button class="small" id="askRaiseBtn">${isCrimeCareer()?"Ask for a bigger cut":"Ask for a raise"}</button>` : `<button class="small" disabled>Already asked about pay</button>`) : ""}
          ${usesLeft("promo")>0 ? `<button class="small" id="askPromoBtn">${isForces?"Put in for selection":"Ask for a promotion"}</button>` : `<button class="small" disabled>Already pushed for promotion</button>`}
        </div>
        ${careerActionFor() ? `<div class="choices">${
          usesLeft("careeract")>0
            ? `<button class="small" id="careerActBtn">${careerActionFor().label}</button>`
            : `<button class="small" disabled>${careerActionFor().label} — done this year</button>`
        }</div>` : ""}
      </div>`;
    }
    statusHtml += `<div class="choices">`;
    if(c.kind === "forces" && c.resigning){
      statusHtml += `<button disabled>Serving out notice — ${c.resignYearsLeft} year${c.resignYearsLeft===1?"":"s"} left</button>`;
    } else {
      statusHtml += `<button class="small danger" id="quitJobBtn">${c.kind==="forces" ? "Hand in your notice (1 year)" : isCrimeCareer() ? "Walk away from the life — they may not let you" : "Quit this job"}</button>`;
    }
    statusHtml += `</div>`;
    overlay.innerHTML = `
      <div class="sheet"><button class="sheet-x" id="closeSheetBtn">✕</button>
        <h2>Career</h2>
        ${statusHtml}
      </div>`;
    const quitJobBtn = document.getElementById("quitJobBtn"); if(quitJobBtn) quitJobBtn.addEventListener("click", quitJob);
    const whBtn = document.getElementById("workHarderBtn"); if(whBtn) whBtn.addEventListener("click", doWorkHarder);
    const slBtn = document.getElementById("slackBtn"); if(slBtn) slBtn.addEventListener("click", doSlackOff);
    const arBtn = document.getElementById("askRaiseBtn"); if(arBtn) arBtn.addEventListener("click", doAskRaise);
    const apBtn = document.getElementById("askPromoBtn"); if(apBtn) apBtn.addEventListener("click", doAskPromotion);
    const caBtn = document.getElementById("careerActBtn"); if(caBtn) caBtn.addEventListener("click", doCareerAction);
    document.getElementById("closeSheetBtn").addEventListener("click", closeSheet);
    return;
  }

  if(careerView.level === "categories"){
    const age = state.age;
    overlay.innerHTML = `
      <div class="sheet"><button class="sheet-x" id="closeSheetBtn">✕</button>
        <h2>Occupation</h2>
        ${jfyHtml("career")}
        <div class="section-label">All</div>
        <div class="menulist">
          ${menuRow({icon:"🎓", title:"Education", sub:"Go back to school or study further", attr:'data-goto="education"'})}
          ${age>=12 ? menuRow({icon:"🔨", title:"Freelance Gigs", sub:"Quick money, no commitment", attr:'data-goto="gigs"'}) : ""}
          ${age>=16 ? menuRow({icon:"🕒", title:"Part-Time Jobs", sub:"Hourly work alongside everything else", attr:'data-goto="parttime"'}) : ""}
        </div>
        <div class="section-label">Jobs by field</div>
        <div class="menulist">
          ${CATEGORIES.map(cat=>menuRow({icon:CATEGORY_ICONS[cat]||"💼", title:cat, sub:categorySummary(cat), attr:`data-cat="${cat}"`})).join("")}
        </div>
      </div>`;
    overlay.querySelectorAll("[data-cat]").forEach(btn=>{
      btn.addEventListener("click", ()=>{ careerView={level:"tracks", category:btn.dataset.cat}; renderCareerSheetContent(overlay); });
    });
    wireJfy(overlay);
    overlay.querySelectorAll("[data-goto]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const d = btn.dataset.goto;
        if(d === "jobs"){ return; } // fields are already listed below
        careerView = { level:d, category:null };
        renderCareerSheetContent(overlay);
      });
    });
    document.getElementById("closeSheetBtn").addEventListener("click", closeSheet);
    return;
  }

  if(careerView.level === "gigs" || careerView.level === "parttime"){
    const isGig = careerView.level === "gigs";
    const list = isGig ? FREELANCE_GIGS : PART_TIME_JOBS;
    const useId = isGig ? "gig" : "parttime";
    overlay.innerHTML = `
      <div class="sheet"><button class="sheet-x" id="closeSheetBtn">✕</button>
        <div class="sheet-title"><button class="bk" id="backBtn">‹</button><h2>${isGig ? "Freelance Gigs" : "Part-Time Jobs"}</h2></div>
        <div class="job-line">${isGig ? "Hourly minimums — pay varies with the hours you get." : "Hourly work. Doesn't replace a full-time career."} ${usesLeft(useId)} left this year.</div>
        <div class="choices">
          ${list.map(g=>{
            const ok = state.age >= g.minAge && (!g.minSmarts || state.stats.smarts>=g.minSmarts) && (!g.minHealth || state.stats.health>=g.minHealth);
            return `<button ${ok?"":"disabled"} data-gig="${g.id}">${g.label} — £${g.rate}/hr${!ok ? (state.age<g.minAge ? ` · from age ${g.minAge}` : " · not qualified") : ""}</button>`;
          }).join("")}
        </div>
      </div>`;
    overlay.querySelectorAll("[data-gig]").forEach(b=>b.addEventListener("click", ()=>doGig(list, b.dataset.gig, useId)));
    document.getElementById("backBtn").addEventListener("click", ()=>{ careerView={level:"categories",category:null}; renderCareerSheetContent(overlay); });
    document.getElementById("closeSheetBtn").addEventListener("click", closeSheet);
    return;
  }

  if(careerView.level === "education"){
    const canPostgrad = state.education === "degree-finished" || (state.postgradAwards||[]).length;
    const returnable = availableReturnCourses();
    overlay.innerHTML = `
      <div class="sheet"><button class="sheet-x" id="closeSheetBtn">✕</button>
        <div class="sheet-title"><button class="bk" id="backBtn">‹</button><h2>Education</h2></div>
        <div class="track-card">
          <span class="req-line">Schooling: ${state.education.replace(/-/g," ")}${state.degree?` · degree in ${state.degree}`:""}${(state.postgradAwards||[]).length?` · ${state.postgradAwards.join(", ")}`:""}</span>
        </div>
        ${inSchool() ? `
          <div class="section-label">While you're at school</div>
          <div class="choices">
            ${usesLeft("school")>0 ? `
              <button id="eduStudy">Study harder</button>
              <button id="eduSkip">Skip class</button>
              <button class="danger" id="eduCheat">Cheat on a test</button>
            ` : `<button disabled>Approach set for this year</button>`}
          </div>` : ""}
        ${state.studying ? `
          <div class="section-label">Currently studying</div>
          <div class="track-card">
            <h3>${state.studying.label}${state.studying.degree?` — ${state.studying.degree}`:""}</h3>
            <span class="req-line">${state.studying.yearsLeft} year${state.studying.yearsLeft===1?"":"s"} left · funded by ${
              state.studying.funding === "scholarship" ? "a scholarship" :
              state.studying.funding === "loan" ? "a student loan" :
              state.studying.funding === "parents" ? "your parents" : "yourself"}</span>
            <div class="choices"><button class="small danger" id="eduDropStudy">Drop out</button></div>
          </div>
        ` : (state.age >= 18 && !inSchool() ? `
          <div class="section-label">Back into education</div>
          ${returnable.length ? `
            <div class="choices"><button class="primary" id="eduReturnBtn">Go back to study — ${returnable.length} option${returnable.length===1?"":"s"}</button></div>
            <div class="job-line">Evening classes, college, a degree or a second degree — at any age. You'll choose a subject where it matters, then how to pay: a scholarship, a student loan, your own money, or asking your parents.</div>
          ` : `<div class="job-line">You've already been through every stage of school, college and university.</div>`}
        ` : "")}
        <div class="section-label">Graduate school</div>
        ${canPostgrad ? `
          ${state.postgrad ? `
            <div class="job-line">Studying for a ${state.postgrad.label} — ${state.postgrad.yearsLeft} year${state.postgrad.yearsLeft===1?"":"s"} left.</div>
            <div class="choices"><button class="danger" id="eduDrop">Drop out</button></div>
          ` : `<div class="choices">${POSTGRAD_COURSES.map(p=>`<button data-pg="${p.id}">${p.label} — ${money(p.cost)} · ${p.years}yr · smarts ${p.minSmarts}+${p.requires?` · needs a ${p.requires}`:""}</button>`).join("")}</div>`}
        ` : `<div class="job-line">An undergraduate degree is needed before graduate school.</div>`}
        <div class="section-label">Professional schools</div>
        <div class="job-line">These are entered through their career tracks — Medicine, Dentistry and Law each include their own training years.</div>
        <div class="choices">
          ${["Medical","Legal"].map(cat=>`<button data-cat="${cat}">Study toward ${cat==="Medical"?"medicine or dentistry":"law"}</button>`).join("")}
        </div>
      </div>`;
    const g=(id,fn)=>{const el=document.getElementById(id); if(el) el.addEventListener("click",fn);};
    g("eduStudy",()=>{doStudyHarder();renderCareerSheetContent(overlay);});
    g("eduSkip",()=>{doSkipClass();renderCareerSheetContent(overlay);});
    g("eduCheat",()=>{doCheatTest();renderCareerSheetContent(overlay);});
    g("eduDrop",()=>{doDropPostgrad();renderCareerSheetContent(overlay);});
    g("eduDropStudy",()=>{doDropStudying();renderCareerSheetContent(overlay);});
    g("eduReturnBtn",()=>{ closeSheet(); openReturnToEducation(); render(); });
    overlay.querySelectorAll("[data-pg]").forEach(b=>b.addEventListener("click",()=>{doStartPostgrad(b.dataset.pg);renderCareerSheetContent(overlay);}));
    overlay.querySelectorAll("[data-cat]").forEach(b=>b.addEventListener("click",()=>{careerView={level:"tracks",category:b.dataset.cat};renderCareerSheetContent(overlay);}));
    document.getElementById("backBtn").addEventListener("click", ()=>{ careerView={level:"categories",category:null}; renderCareerSheetContent(overlay); });
    document.getElementById("closeSheetBtn").addEventListener("click", closeSheet);
    return;
  }

  if(careerView.level === "tracks"){
    const cat = careerView.category;

    if(cat === "Armed Forces"){
      overlay.innerHTML = `
        <div class="sheet"><button class="sheet-x" id="closeSheetBtn">✕</button>
          <div class="sheet-title"><button class="bk" id="backBtn">‹</button><h2>Armed Forces</h2></div>
          <p class="job-line">${forceNationNote()}</p>
          ${forcesAvailable().length === 0 ? `<p class="job-line">No service here is taking recruits from your background.</p>` : ""}
          ${forcesAvailable().map(f=>`
            <div class="track-card">
              <h3>${f.name}</h3>
              <span class="req-line">Other ranks: smarts ${f.minSmarts}+, health ${f.minHealth}+ · ${f.ranks.length - 1} promotions to the top</span>
              <div class="ladder-preview">${f.ranks[0]} → ${f.ranks[1]} → … → ${f.ranks[f.ranks.length-1]}</div>
              <span class="req-line">Officer: smarts ${f.officerMinSmarts}+ · ${f.officerRanks.length - 1} promotions to the top</span>
              <div class="ladder-preview">${f.officerRanks[0]} → ${f.officerRanks[1]} → … → ${f.officerRanks[f.officerRanks.length-1]}</div>
              <div class="choices">
                <button class="small" data-force="${f.id}" data-officer="0">Apply as recruit</button>
                <button class="small" data-force="${f.id}" data-officer="1">Apply as officer</button>
              </div>
            </div>
          `).join("")}
        </div>`;
      overlay.querySelectorAll("[data-force]").forEach(btn=>{
        const force = FORCES.find(f=>f.id===btn.dataset.force);
        btn.addEventListener("click", ()=>applyToForces(force, btn.dataset.officer==="1"));
      });
    } else if(cat === "Entrepreneurship"){
      overlay.innerHTML = `
        <div class="sheet"><button class="sheet-x" id="closeSheetBtn">✕</button>
          <div class="sheet-title"><button class="bk" id="backBtn">‹</button><h2>Start your own business</h2></div>
          <p class="job-line">No application, no ladder — just an investment and a roll of the dice each year. Running a business means giving up any other job.</p>
          ${BUSINESS_TYPES.map(b=>`
            <div class="track-card">
              <h3>${b.name}</h3>
              <span class="req-line">Start-up cost: ${money(b.startCost)} · Requires smarts ${b.minSmarts}+ · ~${Math.round(b.failChanceBase*100)}% chance of failing in year one</span>
              <button class="small" data-startbiz="${b.id}">Start this business</button>
            </div>
          `).join("")}
        </div>`;
      overlay.querySelectorAll("[data-startbiz]").forEach(btn=>{
        btn.addEventListener("click", ()=>startBusiness(btn.dataset.startbiz));
      });
    } else if(cat === "Politics"){
      overlay.innerHTML = `
        <div class="sheet"><button class="sheet-x" id="closeSheetBtn">✕</button>
          <div class="sheet-title"><button class="bk" id="backBtn">‹</button><h2>${currentSystem() === "monarchy" ? "The royal court" : currentSystem() === "authoritarian" ? "The party" : "Run for office"}</h2></div>
          <p class="job-line">${systemNote()}</p>
          <p class="job-line">${state.currentCountry}: ${currentSystem() === "democracy" ? "an elected government" : currentSystem() === "monarchy" ? "a monarchy with real executive power" : "a one-party state"}. Eleven rungs, ten steps to the top.</p>
          ${officesAvailable().map((o,i)=>{
            const held = !!state.flags["heldOffice_"+o.id];
            const open = !o.requiresPrevious || state.flags["heldOffice_"+o.requiresPrevious];
            return `
            <div class="track-card">
              <h3>${i+1}. ${o.title}${held ? " ✓" : ""}</h3>
              <span class="req-line">${o.campaignCost ? `${o.appointed ? "Cost of getting yourself noticed" : "Campaign cost"}: ${money(o.campaignCost)} · ` : ""}Requires smarts ${o.minSmarts}+${o.requiresPrevious ? ` · after ${officeById(o.requiresPrevious).title}` : ""}</span>
              <span class="req-line">${money(o.salary)}/yr · ${o.termYears >= 99 ? "held for life" : `${o.termYears}-year term`}</span>
              ${open
                ? `<button class="small" data-runfor="${o.id}">${o.id === "monarch" && !canInheritThrone() ? "Take the throne" : o.appointed ? `Put yourself forward for ${o.title}` : `Run for ${o.title}`}</button>`
                : `<button class="small" disabled>Serve as ${officeById(o.requiresPrevious).title} first</button>`}
            </div>`;
          }).join("")}
        </div>`;
      overlay.querySelectorAll("[data-runfor]").forEach(btn=>{
        btn.addEventListener("click", ()=>runForOffice(btn.dataset.runfor));
      });
    } else {
      const tracks = tracksInCategory(cat);
      const crimeNote = cat === "Organised Crime" ? `<p class="job-line">Paid in cash and never taxed — but every year builds police heat, arrests come with sentences that grow with your rank, and the violence is real. ${hasCriminalConnections() ? "You have the connections to be introduced." : "<b>You'd need connections first</b>: a crew, a criminal record, or a reputation."}</p>` : "";
      overlay.innerHTML = `
        <div class="sheet"><button class="sheet-x" id="closeSheetBtn">✕</button>
          <div class="sheet-title"><button class="bk" id="backBtn">‹</button><h2>${cat}</h2></div>
          ${crimeNote}
          ${tracks.map(t=>`
            <div class="track-card">
              <h3>${t.name}</h3>
              <span class="req-line">Requires: ${t.criminal ? `connections, smarts ${t.minSmarts}+` : t.minLooks ? `looks ${t.minLooks}+ (yours: ${state.stats.looks})${t.peakAge ? ` · work dries up after ${t.peakAge}` : ""}` : t.requiresDegree ? `a ${t.requiresDegree} degree` : t.requiresAnyDegree ? `a degree in ${t.requiresAnyDegree.join("/")}, smarts ${t.minSmarts}+` : t.minFollowers ? `${t.minFollowers.toLocaleString()} followers (yours: ${state.followers.toLocaleString()})` : t.requiresLicense ? `a ${LICENSE_BY_FLAG[t.requiresLicense]}, smarts ${t.minSmarts}+` : t.skill ? `${SKILL_LABELS[t.skill]} skill ${t.minSkill}+ (yours: ${state.skills[t.skill]||0})` : `${t.gate==="looks"?"looks":"smarts"} ${t.minSmarts||20}+`}${t.minHealth?`, health ${t.minHealth}+`:""}${t.requiresCleanRecord?", clean record":""}${t.training?` · ${t.training.years}-year ${t.training.label}`:""}</span>
              <div class="ladder-preview">${t.ladder[0].title} → ${t.ladder[1].title} → … → ${t.ladder[t.ladder.length-1].title} · ${t.ladder.length-1} promotions</div>
              <button class="small" data-track="${t.id}">Apply</button>
            </div>
          `).join("")}
        </div>`;
      overlay.querySelectorAll("[data-track]").forEach(btn=>{
        const track = tracks.find(t=>t.id===btn.dataset.track);
        btn.addEventListener("click", ()=>applyToTrack(track));
      });
    }
    document.getElementById("backBtn").addEventListener("click", ()=>{ careerView={level:"categories",category:null}; renderCareerSheetContent(overlay); });
    document.getElementById("closeSheetBtn").addEventListener("click", closeSheet);
    return;
  }
}

function closeSheet(){
  const el = document.getElementById("sheetOverlay");
  if(el) el.remove();
}

// Refreshes the Activities sheet in place (same tab, updated numbers) instead
// of closing and reopening it — keeps the person from having to re-navigate
// tabs after every small action.
function refreshActivitySheet(){
  render();
  const ov = document.getElementById("sheetOverlay");
  if(ov) renderActivitySheetContent(ov);
}

// Same idea for the Career sheet — used by the business hire/sell actions so
// the status card updates without dropping back to the category list.
function refreshPeopleSheet(){
  render();
  const ov = document.getElementById("sheetOverlay");
  if(ov) renderPeopleSheetContent(ov);
}

function refreshCareerSheet(){
  render();
  const ov = document.getElementById("sheetOverlay");
  if(ov) renderCareerSheetContent(ov);
}

installSheetPolish();
render();
})();
</script>
</body>
</html>

// ---------- Relationship interactions ----------
// Family, friends and partners can all be engaged with directly rather than
// only drifting on their own.

function findPerson(id){
  return state.family.find(p=>p.id===id)
      || state.friends.find(p=>p.id===id)
      || (state.relationship && state.relationship.id===id ? state.relationship : null);
}

function doSpendTime(id){
  const p = findPerson(id);
  if(!p || !p.alive && p.alive !== undefined) { refreshPeopleSheet(); return; }
  if(isAbroad(p)){ addLog(`${p.name} lives in ${abroadLabel(p)}.`); refreshPeopleSheet(); return; }
  if(usesLeft("social") <= 0){ addLog("No more time for visits this year."); refreshPeopleSheet(); return; }
  if(!spendAction("social")){ refreshPeopleSheet(); return; }
  recordUse("social");
  p.closeness = clamp((p.closeness||50) + rand(4,10));
  p.lastContactAge = state.age;
  nudge("happiness", rand(2,5));
  addLog(`Spent time with ${p.name}. Closeness now ${p.closeness}.`);
  refreshPeopleSheet();
}

// Everyone you'd reasonably keep up with: living family, friends and a partner.
function socialCircle(){
  const circle = [];
  (state.family || []).forEach(p=>{ if(p.alive && isHere(p)) circle.push(p); });
  (state.friends || []).forEach(f=>{ if(isHere(f)) circle.push(f); });
  if(state.relationship) circle.push(state.relationship);
  return circle;
}

// One press to see the whole circle. It costs one action and the year's whole
// social allowance, but it holds every relationship steady at once — the
// trade-off against spending that time deeply with one person.
function doSpendTimeWithEveryone(){
  const circle = socialCircle();
  if(!circle.length){ addLog("There's nobody to catch up with."); refreshPeopleSheet(); return; }
  if(usesLeft("social") <= 0){ addLog("No more time for visits this year."); refreshPeopleSheet(); return; }
  if(!spendAction("social")){ refreshPeopleSheet(); return; }
  // A round of everyone uses up the year's social time, however many are left.
  const left = usesLeft("social");
  for(let i=0;i<left;i++) recordUse("social");

  circle.forEach(p=>{
    p.closeness = clamp((p.closeness||50) + rand(2,5));
    p.lastContactAge = state.age;
  });
  // Grown-up children count too, and get their bond topped up.
  const adults = (state.children||[]).filter(c=>c.adult && isHere(c));
  adults.forEach(c=>{
    c.bond = clamp((c.bond===undefined?50:c.bond) + rand(2,5));
    c.lastContactAge = state.age;
  });

  nudge("happiness", rand(4,8));
  nudgeHidden("energy", -6);
  const total = circle.length + adults.length;
  addLog(`Made the rounds — caught up with all ${total} of them. Everyone a little closer, nobody neglected.`, true);
  refreshPeopleSheet();
}

function doGiveGift(id){

// ---------- One screen per person ----------
// Every relationship opens onto its own page: who they are, how close you
// are, and the things you can actually do with that particular person. A
// partner gets the things partners do, a child the things parents do, and a
// rival the things rivals do.

// The kinds of people the Relationships screen lists, and where each lives.
function personByRef(kind, id){
  switch(kind){
    case "family":  return (state.family||[]).find(p=>p.id===id) || null;
    case "friend":  return (state.friends||[]).find(p=>p.id===id) || null;
    case "partner": return state.relationship && state.relationship.id===id ? state.relationship : null;
    case "child":   return (state.children||[]).find(p=>p.id===id) || null;
    case "enemy":   return (state.enemies||[]).find(p=>p.id===id) || null;
    case "pet":     return (state.pets||[]).find(p=>p.id===id) || null;
    case "ex":      return (state.exes||[]).find(p=>p.id===id && p.alive) || null;
  }
  return null;
}

// Children keep a "bond", everyone else a "closeness". Same idea, older name.
function warmthKey(kind){ return kind === "child" ? "bond" : "closeness"; }
function warmthOf(p, kind){
  const k = warmthKey(kind);
  if(p[k] === undefined) p[k] = 50;
  return p[k];
}
function nudgeWarmth(p, kind, d){
  const k = warmthKey(kind);
  p[k] = clamp((p[k] === undefined ? 50 : p[k]) + d);
  return p[k];
}

function personIcon(p, kind){
  if(kind === "pet"){ return {dog:"🐕", cat:"🐈", exotic:"🦎"}[p.typeId] || "🐾"; }
  if(p.alive === false) return "🕯️";
  if(kind === "enemy") return "😠";
  const girl = p.gender === "Girl";
  if(kind === "child" || (kind === "family" && (p.relation === "Sibling" || p.relation === "Step-sibling"))){
    if(p.age < 4) return "👶";
    if(p.age < 13) return girl ? "👧" : "👦";
    if(p.age < 18) return "🧑";
  }
  if(kind === "family"){
    if(p.relation === "Mother" || p.relation === "Grandmother" || p.relation === "Stepmother") return p.age >= 65 ? "👵" : "👩";
    if(p.relation === "Father" || p.relation === "Grandfather" || p.relation === "Stepfather") return p.age >= 65 ? "👴" : "👨";
  }
  if(kind === "partner") return girl ? "👩" : "👨";
  if(kind === "friend") return girl ? "🙋‍♀️" : "🙋‍♂️";
  return girl ? "👩" : "👨";
}

// What to call them on their own page.
function personRelationLabel(p, kind){
  if(kind === "partner") return state.married ? (p.gender === "Girl" ? "Wife" : "Husband") : state.engaged ? "Fiancé(e)" : "Partner";
  if(kind === "child") return (p.gender === "Girl" ? "Daughter" : "Son") + (p.adopted ? " (adopted)" : "");
  if(kind === "friend") return p.isBestFriend ? "Best friend" : "Friend";
  if(kind === "enemy") return "Rival";
  if(kind === "pet"){ const d = PET_TYPES.find(x=>x.id===p.typeId); return d ? d.name : "Pet"; }
  if(kind === "ex") return exLabel(p);
  if(p.relation === "Sibling") return p.gender === "Girl" ? "Sister" : "Brother";
  if(p.relation === "Step-sibling") return p.gender === "Girl" ? "Stepsister" : "Stepbrother";
  return p.relation || "Family";
}

// A relationship bar small enough to sit inside a list row.
function miniBar(v, invert){
  const val = Math.max(0, Math.min(100, Math.round(v)));
  const bad = invert ? val >= 60 : val <= 25;
  const good = invert ? val <= 25 : val >= 70;
  return `<span class="mbar"><span class="${bad ? "low" : good ? "high" : ""}" style="width:${val}%"></span></span>`;
}

function personRow(p, kind){
  ensurePersonAge(p);
  const dead = p.alive === false;
  const label = personRelationLabel(p, kind);
  let sub;
  if(dead){
    const at = p.ageAtDeath !== undefined ? p.ageAtDeath : p.age;
    sub = `Died at ${at}${p.causeOfDeath ? ` · ${p.causeOfDeath}` : ""}`;
  } else if(kind === "enemy"){
    sub = `Hostility ${miniBar(p.hostility, true)}`;
  } else if(kind === "pet"){
    sub = `Age ${p.age}`;
  } else {
    sub = `Relationship ${miniBar(warmthOf(p, kind))}`;
  }
  if(isAbroad(p)) sub += dead ? ` · buried in ${abroadLabel(p)}` : ` · 🌍 in ${abroadLabel(p)}`;
  return menuRow({
    icon: personIcon(p, kind),
    title: `${p.name} <span class="rel-tag">(${label}${p.age !== undefined && !dead ? `, ${p.age}` : ""})</span>`,
    sub,
    attr: `data-person="${kind}:${p.id}"`,
  });
}

// An action row on someone's page. "•••" marks something that happens when
// you press it; a chevron is kept for rows that open another screen.
function actionRow(act, icon, title, sub, opts){
  const o = opts || {};
  return menuRow({ icon, title, sub, value: o.value || "", attr: `data-pact="${act}"`, disabled: !!o.disabled, chevron: false, dots: !o.opens, opens: !!o.opens });
}

// ---- Gifts, at four sizes ----
const GIFT_TIERS = [
  { id:"small",   label:"Something small",   cost:25,    gain:[2,6],   happy:1 },
  { id:"good",    label:"A thoughtful gift", cost:150,   gain:[6,14],  happy:2 },
  { id:"lavish",  label:"Something lavish",  cost:1000,  gain:[12,22], happy:4 },
  { id:"lavish2", label:"An extravagance",   cost:10000, gain:[18,30], happy:6 },
];

function doGiftTier(kind, id, tierId){
  { const who = personByRef(kind, id); if(who && isAbroad(who)){ addLog(`${who.name} lives in ${abroadLabel(who)}.`); refreshPeopleSheet(); return; } }
  const p = personByRef(kind, id);
  const t = GIFT_TIERS.find(x=>x.id===tierId);
  if(!p || !t){ refreshPeopleSheet(); return; }
  const cost = eraMoney(t.cost);
  if(state.money < cost){ addLog(`Not enough money for ${t.label.toLowerCase()}.`); refreshPeopleSheet(); return; }
  if(usesLeft("social") <= 0){ addLog("No more time for that this year."); refreshPeopleSheet(); return; }
  if(!spendAction("social")){ refreshPeopleSheet(); return; }
  recordUse("social");
  addMoney(-cost);
  // A gift far beyond what the relationship is used to lands a little oddly.
  let gain = rand(t.gain[0], t.gain[1]);
  if(t.id === "lavish2" && warmthOf(p, kind) < 30) gain = Math.round(gain * 0.5);
  nudgeWarmth(p, kind, gain);
  p.lastContactAge = state.age;
  if(kind === "child") p.happiness = clamp((p.happiness||50) + rand(2,6));
  nudge("happiness", t.happy);

// ---- Partners: anniversaries, vows and counselling ----
const ANNIVERSARY_PLANS = [
  { id:"card",    label:"A card and a kiss",         cost:0,    gain:[1,4],   happy:1 },
  { id:"dinner",  label:"Dinner somewhere good",     cost:90,   gain:[4,9],   happy:3 },
  { id:"weekend", label:"A weekend away",            cost:450,  gain:[8,15],  happy:6 },
  { id:"big",     label:"Something unforgettable",   cost:3500, gain:[14,24], happy:10 },
];

function yearsMarried(){
  return state.married && state.marriedAtAge !== undefined ? Math.max(0, state.age - state.marriedAtAge) : 0;
}

function doAnniversary(planId){
  const r = state.relationship;
  const plan = ANNIVERSARY_PLANS.find(x=>x.id===planId);
  if(!r || !state.married || !plan){ refreshPeopleSheet(); return; }
  if(state.lastAnniversaryYear === state.year){ addLog("You've already marked the anniversary this year."); refreshPeopleSheet(); return; }
  const cost = eraMoney(plan.cost);
  if(state.money < cost){ addLog("Can't stretch to that this year."); refreshPeopleSheet(); return; }
  if(!spendAction("anniversary")){ refreshPeopleSheet(); return; }
  recordUse("anniversary");
  if(cost) addMoney(-cost);
  state.lastAnniversaryYear = state.year;
  const y = yearsMarried();
  r.closeness = clamp(r.closeness + rand(plan.gain[0], plan.gain[1]));
  nudge("happiness", plan.happy);
  addLog(`Marked ${y ? `${y} year${y===1?"":"s"} of marriage` : "your first anniversary"} with ${r.name} — ${plan.label.toLowerCase()}${cost ? ` (${money(cost)})` : ""}. Closeness now ${r.closeness}.`, plan.id === "big");
  peopleView.sub = null;
  refreshPeopleSheet();
}

function canRenewVows(){
  if(!state.married || !state.relationship) return false;
  if(yearsMarried() < 10) return false;
  return state.vowsRenewedAge === undefined || state.age - state.vowsRenewedAge >= 10;
}

function doRenewVows(){
  const r = state.relationship;
  if(!r || !canRenewVows()){ refreshPeopleSheet(); return; }
  const cost = eraMoney(2500);
  if(state.money < cost){ addLog(`Renewing your vows properly costs ${money(cost)}.`); refreshPeopleSheet(); return; }
  if(usesLeft("vows") <= 0){ refreshPeopleSheet(); return; }
  if(!spendAction("vows")){ refreshPeopleSheet(); return; }
  recordUse("vows");
  addMoney(-cost);
  state.vowsRenewedAge = state.age;
  r.closeness = clamp(r.closeness + rand(15,25));
  nudge("happiness", rand(8,12));
  milestone("milestone", `Renewed your vows with ${r.name} after ${yearsMarried()} years of marriage.`, { icon:"💞", label:"Vows renewed", tone:"good" });
  refreshPeopleSheet();
}

function doCounselling(){
  const r = state.relationship;
  if(!r){ refreshPeopleSheet(); return; }
  const cost = eraMoney(600);
  if(state.money < cost){ addLog(`A course of counselling costs ${money(cost)}.`); refreshPeopleSheet(); return; }
  if(usesLeft("counsel") <= 0){ addLog("You're already in counselling this year."); refreshPeopleSheet(); return; }
  if(!spendAction("counsel")){ refreshPeopleSheet(); return; }
  recordUse("counsel");
  addMoney(-cost);
  // Works best where there's still something to work with, and for people
  // willing to listen.
  const chance = clamp(0.4 + r.closeness/250 + state.stats.smarts/500, 0.85, 0.2);
  if(Math.random() < chance){
    r.closeness = clamp(r.closeness + rand(10,20));
    nudge("happiness", 4);
    nudgeHidden("stress", -5);
    addLog(`Counselling with ${r.name} helped — you're talking properly again. Closeness now ${r.closeness}.`);
  } else {
    r.closeness = clamp(r.closeness + rand(-3,3));
    addLog(`Went to counselling with ${r.name}. Neither of you got much from it.`);
  }
  refreshPeopleSheet();
}

// A standing arrangement, rather than a decision made in the moment.
function setBirthControl(on){
  state.birthControl = !!on;
  addLog(on
    ? `Agreed with ${state.relationship ? state.relationship.name : "your partner"} to use contraception as a matter of course.`
    : `Agreed with ${state.relationship ? state.relationship.name : "your partner"} to stop using contraception.`);
  refreshPeopleSheet();
}

// Ending a marriage, with the settlement the prenup was signed for.
function divorceSettlement(){
  const r = state.relationship;
  if(!r) return 0;
  // Without a prenup a court moves the two of you a long way towards equal;
  // with one, only a little. Positive: you pay. Negative: you receive.
  const gap = Math.max(0, state.money) - partnerNetWorth(r);
  const share = state.hasPrenup ? 0.1 : 0.4;
  let transfer = Math.round(gap * share / 2);
  if(transfer > 0) transfer = Math.min(transfer, Math.max(0, state.money));
  return transfer;
}

function openDivorceChoice(){
  const r = state.relationship;
  if(!r) return;
  if(!state.married){
    closeSheet();
    queueChoice({
      title: `End things with ${r.name}?`,
      text: `You've been together ${state.relationshipYears||0} year${(state.relationshipYears||0)===1?"":"s"}.`,
      options: [
        { label: "End the relationship", effect: ()=>{ doBreakup(); } },
        { label: "Stay together", effect: ()=>{ addLog("Decided to give it another go."); } },
      ],
    });
    return;
  }
  const t = divorceSettlement();
  closeSheet();
  queueChoice({
    title: `Divorce ${r.name}?`,
    text: `${yearsMarried()} year${yearsMarried()===1?"":"s"} of marriage. ${state.hasPrenup ? "The prenup holds the settlement to a tenth of the gap between you." : "With no prenup, the court will move the two of you a long way towards equal."} ` +
      (t > 0 ? `Expect to pay ${r.name} about ${money(t)}.` : t < 0 ? `Expect to receive about ${money(-t)}.` : "Neither of you has much to divide."),
    options: [
      { label: "File for divorce", effect: ()=>{ doDivorce(); } },
      { label: "Stay married", effect: ()=>{ addLog("Decided against it — for now."); } },
    ],
  });
}

function doDivorce(){
  const r = state.relationship;
  if(!r || !state.married) return;
  const t = divorceSettlement();
  if(t > 0) addMoney(-t);
  else if(t < 0) addMoney(-t);
  const name = r.name;
  state.married = false;
  state.engaged = false;
  state.relationship = null;
  state.relationshipYears = 0;
  state.hasPrenup = false;
  state.birthControl = false;
  state.flags.divorced = true;
  nudge("happiness", -rand(10,18));
  milestone("milestone", t > 0 ? `Divorced ${name}. The settlement cost you ${money(t)}.`
    : t < 0 ? `Divorced ${name}, and received ${money(-t)} in the settlement.`
    : `Divorced ${name}.`, { icon:"💔", label:"Divorced", tone:"bad" });
  maybeCustodyBattle(true);
}

// ---- Spying ----
// It costs nothing but nerve, and finds out things you may not want to know.
function doSpy(kind, id){
  const p = personByRef(kind, id);
  if(!p){ refreshPeopleSheet(); return; }
  if(usesLeft("spy") <= 0){ addLog("You've done enough snooping for one year."); refreshPeopleSheet(); return; }
  if(!spendAction("spy")){ refreshPeopleSheet(); return; }
  recordUse("spy");
  closeSheet();

  const caught = Math.random() < 0.22;
  if(caught){
    nudgeWarmth(p, kind, -rand(8,18));
    nudge("happiness", -4);
  }
  const caughtLine = caught ? ` ${p.name} caught you at it, and wasn't pleased.` : "";

  if(kind === "partner"){
    // A neglected relationship is where things go on behind your back.
    const unfaithful = Math.random() < 0.03 + (100 - p.closeness) / 350;
    const roll = Math.random();
    if(unfaithful){
      queueChoice({
        title: "What you found",
        text: `Messages on ${p.name}'s phone make it plain: there's someone else.${caughtLine}`,
        options: [
          { label: "Confront them", effect: ()=>{
              if(Math.random() < 0.55){
                p.closeness = clamp(p.closeness - rand(10,20));
                nudge("happiness", -8);
                addLog(`Confronted ${p.name}. They admitted it, swore it was over, and asked for another chance.`, true);
              } else {
                nudge("happiness", -12);
                addLog(`Confronted ${p.name}, who decided to leave rather than explain.`, true);
                if(state.married) doDivorce(); else doBreakup();
              }
            }},
          { label: state.married ? "File for divorce" : "End it", effect: ()=>{ if(state.married) doDivorce(); else doBreakup(); } },
          { label: "Say nothing", effect: ()=>{ nudge("happiness", -10); nudgeHidden("stress", 10); addLog(`Said nothing about what you found on ${p.name}'s phone. It sits with you.`); } },
        ],
      });
    } else if(roll < 0.14){
      const debt = eraMoney(rand(2000, 25000));
      queueChoice({
        title: "What you found",
        text: `${p.name} has been hiding ${money(debt)} of debt.${caughtLine}`,
        options: [
          { label: `Pay it off — ${money(debt)}`, effect: ()=>{
              if(state.money < debt){ addLog("You haven't the money to clear it."); return; }
              addMoney(-debt); p.closeness = clamp(p.closeness + rand(8,16));
              addLog(`Cleared ${p.name}'s ${money(debt)} debt. They didn't know what to say.`, true); }},
          { label: "Have it out with them", effect: ()=>{ p.closeness = clamp(p.closeness - rand(4,10)); addLog(`Had it out with ${p.name} about the debt.`); } },
          { label: "Leave it", effect: ()=>{ addLog("Decided it wasn't your business, yet."); } },
        ],
      });
    } else if(roll < 0.24){
      addLog(`Found out ${p.name} has been quietly putting money aside — about ${money(partnerNetWorth(p))} to their name.${caughtLine}`, true);
    } else {
      addLog(`Went through ${p.name}'s things and found nothing at all.${caughtLine}${caught ? "" : " Which is something."}`);
    }
  } else if(kind === "child"){
    const roll = Math.random();
    if(roll < 0.16){
      queueChoice({
        title: "What you found",
        text: `${p.name} has been skipping school.${caughtLine}`,
        options: [
          { label: "Sit them down about it", effect: ()=>{ p.smarts = clamp((p.smarts||50) + rand(2,6)); p.bond = clamp((p.bond||50) - rand(0,4)); addLog(`Talked to ${p.name} about skipping school. They're back in lessons.`); } },
          { label: "Ground them", effect: ()=>{ p.smarts = clamp((p.smarts||50) + rand(1,4)); p.bond = clamp((p.bond||50) - rand(5,10)); p.happiness = clamp((p.happiness||50) - rand(4,8)); addLog(`Grounded ${p.name}.`); } },
          { label: "Let it go", effect: ()=>{ p.smarts = clamp((p.smarts||50) - rand(2,5)); addLog(`Let ${p.name}'s truancy slide.`); } },
        ],
      });
    } else if(roll < 0.28){
      queueChoice({
        title: "What you found",
        text: `${p.name} is being bullied at school, and hasn't told anyone.${caughtLine}`,
        options: [
          { label: "Talk to them, and to the school", effect: ()=>{ p.happiness = clamp((p.happiness||50) + rand(6,14)); p.bond = clamp((p.bond||50) + rand(6,12)); addLog(`Got ${p.name} the support they needed. Things are better.`, true); } },
          { label: "Teach them to stand up for themselves", effect: ()=>{ if(Math.random()<0.5){ p.happiness = clamp((p.happiness||50)+rand(4,10)); addLog(`${p.name} stood up to them. It worked.`); } else { p.health = clamp((p.health||70)-rand(3,8)); addLog(`${p.name} stood up to them and came off worse.`); } } },
          { label: "Say nothing", effect: ()=>{ p.happiness = clamp((p.happiness||50) - rand(4,10)); addLog(`Kept what you found to yourself.`); } },
        ],
      });
    } else if(roll < 0.38){
      addLog(`Found cigarettes in ${p.name}'s room.${caughtLine}`, true);
      p.flags = p.flags || {}; p.flags.smoker = true;
    } else if(roll < 0.5){
      addLog(`Found a notebook full of ${pick(["songs","drawings","stories","poems","code"])} in ${p.name}'s room. They're better at it than you'd guessed.${caughtLine}`);
    } else {
      addLog(`Looked through ${p.name}'s things. Nothing to worry about.${caughtLine}`);
    }
  }
  render();
}

// ---- Children: the doctor, and giving a child up ----
function inBritain(){

}

function doChildDoctor(id){

// ---- The everyday interactions everyone gets ----
function doPersonTalk(kind, id, how){
  const p = personByRef(kind, id);
  if(!p){ refreshPeopleSheet(); return; }
  if(usesLeft("social") <= 0){ addLog("No more time for that this year."); refreshPeopleSheet(); return; }
  if(!spendAction("social")){ refreshPeopleSheet(); return; }
  recordUse("social");
  p.lastContactAge = state.age;
  const w = warmthOf(p, kind);
  if(how === "talk"){
    if(Math.random() < 0.15){
      nudgeWarmth(p, kind, -rand(1,3));
      addLog(`Tried to have a proper conversation with ${p.name}. It never got going.`);
    } else {
      nudgeWarmth(p, kind, rand(1,5));
      nudge("happiness", 1);
      addLog(`Had a good long talk with ${p.name}. ${kind==="child"?"Bond":"Closeness"} now ${warmthOf(p, kind)}.`);
    }
  } else if(how === "compliment"){
    // From someone who barely likes you, a compliment reads as wanting something.
    if(w < 25 && Math.random() < 0.4){
      nudgeWarmth(p, kind, -rand(1,3));
      addLog(`Paid ${p.name} a compliment. They didn't buy it.`);
    } else {
      nudgeWarmth(p, kind, rand(2,6));
      if(kind === "child") p.happiness = clamp((p.happiness||50) + rand(1,4));
      nudge("happiness", 1);
      addLog(`Paid ${p.name} a compliment. It landed.`);
    }
  } else if(how === "insult"){
    if(kind === "enemy"){
      p.hostility = clamp(p.hostility + rand(5,15));
      nudge("happiness", rand(1,4));
      addLog(`Told ${p.name} exactly what you think of them. Hostility now ${p.hostility}.`);
    } else {
      const after = nudgeWarmth(p, kind, -rand(8,18));
      nudge("happiness", rand(-3,2));
      nudgeHidden("karma", -3);
      addLog(`Insulted ${p.name}. ${kind==="child"?"Bond":"Closeness"} now ${after}.`);
      // Push someone far enough and they stop being a friend.
      if(kind === "friend" && after < 10 && Math.random() < 0.5){
        state.friends = state.friends.filter(f=>f.id!==p.id);
        makeEnemy(`you insulted them once too often`);
      }
    }
  }
  refreshPeopleSheet();
}

function doAskChildForMoney(id){
  const c = personByRef("child", id);
  if(!c || !c.adult){ refreshPeopleSheet(); return; }
  if(usesLeft("social") <= 0){ addLog("No more time for that this year."); refreshPeopleSheet(); return; }
  if(!spendAction("social")){ refreshPeopleSheet(); return; }
  recordUse("social");
  const chance = clamp((c.bond===undefined?50:c.bond)/120, 0.85, 0.05);
  const can = Math.max(0, Math.round((c.netWorth||0) * 0.1));
  if(can > 0 && Math.random() < chance){
    const amt = Math.min(can, rand(200, 5000));
    addMoney(amt);
    c.netWorth = (c.netWorth||0) - amt;
    c.bond = clamp((c.bond||50) - rand(2,6));
    addLog(`${c.name} gave you ${money(amt)}.`);
  } else {
    c.bond = clamp((c.bond||50) - rand(4,10));
    addLog(can > 0 ? `Asked ${c.name} for money. They said no.` : `Asked ${c.name} for money they don't have.`);
  }
  refreshPeopleSheet();
}

function doEndFriendship(id){

// ---- The person's own page ----
function renderPersonPage(p, kind){
  ensurePersonAge(p);
  const dead = p.alive === false;
  const label = personRelationLabel(p, kind);
  const ageLine = dead ? `died at ${p.ageAtDeath !== undefined ? p.ageAtDeath : p.age}` : `age ${p.age}`;
  const social = usesLeft("social");
  const socialSub = social > 0 ? `${social} social ${social===1?"slot":"slots"} left this year` : "No social time left this year";
  const noSocial = social <= 0;

  // --- who they are ---
  let card = `<div class="person-card">
    <div class="pc-head"><span class="pc-icon">${personIcon(p, kind)}</span>
      <span class="pc-txt"><span class="pc-name">${p.name}</span><span class="pc-sub">${label} · ${ageLine}</span></span></div>`;
  if(!dead && kind === "enemy"){
    card += `<div class="pc-bar"><span>Hostility</span><div class="bar-track"><div class="bar-fill ${p.hostility>=60?"low":""}" style="width:${p.hostility}%"></div></div><span class="pc-v">${p.hostility}</span></div>
      <div class="job-line">${p.reason}</div>`;
  } else if(!dead && kind !== "pet"){
    const w = warmthOf(p, kind);
    card += `<div class="pc-bar"><span>Relationship</span><div class="bar-track"><div class="bar-fill ${w<=25?"low":w>=70?"high":""}" style="width:${w}%"></div></div><span class="pc-v">${w}</span></div>`;
  }
  if(dead && p.causeOfDeath) card += `<div class="job-line">${p.causeOfDeath}</div>`;
  if(kind === "family" && p.siblingOutcome) card += `<div class="job-line">${p.siblingOutcome}</div>`;
  if(kind === "family" && p.isMonarch && !dead) card += `<div class="job-line">Reigning ${p.relation==="Mother"?"Queen":"King"}</div>`;
  if(kind === "friend" && p.lastContactAge !== undefined && state.age - p.lastContactAge >= 3){
    card += `<div class="job-line" style="color:var(--bad)">Drifting — ${state.age - p.lastContactAge} years since you saw them.</div>`;
  }
  if(kind === "partner"){
    card += `<div class="review-row"><span>Together</span><span class="v">${state.relationshipYears||0} year${(state.relationshipYears||0)===1?"":"s"}</span></div>`;
    if(state.married) card += `<div class="review-row"><span>Married</span><span class="v">${yearsMarried()} year${yearsMarried()===1?"":"s"}${state.hasPrenup ? " · prenup" : ""}</span></div>`;
    card += `<div class="review-row"><span>Their net worth</span><span class="v">${money(partnerNetWorth(p))}</span></div>`;
    if(state.age >= 18) card += `<div class="review-row"><span>Contraception</span><span class="v">${state.birthControl ? "as a matter of course" : "decided in the moment"}</span></div>`;
  }
  if(kind === "child"){
    card += `<div class="review-row"><span>Health</span><span class="v">${p.health}</span></div>
      <div class="review-row"><span>Happiness</span><span class="v">${p.happiness}</span></div>
      ${p.smarts !== undefined ? `<div class="review-row"><span>Smarts</span><span class="v">${p.smarts}</span></div>` : ""}`;
    if(p.adult){
      card += `<div class="review-row"><span>Education</span><span class="v">${p.educationLabel || "—"}</span></div>
        <div class="review-row"><span>Work</span><span class="v">${p.careerLabel ? p.careerLabel.replace(/^(a|an) /,"") : "—"}</span></div>
        <div class="review-row"><span>Earning</span><span class="v">${p.income ? money(p.income)+"/yr" : "nothing right now"}</span></div>
        <div class="review-row"><span>Their net worth</span><span class="v">${money(p.netWorth||0)}</span></div>
        <div class="review-row"><span>Settled down</span><span class="v">${p.partnered ? `with ${p.partnerName}` : "not yet"}</span></div>
        <div class="review-row"><span>Grandchildren</span><span class="v">${(p.ownChildren||[]).length || p.grandchildren || 0}</span></div>
        ${(p.ownChildren||[]).length ? `<div class="job-line">${p.ownChildren.map(g=>`${g.name} (${g.age})`).join(" · ")}</div>` : ""}`;
    }
  }
  card += `</div>`;
  if(!dead && kind !== "pet" && isAbroad(p)) return abroadPersonPage(p, kind, card);

  // --- sub-screens: choosing a gift or an anniversary ---
  if(peopleView.sub === "gift"){
    return card + `<div class="section-label">Choose a gift</div><div class="menulist">

// Routes a press on someone's page to what it does.
function runPersonAction(kind, id, act){
  const p = personByRef(kind, id);
  if(!p){ peopleView.person = null; refreshPeopleSheet(); return; }
  // Actions written for the old Activities sheet re-render that sheet; this
  // puts the person's page back on top afterwards.
  const thenPeople = (fn)=>{ fn(); if(document.getElementById("sheetOverlay")) refreshPeopleSheet(); };
  // Nothing in person with someone in another country.
  if(isAbroad(p) && !["call","invite","cutcontact","unfriend"].includes(act)){
    addLog(p.alive === false ? `${p.name} is buried in ${abroadLabel(p)}.` : `${p.name} lives in ${abroadLabel(p)} — you'd have to ${callVerb().verb.toLowerCase().replace(" them","")} instead.`);
    return refreshPeopleSheet();
  }
  if(act.startsWith("enc:")) return doAdultChild(id, act.slice(4));
  switch(act){
    case "call":      return doCallAbroad(kind, id);
    case "invite":    return doInviteToJoin(kind, id);
    case "time":      return doSpendTime(id);
    case "talk":      return doPersonTalk(kind, id, "talk");
    case "compliment":return doPersonTalk(kind, id, "compliment");
    case "insult":    return doPersonTalk(kind, id, "insult");
    case "gift":      peopleView.sub = "gift"; return refreshPeopleSheet();
    case "money":     return kind === "child" ? doAskChildForMoney(id) : doAskForMoney(id);
    case "argue":     return kind === "partner" ? thenPeople(doArgument) : doArgueWith(id);
    case "grave":     return doVisitGrave(id);
    case "unfriend":  return doEndFriendship(id);
    case "play":      return doPlayWithPet(id);
    case "petshow":   doPetShow(id); return refreshPeopleSheet();
    case "confront":  return doConfrontEnemy(id);
    case "peace":     return doMakePeace(id);
    case "ptime":     return doParent(id, "time");
    case "homework":  return doParent(id, "homework");
    case "tuition":   return doParent(id, "tuition");
    case "treat":     return doParent(id, "treat");
    case "discipline":return doParent(id, "discipline");
    case "doctor":    return doChildDoctor(id);
    case "adoptout":  return openAdoptOutChoice(id);
    case "visit":     return doAdultChild(id, "visit");
    case "help":      return doAdultChild(id, "help");
    case "spy":       return doSpy(kind, id);
    case "reconcile": return doReconcile(id);
    case "cutcontact":return doCutContact(id);
    case "date":      return thenPeople(doDateNight);
    case "cinema":    return doCinema();
    case "getaway":   return thenPeople(doGetaway);
    case "intimacy":  return promptIntimacy();
    case "anniversary": peopleView.sub = "anniversary"; return refreshPeopleSheet();
    case "vows":      return doRenewVows();
    case "counsel":   return doCounselling();
    case "birthcontrol": return setBirthControl(!state.birthControl);
    case "baby":      return thenPeople(doTryForBaby);
    case "propose":   return openProposalFlow();
    case "wedding":   closeSheet(); openWeddingPlanner(); return render();
    case "honeymoon": closeSheet(); openHoneymoonChoice(); return render();
    case "end":       return openDivorceChoice();
  }
}

function doCinema(){
  const r = state.relationship;
  if(!r) return;
  const cost = eraMoney(20);
  if(state.money < cost){ addLog("Not enough money for the cinema."); refreshPeopleSheet(); return; }
  if(!spendAction("date")){ refreshPeopleSheet(); return; }
  addMoney(-cost);
  commitAction();
  r.closeness = clamp(r.closeness + rand(2,6));
  nudge("happiness", 3);
  addLog(`Went to see ${pick(["a thriller","a comedy","something with subtitles","the new blockbuster","a horror film","an old classic"])} with ${r.name}.`);
  refreshPeopleSheet();
}

function iconFor(text){
  const t = String(text).toLowerCase();
  for(const [re, icon] of ROW_ICONS) if(re.test(t)) return icon;
  for(const [re, icon] of MORE_ICONS) if(re.test(t)) return icon;
  return "";
}

// The kind of answer, when nothing names the thing itself.
const ANSWER_ICONS = [
  [/^(try|give it a go|do it|go for|take (it|the|them|a)\b|yes|sure|why not|keep|stay|carry on|continue|join|help|support)/, "👍"],
  [/^(decline|no\b|not interested|don't|do not|never|refuse|reject|pass\b|skip|walk away|say no)/, "🙅"],
  [/^(let it go|leave it|forget it|move on|drop it|shrug)/, "🤷"],
  [/^(ask|enquire|find out|look into|check)/, "❓"],
  [/^(tell|say|explain|admit|confess|own it)/, "🗣️"],
  [/^(wait|think|sleep on it|later)/, "⏳"],
];
// Always an emoji: the specific, then the kind of answer, then a pointer.
function iconOrDefault(title, sub){
  const t = String(title||"").replace(/<[^>]*>/g,"");
  const direct = iconFor(t) || iconFor(sub||"");
  if(direct) return direct;
  const low = t.toLowerCase().trim();
  for(const [re, icon] of ANSWER_ICONS) if(re.test(low)) return icon;
  return "👉";
}

// A part of a label that is only an amount of money: "£40", "€2,925 (£2,500)",
// "~£50", "₹1,200/yr", "free".
function isPriceText(s){
  const t = s.trim();
  if(/^free$/i.test(t)) return true;
  if(t.length > 34 || !/\d/.test(t)) return false;
  // A length of time is not a price: "1yr", "3 years", "6 months".
  if(/^\d+\s*(yr|yrs|years?|mo|months?|wk|weeks?)$/i.test(t)) return false;
  // Strip what a price may contain, and see if anything wordy is left.
  const rest = t.replace(/\([^)]*\)/g, "").replace(/[~≈+−\-]?\s*[\d.,]+\s*(k|m|bn)?/gi, "").replace(/\/(yr|year|mo|month|week|wk|spin|hand|go|night)\b/gi, "")
    .replace(/\b(a|per|each|lump sum|entry|deposit|upkeep)\b/gi, "").replace(/so'm|lei|kr|zł|ft|kč|лв|[A-Z]{3}/g, "").trim();
  return rest.length <= 2;
}

// Buttons that take you somewhere rather than doing something.
function opensScreen(btn){
  const id = btn.id || "";
  if(/^(go|open|show|view|plan|book)[A-Z]/.test(id) || /^(casinoBtn|honeymoonBtn|planWeddingBtn|proposeBtn)$/.test(id)) return true;
  return ["data-goto","data-tab","data-cat","data-continent","data-jumpassets","data-as"].some(a=>btn.hasAttribute(a));
}

// A label that opens with its own emoji keeps it as the row's icon.
const LEADING_EMOJI = /^(\p{Extended_Pictographic}(\uFE0F|\u200D\p{Extended_Pictographic})*)\s*/u;

// Rebuilds a plain "Title — detail · £price" button into a proper row. The
// button element itself is kept, so the listener already on it still works.
function enhanceRow(btn){
  if(btn.classList.contains("erow") || btn.classList.contains("mrow") || btn.classList.contains("primary")) return;
  if(btn.querySelector(".mi, .mtxt, img, input")) return;
  const raw = (btn.textContent || "").replace(/\s+/g, " ").trim();
  if(!raw) return;
  let title = raw, rest = "", lead = "";
  const em = raw.match(LEADING_EMOJI);
  const dash = raw.indexOf(" — ");
  if(dash > 0){ title = raw.slice(0, dash); rest = raw.slice(dash + 3); }
  if(em){ lead = em[1]; title = title.slice(em[0].length); }
  let value = "";
  const parts = rest ? rest.split(" · ") : [];
  const keep = [];
  parts.forEach(p=>{ if(!value && isPriceText(p)) value = p.trim(); else keep.push(p); });
  // A price sometimes leads the title instead: "Claim pension — £4,200".
  const sub = keep.join(" · ");
  const icon = lead || iconOrDefault(title, sub);
  const esc = s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  btn.classList.add("erow");
  btn.innerHTML = `<span class="mi">${icon}</span>
    <span class="mtxt"><span class="mtitle">${esc(title)}</span>${sub ? `<span class="msub">${esc(sub)}</span>` : ""}</span>
    ${value ? `<span class="mval${/^free$/i.test(value) ? " free" : ""}">${esc(value)}</span>` : ""}
    ${opensScreen(btn) ? `<span class="chev">›</span>` : `<span class="dots">•••</span>`}`;
}

// A short button ("Apply", "Drive it") stays short, with an emoji in front.
function iconShortButton(btn){
  if(btn.dataset.iconed || btn.querySelector("img, input")) return;
  const raw = (btn.textContent || "").trim();
  if(!raw || LEADING_EMOJI.test(raw)) { btn.dataset.iconed = "1"; return; }
  btn.dataset.iconed = "1";
  const span = document.createElement("span");
  span.className = "bi";
  span.textContent = iconOrDefault(raw) + " ";
  btn.insertBefore(span, btn.firstChild);
}

function enhanceSheet(sheet){
  if(!state) return;
  if(!sheet.querySelector(":scope > .sheet-hud")){
    const holder = document.createElement("div");
    holder.innerHTML = sheetHudHtml();
    const hud = holder.firstElementChild;
    if(hud){
      // The close button rides in the header, so it stays reachable however
      // far down the sheet you've scrolled.
      const x = sheet.querySelector(":scope > .sheet-x");
      if(x) hud.appendChild(x);
      sheet.insertBefore(hud, sheet.firstChild);
      sheet.classList.add("has-hud");
    }
  }
  sheet.querySelectorAll("button.small:not(.erow):not(.mrow), .track-card > button:not(.erow):not(.mrow)").forEach(btn=>{
    if(!btn.closest(".choices") && !btn.closest(".cat-list")) iconShortButton(btn);
  });
  sheet.querySelectorAll(".choices > button").forEach(btn=>{
    // Cards keep their short buttons ("Apply"); labelled items in a card, like
    // a dealer's stock, become rows too.
    // ...unless the card already has rows in it, in which case every button
    // in it becomes one, so a single card never mixes the two styles.
    const card = btn.closest(".track-card");
    if(card && !/ — /.test(btn.textContent || "") &&
       ![...card.querySelectorAll(".choices > button")].some(b=>b.classList.contains("erow") || / — /.test(b.textContent||""))){
      iconShortButton(btn);
      return;
    }
    enhanceRow(btn);
  });
}

// Watches for sheets being drawn and gives each the shared chrome. Sheets are
// rebuilt wholesale on every change, so this runs after each redraw.
function installSheetPolish(){
  if(typeof MutationObserver === "undefined" || typeof document === "undefined" || !document.body) return;
  const run = ()=>document.querySelectorAll(".sheet").forEach(enhanceSheet);
  const obs = new MutationObserver(()=>{ obs.disconnect(); try{ run(); } finally { obs.observe(document.body, { childList:true, subtree:true }); } });
  obs.observe(document.body, { childList:true, subtree:true });
  run();
}

// ---------- Just for you ----------
// Up to three things worth doing now, picked from your actual circumstances,
// on the screen where you'd do them.
let jfyActions = [];

function justForYou(scope){
  if(!state || !state.alive || state.prisonYearsLeft > 0) return [];
  const out = [];
  const add = (prio, icon, title, sub, go, opens)=>out.push({ prio, icon, title, sub, go, opens: opens !== false });
  const age = state.age;
  const c = state.career;

  if(scope === "career" || scope === "activities"){
    if(c && state.careerWarning)
      add(100, "⚠️", "You're on a formal warning", `Performance ${jobPerformance()}/100 — work harder or lose the job`, ()=>{ doWorkHarder(); }, false);
    if(scope === "career" && c && !c.training && jobPerformance() >= 70 && usesLeft("promo") > 0)
      add(70, "📈", "Ask for a promotion", `Performance ${jobPerformance()}/100 — a good time to ask`, ()=>{ doAskPromotion(); }, false);
    const studying = ["school","college","apprenticeship"].includes(state.education) || !!state.studying || !!state.postgrad;
    if(age >= 18 && age < 66 && !c && !state.business && !state.politics && !studying)
      add(80, "💼", "Find a job", "You're not earning a salary", ()=>{ careerView = { level:"categories", category:null }; openCareerSheet(); });
  }

  if(scope === "activities"){
    if(state.stats.health < 45)
      add(90, "🩺", "See a doctor", `Health is down to ${state.stats.health}`, ()=>{ activityView.tab = "foryou"; refreshActivitySheet(); });
    if((state.hidden.stress||0) > 70 && age >= 18)
      add(75, "🏖️", "Take a holiday", "Stress is running high", ()=>{ activityView.tab = "world"; refreshActivitySheet(); });
    if(age >= 17 && !state.flags.canDrive)
      add(40, "🆔", "Learn to drive", "Opens up cars, and jobs that need one", ()=>{ activityView.tab = "licenses"; refreshActivitySheet(); });
    const r = state.relationship;
    if(r && !state.married && !state.engaged && typeof canPropose === "function" && canPropose() && usesLeft("propose") > 0)
      add(60, "💍", `Propose to ${r.name}`, `Together ${state.relationshipYears||0} years`, ()=>{ openProposalFlow(); }, false);
    if(r && r.closeness < 40)
      add(85, "🛋️", `Things are strained with ${r.name}`, `Closeness ${r.closeness} — counselling may help`, ()=>openPersonFrom("partner", r.id));
    if(r && state.married && state.lastAnniversaryYear !== state.year && yearsMarried() >= 1)
      add(50, "🎉", "Celebrate your anniversary", `${yearsMarried()} year${yearsMarried()===1?"":"s"} married`, ()=>openPersonFrom("partner", r.id, "anniversary"));
    const drifting = (state.friends||[]).filter(f=>isHere(f) && f.lastContactAge !== undefined && age - f.lastContactAge >= 3)
      .sort((a,b)=>a.lastContactAge - b.lastContactAge)[0];
    if(drifting)
      add(65, "🤝", `Catch up with ${drifting.name}`, `${age - drifting.lastContactAge} years since you saw them`, ()=>openPersonFrom("friend", drifting.id));
    const idle = Object.entries(state.social||{}).filter(([id,a])=>{
      const p = SOCIAL_PLATFORMS.find(x=>x.id===id);
      return p && !a.banned && p.monetiseAt !== null && p.payPer > 0 && a.followers >= p.monetiseAt && a.lastPostAge !== age;
    }).sort((x,y)=>y[1].followers - x[1].followers)[0];
    if(idle && postsLeft() > 0){
      const p = SOCIAL_PLATFORMS.find(x=>x.id===idle[0]);
      add(45, platformIcon(p), `Post on ${platformName(p)}`, `${idle[1].followers.toLocaleString()} ${p.unit} — it only pays if you're active`, ()=>{ activityView.tab = "social"; socialView.platform = p.id; refreshActivitySheet(); });
    }
    const lost = (state.children||[]).filter(k=>k.adult && isHere(k) && k.lastContactAge !== undefined && age - k.lastContactAge >= 3)[0];
    if(lost)
      add(66, "🏡", `Visit ${lost.name}`, `${age - lost.lastContactAge} years since you saw them`, ()=>openPersonFrom("child", lost.id));
  }

  if(scope === "assets"){
    const holdings = state.assets.filter(a=>["bonds","stocks","crypto"].includes(a.type));
    if(age >= 18 && !holdings.length && state.money > eraMoney(25000))
      add(60, "📈", "Put your savings to work", `${money(state.money)} sitting in cash`, ()=>{ assetsView.screen = "invest"; refreshAssetsSheet(); });
    if(age >= 65 && state.pension > 0)
      add(90, "👴", "Claim your pension", `${money(state.pension)} lump sum`, ()=>{ claimPension(); refreshAssetsSheet(); }, false);
    const props = state.assets.filter(a=>a.type === "property");
    const empty = props.filter(p=>!p.rented).length;
    if(props.length > 1 && empty > 1)
      add(55, "🏠", `Let out your empty properties`, `${empty - 1} sitting empty`, ()=>{ assetsView.screen = "property"; refreshAssetsSheet(); });
    const vi = state.assets.findIndex(a=>["car","motorcycle","boat","vehicle"].includes(a.type) && !vehicleLicenceMissing(a));
    if(vi >= 0 && usesLeft("vehicle") > 0){
      const v = state.assets[vi];
      add(30, iconFor(vehicleKind(v).verb + " " + v.name) || "🚗", `${vehicleKind(v).verb} the ${v.name.replace(/^(a|an|the) /i, "")}`, "Take it out for the day", ()=>{ openVehicleUse(vi); }, false);
    }
  }

  return out.sort((a,b)=>b.prio - a.prio).slice(0, 3);
}

// Opens the Relationships sheet straight onto one person's page.
function openPersonFrom(kind, id, sub){
  openPeopleSheet();
  peopleView.tab = kind === "partner" ? "partner" : ({friend:"friends", child:"children", family:"family"}[kind] || "menu");
  peopleView.person = { kind, id };
  peopleView.sub = sub || null;
  refreshPeopleSheet();
}

function jfyHtml(scope){
  const items = justForYou(scope);
  jfyActions = items.map(i=>i.go);
  if(!items.length) return "";
  return `<div class="section-label">Just for you</div>
    <div class="menulist jfy">${items.map((i,n)=>menuRow({ icon:i.icon, title:i.title, sub:i.sub, attr:`data-jfy="${n}"`, chevron:false, opens:i.opens, dots:!i.opens })).join("")}</div>`;
}

function wireJfy(overlay){
  overlay.querySelectorAll("[data-jfy]").forEach(b=>b.addEventListener("click", ()=>{
    const fn = jfyActions[parseInt(b.dataset.jfy, 10)];
    if(fn) fn();
  }));
}

// Twitter became X in 2023, and the name follows the year you're living in.
function platformName(p){ return p.id === "x" && (state ? state.year : 2023) < 2023 ? "Twitter" : p.name; }
function platformIcon(p){ return p.id === "x" && (state ? state.year : 2023) < 2023 ? "🐦" : p.icon; }
function platformVerb(p){ return p.id === "x" && (state ? state.year : 2023) < 2023 ? "Tweet" : p.verb; }

function socialAccounts(){
  if(!state.social) state.social = {};
  return state.social;
}
function accountOn(id){ return socialAccounts()[id] || null; }
function platformExists(p){ return (state.year || 2020) >= p.from; }
function platformOpenToYou(p){ return platformExists(p) && state.age >= p.minAge; }

// ---- Keeping one total across every platform ----
// Older parts of the game (a viral moment, a cancellation, a content-creator
// career) still move the single follower count. Any difference since the
// last check is put down to your biggest account, or held aside until you
// have one; a fall is shared out across all of them.
function reconcileFollowers(){
  const acc = socialAccounts();
  const ids = Object.keys(acc).filter(id=>!acc[id].banned);
  const sum = ids.reduce((s,id)=>s + acc[id].followers, 0) + (state.socialOther || 0);
  const synced = state.socialSynced === undefined ? 0 : state.socialSynced;
  const delta = (state.followers || 0) - synced;
  if(delta > 0){
    const biggest = ids.sort((a,b)=>acc[b].followers - acc[a].followers)[0];
    if(biggest) acc[biggest].followers += delta;
    else state.socialOther = (state.socialOther || 0) + delta;
  } else if(delta < 0 && sum > 0){
    const keep = Math.max(0, (state.followers || 0)) / synced;
    ids.forEach(id=>{ acc[id].followers = Math.round(acc[id].followers * keep); });
    state.socialOther = Math.round((state.socialOther || 0) * keep);
  }
  syncFollowers();
}
function syncFollowers(){
  const acc = socialAccounts();
  const total = Object.values(acc).filter(a=>!a.banned).reduce((s,a)=>s + a.followers, 0) + (state.socialOther || 0);
  state.followers = total;
  state.socialSynced = total;
  return total;
}
function largestAccount(){
  const acc = socialAccounts();
  return Object.keys(acc).filter(id=>!acc[id].banned).sort((a,b)=>acc[b].followers - acc[a].followers)[0] || null;
}

// ---- How much posting a year holds ----
// Six posts across every platform, and three on any one; making content your
// job doubles it.
function contentAllowance(){
  const c = state.career;
  return c && c.kind === "civilian" && c.trackId === "content_creator" ? 12 : 6;
}
function postsLeft(){ return Math.max(0, contentAllowance() - (state.yearlyActivityUses.content || 0)); }
function postsLeftOn(id){ return Math.max(0, 3 - (state.yearlyActivityUses["post_"+id] || 0)); }

function statFor(p){
  if(p.stat === "looks") return state.stats.looks;
  if(p.stat === "smarts") return state.stats.smarts;
  if(p.stat === "esports") return Math.min(100, (state.skills.esports || 0) + 20);
  return Math.min(100, (state.hidden.fame || 0) + 20);
}

// ---- Actions ----
function doJoinPlatform(id){
  const p = SOCIAL_PLATFORMS.find(x=>x.id===id);
  if(!p) return refreshActivitySheet();
  reconcileFollowers();
  if(!platformExists(p)){ addLog(`${platformName(p)} doesn't exist yet — it launches in ${p.from}.`); return refreshActivitySheet(); }
  if(state.age < p.minAge){ addLog(`You have to be ${p.minAge} to join ${platformName(p)}.`); return refreshActivitySheet(); }
  const acc = socialAccounts();
  if(acc[id] && !acc[id].banned){ return refreshActivitySheet(); }
  if(acc[id] && acc[id].banned && state.age - acc[id].bannedAge < 3){
    addLog(`${platformName(p)} banned you ${state.age - acc[id].bannedAge === 0 ? "this year" : `${state.age - acc[id].bannedAge} year${state.age - acc[id].bannedAge===1?"":"s"} ago`}. They won't take you back yet.`);
    return refreshActivitySheet();
  }
  // A first account inherits whatever following you'd built up before
  // accounts were tracked separately.
  const carry = !Object.keys(acc).some(k=>!acc[k].banned) ? (state.socialOther || 0) : 0;
  acc[id] = { followers: carry, joinedAge: state.age, posts: 0, earnedLife: 0, earnedLast: 0, lastPostAge: null, verified: false, banned: false };
  if(carry) state.socialOther = 0;
  syncFollowers();
  addLog(`Joined ${platformName(p)}${carry ? `, bringing ${carry.toLocaleString()} followers with you` : ""}.`);
  socialView.platform = id;
  refreshActivitySheet();
}

function doLeavePlatform(id){
  const p = SOCIAL_PLATFORMS.find(x=>x.id===id);
  const acc = socialAccounts();
  if(!acc[id]) return refreshActivitySheet();
  const lost = acc[id].followers;
  delete acc[id];
  syncFollowers();
  addLog(`Deleted your ${platformName(p)} account${lost ? ` and its ${lost.toLocaleString()} ${p.unit}` : ""}.`);
  socialView.platform = null;
  refreshActivitySheet();
}

// The growth of one post: what the platform gives an ordinary post, scaled
// by what the audience responds to, by how known you are, and by the size of
// the audience you already have — followers bring followers.
function postGrowth(p, a){
  const stat = statFor(p);
  let g = rand(p.growth[0], p.growth[1]) * (0.5 + stat/100) * (1 + (state.hidden.fame||0)/150);
  if(p.olderAudience) g *= state.age >= 35 ? 1.4 : 0.8;
  if(a.verified) g *= 1.15;
  if(p.fromAudience){
    // Patrons come from everywhere else you're followed.
    const elsewhere = Object.entries(socialAccounts()).filter(([k,v])=>k!==p.id && !v.banned).reduce((s,[,v])=>s+v.followers,0);
    g += elsewhere * p.fromAudience * (0.5 + Math.random());
  }
  // Followers bring followers, but less so the bigger you already are.
  const saturation = 1 / (1 + a.followers / 500000);
  let network = a.followers * (0.002 + Math.random() * 0.013) * saturation;
  let viral = false;
  // A viral post multiplies that post's reach, not your whole audience.
  if(Math.random() < p.viral){ g = g * rand(p.viralMult[0], p.viralMult[1]) + a.followers * (0.02 + Math.random()*0.08) * saturation; viral = true; }
  g += network;
  // Very occasionally the platform itself picks you up and pushes you to
  // everyone — the long tail that makes a handful of creators enormous.
  let breakout = false;
  if(p.viral > 0 && Math.random() < 0.002 + statFor(p)/40000 + (state.hidden.fame||0)/25000){
    g += (a.followers + rand(p.growth[1]*5, p.growth[1]*40)) * (1 + Math.random()*3);
    viral = true; breakout = true;
  }
  // Not every post lands; some cost you a little.
  if(!viral && Math.random() < 0.1) g = -Math.round(a.followers * (0.01 + Math.random()*0.04));
  return { gain: Math.round(g), viral };
}

function doPlatformPost(id){
  const p = SOCIAL_PLATFORMS.find(x=>x.id===id);
  const a = accountOn(id);
  if(!p || !a || a.banned) return refreshActivitySheet();
  reconcileFollowers();
  if(postsLeft() <= 0){ addLog("You've made all the content you've time for this year."); return refreshActivitySheet(); }
  if(postsLeftOn(id) <= 0){ addLog(`That's enough on ${platformName(p)} for one year.`); return refreshActivitySheet(); }
  state.yearlyActivityUses.content = (state.yearlyActivityUses.content || 0) + 1;
  state.yearlyActivityUses["post_"+id] = (state.yearlyActivityUses["post_"+id] || 0) + 1;
  const { gain, viral } = postGrowth(p, a);
  a.followers = Math.max(0, a.followers + gain);
  if(p.cap) a.followers = Math.min(p.cap, a.followers);
  a.posts += 1;
  a.lastPostAge = state.age;
  if(p.stress) nudgeHidden("stress", p.stress);
  if(p.music && state.career && ["music","band","producer"].includes(state.career.trackId)) nudgePerformance(rand(1,4));
  if(viral) nudgeHidden("fame", rand(2,6));
  syncFollowers();
  if(viral){
    nudge("happiness", 6);
    milestone("milestone", `It went viral on ${platformName(p)} — ${gain.toLocaleString()} new ${p.unit}. ${a.followers.toLocaleString()} now.`, { icon: platformIcon(p), label:"Viral", tone:"good" });
  } else if(gain < 0){
    nudge("happiness", -2);
    addLog(`${platformVerb(p)} on ${platformName(p)} — it didn't land, and ${(-gain).toLocaleString()} ${p.unit} left. ${a.followers.toLocaleString()} now.`);
  } else {
    addLog(`${platformVerb(p)} on ${platformName(p)} — ${gain.toLocaleString()} new ${p.unit}. ${a.followers.toLocaleString()} now.`);
  }
  refreshActivitySheet();
}

// Paid promotion: money for reach, at a rate that doesn't care how good you are.
function doPlatformPromote(id){
  const p = SOCIAL_PLATFORMS.find(x=>x.id===id);
  const a = accountOn(id);
  if(!p || !a || a.banned) return refreshActivitySheet();
  if((state.yearlyActivityUses["promo_"+id] || 0) >= 1){ addLog(`You've already paid to promote on ${platformName(p)} this year.`); return refreshActivitySheet(); }
  const cost = eraMoney(500);
  if(state.money < cost){ addLog(`A promotion costs ${money(cost)}.`); return refreshActivitySheet(); }
  reconcileFollowers();
  state.yearlyActivityUses["promo_"+id] = 1;
  addMoney(-cost);
  // Paid subscribers don't come from adverts in any number.
  const per = p.payPer >= 1 ? 0.02 : 1;
  const gain = Math.round(rand(300, 1200) * per * (0.7 + statFor(p)/150));
  a.followers += gain;
  syncFollowers();
  addLog(`Paid ${money(cost)} to promote your ${platformName(p)} — ${gain.toLocaleString()} new ${p.unit}.`);
  refreshActivitySheet();
}

// A collaboration with someone bigger: a share of their audience, if they'll have you.
function doPlatformCollab(id){
  const p = SOCIAL_PLATFORMS.find(x=>x.id===id);
  const a = accountOn(id);
  if(!p || !a || a.banned) return refreshActivitySheet();
  if(a.followers < 1000){ addLog(`Nobody bigger will collaborate until you've got 1,000 ${p.unit}.`); return refreshActivitySheet(); }
  if((state.yearlyActivityUses["collab_"+id] || 0) >= 1){ addLog(`You've already collaborated on ${platformName(p)} this year.`); return refreshActivitySheet(); }
  if(!spendAction("collab_"+id)){ return refreshActivitySheet(); }
  reconcileFollowers();
  state.yearlyActivityUses["collab_"+id] = 1;
  commitAction();
  const chance = clamp(0.3 + (state.hidden.fame||0)/300 + statFor(p)/400, 0.8, 0.1);
  if(Math.random() < chance){
    const gain = Math.round(a.followers * (0.1 + Math.random()*0.5) + rand(300, 4000) * (p.payPer >= 1 ? 0.05 : 1));
    a.followers += gain;
    nudgeHidden("fame", rand(1,4));
    syncFollowers();
    addLog(`Collaborated with a bigger ${platformName(p)} name — ${gain.toLocaleString()} new ${p.unit}.`, true);
  } else {
    addLog(`Pitched a collaboration on ${platformName(p)}. Nobody bigger was interested.`);
  }
  refreshActivitySheet();
}

// Something designed to get attention. It might work brilliantly, it might
// cost you, and once in a while it gets you thrown off the platform.
function doPlatformStunt(id){
  const p = SOCIAL_PLATFORMS.find(x=>x.id===id);
  const a = accountOn(id);
  if(!p || !a || a.banned) return refreshActivitySheet();
  if((state.yearlyActivityUses["stunt_"+id] || 0) >= 1){ addLog(`One stunt a year on ${platformName(p)} is plenty.`); return refreshActivitySheet(); }
  if(!spendAction("stunt_"+id)){ return refreshActivitySheet(); }
  reconcileFollowers();
  state.yearlyActivityUses["stunt_"+id] = 1;
  commitAction();
  const roll = Math.random();
  if(roll < 0.35){
    const gain = Math.round(a.followers * (0.5 + Math.random()*1.5) + rand(500, 8000));
    a.followers += gain;
    nudgeHidden("fame", rand(4,10));
    milestone("milestone", `The stunt worked — ${gain.toLocaleString()} new ${p.unit} on ${platformName(p)}.`, { icon: platformIcon(p), label:"Viral", tone:"good" });
  } else if(roll < 0.75){
    const gain = rand(50, 600);
    a.followers += gain;
    addLog(`Tried something to get attention on ${platformName(p)}. It did all right — ${gain.toLocaleString()} new ${p.unit}.`);
  } else {
    const lost = Math.round(a.followers * (0.2 + Math.random()*0.3));
    a.followers -= lost;
    nudgeHidden("karma", -6);
    nudge("happiness", -6);
    if(Math.random() < 0.15){
      a.banned = true; a.bannedAge = state.age;
      milestone("milestone", `Banned from ${platformName(p)} after the stunt went too far. ${(a.followers + lost).toLocaleString()} ${p.unit}, gone.`, { icon:"🚫", label:"Banned", tone:"bad" });
    } else {
      addLog(`The stunt backfired on ${platformName(p)} — ${lost.toLocaleString()} ${p.unit} gone and a lot of angry comments.`, true);
    }
  }
  syncFollowers();
  refreshActivitySheet();
}

// Verification: bought from X since 2023, earned elsewhere.
function verificationCost(p){ return p.id === "x" && state.year >= 2023 ? eraMoney(84) : 0; }
function canVerify(p, a){
  if(!a || a.verified) return false;
  if(p.id === "x" && state.year >= 2023) return true;
  return a.followers >= 100000 || (state.hidden.fame || 0) >= 70;
}
function doPlatformVerify(id){
  const p = SOCIAL_PLATFORMS.find(x=>x.id===id);
  const a = accountOn(id);
  if(!p || !a || !canVerify(p, a)){ addLog("You don't qualify for verification yet."); return refreshActivitySheet(); }
  const cost = verificationCost(p);
  if(cost && state.money < cost){ addLog(`Verification on ${platformName(p)} costs ${money(cost)} a year.`); return refreshActivitySheet(); }
  if(cost) addMoney(-cost);
  a.verified = true;
  a.verifiedPaid = !!cost;
  addLog(cost ? `Paid ${money(cost)} for a blue tick on ${platformName(p)}.` : `Verified on ${platformName(p)}.`, !cost);
  refreshActivitySheet();
}

// ---- The year on social media ----
// Active accounts earn and grow; idle ones shrink. Paid verification renews or
// lapses. An adult account can come out where it matters.
function runSocialYear(){
  if(!state.social || state.prisonYearsLeft > 0) return;
  reconcileFollowers();
  const acc = socialAccounts();
  let totalPaid = 0;
  Object.keys(acc).forEach(id=>{
    const a = acc[id];
    const p = SOCIAL_PLATFORMS.find(x=>x.id===id);
    if(!p || a.banned) return;
    const active = a.lastPostAge === state.age;
    a.followers = Math.round(a.followers * (1 - (p.churn || 0.03)));
    if(!active) a.followers = Math.round(a.followers * (1 - p.decay));
    a.earnedLast = 0;
    // X only started sharing revenue in 2023, and only with paying members.
    const xPays = p.id !== "x" || (state.year >= 2023 && a.verified);
    if(xPays && p.payPer > 0 && p.monetiseAt !== null && a.followers >= p.monetiseAt){
      const share = active ? 1 : p.idlePay;
      const gross = Math.round(a.followers * p.payPer * share * (0.6 + Math.random()*0.8));
      if(gross > 0){
        a.earnedLast = Math.round(gross * priceLevel());
        a.earnedLife += a.earnedLast;
        totalPaid += gross;
      }
    }
    if(a.verified && a.verifiedPaid){
      const cost = verificationCost(p);
      if(state.money >= cost) addMoney(-cost); else { a.verified = false; addLog(`Your ${platformName(p)} verification lapsed.`); }
    }
  });
  if(totalPaid > 0) payAdditionalIncome(totalPaid, "Social media income");
  // A big enough following makes you somebody.
  if((state.followers||0) > 50000) nudgeHidden("fame", Math.min(4, Math.floor(Math.log10(state.followers) - 3)));
  syncFollowers();
  maybeSocialEvent();
}

function maybeSocialEvent(){
  if(state.pendingChoice) return;
  const acc = socialAccounts();
  const of = acc.onlyfans;
  // An adult account can surface at work, or with family.
  if(of && !of.banned && of.followers > 0 && !of.exposed && Math.random() < 0.10){
    const c = state.career;
    const track = c && c.kind === "civilian" ? TRACKS.find(t=>t.id===c.trackId) : null;
    const sensitive = (c && c.kind === "forces") || state.politics ||
      (track && ["Public Sector","Academia","Medical","Legal","Emergency Services","Politics"].includes(track.category));
    of.exposed = true;
    if(sensitive){
      queueChoice({ title:"It's come out at work", text:"Someone at work has found your OnlyFans, and it's been passed round.",
        options:[
          { label:"Own it", effect:()=>{
              if(state.politics){ nudgeApproval(-rand(15,30)); addLog("Owned it publicly. The party is not pleased, and nor are the voters.", true); }
              else if(Math.random() < 0.3){ state.career = null; state.careerWarning = null; milestone("fired", "Let go after your OnlyFans came to light at work."); }
              else { nudgePerformance(-rand(10,20)); addLog("Owned it. It's awkward at work, but you kept the job.", true); }
            }},
          { label:"Close the account", effect:()=>{ delete socialAccounts().onlyfans; syncFollowers(); nudgePerformance(-5); addLog("Closed the account. The whispering will take longer to stop."); } },
        ]});
      return;
    }
    const parents = (state.family||[]).filter(p=>p.alive && (p.relation==="Mother"||p.relation==="Father"));
    if(parents.length){
      parents.forEach(p=>{ p.closeness = clamp(p.closeness - rand(5,20)); });
      addLog(`Your ${parents.length > 1 ? "parents have" : parents[0].relation.toLowerCase() + " has"} found out about your OnlyFans. Things are strained.`, true);
      return;
    }
  }
  // Brand deals for anyone with a real following.
  const big = largestAccount();
  if(big && acc[big].followers >= 50000 && Math.random() < 0.15){
    const p = SOCIAL_PLATFORMS.find(x=>x.id===big);
    const fee = Math.round(acc[big].followers * rand(5, 25) / 100);
    queueChoice({ title:"A brand deal", text:`A company wants you to promote its product to your ${acc[big].followers.toLocaleString()} ${p.unit} on ${platformName(p)}.`,
      options:[
        { label:"Take the deal", effect:()=>{ payAdditionalIncome(fee, "Brand deal"); if(Math.random()<0.25){ acc[big].followers = Math.round(acc[big].followers*0.95); syncFollowers(); addLog("Took the money. Some followers found it a bit much."); } else addLog("Took the deal. It went down fine."); } },
        { label:"Turn it down", effect:()=>{ nudgeHidden("karma", 2); addLog("Turned down the brand deal. Your audience trusts you a little more."); } },
      ]});
    return;
  }
  // Trolls follow attention.
  if((state.followers||0) > 20000 && Math.random() < 0.06){
    makeEnemy("an online troll who's made you a project");
  }
}

// LinkedIn helps job applications, a little, once the network is big.

  const a = accountOn("linkedin");
  if(!a || a.banned) return 0;
  return a.followers >= 2000 ? 0.08 : a.followers >= 500 ? 0.04 : 0;
}

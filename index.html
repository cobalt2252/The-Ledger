// ---------------------------------------------------------------------------
// Grown-up children
// Once a child turns 18 they stop being a parenting mini-game and start living
// a life you can take an interest in but not control: education, a career,
// a partner, children of their own. What you did while they were young — bond,
// smarts, happiness — shifts the odds, and so does encouragement afterwards.
// ---------------------------------------------------------------------------

const CHILD_EDUCATION = [
  {id:"none",        label:"Left school at 18",       smarts:0,  earn:0.75},
  {id:"college",     label:"College diploma",         smarts:55, earn:0.9},
  {id:"degree",      label:"University degree",       smarts:65, earn:1.15},
  {id:"masters",     label:"Master's degree",         smarts:75, earn:1.35},
  {id:"doctorate",   label:"Doctorate",               smarts:85, earn:1.5},
];

const CHILD_CAREERS = [
  {id:"trade",     label:"a tradesperson",        minSmarts:0,  pay:[24000,42000]},
  {id:"retail",    label:"working in retail",     minSmarts:0,  pay:[19000,28000]},
  {id:"forces",    label:"in the armed forces",   minSmarts:40, pay:[26000,55000]},
  {id:"nurse",     label:"a nurse",               minSmarts:50, pay:[28000,48000]},
  {id:"teacher",   label:"a teacher",             minSmarts:55, pay:[30000,50000]},
  {id:"engineer",  label:"an engineer",           minSmarts:60, pay:[35000,70000]},
  {id:"tech",      label:"a software engineer",   minSmarts:62, pay:[38000,95000]},
  {id:"lawyer",    label:"a solicitor",           minSmarts:70, pay:[45000,120000]},
  {id:"doctor",    label:"a doctor",              minSmarts:75, pay:[50000,130000]},
  {id:"academic",  label:"an academic",           minSmarts:78, pay:[38000,70000]},
  {id:"artist",    label:"an artist",             minSmarts:0,  pay:[12000,40000]},
  {id:"drifting",  label:"between things",        minSmarts:0,  pay:[0,12000]},
];

// Settles what a child does with their life at 18, weighted by how they were
// raised and by anything you encouraged them towards.
function launchAdultChild(c){
  c.adult = true;
  const smarts = c.smarts === undefined ? 50 : c.smarts;
  const bond = c.bond === undefined ? 50 : c.bond;
  const encouraged = c.encouraged || {};

  // Education: ability decides what's open, encouragement and a close
  // relationship make the ambitious route likelier.
  let eligible = CHILD_EDUCATION.filter(e=>smarts >= e.smarts);
  let edu = eligible[Math.max(0, eligible.length - 1 - (Math.random() < 0.5 ? 1 : 0))] || CHILD_EDUCATION[0];
  if(encouraged.education && Math.random() < 0.35 + bond/250){
    edu = eligible[eligible.length-1] || edu;
  } else if(!encouraged.education && Math.random() < 0.3){
    edu = eligible[Math.max(0, Math.floor(Math.random()*eligible.length))] || edu;
  }
  c.education = edu.id;
  c.educationLabel = edu.label;

  // Career: gated by ability, with encouragement nudging them up the list.
  const openCareers = CHILD_CAREERS.filter(j=>smarts >= j.minSmarts);
  let job = pick(openCareers.length ? openCareers : [CHILD_CAREERS[CHILD_CAREERS.length-1]]);
  if(encouraged.career && Math.random() < 0.4 + bond/250){
    const ambitious = openCareers.filter(j=>j.minSmarts >= 50);
    if(ambitious.length) job = pick(ambitious);
  }
  if(c.happiness < 30 && Math.random() < 0.3) job = CHILD_CAREERS.find(j=>j.id==="drifting");
  c.careerId = job.id;
  c.careerLabel = job.label;
  c.income = Math.round(rand(job.pay[0], job.pay[1]) * edu.earn);
  c.netWorth = 0;
  c.grandchildren = 0;
  c.partnered = false;
  return c;
}

// Each year an adult child's life moves on a little by itself.
function tickAdultChild(c){
  backfillGrandchildren(c);
  const bond = c.bond === undefined ? 50 : c.bond;
  const encouraged = c.encouraged || {};

  // Earnings grow, and savings accumulate off the back of them.
  if(c.income){
    if(Math.random() < 0.3) c.income = Math.round(c.income * (1 + rand(2,8)/100));
    c.netWorth = Math.round((c.netWorth||0) + c.income * (0.08 + Math.random()*0.12));
  }

  // Settling down, then children of their own.
  if(!c.partnered && c.age >= 20 && Math.random() < (encouraged.dating ? 0.22 : 0.12) + bond/600){
    c.partnered = true;
    c.partnerName = pick(NAMES);
    addLog(`${c.name} has settled down with ${c.partnerName}.`, true);
  }
  if(c.partnered && (c.ownChildren||[]).length < 3 && c.age >= 22 && c.age <= 45){
    const chance = (encouraged.family ? 0.18 : 0.09) + bond/900;
    if(Math.random() < chance){
      // Stored as actual people rather than a tally, so they survive being
      // continued as — a grandchild becomes your child in the next generation.
      c.ownChildren = c.ownChildren || [];
      const gk = {
        id: personIdCounter++,
        name: pick(NAMES),
        gender: pick(["Girl","Boy"]),
        age: 0,
        health: clamp(rand(60,90)),
        happiness: clamp(rand(60,90)),
        smarts: clamp(Math.round(((c.smarts===undefined?50:c.smarts) + rand(30,70))/2)),
        bond: rand(40,70),
      };
      c.ownChildren.push(gk);
      c.grandchildren = c.ownChildren.length;   // kept for display
      state.flags.grandparent = true;
      milestone("grandchild", `${c.name} has had a ${gk.gender==="Girl"?"daughter":"son"}, ${gk.name} — you're a grandparent${c.ownChildren.length>1?" again":""}.`);
      nudge("happiness", 8);
    }
  }

  // Grandchildren grow up alongside everyone else.
  (c.ownChildren||[]).forEach(gk=>{
    gk.age += 1;
    gk.health = clamp(gk.health + rand(-2,3));
    gk.happiness = clamp(gk.happiness + rand(-2,3));
  });

  // A career can move on, up or down.
  if(c.careerId && Math.random() < 0.06){
    if(c.careerId === "drifting" && (encouraged.career || Math.random() < 0.4)){
      const job = pick(CHILD_CAREERS.filter(j=>j.id!=="drifting" && (c.smarts===undefined?50:c.smarts) >= j.minSmarts)) || null;
      if(job){
        c.careerId = job.id; c.careerLabel = job.label;
        c.income = rand(job.pay[0], job.pay[1]);
        addLog(`${c.name} has found their feet — now ${job.label}.`, true);
      }
    } else if(Math.random() < 0.3){
      c.careerId = "drifting"; c.careerLabel = "between things"; c.income = rand(0, 12000);
      addLog(`${c.name} has lost their job and is between things.`);
    }
  }

  // Distance grows if you never pick up the phone.
  if(c.lastContactAge === undefined) c.lastContactAge = state.age;
  // Same off-by-one as friendships: one year since contact means you saw them
  // during the year just gone.
  if(state.age - c.lastContactAge >= 3){
    c.bond = clamp((c.bond===undefined?50:c.bond) - 2);
  }
}

// Older saves recorded grandchildren as a number. Give those a name and an age
// so they behave like the ones created since, and still carry over.
function backfillGrandchildren(c){
  if(!c || !c.adult) return;
  const count = c.grandchildren || 0;
  const have = (c.ownChildren || []).length;
  if(count <= have) return;
  c.ownChildren = c.ownChildren || [];
  for(let i = have; i < count; i++){
    c.ownChildren.push({
      id: personIdCounter++,
      name: pick(NAMES),
      gender: pick(["Girl","Boy"]),
      // Plausible: born some time after their parent turned 22.
      age: Math.max(0, Math.min(c.age - 18, rand(0, Math.max(1, c.age - 24)))),
      health: clamp(rand(60,90)),
      happiness: clamp(rand(60,90)),
      smarts: clamp(rand(35,75)),
      bond: rand(40,70),
    });
  }
  c.grandchildren = c.ownChildren.length;
}

// The five things you can do with a grown-up child.
function doAdultChild(childId, kind){
  const c = state.children.find(x=>x.id===childId);
  if(!c || !c.adult) return;
  if(usesLeft("social") <= 0){ addLog("No more time for visits this year."); refreshPeopleSheet(); return; }
  if(kind === "help" && state.money < 5000){ addLog(`You haven't got ${money(5000)} spare to help out.`); refreshPeopleSheet(); return; }
  if(!spendAction("social")){ refreshPeopleSheet(); return; }
  recordUse("social");
  c.encouraged = c.encouraged || {};
  c.bond = c.bond === undefined ? 50 : c.bond;
  c.lastContactAge = state.age;

  if(kind === "visit"){
    c.bond = clamp(c.bond + rand(4,10));
    c.happiness = clamp(c.happiness + rand(3,8));
    nudge("happiness", rand(3,6));
    addLog(`Spent the day with ${c.name}. Bond now ${c.bond}.`);
  } else if(kind === "help"){
    addMoney(-5000);
    c.netWorth = (c.netWorth||0) + 5000;
    c.bond = clamp(c.bond + rand(6,14));
    c.happiness = clamp(c.happiness + rand(5,12));
    addLog(`Gave ${c.name} ${money(5000)} towards getting established.`);
  } else {
    // The four kinds of encouragement. Pushing works better where the
    // relationship is good, and can backfire where it isn't.
    const labels = {
      education: ["study further", "studying"],
      career:    ["be ambitious about their career", "their career"],
      dating:    ["put themselves out there", "meeting someone"],
      family:    ["think about starting a family", "starting a family"],
    };
    const l = labels[kind];
    if(!l){ refreshPeopleSheet(); return; }
    const receptive = clamp01(0.25 + c.bond/200);
    if(Math.random() < receptive){
      c.encouraged[kind] = true;
      c.bond = clamp(c.bond + rand(2,6));
      addLog(`Encouraged ${c.name} to ${l[0]}. They took it well, and they're thinking about ${l[1]}.`);
      // Encouragement after the fact can still redirect a young adult.
      if(kind === "education" && c.age <= 25 && Math.random() < 0.3){
        const better = CHILD_EDUCATION.filter(e=>(c.smarts===undefined?50:c.smarts) >= e.smarts);
        const top = better[better.length-1];
        if(top && top.id !== c.education){
          c.education = top.id; c.educationLabel = top.label;
          addLog(`${c.name} has gone back into education — ${top.label.toLowerCase()}.`, true);
        }
      }
    } else {
      c.bond = clamp(c.bond - rand(3,9));
      c.happiness = clamp(c.happiness - rand(2,6));
      nudge("happiness", -2);
      addLog(`Pushed ${c.name} about ${l[1]}. They told you to leave it.`);
    }
  }
  refreshPeopleSheet();
}

function conceiveChild(){
  const child = { id: personIdCounter++, name: pick(NAMES), age:0, health:clamp(rand(60,90)), happiness:clamp(rand(60,90)) };
  state.children.push(child);
  nudge("happiness",10); addMoney(-rand(1500,4000));
  const complicationChance = clamp(0.15 - state.stats.health/500, 0.15, 0.03);
  if(Math.random() < complicationChance){
    nudge("health", -15);
    addCondition(pick(["postpartum complications","a difficult recovery"]), "chronic");
    milestone("child", `${child.name} is born — but the birth had complications, and recovery has been hard.`);
  } else {
    nudge("health", -3);
    milestone("child", `${child.name} is born. Costs rise, so does the happiness column.`);
  }
  return child;
}

function doTryForBaby(){
  if(!spendAction("baby")){ refreshActivitySheet(); return; }
  if(!state.married || !state.relationship){ return; }
  if(state.children.length >= 3){ addLog("Feels like your family is complete as it is."); refreshActivitySheet(); return; }
  if(usesLeft("tryforbaby") <= 0){ addLog("Already tried enough this year."); refreshActivitySheet(); return; }
  recordUse("tryforbaby");
  if(state.birthControl){ state.birthControl = false; addLog("Stopped using contraception, to try for a baby."); }
  let chance = 0.65;
  if(state.age > 40) chance -= 0.25;
  if(state.age > 45) chance -= 0.2;
  if(Math.random() < Math.max(0.05, chance)){
    conceiveChild();
  } else {
    state.failedConceptionYears = (state.failedConceptionYears||0) + 1;
    nudge("happiness", -2);
    addLog("Tried for a baby this year, but no luck yet.");
  }
  refreshActivitySheet();
}

// ---------- Adoption & IVF — other routes to a family ----------

function doAdoptChild(){
  if(!spendAction("adopt")){ refreshActivitySheet(); return; }
  if(state.children.length >= 3){ addLog("Feels like your family is complete as it is."); refreshActivitySheet(); return; }
  if(usesLeft("adopt") <= 0){ addLog("An adoption process takes time — one at a time."); refreshActivitySheet(); return; }
  const cost = 6000;
  if(state.money < cost){ addLog(`Adoption costs about ${money(cost)} in fees — not affordable right now.`); refreshActivitySheet(); return; }
  if(state.flags.criminalRecord){ addLog("The adoption agency turned down the application over your criminal record."); refreshActivitySheet(); return; }
  recordUse("adopt");
  addMoney(-cost);
  // Agencies weigh stability: income, a partner, and a settled home all help.
  let approvalChance = 0.5;
  if(state.married) approvalChance += 0.2;
  if(state.career || state.business || state.politics) approvalChance += 0.15;
  if(state.assets.some(a=>a.type==="property")) approvalChance += 0.1;
  if(Math.random() < Math.min(0.95, approvalChance)){
    const child = { id: personIdCounter++, name: pick(NAMES), age: rand(0,8), health: clamp(rand(55,90)), happiness: clamp(rand(45,80)), adopted:true };
    state.children.push(child);
    nudge("happiness", 12);
    addLog(`Adoption approved — ${child.name}, age ${child.age}, joins the family.`, true);
  } else {
    nudge("happiness", -8);
    addLog("The adoption application was turned down this time. The fees aren't refunded.");
  }
  refreshActivitySheet();
}

function doIVF(){
  if(!spendAction("ivf")){ refreshActivitySheet(); return; }
  if(!state.relationship){ addLog("IVF needs a partner alongside you."); refreshActivitySheet(); return; }
  if(state.children.length >= 3){ addLog("Feels like your family is complete as it is."); refreshActivitySheet(); return; }
  if(usesLeft("ivf") <= 0){ addLog("Only one IVF cycle a year — the body needs recovery time."); refreshActivitySheet(); return; }
  const cost = 5000;
  if(state.money < cost){ addLog(`An IVF cycle costs about ${money(cost)} — not affordable right now.`); refreshActivitySheet(); return; }
  recordUse("ivf");
  addMoney(-cost);
  nudgeHidden("stress", 8);
  // Real IVF success rates fall sharply with age.
  let chance = 0.4;
  if(state.age > 35) chance = 0.3;
  if(state.age > 40) chance = 0.15;
  if(state.age > 44) chance = 0.05;
  if(Math.random() < chance){
    addLog("The IVF cycle worked.");
    conceiveChild();
    state.failedConceptionYears = 0;
  } else {
    nudge("happiness", -6);
    addLog("The IVF cycle didn't take this time. Difficult, and expensive.");
  }
  refreshActivitySheet();
}

function setEstatePlan(plan){
  state.estatePlan = plan;
  const labels = { equal:"split equally among your children", eldest:"left entirely to your eldest child", charity:"left to charity" };
  addLog(`Drew up a will: estate to be ${labels[plan]}.`, true);
  refreshActivitySheet();
}

function heirShareFor(child, allChildren, totalEstate){
  if(allChildren.length === 0) return 0;
  if(hasPerk("dynasty")) totalEstate = Math.round(totalEstate * 1.25);
  const plan = state.estatePlan || "equal";
  if(plan === "charity") return 0;
  if(plan === "eldest"){
    const eldest = allChildren.reduce((a,b)=> (b.age>a.age?b:a), allChildren[0]);
    return child.id === eldest.id ? totalEstate : 0;
  }
  return Math.round(totalEstate / allChildren.length);
}

// A proposal makes sense once things are established — a few years together,
// or a partner old enough to be thinking about it.
function canPropose(){
  if(!state.relationship || state.married || state.age < 18) return false;
  const yearsTogether = state.relationshipYears || 0;
  const partnerAge = ensurePersonAge(state.relationship).age;
  return yearsTogether >= 2 || partnerAge >= 30;
}

function proposeReadyReason(){
  if(!state.relationship) return "You're not seeing anyone.";
  if(state.married) return "You're already married.";
  const yearsTogether = state.relationshipYears || 0;
  const partnerAge = ensurePersonAge(state.relationship).age;
  if(yearsTogether < 2 && partnerAge < 30){
    return `Too soon — ${state.relationship.name} is ${partnerAge} and you've been together ${yearsTogether} year${yearsTogether===1?"":"s"}. Give it until two years together, or until they're thirty.`;
  }
  return "";
}

// The odds of a yes. Driven by how close you are, how long it's been, and
// whether you turned up with a ring.
function proposalChance(ring){
  if(!state.relationship) return 0;
  const c = state.relationship.closeness || 50;
  const years = state.relationshipYears || 0;
  let p = 0.25 + (c - 50) / 110 + Math.min(years, 8) * 0.035 + (state.stats.looks - 50) / 500;
  p += ring ? ring.bonus : 0;
  // Being broke, or notorious, doesn't help.
  if(netWorth() < 0) p -= 0.08;
  if((state.hidden.karma || 50) < 25) p -= 0.08;
  return clamp01(p);
}

// Step one: shop for a ring, or decide to go without.
function openProposalFlow(){
  if(!canPropose()){ addLog(proposeReadyReason()); refreshActivitySheet(); return; }
  if(!spendAction("propose")){ refreshActivitySheet(); return; }
  if(usesLeft("propose") <= 0){ addLog("You've already had that conversation this year."); refreshActivitySheet(); return; }
  recordUse("propose");
  closeSheet();
  const affordable = ENGAGEMENT_RINGS.filter(r=>r.cost <= state.money);
  queueChoice({
    title: "Ring shopping",
    text: `You've decided to ask ${state.relationship.name}. A ring is the usual way to go about it — going without is cheaper, and considerably riskier.`,
    options: affordable.map(r=>({
      label: r.cost ? `${r.label} — ${money(r.cost)}` : r.label,
      effect: ()=>{
        if(r.cost) addMoney(-r.cost);
        if(r.id === "none") addLog(`Decided to propose to ${state.relationship.name} without a ring.`);
        else addLog(`Bought a ring: ${r.label.toLowerCase()}, ${money(r.cost)}. ${r.desc}`);
        doPropose(r);
      },
    })),
  });
}

// Step two: the proposal.
function doPropose(ring){
  if(!state.relationship) return;
  const p = state.relationship;
  const chance = proposalChance(ring);
  if(Math.random() < chance){
    state.engaged = true;
    state.engagementRing = ring ? ring.id : "none";
    p.closeness = clamp((p.closeness||50) + rand(8,16));
    nudge("happiness", 14);
    milestone("engaged", `${p.name} said yes. You're engaged.`);
    openWeddingPlanner();
  } else {
    // A refusal stings, and sometimes ends it.
    nudge("happiness", -14);
    nudgeHidden("stress", 12);
    p.closeness = clamp((p.closeness||50) - rand(10,25));
    if(ring && ring.id === "none" && Math.random() < 0.5){
      addLog(`${p.name} said no — and asked whether you'd even thought it through. You're no longer together.`, true);
      state.relationship = null;
    } else if(Math.random() < 0.3){
      addLog(`${p.name} said no, and that was the end of the relationship.`, true);
      state.relationship = null;
    } else {
      addLog(`${p.name} said no. Not yet, anyway.`, true);
    }
  }
}

// Step three: where, who pays, and whether to protect what you've got.
function openWeddingPlanner(){
  if(!state.relationship || !state.engaged) return;
  const affordable = WEDDING_VENUES.filter(v=>v.cost <= state.money);
  const options = (affordable.length ? affordable : [WEDDING_VENUES[0]]).map(v=>({
    label: `${v.label} — ${money(v.cost)}`,
    effect: ()=>{
      if(state.money >= v.cost) addMoney(-v.cost);
      state.weddingVenue = v.id;
      nudge("happiness", rand(v.happy[0], v.happy[1]));
      if(v.fame) nudgeHidden("fame", v.fame);
      const bf = state.friends.find(f=>f.isBestFriend);
      milestone("married", `Married ${state.relationship.name} at ${v.label.toLowerCase()} — ${money(v.cost)}.${bf ? ` ${bf.name} stood up with you.` : ""}`);
      finaliseMarriage();
    },
  }));
  options.push({
    label: "Put the wedding off for now",
    effect: ()=>{ addLog("Engaged, with the wedding left for another year."); },
  });
  queueChoice({
    title: "Where are you getting married?",
    text: `Engaged to ${state.relationship.name}. ${affordable.length < WEDDING_VENUES.length ? "Some venues are beyond what you can afford." : "Everything is within reach."} Balance: ${money(state.money)}.`,
    options,
  });
}

function finaliseMarriage(){
  state.married = true;
  state.engaged = false;
  state.flags.everMarried = true;
  state.marriedAtAge = state.age;
  openPrenupChoice();
}

// The prenup comes after the venue, as it does in life — and it matters most
// when there's something to protect.
function openPrenupChoice(){
  const nw = netWorth();
  const them = state.relationship ? partnerNetWorth(state.relationship) : 0;
  const theirName = state.relationship ? state.relationship.name : "your spouse";
  // The whole point of the decision is the gap between the two columns: a
  // prenup protects the richer party and costs the poorer one nothing.
  const ledger = `You: ${money(nw)} · ${theirName}: ${money(them)}.`;
  const verdict = nw > them * 1.5 && nw - them > 25000
    ? ` You're bringing considerably more into the marriage, so a prenup would be protecting your side of it.`
    : them > nw * 1.5 && them - nw > 25000
      ? ` ${theirName} is bringing considerably more into the marriage — a prenup here would mostly protect them, not you.`
      : ` You're coming into this on roughly even terms, so there's little in it either way.`;
  queueChoice({
    title: "A prenuptial agreement",
    text: nw > 50000 || them > 50000
      ? `Your solicitor has raised a prenup, and has laid out what each of you is worth. ${ledger}${verdict} It would cap a divorce settlement at 10% rather than 40% — though ${theirName} may not love being asked.`
      : `Your solicitor has raised a prenup, more as a formality. ${ledger} There isn't much to protect yet, but it would hold if that changes.`,
    options: [
      { label: "Sign a prenup", effect: ()=>{
          const fee = Math.max(400, Math.round(nw * 0.005));
          if(state.money >= fee) addMoney(-fee);
          state.hasPrenup = true;
          if(state.relationship) state.relationship.closeness = clamp(state.relationship.closeness - rand(3,10));
          addLog(`Signed a prenuptial agreement — ${money(fee)} in legal fees. It caps a divorce settlement at 10% rather than 40%.`, true);
        }},
      { label: "Don't bother", effect: ()=>{
          if(state.relationship) state.relationship.closeness = clamp(state.relationship.closeness + rand(2,6));
          state.hasPrenup = false;
          addLog("Decided against a prenup.");
        }},
    ],
  });
}

function startGame(name, gender, sexuality, godModeOptions){
  notifications = [];
  pendingOutcome = null;
  // The decade you're born into decides which careers exist, what money is
  // worth, and what the world does to you along the way.
  const era = (godModeOptions && godModeOptions.eraId) ? eraById(godModeOptions.eraId) : pick(ERAS);
  const birthYear = rand(era.birthRange[0], era.birthRange[1]);
  // The setup screen supplies a full name; only invent a surname if one of
  // the other entry points (e.g. a test) passed a bare first name.
  const surname = name.trim().includes(" ") ? "" : " " + pick(SURNAMES);
  const nobility = (godModeOptions && godModeOptions.nobility) || "commoner";
  let tier = (godModeOptions && godModeOptions.wealthClass) || pick(["poor","middle","middle","rich"]);
  if(nobility !== "commoner") tier = "rich"; // nobles and royals always start wealthy, overriding any wealth class chosen
  const birthplace = (godModeOptions && godModeOptions.birthplace) || rollBirthplace();
  // Starting money is quoted in modern terms and scaled into the birth year.
  const tierMoney = Math.round({ poor: rand(0,200), middle: rand(300,900), rich: rand(3000,9000) }[tier]
    * diff().startMult * (hasPerk("nest_egg") ? 3 : 1) * moneyIndex(birthYear));
  const tierStatBoost = { poor: -8, middle: 0, rich: 8 }[tier];

  // Parents are a plausible age at your birth, so they age with you and die
  // when their own years catch up with them.
  const mother = makePerson("Mother", "Girl", rand(20, 38));
  const father = makePerson("Father", "Boy", rand(21, 42));
  const family = [mother, father];
  // Older siblings already exist at your birth; younger ones are born during
  // your early childhood, as actual events, rather than existing at a
  // negative age.
  const olderSiblings = pick([0, 0, 1, 1, 2, 2, 3]);
  for(let i = 0; i < olderSiblings; i++){
    family.push(makePerson("Sibling", undefined, rand(1, 9)));
  }
  const youngerSiblings = pick([0, 0, 0, 1, 1, 2]);
  // Grandparents, where the parents' ages leave room for them.
  if(Math.random() < 0.75) family.push(makePerson("Grandmother", "Girl", mother.age + rand(22, 34)));
  if(Math.random() < 0.6)  family.push(makePerson("Grandfather", "Boy", father.age + rand(23, 36)));
  if(nobility === "royal"){
    (Math.random() < 0.5 ? mother : father).isMonarch = true;
  }

  state = {
    name: name.trim() + surname,
    gender,
    sexuality,
    age: 0,
    eraId: era.id,
    birthYear,
    year: birthYear,
    stats: {
      health: clamp(rand(55,80)),
      happiness: clamp(rand(55,80)),
      smarts: clamp(rand(35,65) + tierStatBoost),
      looks: clamp(rand(35,65) + tierStatBoost),
    },
    yearlyStatGain: {health:0, happiness:0, smarts:0, looks:0},
    skills: { football:0, tennis:0, motorsport:0, martialArts:0, bodybuilding:0, esports:0, languages:0 },
    yearlySkillGain: { football:0, tennis:0, motorsport:0, martialArts:0, bodybuilding:0, esports:0, languages:0 },
    yearlyActivityUses: {},
    degree: null,
    hidden: { stress: rand(20,40), energy: rand(60,85), karma: 50, fame: 0 },
    followers: 0, social: {}, socialOther: 0, socialSynced: 0, exes: [], late: [], certificates: [],
    hasPrenup: false,
    money: tierMoney,

  // Apply any scenario-specific starting conditions.
  const sc = SCENARIOS.find(x=>x.id === state.scenarioId);

  if(sc && sc.goal) addLog(`Scenario: ${sc.name} — ${sc.goal.desc}.`, true);
  // Skip the Pram: childhood is simulated in one go and summarised, so the run
  // begins at sixteen with whatever those years made of you.
  if(hasPerk("start_sixteen")) fastForwardChildhood();

  setupDraft = null; // next new life gets a freshly rolled character
  queueSave();

    addLog(`${state.name} is born in ${birthplace}, into a ${tier} household, to ${mother.name} and ${father.name}.`, true);

      addLog(`${monarch.name}, the reigning ${monarch===mother?"Queen":"King"}, sits on the throne. One day, it may pass to ${state.name}.`, true);
    }
  }
  render();
}

// ---------- Continuing as a child (legacy mode) ----------

function startAsChild(childId){
  const chosen = state.children.find(c=>c.id===childId);
  if(!chosen) return;
  notifications = [];
  pendingOutcome = null;
  // In case the heir only ever held a grandchild count (an older save, or a
  // child who came of age the same year you died).
  backfillGrandchildren(chosen);

  const deceasedName = state.name;
  const deceasedGender = state.gender;
  const wasMonarch = !!state.flags.becameMonarch;
  const survivingSpouse = (state.married && state.relationship) ? state.relationship : null;
  const oldSurname = state.name.trim().split(" ").slice(1).join(" ") || pick(SURNAMES);
  const passing = heirloomsForHeir(chosen, state.children, state.name, state.gender);
  const passingValue = passing.reduce((s,a)=>s+a.value,0);
  // The money divides among the children; the heirlooms go to the heir, so
  // they come out of the pot first rather than being counted twice.
  const totalEstate = Math.max(0, netWorth() - passingValue);
  const shareCount = state.children.length;
  const inheritance = heirShareFor(chosen, state.children, totalEstate);
  const prevGeneration = state.generation || 1;
  const prevNobility = state.nobility;

  const newFamily = [];
  // The heir carries on wherever they live; everyone else is where they are.
  const diedIn = state.currentCountry;
  const heirCountry = chosen.country || diedIn;
  newFamily.push({ id: personIdCounter++, name: deceasedName, relation: deceasedGender==="Girl"?"Mother":"Father", gender: deceasedGender, alive:false, closeness:70, country: diedIn });
  if(survivingSpouse){
    newFamily.push({ id: personIdCounter++, name: survivingSpouse.name, relation: survivingSpouse.gender==="Girl"?"Mother":"Father", gender: survivingSpouse.gender, alive:true, closeness:70, country: survivingSpouse.country || diedIn });
  }
  state.children.forEach(c=>{
    if(c.id !== chosen.id){
      // Siblings you didn't play as go on to live their own lives — roll a
      // plausible outcome now so you can see how they turned out later.
      const outcome = pick([
        "became a teacher", "went into medicine", "runs a small business",
        "moved abroad and rarely visits", "works in a trade and does well",
        "drifted through a few jobs", "made a fortune in finance",
        "became a musician of modest renown", "settled down with a big family",
        "had a difficult time of it", "joined the forces", "went into politics",
      ]);
      newFamily.push({ id: personIdCounter++, name:c.name, relation:"Sibling", gender: pick(["Boy","Girl"]), alive:true, closeness: rand(40,70), siblingOutcome: outcome, country: c.country || diedIn });
    }
  });

  const dynastyBonus = hasPerk("dynasty") ? 10 : 0;
  const inheritedSmarts = clamp(Math.round((state.stats.smarts + rand(30,70))/2) + dynastyBonus);
  const inheritedLooks = clamp(Math.round((state.stats.looks + rand(30,70))/2) + dynastyBonus);
  const chosenGender = chosen.gender || pick(["Boy","Girl"]);

  const carriedChildren = (chosen.ownChildren || []).map(gk=>({
    id: gk.id,
    name: gk.name,
    gender: gk.gender,
    age: gk.age,
    health: gk.health,
    happiness: gk.happiness,
    smarts: gk.smarts,
    bond: gk.bond,
  }));

  state = {
    name: chosen.name + " " + oldSurname,
    gender: chosenGender,
    sexuality: pick(["Straight","Straight","Straight","Gay","Bisexual"]),
    age: chosen.age,
    year: state.year,
    // The heir lives on in the same calendar year, so their era follows from
    // when they were actually born rather than their parent's decade.
    birthYear: state.year - chosen.age,
    eraId: (ERAS.find(e=>(state.year - chosen.age) >= e.birthRange[0] && (state.year - chosen.age) <= e.birthRange[1]) || ERAS[ERAS.length-1]).id,
    stats: {
      health: clamp(chosen.health),
      happiness: clamp(chosen.happiness),
      smarts: inheritedSmarts,
      looks: inheritedLooks,
    },
    yearlyStatGain: {health:0, happiness:0, smarts:0, looks:0},
    skills: { football:0, tennis:0, motorsport:0, martialArts:0, bodybuilding:0, esports:0, languages:0 },
    yearlySkillGain: { football:0, tennis:0, motorsport:0, martialArts:0, bodybuilding:0, esports:0, languages:0 },
    yearlyActivityUses: {},
    degree: null,
    hidden: { stress: rand(20,40), energy: rand(60,85), karma: 50, fame: 0 },
    followers: 0, social: {}, socialOther: 0, socialSynced: 0, exes: [], late: [], certificates: [],
    hasPrenup: false,
    money: inheritance,
    education: "none",
    career: null,
    business: null,
    politics: null,
    pets: [],
    snapshots: [],
    addictions: [],
    postgrad: null,
    postgradAwards: [],
    failedConceptionYears: 0,
    estatePlan: null,
    custody: null,
    gang: null,
    bucketList: { done:{}, holidayTaken:false, everHadPet:false },
    conditions: [],
    flags: {},
    family: newFamily,
    friends: [],
    // The heir's own partner and children come with them — previously the
    // whole next generation was dropped on continuation.
    relationship: chosen.partnered && chosen.partnerName
      ? { id: personIdCounter++, name: chosen.partnerName,
          relation: "Partner",
          gender: (chosen.gender === "Girl") ? "Boy" : "Girl",
          alive: true, closeness: rand(55,85),
          age: Math.max(18, chosen.age + rand(-5,5)) }
      : null,
    married: !!chosen.partnered,
    relationshipYears: chosen.partnered ? Math.max(1, rand(1, Math.max(1, chosen.age - 20))) : 0,
    children: carriedChildren,
    assets: passing,
    wealthTier: prevNobility !== "commoner" ? "rich" : (inheritance > 20000 ? "rich" : inheritance > 5000 ? "middle" : "poor"),
    nobility: prevNobility,
    birthplace: state.birthplace,
    currentCountry: heirCountry,
    // Pay and prices are those of where the heir lives, against the family's home country.
    emigrationMultipliers: heirCountry === state.birthplace ? { salaryMult: 1, costMult: 1 } : (()=>{ const sh = emigrationShift(heirCountry); return { salaryMult: sh.salaryMult, costMult: sh.costMult }; })(),
    prisonYearsLeft: 0,
    recoveryYearsLeft: 0,
    yearsHighStress: 0,
    generation: prevGeneration + 1,
    livingWithParents: chosen.age < 18,
    worldEvent: null,
    studentLoan: null,
    pension: 0,
    creditScore: 60,
    lifeInsurance: null,
    careerWarning: null,
    lastIncome: 0,
    records: { health:0, happiness:0, smarts:0, looks:0, netWorth:inheritance },
    causeOfDeath: null,
    newAchievements: [],
    alive: true,
    log: [],
    pendingChoice: null,
  };

  // launchAdultChild reads `state`, so this runs only once the new state is in
  // place — a grandchild who arrives already grown gets an education, a career
  // and the rest, rather than showing blanks on the children screen.
  state.children.forEach(c=>{ if(c.age >= 18 && !c.adult) launchAdultChild(c); });

  addLog(`${state.name} takes up the ledger as the ${ordinal(state.generation)} generation of the family, inheriting ${money(inheritance)}.`, true);
  if(state.children.length){
    addLog(`${state.children.length === 1 ? "A child comes" : "Children come"} with you: ${state.children.map(c=>`${c.name} (${c.age})`).join(", ")}.`, true);
  }
  if(wasMonarch && prevNobility === "royal"){
    state.flags.becameMonarch = true;
    addLog(`As ${deceasedName}'s heir, ${state.name} ascends to the throne as ${chosenGender==="Boy"?"King":"Queen"}.`, true);
  }
  render();
}

// ---------- Logging ----------

function addLog(text, isStamp, isNews){
  // Audio feedback follows the same classification used for log colour.
  if(!isNews){
    if(/\bdied|passed away|injured|lost|failed|caught|turned down|unsuccessful|bust|went under|destroyed|convicted|sentenced/i.test(text)) SFX.bad();
    else if(/won|jackpot|promoted|awarded|married|qualified|hired|accepted|inherit|payout|prize/i.test(text)) SFX.good();
    else if(/salary|received|royalties|rent on|profit/i.test(text)) SFX.money();
  }
  // Classify for colour so the log is scannable at a glance rather than a
  // uniform wall of grey.
  let kind = "";
  if(!isNews && !isStamp){
    if(/\bdied|passed away|injured|lost|failed|caught|turned down|unsuccessful|didn't|declined|bust|went under|destroyed|damaged|missed a|botched|diagnosed/i.test(text)) kind = "bad";
    else if(/salary|stipend|pension|support|allowance|received|won|nets|brought in|collected|inherit|payout|prize|profit|rent on|sold|cut from/i.test(text)) kind = "money-in";
    else if(/costs|bills|fee|spent|repayment|premium|invested|bought|fined|settled|damages|entry/i.test(text)) kind = "money-out";
  }
  state.log.push({age: state.age, text, stamp: !!isStamp, news: !!isNews, kind});
}

// ---------- Core stat helpers ----------

const STAT_YEAR_CAP = 12; // max total increase to any one stat per in-game year

function statCap(key){
  if(key === "looks" && state.age > 60) return Math.max(20, 100 - (state.age-60)*1.5);
  return 100;
}
function nudge(key, delta){
  if(delta > 0){
    const gained = state.yearlyStatGain[key] || 0;
    const room = STAT_YEAR_CAP - gained;
    if(room <= 0) return;
    if(delta > room) delta = room;
    state.yearlyStatGain[key] = gained + delta;
  }
  state.stats[key] = clamp(state.stats[key] + delta, statCap(key));
  updateRecords();
}
function nudgeHidden(key, delta){
  state.hidden[key] = clamp(state.hidden[key] + delta);
}
function nudgeSkill(key, delta){
  if(delta > 0){
    const gained = state.yearlySkillGain[key] || 0;
    const room = STAT_YEAR_CAP - gained;
    if(room <= 0) return;
    if(delta > room) delta = room;
    state.yearlySkillGain[key] = gained + delta;
  }
  state.skills[key] = clamp((state.skills[key]||0) + delta);
}
// Earned income is taxed progressively (UK-style bands), so take-home pay is
// meaningfully less than the headline salary. Without this, even a minimum-wage
// character banks most of their gross pay and everyone retires a millionaire.
function incomeTax(gross){
  if(hasPerk("tax_adviser")) return Math.round(rawIncomeTax(gross) * 0.9);
  return rawIncomeTax(gross);
}

function rawIncomeTax(gross){
  if(gross <= 0) return 0;
  const allowance = 12570, basicTop = 50270, higherTop = 125140;
  let tax = 0;
  if(gross > higherTop) tax += (gross - higherTop) * 0.45;
  if(gross > basicTop) tax += (Math.min(gross, higherTop) - basicTop) * 0.40;
  if(gross > allowance) tax += (Math.min(gross, basicTop) - allowance) * 0.20;
  // National Insurance, roughly
  if(gross > allowance) tax += (Math.min(gross, basicTop) - allowance) * 0.08;
  if(gross > basicTop) tax += (gross - basicTop) * 0.02;
  return Math.round(tax);
}

// All earned income in a year is taxed together. Each payment is taxed at the
// marginal rate on top of whatever has already come in this year of your life,
// so a salary, a fee, a tour and a sponsorship deal share one personal
// allowance between them instead of each getting their own, and the year's
// total tax is the same whichever order the money arrives in. The tally
// starts again at each birthday; lastIncome (which student-loan repayment
// reads) is the year's running total.
function incomeSoFarThisYear(){
  return state.incomeTallyAge === state.age ? (state.incomeTally || 0) : 0;
}
function taxOnTop(gross){
  const already = incomeSoFarThisYear();
  return incomeTax(already + gross) - incomeTax(already);
}
function recordIncome(gross){
  state.incomeTally = incomeSoFarThisYear() + gross;
  state.incomeTallyAge = state.age;
  state.lastIncome = state.incomeTally;
}
function payIncome(grossModern, label){
  // Ladder salaries are written in today's money; what actually lands in the
  // account is that figure in the money of the year you're living in.
  const gross = Math.round(grossModern * priceLevel());
  const tax = taxOnTop(gross);
  const net = gross - tax;
  addMoney(net);
  recordIncome(gross);
  addLog(`${label}: ${money(gross)} gross, ${money(net)} after ${money(tax)} tax.`);
  return net;
}
// Kept as a name for the callers that already use it; it is the same thing now.
function payAdditionalIncome(grossModern, label){ return payIncome(grossModern, label); }

function addMoney(delta){
  state.money += delta;
  updateRecords();
}
function addCondition(name, severity){
  if(!state.conditions.some(c=>c.name===name)){
    state.conditions.push({name, sinceAge: state.age, severity: severity || "chronic"});
    addLog(`Diagnosed with ${name}.`);
  }
}
function netWorth(){
  const assetValue = state.assets.reduce((s,a)=>s+a.value,0);
  const mortgageDebt = state.assets.reduce((s,a)=>s+(a.mortgage ? a.mortgage.balance : 0),0);
  const studentDebt = state.studentLoan ? state.studentLoan.balance : 0;
  const businessValue = state.business ? state.business.valuation : 0;
  return Math.round(state.money + assetValue + state.pension + businessValue - mortgageDebt - studentDebt);
}
function updateRecords(){
  STAT_KEYS.forEach(k=>{ if(state.stats[k] > state.records[k]) state.records[k] = state.stats[k]; });
  const nw = netWorth();
  if(nw > state.records.netWorth) state.records.netWorth = nw;
}

// ---------- Death check ----------

function deathChance(age){
  // Graduated to follow real mortality rather than a flat rate for everyone
  // under 50 — a child should not share a 49-year-old's odds. Childhood and
  // early adulthood are near-zero, and risk climbs steeply only in later life.
  let chance;
  if(age < 15)      chance = 0.0001;
  else if(age < 25) chance = 0.0004;
  else if(age < 35) chance = 0.0008;
  else if(age < 45) chance = 0.0018;
  else if(age < 55) chance = 0.004;
  else if(age < 65) chance = 0.011;
  else if(age < 75) chance = 0.030;
  else if(age < 85) chance = 0.080;
  else if(age < 95) chance = 0.20;
  else              chance = 0.42;

  // Conditions and risk factors scale with the underlying rate rather than
  // adding a flat amount, so they can't dominate an otherwise healthy youth.
  const riskMult = 1
    + state.conditions.length * 0.5
    + (state.flags.smoker ? 0.6 : 0)
    + ((state.addictions||[]).length * 0.4)
    + (state.worldEvent && state.worldEvent.type === "pandemic" ? 0.5 : 0);

  // Health is a genuine protective factor, not just a floor. Keeping health
  // high should realistically buy you years: at 70+ the annual risk is roughly
  // halved, and at 90+ it is cut to a quarter — so a well-looked-after
  // character can comfortably reach their late seventies and beyond.
  const h = state.stats.health;
  let healthMult;
  if(h >= 90)      healthMult = 0.25;
  else if(h >= 80) healthMult = 0.35;
  else if(h >= 70) healthMult = 0.5;
  else if(h >= 60) healthMult = 0.75;
  else if(h >= 45) healthMult = 1;
  else if(h >= 30) healthMult = 1.6;
  else if(h >= 15) healthMult = 2.5;
  else             healthMult = 4;

  return chance * riskMult * healthMult * diff().deathMult * (hasPerk("good_genes") ? 0.85 : 1);
}

function buildDeathCauses(){
  let causes = ["a quiet illness","a sudden decline","natural causes"];
  state.conditions.forEach(c=>{ causes.push(`complications from ${c.name}`); causes.push(`complications from ${c.name}`); });
  if(state.flags.smoker){ causes.push("a smoking-related illness"); causes.push("a smoking-related illness"); }
  if(state.career && state.career.kind === "forces") causes.push("an incident in service");
  if(state.worldEvent && state.worldEvent.type === "pandemic") causes.push("the pandemic");
  return causes;
}

function maybeDie(){
  // Childhood and adolescence are protected from unexplained death. A life that
  // ends at 6 of "natural causes" is just a wasted run, so under-18s can only
  // die from something the player can actually see coming — a disaster, a
  // serious accident, or health genuinely driven into the ground.
  const minor = state.age < 18;

  if(state.stats.health <= 0){
    if(minor){
      // Pull them back from the brink rather than ending the run outright.
      state.stats.health = 10;
      addLog("A serious spell of illness, but you pulled through.", true);
      return false;
    }
    // Second Wind is good for exactly one reprieve in a life.
    if(hasPerk("second_wind") && !state.flags.usedSecondWind){
      state.flags.usedSecondWind = true;
      state.stats.health = 25;
      milestone("milestone", "You should not have survived that. Somehow you did.");
      return false;
    }
    die("failing health");
    return true;
  }

  if(minor) return false;

  const chance = deathChance(state.age); // already scaled by health
  if(Math.random() < chance){ die(pick(buildDeathCauses())); return true; }
  return false;
}

function triggerSuccession(){
  state.flags.becameMonarch = true;
  const crownWealth = rand(5000000, 20000000);
  addMoney(crownWealth);
  nudge("happiness", 15);
  const newTitle = state.gender === "Boy" ? "King" : "Queen";
  addLog(`${state.name} ascends to the throne as ${newTitle}! The royal treasury adds ${money(crownWealth)} to the accounts.`, true);
}

function die(cause){
  state.alive = false;
  state.causeOfDeath = cause;
  addLog(`${state.name}'s account is closed, age ${state.age}, of ${cause}.`, true);
  if(state.lifeInsurance){
    addLog(`A ${state.lifeInsurance.label} life insurance payout of ${money(state.lifeInsurance.payout)} passes to the family.`, true);
  }
  if(state.pension > 0){
    addLog(`An unclaimed pension pot of ${money(state.pension)} passes to the family.`, true);
  }
  state.newAchievements = checkAchievements();
  state.ribbon = awardRibbon(state);
  recordToMuseum(state);
  state.newChallenges = checkChallenges(state);
  state.finalScore = recordFinishedLife(state);
  discardSavedLife();
}

// Ends the run deliberately rather than waiting for death — the life is
// closed, scored and ribboned as normal, and an heir can carry it on.
function endLedgerEarly(){
  if(!state || !state.alive) return;
  closeSheet();
  const heirs = (state.children||[]).length;
  queueChoice({
    title: "Close the ledger",
    text: `You're ${state.age}, with ${money(netWorth())} to your name. Closing the ledger now ends this life for good: it's scored and filed like any other.${heirs ? ` You have ${heirs} ${heirs===1?"child":"children"} who could carry it on.` : " You have no children, so the line ends here."}`,
    options: [
      { label: "Close it — I'm done", effect: ()=>{
          die("a ledger closed by choice");
          SFX.death();
          render();
        }},
      { label: "Keep going", effect: ()=>{ addLog("Thought better of it. The ledger stays open."); } },
    ],
  });
}

function checkAchievements(){
  const newly = ACHIEVEMENTS.filter(a=>a.test(state) && !unlockedAchievements.includes(a.id));
  newly.forEach(a=>unlockedAchievements.push(a.id));
  if(newly.length) saveUnlockedAchievements();
  return newly;
}

// Rolls sixteen years of childhood in one pass — schooling, the stat drift and
// the household you grew up in — without making the player press Age sixteen
// times for a stretch of life they have little control over.
function fastForwardChildhood(){
  const start = { ...state.stats };
  state.age = 16;
  state.year = (state.birthYear || state.year) + 16;
  state.education = "school";
  // A childhood's worth of drift, weighted by the household you were born into.
  const tierBias = { poor:-5, middle:0, rich:6 }[state.wealthTier] || 0;
  nudge("smarts", rand(4, 20) + tierBias);
  nudge("health", rand(-4, 10) + Math.round(tierBias/2));
  nudge("happiness", rand(-6, 12) + tierBias);
  nudge("looks", rand(-4, 10));
  // Everyone else ages those sixteen years too.
  for(let y=0;y<16;y++){
    state.family.forEach(p=>{ ensurePersonAge(p); if(p.alive) p.age += 1; });
  }
  // A plausible scattering of childhood outcomes.
  const notes = [];
  if(state.stats.smarts >= 65) notes.push("did well at school");
  else if(state.stats.smarts <= 35) notes.push("struggled in the classroom");
  if(state.stats.health >= 70) notes.push("rarely ill");
  else if(state.stats.health <= 40) notes.push("a sickly child");
  if(state.stats.happiness >= 70) notes.push("a happy enough childhood");
  else if(state.stats.happiness <= 35) notes.push("not an easy few years");
  if(Math.random() < 0.3){ const f = addFriend(null, rand(55,80)); notes.push(`made a lasting friend in ${f.name}`); }
  state.livingWithParents = true;
  const deltas = STAT_KEYS.map(k=>`${k} ${state.stats[k]-start[k]>=0?"+":""}${state.stats[k]-start[k]}`).join(", ");
  addLog(`Sixteen years pass. ${notes.length ? notes.join(", ") + "." : "An unremarkable childhood."} (${deltas})`, true);
}

// ---------- Age up ----------

function ageUp(){
  if(!state.alive) return;
  pushSnapshot();
  state.age += 1;
  state.year += 1;
  state.yearlyStatGain = {health:0, happiness:0, smarts:0, looks:0};
  state.yearlySkillGain = {football:0, tennis:0, motorsport:0, martialArts:0, bodybuilding:0, esports:0, languages:0};
  state.yearlyActivityUses = {};
  state.actionsUsed = 0;
  state.pendingActionId = null;
  // Snapshot so we can show what actually changed over the year.
  const yearStart = {
    stats: {...state.stats},
    money: state.money,
    netWorth: netWorth(),
    logLen: state.log.length,
  };

  if(state.prisonYearsLeft > 0){
    state.prisonYearsLeft -= 1;
    state.prisonActionUsed = false;   // one choice per year inside
    nudge("health", rand(-4,0));
    // A well-behaved year inside is still grim, but less so than a hostile one.
    nudge("happiness", prisonConduct() >= 65 ? -4 : prisonConduct() <= 30 ? -9 : -6);
    // Running with a crew or a poor record invites trouble you didn't choose.
    if(prisonConduct() <= 30 && Math.random() < 0.3){
      nudge("health", -rand(5,15));
      addLog("Singled out on the wing — a bad year, and you wear it.");
    } else {
      pick(PRISON_EVENTS)();
    }
    // The world doesn't stop while you're inside: family and children age,
    // pets age, debts accrue, investments move and bills still fall due.
    // Only the things needing your presence (work, business, office, social
    // life, activities) are suspended.
    applyConditions();
    applyAddictions();
    maybeSilentCondition();
    progressConditions();
    ageFamilyAndFriends();
    agePets();
    tickWorldEvent();
    payMortgages();
    repayStudentLoan();
    payLifeInsurancePremium();
    growPension();
    applyExpenses();
    depreciateAssets();
    if(state.prisonYearsLeft > 0) addLog("Spent another year in prison.");
    else milestone("released", "Released from prison.");
    buildYearReview(yearStart);
    SFX.age();
    if(maybeDie()){ SFX.death(); queueSave(); render(); return; }
    queueSave();
    render();
    return;
  }

  checkStageTransition();
  runEraEvent();
  if(checkConscription()){
    // Call-up papers are the year's decision; everything else still happens.
  }
  addYearlyNews();

  // Fractional drift is applied probabilistically so difficulty can nudge
  // ageing gently rather than only in whole points a year.
  const drift = diff().healthDrift || 0;
  const wholeDrift = Math.trunc(drift) + (Math.random() < Math.abs(drift % 1) ? Math.sign(drift) : 0);
  nudge("health", rand(-3,1) + wholeDrift);
  nudge("happiness", rand(-2,2));
  nudgeHidden("energy", rand(-3,2));
  nudgeHidden("stress", rand(-2,3));
  if(state.flags.smoker) nudge("health", -2);

  applyCouplings();
  applyConditions();
  applyAddictions();
  maybeSilentCondition();
  progressConditions();
  ageFamilyAndFriends();
  tickWorldEvent();
  maybeTriggerWorldEvent();
  runCareerYear();
  if(!state.alive){ SFX.death(); queueSave(); render(); return; }
  runBusinessYear();
  runPoliticsYear();
  runGangYear();
  runPostgradYear();
  runEnemyYear();
  checkScenarioGoal();
  maybeCareerEvent();
  maybeOpportunity();
  // Flags that challenges check later.
  if(state.age < 40 && netWorth() >= 500000) state.flags.richBy40 = true;
  if(state.prisonYearsLeft > 0) state.flags.servedTime = true;
  // Rivalries occasionally form on their own.
  if((state.enemies||[]).length < 3 && state.age >= 12 && Math.random() < 0.04){
    makeEnemy(pick(["a falling out at work","an old grudge from school","a dispute with a neighbour","a row that got out of hand"]));
  }
  runStudyingYear();
  // Old Money: a relative you barely knew leaves you something.
  if(hasPerk("old_money") && !state.flags.oldMoneyPaid && state.age >= 21 && state.age <= 29 && Math.random() < 0.3){
    state.flags.oldMoneyPaid = true;
    const amount = Math.round(rand(8000, 30000) * priceLevel());
    addMoney(amount);
    milestone("windfall", `A relative you barely knew has left you ${money(amount)}.`);
  }
  checkBucketList();
  agePets();
  runSocialYear();
  maybeJuryDuty();
  recoverStress();
  checkBurnout();
  tickRecovery();
  homeYear();
  collectRent();
  payMortgages();
  repayStudentLoan();
  payLifeInsurancePremium();
  growPension();
  claimBenefits();
  statePension();
  checkRetirementAge();
  applyExpenses();
  depreciateAssets();
  runAgeEvents();
  maybeSocialEvent();
  maybeRareEvent();
  state.datingProfiles = null;   // a fresh set of profiles on the app each year

  buildYearReview(yearStart);
  SFX.age();
  if(maybeDie()){ SFX.death(); queueSave(); render(); return; }
  queueSave();
  render();
}

// Condenses the year into a card so the player sees the shape of what happened
// without re-reading the whole log.
function buildYearReview(start){
  const deltas = {};
  STAT_KEYS.forEach(k=>{ deltas[k] = state.stats[k] - start.stats[k]; });
  const newEntries = state.log.slice(start.logLen);
  const highlight = newEntries.find(e=>e.stamp && !e.news);
  state.yearReview = {
    age: state.age,
    year: state.year,
    deltas,
    moneyDelta: state.money - start.money,
    netWorthDelta: netWorth() - start.netWorth,
    highlight: highlight ? highlight.text : null,
    events: newEntries.filter(e=>!e.news).length,
  };
}

// Stress eases with time. Each year it drifts part of the way back towards a
// resting level, faster for someone who is healthy, happy, loved and not at
// work, so an ordinary job settles at a steady level and burnout takes years of
// heavy load (frontline work, crime, crises one after another), not just having a job.
const STRESS_REST = 30;
function stressRecoveryRate(){
  if(state.prisonYearsLeft > 0) return 0.04;
  let k = 0.08;
  if(state.stats.happiness >= 60) k += 0.04;
  if(state.stats.health >= 60) k += 0.03;
  if(state.relationship && (state.relationship.closeness||0) >= 60) k += 0.03;
  if((state.friends||[]).some(f=>(f.closeness||0) >= 60)) k += 0.02;
  if(!state.career) k += 0.05;
  if(state.stats.happiness < 30) k -= 0.04;
  return Math.max(0.03, k);
}
function recoverStress(){
  const s = state.hidden.stress || 0;
  if(s <= STRESS_REST) return;
  const drop = Math.round((s - STRESS_REST) * stressRecoveryRate());
  if(drop > 0) nudgeHidden("stress", -drop);
}

function checkBurnout(){
  if(!state.career){ state.yearsHighStress = 0; return; }
  if(state.hidden.stress > 80){
    state.yearsHighStress = (state.yearsHighStress||0) + 1;
  } else {
    state.yearsHighStress = 0;
  }
  if(state.yearsHighStress >= 3){
    addLog("Burned out after years of relentless stress — walked away from the job, whatever the rank.", true);
    state.career = null;
    state.yearsHighStress = 0;
    nudgeHidden("stress", -30);
    nudge("happiness", -10);
    state.flags.hadBurnout = true;
  }
}

// Jury duty: mandatory, unavoidable, no choice offered — it just happens.
function maybeJuryDuty(){
  if(state.age < 18 || state.age > 70) return;
  if(Math.random() >= 0.04) return;
  let cost = 0;
  if(state.lastIncome > 0){
    cost = Math.round(state.lastIncome / 52);
    addMoney(-cost);
  }
  nudge("happiness", -3);
  addLog(`Called up for jury duty — a week away from work${cost>0 ? `, costing about ${money(cost)} in lost income` : ""}.`, true);
}

// Any legal training or career gives a real edge if a case ever goes to court.
function legalAdvantage(){
  let bonus = 0;
  if(state.degree === "Law") bonus += 15;
  if(state.career && state.career.kind === "civilian"){
    const track = TRACKS.find(t=>t.id===state.career.trackId);
    if(track && track.category === "Legal") bonus += 25;
  }
  return bonus;
}

// A bad injury doesn't just cost health points once — it sidelines you for a
// year or two, with reduced income while you're recovering.
function startRecovery(years){
  state.recoveryYearsLeft = Math.max(state.recoveryYearsLeft||0, years);
}
function tickRecovery(){
  if(state.recoveryYearsLeft <= 0) return;
  nudge("health", 5);
  state.recoveryYearsLeft -= 1;
  addLog(state.recoveryYearsLeft > 0 ? "Still recovering from the injury — income reduced while you're out." : "Fully recovered from the injury.", state.recoveryYearsLeft <= 0);
}

function applyCouplings(){
  if(state.stats.health < 30) nudge("happiness", -2);
  if(state.stats.happiness < 25) nudge("health", -1);
  if(state.hidden.stress > 75) nudge("happiness", -3);
  if(state.hidden.energy < 20) nudge("health", -2);
}

function applyConditions(){
  state.conditions.forEach(c=>{
    if(c.severity === "early"){
      nudge("health", -1);
    } else {
      nudge("health", -2);
      nudge("happiness", -1);
    }
  });
}

const SILENT_CONDITIONS = ["high blood pressure","early-stage diabetes","a slipped disc","mild arthritis","high cholesterol","a heart murmur","reduced kidney function","early-stage osteoporosis"];

function maybeSilentCondition(){
  // Cap how many of these background conditions can pile up — this system
  // is meant to add occasional, catchable risk, not compound into an
  // unrealistically sickly life on its own. Risk is also near-zero before
  // your late twenties, same as real chronic-disease incidence curves.
  if(state.age < 25) return;
  const fromThisSystem = state.conditions.filter(c => SILENT_CONDITIONS.includes(c.name)).length;
  if(fromThisSystem >= 2) return;
  let chance = 0.002 + (state.age-25)/6000;
  if(state.flags.smoker) chance += 0.005;
  if(state.hidden.stress > 70) chance += 0.002;
  if(Math.random() < chance){
    const name = pick(SILENT_CONDITIONS.filter(n => !state.conditions.some(c=>c.name===n)));
    if(name) state.conditions.push({name, sinceAge: state.age, severity:"early"});
  }
}

function progressConditions(){
  state.conditions.forEach(c=>{
    if(c.severity === "early" && Math.random() < 0.12){
      c.severity = "chronic";
      addLog(`${c.name}, undetected, has become a chronic condition.`, true);
    }
  });
}

function ageFamilyAndFriends(){
  trackPartner();
  // Younger siblings arrive during your early childhood.
  if(Array.isArray(state.siblingsToCome) && state.siblingsToCome.length){
    const arriving = state.siblingsToCome.filter(y=>y <= state.age);
    if(arriving.length){
      state.siblingsToCome = state.siblingsToCome.filter(y=>y > state.age);
      const motherAlive = state.family.some(p=>p.relation==="Mother" && p.alive);
      arriving.forEach(()=>{
        if(!motherAlive) return;   // no new siblings once your mother has gone
        const sib = makePerson("Sibling", undefined, 0);
        state.family.push(sib);
        nudge("happiness", rand(1,4));
        addLog(`A new baby in the family — your ${sib.gender === "Girl" ? "sister" : "brother"} ${sib.name} was born.`, true);
      });
    }
  }

  // Everyone gets a year older, then rolls against the mortality of their own
  // age rather than the player's.
  state.family.forEach(p=>{
    ensurePersonAge(p);
    if(p.alive) p.age += 1;
  });
  state.friends.forEach(f=>{ ensurePersonAge(f); f.age += 1; });
  if(state.relationship){
    ensurePersonAge(state.relationship);
    state.relationship.age += 1;
    // Working years build, retirement draws down.
    const r = state.relationship;
    partnerNetWorth(r);
    if(r.age < 67) r.netWorth = Math.round(r.netWorth * (1 + (Math.random()*0.09 - 0.01)) + rand(200, 2400));
    else r.netWorth = Math.round(r.netWorth * (1 - Math.random()*0.05));
    if(r.netWorth < 0) r.netWorth = 0;
  }

  // Partners are mortal too. Losing one ends the marriage rather than leaving
  // you married to someone who has died.
  if(state.relationship && Math.random() < npcDeathChance(state.relationship.age)){
    const p = state.relationship;
    const wasMarried = state.married;
    const cause = npcDeathCause(p.age);
    milestone(wasMarried ? "bereaved" : "divorced", `${p.name}, ${p.age}, has died of ${cause}.${wasMarried ? " You are widowed." : ""}`);
    // Widowed, not separated: they go to the late, not the exes.
    trackPartner();
    if(state.partnerWatch) state.partnerWatch.died = true;
    recordLate({ kind:"partner", name:p.name, relation: wasMarried ? (p.gender === "Girl" ? "Wife" : "Husband") : "Partner", ageAtDeath:p.age, cause });
    nudge("happiness", wasMarried ? -25 : -15);
    nudgeHidden("stress", 15);
    if(wasMarried){
      state.flags.widowed = true;
      // A spouse's estate comes to you.
      const bequest = rand(2000, 40000);
      addMoney(bequest);
      addLog(`${p.name}'s estate passes to you: ${money(bequest)}.`, true);
    }
    state.relationship = null;
    state.married = false;
  }

  // Friends die too, at their own ages.
  const survivingFriends = [];
  state.friends.forEach(f=>{
    if(Math.random() < npcDeathChance(f.age)){
      const cause = npcDeathCause(f.age);
      addLog(`Your friend ${f.name} has died at ${f.age}, of ${cause}.`, true);
      recordLate({ kind:"friend", name:f.name, relation: f.isBestFriend ? "Best friend" : "Friend", ageAtDeath:f.age, cause, country: f.country });
      nudge("happiness", f.isBestFriend ? -14 : -8);
    } else {
      survivingFriends.push(f);
    }
  });
  state.friends = survivingFriends;
  runParentsYear();
  ageExes();

  state.family.forEach(p=>{
    if(!p.alive) return;
    const chance = npcDeathChance(p.age);
    if(Math.random() < chance){
      p.alive = false;
      p.ageAtDeath = p.age;
      p.causeOfDeath = npcDeathCause(p.age);
      p.diedPlayerAge = state.age;
      if(p.heldEstate) settleStepEstate(p);
      heirloomOnDeath(p);
      if(p.relation === "Mother" || p.relation === "Father"){
        milestone("bereaved", `Your ${p.relation.toLowerCase()} ${p.name} has died at ${p.age}, of ${p.causeOfDeath}.`);
      } else {
        addLog(`${p.relation} ${p.name} has died at ${p.age}, of ${p.causeOfDeath}.`, true);
      }
      nudge("happiness", (p.relation==="Mother"||p.relation==="Father") ? -14 : -8);

      if(p.isMonarch && !state.flags.becameMonarch){
        triggerSuccession();
      }

      if(p.relation === "Mother" || p.relation === "Father"){
        const parents = state.family.filter(f=>f.relation==="Mother"||f.relation==="Father");
        const bothGone = parents.length > 0 && parents.every(par=>!par.alive);
        if(bothGone && !state.flags.parentsEstateSettled && !divertEstateToSpouse(p)){
          state.flags.parentsEstateSettled = true;
          const inhRanges = { poor:[1000,5000], middle:[5000,20000], rich:[20000,80000] };
          const [lo,hi] = inhRanges[state.wealthTier] || inhRanges.middle;
          const totalInh = rand(lo,hi);
          // Every one of your parents' children has a claim — you and each
          // sibling, living or not — so the estate divides equally between
          // them all. Your share is one of those parts.
          const siblings = state.family.filter(f=>f.relation==="Sibling");
          const livingSiblings = siblings.filter(f=>f.alive);
          const beneficiaries = 1 + siblings.length;   // you, plus every sibling
          const share = Math.round(totalInh / beneficiaries);

          if(livingSiblings.length){
            const names = livingSiblings.map(s=>s.name);
            const nameList = names.length === 1 ? names[0]
              : names.slice(0,-1).join(", ") + " and " + names[names.length-1];
            queueChoice({
              title:"Dividing the estate",
              text:`With both parents gone, their estate of ${money(totalInh)} has to be settled between the ${beneficiaries} of you — you, ${nameList}. An equal split gives each of you ${money(share)}.`,
              options:[
                {label:`Split it equally — ${money(share)} each`, effect:()=>{
                  addMoney(share);
                  parentsHeirlooms("share", beneficiaries);
                  livingSiblings.forEach(s=>{ s.closeness = clamp(s.closeness + rand(6,12)); });
                  addLog(`The estate was divided equally between all ${beneficiaries} children: ${money(share)} each.`, true);
                }},
                {label:"Contest the will for a larger share", effect:()=>{
                  livingSiblings.forEach(s=>{ s.closeness = clamp(s.closeness - rand(25,40)); });
                  nudgeHidden("karma", -8);
                  const legalCost = rand(500, 3000);
                  // Smarts and a good solicitor help, but it's close to a coin toss.
                  const winChance = clamp(0.35 + state.stats.smarts/400, 0.65, 0.2);
                  if(Math.random() < winChance){
                    const won = Math.round(totalInh * 0.7) - legalCost;
                    addMoney(won);
                    parentsHeirlooms("all", 1);
                    addLog(`Contested the will and won the larger share — ${money(won)} after ${money(legalCost)} in legal fees. ${nameList} ${names.length===1?"isn't":"aren't"} speaking to you.`, true);
                  } else {
                    addMoney(share - legalCost);
                    parentsHeirlooms("share", beneficiaries);
                    addLog(`Contested the will and lost. Still your equal share of ${money(share)}, less ${money(legalCost)} in legal fees — and ${nameList} ${names.length===1?"isn't":"aren't"} speaking to you.`, true);
                  }
                }},
                {label:`Waive your share`, effect:()=>{
                  livingSiblings.forEach(s=>{ s.closeness = clamp(s.closeness + rand(15,25)); });
                  nudgeHidden("karma", 12);
                  nudge("happiness", 6);
                  addLog(`Waived your share of the estate so it went to ${nameList} instead.`, true);
                }},
              ]
            });
          } else if(siblings.length){
            // Siblings existed but have died; their shares pass down their own
            // lines rather than reverting to you.
            addMoney(share);
            parentsHeirlooms("share", beneficiaries);
            addLog(`With both parents gone, the estate of ${money(totalInh)} divided between all ${beneficiaries} children — your share is ${money(share)}, the rest passing to your late ${siblings.length===1?"sibling's":"siblings'"} families.`, true);
          } else {
            addMoney(totalInh);
            parentsHeirlooms("all", 1);
            addLog(`With both parents now gone and no siblings to share it with, the whole estate passes to you: ${money(totalInh)}.`, true);
          }
          if(state.age < 18 && state.livingWithParents){
            state.livingWithParents = false;
            addLog("Now living independently, having lost both parents.");
          }
        }
      }
    }
  });

  // Friendships decay on neglect rather than at a flat rate: see someone this
  // year and it barely moves, leave it a few years and it falls away.
  const kept = [];
  state.friends.forEach(f=>{
    if(f.lastContactAge === undefined) f.lastContactAge = state.age;
    // This runs after the birthday, so someone seen during the year just gone
    // reads as one year ago — that's the "kept in touch" case, not neglect.
    const yearsSince = state.age - f.lastContactAge;
    let drop;
    if(yearsSince <= 1) drop = 0;              // saw them in the year just gone
    else if(yearsSince === 2) drop = 3;
    else if(yearsSince === 3) drop = 6;
    else if(yearsSince <= 5) drop = 10;
    else drop = 15;                            // years of silence
    if(f.isBestFriend) drop = Math.round(drop * 0.6);
    f.closeness -= drop;
    if(drop >= 10 && f.closeness > 0 && Math.random() < 0.35){
      addLog(`${f.name} has stopped getting in touch — it's been ${yearsSince} years.`);
    }
    if(f.closeness > 0){ kept.push(f); }
    else { addLog(`Drifted apart from ${f.name}.`); }
  });
  state.friends = kept;
  state.friends.forEach(f=>{ f.isBestFriend = false; });
  const topFriend = state.friends.reduce((best,f)=> (f.closeness>=85 && (!best || f.closeness>best.closeness)) ? f : best, null);
  if(topFriend) topFriend.isBestFriend = true;

  // How long the current relationship has lasted, which gates a proposal.
  if(state.relationship){
    state.relationshipYears = (state.relationshipYears || 0) + 1;
  } else {
    state.relationshipYears = 0;
  }
  // The honeymoon lands the year after the wedding.
  // Now that decisions queue, this no longer has to stand aside for whatever
  // else happened to arrive first this year.
  if(state.married && state.marriedAtAge !== undefined && state.age > state.marriedAtAge
     && !state.flags.honeymooned){
    openHoneymoonChoice();
  }

  state.children.forEach(c=>{
    c.age += 1;
    c.health = clamp(c.health + rand(-2,3));
    c.happiness = clamp(c.happiness + rand(-2,3));
    if(c.age === 18 && !c.adult){
      launchAdultChild(c);
      addLog(`${c.name} came of age and moved out — ${c.educationLabel.toLowerCase()}, now ${c.careerLabel}.`, true);
    } else if(c.adult){
      tickAdultChild(c);
    }
  });
}

// ---------- Career simulation ----------

function runCareerYear(){
  const c = state.career;
  if(!c){ state.lastIncome = incomeSoFarThisYear(); return; }
  const recession = state.worldEvent && state.worldEvent.type === "recession";
  const boom = state.worldEvent && state.worldEvent.type === "boom";
  const pandemic = state.worldEvent && state.worldEvent.type === "pandemic";

  if(c.training){
    payIncome(c.training.salary, `Training year (${c.training.label}) stipend`);
    c.training.yearsLeft -= 1;
    if(c.training.yearsLeft <= 0){
      const startRank = c.training.startRank || 0;
      c.training = null;
      c.rankIndex = startRank;
      c.yearsInRank = 0;
      const track = TRACKS.find(t=>t.id===c.trackId);
      addLog(`Qualified. Started work as a ${track.ladder[startRank].title}.`, true);
    }
    return;
  }

  if(c.kind === "civilian"){
    const track = TRACKS.find(t=>t.id===c.trackId);
    const rung = track.ladder[c.rankIndex];
    const perf = track.skill ? (state.skills[track.skill]||0) : track.perfStat === "looks" ? state.stats.looks : state.stats.smarts;
    let pay = rung.salary;
    if(track.volatile) pay = Math.round(pay * (0.5 + Math.random()*1.4));
    if(recession) pay = Math.round(pay * 0.9);
    if(boom) pay = Math.round(pay * 1.1);
    if(pandemic && track.frontline) pay = Math.round(pay * 1.15);
    pay = Math.round(pay * (state.emigrationMultipliers.salaryMult || 1) * (c.raiseMult || 1));
    if(state.recoveryYearsLeft > 0) pay = Math.round(pay * 0.5);
    if(track.criminal){
      // Cash, never declared: no tax, no pension, and nothing a bank or a
      // mortgage lender can see.
      const cash = Math.round(pay * priceLevel());
      addMoney(cash);
      state.lastIncome = incomeSoFarThisYear();   // nothing declared
      addLog(`Your cut as ${aOrAn(rung.title)} ${rung.title}: ${money(cash)}, in cash.`);
      nudgeHidden("stress", 4);
      nudgeHidden("karma", -3);
      if(runCrimeCareerYear(track, rung)) return;
    } else {
      payIncome(pay, `Salary as a ${rung.title}`);
      nudgeHidden("stress", track.frontline ? 3 : 2);
      state.pension += Math.round(pay * 0.08);
    }

    if(track.category === "Sport" || track.category === "Creative"){
      nudgeHidden("fame", rand(1,4) + c.rankIndex*2);
      const sponsorship = Math.round(pay * (state.hidden.fame/250));
      if(sponsorship > 0){
        addMoney(sponsorship);
        addLog(`A sponsorship deal brings in an extra ${money(sponsorship)}.`);
      }
    }
    // Making content your job grows the audience much faster than casual posting.
    if(track.id === "content_creator"){
      const growth = Math.round(rand(500, 5000) * (1 + c.rankIndex));
      state.followers += growth;
      addLog(`Your channel grew by ${growth.toLocaleString()} followers this year — now at ${state.followers.toLocaleString()}.`);
    }

    c.yearsInRank = (c.yearsInRank||0) + 1;
    // Performance decays toward average if you stop pushing.
    nudgePerformance(jobPerformance() > 50 ? -3 : 3);
    const minYears = 3; // realistic minimum time in a role before promotion is even considered
    if(c.rankIndex < track.ladder.length - 1 && c.yearsInRank >= minYears && !degreeCapBlocks(track, c)){
      let promoChance = 0.15 + (perf/400) + (jobPerformance()-50)/500 + (hasPerk("fast_track") ? 0.1 : 0) + mbaBoost(track, c);
      if(boom) promoChance += 0.05;
      // Past their peak, a model is booked less and promoted rarely.
      if(track.peakAge && state.age > track.peakAge) promoChance -= (state.age - track.peakAge) * 0.015;
      if(Math.random() < promoChance){
        c.rankIndex += 1;
        c.yearsInRank = 0;
        resetPerformanceForNewRank();
        milestone("promoted", `Promoted to ${track.ladder[c.rankIndex].title}.`);
        if(c.rankIndex === track.ladder.length - 1){
          state.flags.reachedTopOfLadder = true;
          state.toppedTracks = (state.toppedTracks || []).concat(track.id);
      addLog(`Reached the top of the ${track.name} ladder.`, true);
        }
      }
    }

    // Below the threshold you get a formal warning first, and a year to pull
    // it back — nobody is sacked out of nowhere for poor performance.
    if(checkPerformanceWarning(rung.title)) return;

    // Stress mostly expresses itself through burnout (see checkBurnout), not
    // through this ordinary firing roll — keep the stress term small here so
    // the two mechanisms don't race each other for the same outcome.
    // An organisation that runs on loyalty rarely just lets people go; it's
    // arrests and violence that end those careers.
    let fireChance = (track.criminal ? 0.02 : 0.06) + state.hidden.stress/2000 - perf/1200 + (50-jobPerformance())/900;
    if(recession && !track.criminal) fireChance += 0.05;
    if(track.peakAge && state.age > track.peakAge) fireChance += (state.age - track.peakAge) * 0.018;
    if(Math.random() < Math.max(0.01, fireChance)){
      milestone("fired", track.criminal ? `Cut loose — the ${track.name.toLowerCase()} has no more use for you as ${aOrAn(rung.title)} ${rung.title}.`
        : track.peakAge && state.age > track.peakAge ? `Your agency stopped booking you. At ${state.age}, the work has dried up.`
        : `Let go from the position of ${rung.title}.`);
      nudge("happiness",-10);
      state.career = null;
      state.careerWarning = null;
      return;
    }
    if(track.injuryRisk && Math.random() < track.injuryRisk){
      nudge("health",-15);
      startRecovery(rand(1,2));
      addLog(`Injured on duty as a ${rung.title} — will take time to recover.`, true);
    }
    if(state.age >= 65 && Math.random() < 0.3){
      milestone("retired", track.criminal ? `Stepped back from the life, as ${aOrAn(rung.title)} ${rung.title}.` : `Retired from work as a ${rung.title}.`);
      nudge("happiness",6);
      state.career = null;
    }
    return;
  }

  if(c.kind === "forces"){
    const force = FORCES.find(f=>f.id===c.trackId);
    const ranks = c.isOfficer ? force.officerRanks : force.ranks;
    const promoYears = c.isOfficer ? force.officerPromoYears : force.promoYears;
    const rankTitle = ranks[c.rankIndex];
    const basePay = c.isOfficer ? force.officerBasePay : force.basePay;
    const step = c.isOfficer ? force.officerPayStep : force.payStep;
    let pay = basePay + step * c.rankIndex;
    if(recession) pay = Math.round(pay * 0.95);
    if(boom) pay = Math.round(pay * 1.1);
    if(state.recoveryYearsLeft > 0) pay = Math.round(pay * 0.5);

    if(c.deployed){
      pay = Math.round(pay * 1.2);
      payIncome(pay, `On deployment as ${rankTitle}, ${force.name} — pay and allowance`);
      state.pension += Math.round(pay * 0.08);
      nudge("happiness", -6);
      nudgeHidden("stress", 6);
      if(Math.random() < force.injuryRisk){
        nudge("health", -20);
        startRecovery(rand(1,2));
        addCondition(pick(["a service-related injury","chronic back pain","hearing damage"]));
      }
      c.deployedYearsLeft -= 1;
      if(c.deployedYearsLeft <= 0){
        c.deployed = false;
        addLog(`Returned from deployment with ${force.name}.`);
      }
    } else {
      payIncome(pay, `Pay as ${rankTitle}, ${force.name}`);
      state.pension += Math.round(pay * 0.08);
      if(Math.random() < 0.25){
        c.deployed = true;
        c.deployedYearsLeft = rand(1,2);
        addLog(`Deployed on operations with ${force.name}.`, true);
      }
    }

    c.yearsInRank = (c.yearsInRank||0) + 1;
    const minYears = promoYears[c.rankIndex] ?? 5;
    if(c.rankIndex < ranks.length - 1 && c.yearsInRank >= minYears){
      // How you've been reported on now counts towards selection.
      let promoChance = 0.3 + (state.stats.smarts/400) + (jobPerformance()-50)/300;
      if(Math.random() < clamp01(promoChance)){
        c.rankIndex += 1;
        c.yearsInRank = 0;
        resetPerformanceForNewRank();
        milestone("promoted", `Promoted to ${ranks[c.rankIndex]}, ${force.name}, after ${minYears} years in rank.`);
        if(c.rankIndex === ranks.length - 1) state.flags.reachedTopOfLadder = true;
      }
    }

    // Poor reports are warned formally first, then administratively discharged.
    if(!c.deployed && checkPerformanceWarning(`${rankTitle}, ${force.name}`)) return;

    if(c.resigning){
      c.resignYearsLeft -= 1;
      if(c.resignYearsLeft <= 0){
        addLog(`Discharged from the ${force.name} after serving out your notice.`, true);
        state.career = null;
      }
      return;
    }

    if(state.age >= 55 && Math.random() < 0.3){
      addLog(`Left the ${force.name} after service as ${rankTitle}.`, true);
      nudge("happiness",6);
      state.career = null;
    }
    return;
  }
}

// ---------- Applying to a career ----------

// ---------- Organised crime ----------
// A career like any other in shape — eleven rungs, performance, promotion —
// but paid in cash, and every year in it builds heat. Heat is what gets you
// arrested; your rank is what decides how long you go away for.

function hasCriminalConnections(){
  return !!(state.gang || state.flags.criminalRecord || state.flags.everJailed || (state.hidden.karma === undefined ? 50 : state.hidden.karma) < 35);
}

function aOrAn(word){ return /^[aeiou]/i.test(word || "") ? "an" : "a"; }

function crimeHeat(){
  const c = state.career;
  return c && c.heat !== undefined ? Math.round(c.heat) : 0;
}

// The chance in any year that it all comes down on you. The higher you are,
// the more people stand between you and the street, so the same heat is
// harder to make stick — though the sentence, when it does, is far longer.
function crimeArrestChance(heat, rank){
  const insulation = 1 - Math.min(10, rank || 0) * 0.045;
  return clamp((0.01 + heat / 700) * insulation, 0.25, 0.005);
}

// A sentence that fits the rank: a lookout does months, a boss does decades.
function crimeSentenceRange(track, rank){
  const lo = 1 + Math.floor(rank / 2);
  const hi = 3 + rank + (track.id === "cartel" ? 2 : 0);
  return [lo, hi];
}

function crimeCharge(track, rank){
  if(track.id === "cartel") return rank >= 6 ? "drug trafficking" : rank >= 3 ? "supplying class A drugs" : "possession with intent to supply";
  return rank >= 6 ? "racketeering" : rank >= 3 ? "extortion" : "handling stolen goods";
}

// Runs inside the career year for criminal tracks. Returns true when the
// year has ended the career (arrest or worse).
function runCrimeCareerYear(track, rung){
  const c = state.career;
  if(c.heat === undefined) c.heat = 0;
  // Heat cools a little each year, and every rung up the ladder adds more.
  c.heat = clamp(c.heat * 0.85 + track.heatBase + c.rankIndex * track.heatPerRank + rand(-2, 3));

  // Violence comes with the work — more for the people who do the work.
  const exposure = track.violence * (1 + c.rankIndex * 0.12);
  if(Math.random() < exposure){
    die(track.id === "cartel" ? "killed in a cartel dispute" : "shot by a rival crew");
    return true;
  }
  if(Math.random() < exposure * 8){
    nudge("health", -rand(12, 30));
    startRecovery(1);
    addLog(track.id === "cartel" ? "Caught up in violence between rival crews — badly hurt." : "Jumped by men from a rival crew — badly hurt.", true);
  }

  if(Math.random() < crimeArrestChance(c.heat, c.rankIndex)){
    const [lo, hi] = crimeSentenceRange(track, c.rankIndex);
    const def = { id:"orgcrime_"+track.id, label: crimeCharge(track, c.rankIndex), jailYears:[lo, hi] };
    c.heat = Math.max(0, c.heat - 30);
    closeSheet();
    beginArrest(def, Math.round(rung.salary * priceLevel()));
    return true;
  }
  return false;
}

function applyToTrack(track){
  if(state.business){
    addLog("Sell or close the business first before taking on a regular job.");
    closeSheet(); render();
    return;
  }
  if(state.politics){
    addLog("Can't take a regular job while holding political office.");
    closeSheet(); render();
    return;
  }
  if(track.requiresDegree && state.degree !== track.requiresDegree){
    addLog(`${track.name} requires a ${track.requiresDegree} degree — application turned down.`);
    closeSheet(); render();
    return;
  }
